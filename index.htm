<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fizika — interaktiv mavzular</title>
<style>
:root{
  --ink:#16233b; --ink-2:#52607a; --paper:#f3f5f9; --panel:#ffffff; --line:#dde3ed;
  --brand:#1f4fb5; --brand-soft:#e7eefc; --mark:#e8a21c; --side:340px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--paper);overflow:hidden}
.app{display:grid;grid-template-columns:1fr var(--side);height:100%}

/* ---------- content area ---------- */
.stage{display:flex;flex-direction:column;min-width:0;height:100%}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.bar .now{flex:1;min-width:0}
.bar .now small{display:block;color:var(--ink-2);font-size:12px}
.bar .now strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-btn,.menu-btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px}
.nav-btn:hover,.menu-btn:hover{background:var(--brand-soft);border-color:#c3d3f5}
.nav-btn:disabled{opacity:.35;cursor:default;background:var(--panel)}
.menu-btn{display:none}
.frame-wrap{position:relative;flex:1;min-height:0;background:#fff}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--ink-2);background:#fff}
.welcome{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--paper)}
.welcome h1{margin:0 0 8px;font-size:clamp(24px,3.4vw,36px)}
.welcome p{margin:0 0 18px;color:var(--ink-2);max-width:460px;line-height:1.55}
.welcome .go{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 20px;background:var(--brand);color:#fff;cursor:pointer}

/* ---------- right topic list ---------- */
.side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;height:100%;min-height:0}
.side header{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.side header h2{margin:0;font-size:18px}
.side header p{margin:4px 0 0;color:var(--ink-2);font-size:13px}
.list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.topic{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer;transition:background .15s,border-color .15s}
.topic:hover{background:var(--brand-soft);border-color:#c3d3f5}
.topic .n{flex:none;width:34px;height:34px;border-radius:9px;background:var(--paper);color:var(--ink-2);display:grid;place-items:center;font-weight:700;font-size:14px}
.topic .t{flex:1;min-width:0;font-size:14px;line-height:1.35}
.topic .t b{display:block;font-weight:650}
.topic .t span{display:block;color:var(--ink-2);font-size:12px;margin-top:1px}
.topic.active{background:var(--brand);border-color:var(--brand);color:#fff}
.topic.active .n{background:var(--mark);color:#16233b}
.topic.active .t span{color:#d6e2ff}
.topic.project .n{background:#fff3d6;color:#8a5a00}
.topic.project.active .n{background:var(--mark);color:#16233b}
.topic:focus-visible,.nav-btn:focus-visible,.menu-btn:focus-visible,.go:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.scrim{display:none}

/* ---------- phone / narrow ---------- */
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .menu-btn{display:inline-block;background:var(--brand);color:#fff;border-color:var(--brand)}
  .menu-btn:hover{background:#18419a}
  .side{position:fixed;top:0;right:0;bottom:0;width:min(88vw,360px);z-index:30;transform:translateX(100%);transition:transform .22s ease;box-shadow:-10px 0 30px #0003}
  body.open .side{transform:none}
  .scrim{position:fixed;inset:0;background:#0006;z-index:20}
  body.open .scrim{display:block}
  .nav-btn .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){.side,.topic{transition:none}}
</style>
</head>
<body>
<div class="app">
  <main class="stage">
    <div class="bar">
      <button class="nav-btn" id="prev" aria-label="Oldingi mavzu">‹ <span class="lbl">Oldingi</span></button>
      <div class="now"><small id="nowNum">Mavzu tanlang</small><strong id="nowTitle">—</strong></div>
      <button class="nav-btn" id="next" aria-label="Keyingi mavzu"><span class="lbl">Keyingi</span> ›</button>
      <button class="menu-btn" id="menu" aria-label="Mavzular ro‘yxatini ochish">☰ Mavzular</button>
    </div>
    <div class="frame-wrap">
      <iframe id="view" title="Mavzu" allow="fullscreen"></iframe>
      <div class="loading" id="loading">Yuklanmoqda…</div>
      <div class="welcome" id="welcome">
        <h1>Fizika: interaktiv mavzular</h1>
        <p>O‘ngdagi ro‘yxatdan kerakli mavzuni bosing — u shu zahoti ochiladi. Mavzular orasida ‹ › tugmalari yoki klaviaturadagi ← → bilan ham o‘tish mumkin.</p>
        <button class="go" id="start">1-mavzudan boshlash</button>
      </div>
    </div>
  </main>

  <aside class="side" id="side" aria-label="Mavzular ro‘yxati">
    <header>
      <h2>Mavzular ro‘yxati</h2>
      <p id="count"></p>
    </header>
    <nav class="list" id="list"></nav>
  </aside>
</div>
<div class="scrim" id="scrim"></div>

<script id="pages" type="application/json">{"1-mavzu": "\u003c!doctype html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Kuchlarni qo‘shish — interaktiv simulyatsiya\u003c/title>\n\u003cstyle>\n:root{--navy:#182a4c;--blue:#3174be;--cyan:#3ebed2;--orange:#f59d42;--green:#42a073;--bg:#f2f7fc;--ink:#283444}\n*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}\nheader{background:linear-gradient(120deg,var(--navy),#245b8e);color:white;padding:28px 20px}\nheader h1{margin:0 0 8px;font-size:clamp(1.6rem,4vw,2.4rem)}header p{margin:0;color:#d9f7ff}\nmain{max-width:1100px;margin:22px auto;padding:0 14px 40px;display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:18px}\n.card{background:white;border:1px solid #dce5ef;border-radius:16px;padding:18px;box-shadow:0 6px 20px #182a4c0b}\nh2{font-size:1.2rem;color:var(--navy);margin:0 0 14px}\nlabel{display:block;font-weight:650;margin:16px 0 6px}\ninput[type=range]{width:100%;accent-color:var(--blue)}\nselect,button{font:inherit;border-radius:9px;border:1px solid #cbd7e5;padding:10px;background:white}\nbutton{cursor:pointer;background:var(--blue);color:white;border:0;font-weight:650}\nbutton.secondary{background:#eaf2fb;color:var(--navy);border:1px solid #d3e0ef}\n.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}\nsmall,.hint{color:#63748a;line-height:1.5}\n.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}\n.stat div{background:#f2f7fc;padding:12px;border-radius:10px}\n.stat strong{display:block;font-size:1.2rem;color:var(--navy)}\ncanvas{width:100%;height:390px;display:block;border:1px solid #dce5ef;border-radius:12px;background:#fbfdff}\n.formula{font-size:1.1rem;font-weight:700;color:var(--navy);background:#eef7fb;border-radius:10px;padding:12px;margin-top:12px}\n#explain{line-height:1.6;margin-top:10px}\nfooter{max-width:1100px;margin:0 auto;padding:0 14px 30px;color:#63748a}\n@media(max-width:800px){main{grid-template-columns:1fr}canvas{height:320px}.stat{grid-template-columns:1fr 1fr}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\u003ch1>Kuchlarni qo‘shish\u003c/h1>\u003cp>Interaktiv fizika simulyatsiyasi · Kuchlarni o‘zgartiring va natijani kuzating\u003c/p>\u003c/header>\n\u003cmain>\n\u003csection class=\"card\">\n\u003ch2>Boshqaruv paneli\u003c/h2>\n\u003clabel for=\"f1\">Birinchi kuch F₁: \u003cspan id=\"v1\">4\u003c/span> N\u003c/label>\n\u003cinput id=\"f1\" type=\"range\" min=\"0\" max=\"10\" step=\"0.5\" value=\"4\">\n\u003clabel for=\"f2\">Ikkinchi kuch F₂: \u003cspan id=\"v2\">3\u003c/span> N\u003c/label>\n\u003cinput id=\"f2\" type=\"range\" min=\"0\" max=\"10\" step=\"0.5\" value=\"3\">\n\u003clabel for=\"angle\">F₂ kuchining burchagi: \u003cspan id=\"va\">0\u003c/span>°\u003c/label>\n\u003cinput id=\"angle\" type=\"range\" min=\"0\" max=\"180\" step=\"5\" value=\"0\">\n\u003clabel for=\"direction\">F₁ yo‘nalishi\u003c/label>\n\u003cselect id=\"direction\">\u003coption value=\"0\">O‘ngga (0°)\u003c/option>\u003coption value=\"180\">Chapga (180°)\u003c/option>\u003c/select>\n\u003cdiv class=\"controls\">\n\u003cbutton id=\"animate\">Vektorlarni ko‘rsatish\u003c/button>\n\u003cbutton id=\"reset\" class=\"secondary\">Qayta boshlash\u003c/button>\n\u003c/div>\n\u003cp class=\"hint\">Maslahat: avval burchakni 0°, keyin 180° va 90° qilib ko‘ring. Har bir holatda natijaviy kuch qanday o‘zgarishini kuzating.\u003c/p>\n\u003cdiv class=\"formula\" id=\"formula\">R = 7.00 N\u003c/div>\n\u003cdiv id=\"explain\">\u003c/div>\n\u003c/section>\n\u003csection class=\"card\">\n\u003ch2>Vektorlar chizmasi\u003c/h2>\n\u003ccanvas id=\"plot\" width=\"760\" height=\"460\" aria-label=\"Kuch vektorlari va natijaviy vektor chizmasi\">\u003c/canvas>\n\u003cdiv class=\"stat\">\n\u003cdiv>\u003csmall>Gorizontal tarkibiy qism\u003c/small>\u003cstrong id=\"rx\">7.00 N\u003c/strong>\u003c/div>\n\u003cdiv>\u003csmall>Vertikal tarkibiy qism\u003c/small>\u003cstrong id=\"ry\">0.00 N\u003c/strong>\u003c/div>\n\u003cdiv>\u003csmall>Natijaviy yo‘nalish\u003c/small>\u003cstrong id=\"theta\">0°\u003c/strong>\u003c/div>\n\u003c/div>\n\u003cp class=\"hint\">Ko‘k — F₁, to‘q sariq — F₂, yashil — natijaviy kuch R. Chizmada strelkalar kuchlarning yo‘nalishini bildiradi.\u003c/p>\n\u003c/section>\n\u003csection class=\"card\">\n\u003ch2>Qisqa nazariya\u003c/h2>\n\u003cp>\u003cb>Kuch\u003c/b> — jismlarning o‘zaro ta’sirini ifodalovchi vektor kattalik. Uning SI birligi nyuton (N).\u003c/p>\n\u003cp>\u003cb>Bir yo‘nalishda:\u003c/b> R = F₁ + F₂.\u003c/p>\n\u003cp>\u003cb>Qarama-qarshi yo‘nalishda:\u003c/b> R = |F₁ − F₂|, yo‘nalish esa kattaroq kuch tomonga bo‘ladi.\u003c/p>\n\u003cp>\u003cb>Burchak ostida:\u003c/b> R = √(F₁² + F₂² + 2F₁F₂ cos α), bunda α — kuchlar orasidagi burchak.\u003c/p>\n\u003cp>\u003cb>Muvozanat:\u003c/b> R = 0 bo‘lsa, kuchlar muvozanatlashgan. Jism tinch turishi yoki tekis to‘g‘ri chiziqli harakatini saqlashi mumkin.\u003c/p>\n\u003c/section>\n\u003csection class=\"card\">\n\u003ch2>Sinab ko‘ring\u003c/h2>\n\u003col>\n\u003cli>F₁ = 4 N, F₂ = 3 N va burchak 0° bo‘lsin. R ni yozing.\u003c/li>\n\u003cli>F₁ = 8 N, F₂ = 3 N; F₂ burchagini 180° qiling. R ning yo‘nalishi qanday?\u003c/li>\n\u003cli>F₁ = 3 N, F₂ = 4 N va burchak 90° bo‘lsin. Natijaviy kuchni toping.\u003c/li>\n\u003c/ol>\n\u003cdetails>\u003csummary>\u003cb>Javoblarni ko‘rish\u003c/b>\u003c/summary>\u003cp>1) 7 N. 2) 5 N, F₁ yo‘nalishi bo‘yicha. 3) 5 N.\u003c/p>\u003c/details>\n\u003c/section>\n\u003c/main>\n\u003cfooter>O‘quv maqsadida tayyorlangan interaktiv model. Faylni saqlab, brauzerda ochish orqali internetsiz ham ishlatish mumkin.\u003c/footer>\n\u003cscript>\nconst f1=document.getElementById('f1'),f2=document.getElementById('f2'),angle=document.getElementById('angle'),direction=document.getElementById('direction');\nconst canvas=document.getElementById('plot'),ctx=canvas.getContext('2d');\nlet animating=false,progress=1;\nfunction arrow(x1,y1,x2,y2,color,width=4){\n const dx=x2-x1,dy=y2-y1,a=Math.atan2(dy,dx),head=12;\n ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=width;ctx.lineCap='round';\n ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();\n ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-head*Math.cos(a-Math.PI/6),y2-head*Math.sin(a-Math.PI/6));\n ctx.lineTo(x2-head*Math.cos(a+Math.PI/6),y2-head*Math.sin(a+Math.PI/6));ctx.closePath();ctx.fill();\n}\nfunction draw(){\n const a=Number(f1.value),b=Number(f2.value),alpha=Number(angle.value)*Math.PI/180,dir=Number(direction.value)*Math.PI/180;\n const x1=a*Math.cos(dir),y1=-a*Math.sin(dir);\n const x2=b*Math.cos(dir+alpha),y2=-b*Math.sin(dir+alpha);\n const rx=x1+x2,ry=y1+y2,R=Math.hypot(rx,ry),theta=(Math.atan2(-ry,rx)*180/Math.PI+360)%360;\n document.getElementById('v1').textContent=a;document.getElementById('v2').textContent=b;document.getElementById('va').textContent=angle.value;\n document.getElementById('rx').textContent=rx.toFixed(2)+' N';document.getElementById('ry').textContent=(-ry).toFixed(2)+' N';\n document.getElementById('theta').textContent=R\u003c0.001?'Aniqlanmagan':theta.toFixed(1)+'°';\n document.getElementById('formula').textContent='R = '+R.toFixed(2)+' N';\n let desc='';\n if(R\u003c0.001)desc='Natijaviy kuch nolga teng: kuchlar muvozanatlashgan.';\n else if(Number(angle.value)===0 && Number(direction.value)===0)desc='Kuchlar bir yo‘nalishda: R = F₁ + F₂ = '+R.toFixed(2)+' N.';\n else if(Number(angle.value)===180)desc='Kuchlar qarama-qarshi yo‘nalgan: natija kattaroq kuch yo‘nalishida.';\n else desc='Kuchlar burchak ostida ta’sir qilmoqda. Natijaviy kuch vektorlar yig‘indisiga teng.';\n document.getElementById('explain').textContent=desc;\n const w=canvas.width,h=canvas.height,cx=w/2,cy=h/2,scale=19;\n ctx.clearRect(0,0,w,h);ctx.fillStyle='#fbfdff';ctx.fillRect(0,0,w,h);\n ctx.strokeStyle='#e5edf5';ctx.lineWidth=1;\n for(let x=30;x\u003cw;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}\n for(let y=10;y\u003ch;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}\n ctx.strokeStyle='#93a4b8';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(20,cy);ctx.lineTo(w-20,cy);ctx.moveTo(cx,20);ctx.lineTo(cx,h-20);ctx.stroke();\n ctx.fillStyle='#63748a';ctx.font='14px system-ui';ctx.fillText('0',cx+5,cy-6);\n const end1x=cx+x1*scale,end1y=cy+y1*scale;\n const end2x=cx+x2*scale,end2y=cy+y2*scale;\n const endRx=cx+rx*scale,endRy=cy+ry*scale;\n arrow(cx,cy,end1x, end1y,'#3174be',4);\n arrow(cx,cy,end2x,end2y,'#f59d42',4);\n arrow(cx,cy,endRx,endRy,'#42a073',5);\n ctx.font='bold 16px system-ui';ctx.fillStyle='#3174be';ctx.fillText('F₁',end1x+7,end1y-8);\n ctx.fillStyle='#b96a15';ctx.fillText('F₂',end2x+7,end2y-8);\n ctx.fillStyle='#287b55';ctx.fillText('R',endRx+7,endRy-8);\n}\n[f1,f2,angle,direction].forEach(el=>el.addEventListener('input',draw));\ndocument.getElementById('reset').addEventListener('click',()=>{f1.value=4;f2.value=3;angle.value=0;direction.value=0;draw()});\ndocument.getElementById('animate').addEventListener('click',()=>{\n const btn=document.getElementById('animate');\n btn.textContent='Vektorlar tayyor';draw();\n setTimeout(()=>{btn.textContent='Vektorlarni ko‘rsatish'},900);\n});\ndraw();\n\u003c/script>\n\u003c/body>\n\u003c/html>", "2-mavzu": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\u003chead>\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>2-mavzu Markazga intilma kuch\u003c/title>\n\u003cstyle>\n:root{--navy:#142747;--blue:#2f75c5;--orange:#f09a38;--green:#23976b;--bg:#f3f7fb;--ink:#233247;--line:#dbe5ef}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Arial,sans-serif;line-height:1.5}\nheader{background:linear-gradient(120deg,#142747,#245f96);color:white;padding:28px max(24px,calc((100% - 1100px)/2))}header h1{margin:0 0 8px;font-size:clamp(1.7rem,4vw,2.5rem)}header p{margin:0;color:#d9f4ff}\nmain{width:calc(100% - 32px);max-width:1100px;margin:22px auto;padding:0 8px 35px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button{border:1px solid var(--line);background:white;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700}.tabs button.active,.primary{background:var(--blue);color:white;border-color:var(--blue)}\n.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:15px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:15px;box-shadow:0 5px 18px #1427470b}\nh2{margin:0 0 10px;color:var(--navy);font-size:1.25rem}h3{margin:12px 0 5px;color:var(--navy)}label{display:block;font-weight:650;margin:13px 0 5px}input[type=range]{width:100%;accent-color:var(--blue)}button,select{font:inherit;border:1px solid #c8d6e5;border-radius:8px;padding:9px 11px;background:white;color:var(--ink)}button{cursor:pointer;font-weight:650}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.value{font-weight:800;color:var(--blue)}canvas{width:100%;height:330px;display:block;border:1px solid var(--line);border-radius:10px;background:#fbfdff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat{background:#f1f6fb;padding:10px;border-radius:9px}.stat small{display:block;color:#64748b;font-size:.78rem}.stat strong{color:var(--navy);font-size:1.05rem}.note{background:#eef8fb;border-left:4px solid #35b9cc;padding:11px 13px;border-radius:7px;margin:12px 0}.formula{font-size:1.15rem;font-weight:800;background:#f1f6fb;padding:12px;border-radius:9px;color:var(--navy)}.muted{color:#64748b;font-size:.9rem}details{background:#f7fafc;padding:9px;border-radius:7px}footer{max-width:1100px;margin:0 auto;padding:0 24px 24px;color:#64748b}canvas{max-width:100%}\n@media(max-width:480px){main{width:100%;padding:0 14px 28px}.card{padding:14px}.tabs button{padding:9px 10px;font-size:.9rem}header{padding:24px 20px}}\n@media(max-width:800px){.grid{grid-template-columns:1fr}canvas{height:290px}.stats{grid-template-columns:1fr 1fr}header{padding:24px 18px}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cheader>\u003ch1>Markazga intilma kuch\u003c/h1>\u003cp>10-sinf fizika · Interaktiv simulyatsiyalar, animatsiyalar va virtual tajribalar\u003c/p>\u003c/header>\n\u003cmain>\n\u003cdiv class=\"tabs\">\u003cbutton class=\"active\" data-tab=\"one\">1. Kuch tushunchasi\u003c/button>\u003cbutton data-tab=\"two\">2. Formula va bog‘liqlik\u003c/button>\u003cbutton data-tab=\"three\">3. Hayotiy misollar\u003c/button>\u003cbutton data-tab=\"quiz\">Masalalar va test\u003c/button>\u003c/div>\n\u003csection id=\"one\" class=\"panel active\">\n\u003cdiv class=\"card\">\u003ch2>1-reja. Markazga intilma kuch nima?\u003c/h2>\u003cp>Jism aylana bo‘ylab harakatlanganda uning tezlik yo‘nalishi uzluksiz o‘zgaradi. Buning uchun aylana markaziga yo‘nalgan natijaviy kuch kerak. Bu \u003cb>markazga intilma kuch\u003c/b> deyiladi.\u003c/p>\u003cdiv class=\"note\">\u003cb>Eslab qoling:\u003c/b> tezlik vektori urinma bo‘ylab, markazga intilma tezlanish va natijaviy kuch markaz tomon yo‘naladi. Bu alohida yangi kuch emas, balki natijaviy kuchning yo‘nalishidir.\u003c/div>\u003c/div>\n\u003cdiv class=\"grid\">\u003cdiv class=\"card\">\u003ch2>Aylana bo‘ylab harakat\u003c/h2>\u003clabel>Tezlik: \u003cspan class=\"value\" id=\"s1v\">5\u003c/span> m/s\u003c/label>\u003cinput id=\"s1\" type=\"range\" min=\"1\" max=\"10\" step=\".5\" value=\"5\">\u003clabel>Radius: \u003cspan class=\"value\" id=\"r1v\">3\u003c/span> m\u003c/label>\u003cinput id=\"r1\" type=\"range\" min=\"1\" max=\"5\" step=\".5\" value=\"3\">\u003clabel>\u003cinput id=\"showv\" type=\"checkbox\" checked> Tezlik vektorini ko‘rsatish\u003c/label>\u003clabel>\u003cinput id=\"showa\" type=\"checkbox\" checked> Markazga yo‘nalgan vektorni ko‘rsatish\u003c/label>\u003cdiv class=\"controls\">\u003cbutton class=\"primary\" id=\"play1\">▶ Harakatni boshlash\u003c/button>\u003cbutton id=\"reset1\">Qayta boshlash\u003c/button>\u003c/div>\u003cp class=\"muted\">Vektorlarni kuzating: ko‘k — tezlik, to‘q sariq — markazga intilma tezlanish.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch2>Aylana animatsiyasi\u003c/h2>\u003ccanvas id=\"orbit\" width=\"700\" height=\"390\">\u003c/canvas>\u003cdiv class=\"stats\">\u003cdiv class=\"stat\">\u003csmall>Tezlik\u003c/small>\u003cstrong id=\"sout\">5 m/s\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Radius\u003c/small>\u003cstrong id=\"rout\">3 m\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Tezlanish\u003c/small>\u003cstrong id=\"aout\">8.33 m/s²\u003c/strong>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Agar ip uzilsa nima bo‘ladi?\u003c/h3>\u003cp>Markazga yo‘nalgan kuch yo‘qolsa, jism shu ondagi tezlik yo‘nalishi bo‘yicha — aylana trayektoriyasiga urinma bo‘ylab harakatni davom ettiradi. Bu “tashqariga itarilish” emas, balki inertsiya tufayli tezlik yo‘nalishining saqlanishidir.\u003c/p>\u003c/div>\n\u003c/section>\n\u003csection id=\"two\" class=\"panel\">\n\u003cdiv class=\"card\">\u003ch2>2-reja. Formula va fizik kattaliklarga bog‘liqlik\u003c/h2>\u003cdiv class=\"formula\">F = mv²/r &nbsp; va &nbsp; a = v²/r\u003c/div>\u003cp>\u003cb>F\u003c/b> — markazga intilma natijaviy kuch (N), \u003cb>m\u003c/b> — massa (kg), \u003cb>v\u003c/b> — tezlik (m/s), \u003cb>r\u003c/b> — radius (m). Formula Nyutonning ikkinchi qonuni F = ma va markazga intilma tezlanish a = v²/r dan kelib chiqadi.\u003c/p>\u003c/div>\n\u003cdiv class=\"grid\">\u003cdiv class=\"card\">\u003ch2>Virtual laboratoriya\u003c/h2>\u003clabel>Massa m: \u003cspan class=\"value\" id=\"mv\">2\u003c/span> kg\u003c/label>\u003cinput id=\"m\" type=\"range\" min=\".5\" max=\"10\" step=\".5\" value=\"2\">\u003clabel>Tezlik v: \u003cspan class=\"value\" id=\"vv\">5\u003c/span> m/s\u003c/label>\u003cinput id=\"v\" type=\"range\" min=\"1\" max=\"20\" step=\".5\" value=\"5\">\u003clabel>Radius r: \u003cspan class=\"value\" id=\"rv\">3\u003c/span> m\u003c/label>\u003cinput id=\"r\" type=\"range\" min=\".5\" max=\"10\" step=\".5\" value=\"3\">\u003cdiv class=\"controls\">\u003cbutton class=\"primary\" id=\"calc\">Hisoblash\u003c/button>\u003cbutton id=\"resetlab\">Qiymatlarni tiklash\u003c/button>\u003c/div>\u003cdiv class=\"note\" id=\"explain\">Qiymatlarni o‘zgartiring va natijani kuzating.\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch2>Hisoblangan natija\u003c/h2>\u003ccanvas id=\"force\" width=\"700\" height=\"330\">\u003c/canvas>\u003cdiv class=\"stats\">\u003cdiv class=\"stat\">\u003csmall>Markazga intilma kuch\u003c/small>\u003cstrong id=\"fo\">16.67 N\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Tezlanish\u003c/small>\u003cstrong id=\"ao\">8.33 m/s²\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Bog‘liqlik\u003c/small>\u003cstrong>F ∝ mv²/r\u003c/strong>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Virtual tajribalar\u003c/h3>\u003col>\u003cli>Tezlikni ikki marta oshiring. Kuch necha marta oshdi?\u003c/li>\u003cli>Radiusni ikki marta oshiring. Kuch qanday o‘zgaradi?\u003c/li>\u003cli>Massani ikki marta oshiring. Kuch qanday o‘zgaradi?\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>\u003cb>Javoblarni ko‘rish\u003c/b>\u003c/summary>\u003cp>Tezlik ikki marta oshsa kuch 4 marta oshadi. Radius ikki marta oshsa kuch 2 marta kamayadi. Massa ikki marta oshsa kuch ham 2 marta oshadi.\u003c/p>\u003c/details>\u003c/div>\n\u003c/section>\n\u003csection id=\"three\" class=\"panel\">\n\u003cdiv class=\"card\">\u003ch2>3-reja. Markazga intilma kuch hayotda\u003c/h2>\u003cp>Markazga intilma kuch vazifasini turli vaziyatlarda turli kuchlar bajaradi. U alohida yangi turdagi kuch emas — markazga yo‘nalgan natijaviy kuchdir.\u003c/p>\u003c/div>\n\u003cdiv class=\"grid\">\u003cdiv class=\"card\">\u003ch2>Vaziyatni tanlang\u003c/h2>\u003clabel>Misol\u003c/label>\u003cselect id=\"scene\">\u003coption value=\"car\">Avtomobil burilishda\u003c/option>\u003coption value=\"ball\">Ipga bog‘langan shar\u003c/option>\u003coption value=\"sat\">Yer atrofidagi sun’iy yo‘ldosh\u003c/option>\u003coption value=\"planet\">Sayyora Quyosh atrofida\u003c/option>\u003c/select>\u003clabel>Tezlik (model): \u003cspan class=\"value\" id=\"v3v\">6\u003c/span> m/s\u003c/label>\u003cinput id=\"v3\" type=\"range\" min=\"2\" max=\"12\" step=\".5\" value=\"6\">\u003clabel>Radius (model): \u003cspan class=\"value\" id=\"r3v\">4\u003c/span> m\u003c/label>\u003cinput id=\"r3\" type=\"range\" min=\"2\" max=\"8\" step=\".5\" value=\"4\">\u003cdiv class=\"controls\">\u003cbutton class=\"primary\" id=\"play3\">▶ Animatsiya\u003c/button>\u003cbutton id=\"reset3\">Qayta boshlash\u003c/button>\u003c/div>\u003cdiv class=\"note\" id=\"desc\">Avtomobil burilganda shina va yo‘l orasidagi ishqalanish markazga yo‘nalgan natijaviy kuchni ta’minlaydi.\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch2>Hayotiy vaziyat animatsiyasi\u003c/h2>\u003ccanvas id=\"sceneCanvas\" width=\"700\" height=\"390\">\u003c/canvas>\u003cp class=\"muted\">Ko‘k — tezlik, to‘q sariq — markazga yo‘nalgan kuch. Sxema tushuntirish uchun soddalashtirilgan.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Qaysi kuch markazga intilma kuch vazifasini bajaradi?\u003c/h3>\u003cul>\u003cli>\u003cb>Avtomobil burilishda:\u003c/b> odatda shina va yo‘l orasidagi ishqalanish.\u003c/li>\u003cli>\u003cb>Ipga bog‘langan shar:\u003c/b> ip tarangligi (boshqa kuchlar ham bo‘lsa, natijaviy kuch hisoblanadi).\u003c/li>\u003cli>\u003cb>Sun’iy yo‘ldosh va sayyoralar:\u003c/b> gravitatsiya kuchi.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">Markazdan qochma kuchni inertsiya sanoq sistemasidagi markazga intilma kuch bilan chalkashtirmang. Markazga intilma kuch markaz tomon yo‘naladi.\u003c/div>\u003c/div>\n\u003c/section>\n\u003csection id=\"quiz\" class=\"panel\">\n\u003cdiv class=\"card\">\u003ch2>Masalalar va yechimlar\u003c/h2>\u003cdiv class=\"grid\">\n\u003cdiv>\u003ch3>1-masala\u003c/h3>\u003cp>m = 2 kg, v = 6 m/s, r = 4 m. F ni toping.\u003c/p>\u003cdetails>\u003csummary>Yechim\u003c/summary>\u003cp>F = mv²/r = 2 × 36 / 4 = \u003cb>18 N\u003c/b>.\u003c/p>\u003c/details>\u003c/div>\n\u003cdiv>\u003ch3>2-masala\u003c/h3>\u003cp>m = 0,5 kg, v = 8 m/s, r = 2 m. F ni toping.\u003c/p>\u003cdetails>\u003csummary>Yechim\u003c/summary>\u003cp>F = 0,5 × 64 / 2 = \u003cb>16 N\u003c/b>.\u003c/p>\u003c/details>\u003c/div>\n\u003cdiv>\u003ch3>3-masala\u003c/h3>\u003cp>Tezlik 3 marta oshdi. Kuch qanday o‘zgaradi?\u003c/p>\u003cdetails>\u003csummary>Yechim\u003c/summary>\u003cp>Tezlik kvadratga bog‘liq: kuch \u003cb>9 marta oshadi\u003c/b>.\u003c/p>\u003c/details>\u003c/div>\n\u003cdiv>\u003ch3>4-masala\u003c/h3>\u003cp>m = 3 kg, v = 5 m/s, r = 2,5 m. Tezlanish va kuchni toping.\u003c/p>\u003cdetails>\u003csummary>Yechim\u003c/summary>\u003cp>a = 25/2,5 = 10 m/s²; F = 3 × 10 = \u003cb>30 N\u003c/b>.\u003c/p>\u003c/details>\u003c/div>\n\u003cdiv>\u003ch3>5-masala\u003c/h3>\u003cp>Radius 2 m dan 8 m ga oshdi. Kuch qanday o‘zgaradi?\u003c/p>\u003cdetails>\u003csummary>Yechim\u003c/summary>\u003cp>Radius 4 marta oshdi, demak kuch \u003cb>4 marta kamayadi\u003c/b>.\u003c/p>\u003c/details>\u003c/div>\n\u003cdiv>\u003ch3>6-masala\u003c/h3>\u003cp>m = 1,5 kg, v = 12 m/s, r = 3 m. F ni toping.\u003c/p>\u003cdetails>\u003csummary>Yechim\u003c/summary>\u003cp>F = 1,5 × 144 / 3 = \u003cb>72 N\u003c/b>.\u003c/p>\u003c/details>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch2>Interaktiv test\u003c/h2>\u003cform id=\"quizform\">\n\u003cp>\u003cb>1.\u003c/b> Markazga intilma kuch qaysi tomonga yo‘naladi?\u003c/p>\u003clabel>\u003cinput type=\"radio\" name=\"q1\" value=\"a\"> Harakat bo‘ylab\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q1\" value=\"b\"> Aylana markaziga\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q1\" value=\"c\"> Markazdan tashqariga\u003c/label>\n\u003cp>\u003cb>2.\u003c/b> Formula qaysi?\u003c/p>\u003clabel>\u003cinput type=\"radio\" name=\"q2\" value=\"a\"> F = mv/r\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q2\" value=\"b\"> F = mr/v²\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q2\" value=\"c\"> F = mv²/r\u003c/label>\n\u003cp>\u003cb>3.\u003c/b> Tezlik 3 marta oshsa, kuch necha marta oshadi?\u003c/p>\u003clabel>\u003cinput type=\"radio\" name=\"q3\" value=\"a\"> 3 marta\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q3\" value=\"b\"> 6 marta\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q3\" value=\"c\"> 9 marta\u003c/label>\n\u003cp>\u003cb>4.\u003c/b> Sun’iy yo‘ldosh orbitasida markazga intilma kuchni nima ta’minlaydi?\u003c/p>\u003clabel>\u003cinput type=\"radio\" name=\"q4\" value=\"a\"> Gravitatsiya\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q4\" value=\"b\"> Har doim ishqalanish\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q4\" value=\"c\"> Havo qarshiligi\u003c/label>\n\u003cp>\u003cb>5.\u003c/b> Tezlik vektori aylana trayektoriyasiga qanday yo‘nalgan?\u003c/p>\u003clabel>\u003cinput type=\"radio\" name=\"q5\" value=\"a\"> Markazga\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q5\" value=\"b\"> Urinma bo‘ylab\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q5\" value=\"c\"> Har doim yuqoriga\u003c/label>\n\u003cdiv class=\"controls\">\u003cbutton class=\"primary\" type=\"submit\">Javoblarni tekshirish\u003c/button>\u003cbutton type=\"reset\" id=\"clear\">Tozalash\u003c/button>\u003c/div>\u003c/form>\u003cdiv class=\"note\" id=\"result\">Javoblarni belgilang va tekshiring.\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch2>Xulosa va uyga vazifa\u003c/h2>\u003cul>\u003cli>F = mv²/r va a = v²/r.\u003c/li>\u003cli>Tezlik oshishi kuchni kvadrat qonun bo‘yicha oshiradi.\u003c/li>\u003cli>Kuchning manbai vaziyatga qarab ishqalanish, taranglik yoki gravitatsiya bo‘lishi mumkin.\u003c/li>\u003c/ul>\u003cp>\u003cb>Uyga vazifa:\u003c/b> m = 4 kg, r = 5 m, v = 10 m/s. Hisoblang: markazga intilma tezlanish va kuch. Kundalik hayotdan 2 ta misol yozing.\u003c/p>\u003c/div>\n\u003c/section>\n\u003c/main>\u003cfooter>HTML5 o‘quv materiali. Faylni Chrome yoki boshqa brauzerda oching; internet talab qilinmaydi.\u003c/footer>\n\u003cscript>\nconst $=id=>document.getElementById(id);\ndocument.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===b.dataset.tab));});\nfunction arrow(c,x,y,X,Y,color,w=4){let a=Math.atan2(Y-y,X-x),h=12;c.strokeStyle=color;c.fillStyle=color;c.lineWidth=w;c.lineCap='round';c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.stroke();c.beginPath();c.moveTo(X,Y);c.lineTo(X-h*Math.cos(a-.5),Y-h*Math.sin(a-.5));c.lineTo(X-h*Math.cos(a+.5),Y-h*Math.sin(a+.5));c.closePath();c.fill()}\nfunction grid(c,w,h){c.clearRect(0,0,w,h);c.fillStyle='#fbfdff';c.fillRect(0,0,w,h);c.strokeStyle='#e8eff6';c.lineWidth=1;for(let x=20;x\u003cw;x+=30){c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke()}for(let y=20;y\u003ch;y+=30){c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}}\nlet ang=0,run1=false,ang3=0,run3=false;\nfunction orbit(){let c=$('orbit').getContext('2d'),w=700,h=390;grid(c,w,h);let cx=w/2,cy=h/2,r=+$('r1').value*31,v=+$('s1').value;c.strokeStyle='#23976b';c.lineWidth=3;c.beginPath();c.arc(cx,cy,r,0,7);c.stroke();c.fillStyle='#142747';c.beginPath();c.arc(cx,cy,5,0,7);c.fill();let x=cx+r*Math.cos(ang),y=cy+r*Math.sin(ang);c.fillStyle='#2f75c5';c.beginPath();c.arc(x,y,10,0,7);c.fill();if($('showv').checked)arrow(c,x,y,x-Math.sin(ang)*v*8,y+Math.cos(ang)*v*8,'#2f75c5');if($('showa').checked)arrow(c,x,y,x+(cx-x)*.38,y+(cy-y)*.38,'#f09a38');$('s1v').textContent=v;$('r1v').textContent=$('r1').value;$('sout').textContent=v.toFixed(1)+' m/s';$('rout').textContent=(+$('r1').value).toFixed(1)+' m';$('aout').textContent=(v*v/(+$('r1').value)).toFixed(2)+' m/s²'}\nfunction force(){let c=$('force').getContext('2d'),w=700,h=330;grid(c,w,h);let m=+$('m').value,v=+$('v').value,r=+$('r').value,a=v*v/r,F=m*a,cx=w/2,cy=h/2,rad=Math.min(100,r*14),x=cx+rad;c.strokeStyle='#23976b';c.lineWidth=3;c.beginPath();c.arc(cx,cy,rad,0,7);c.stroke();c.fillStyle='#2f75c5';c.beginPath();c.arc(x,cy,10,0,7);c.fill();arrow(c,x,cy,cx+rad*.3,cy,'#f09a38',Math.min(9,2+F/30));$('mv').textContent=m;$('vv').textContent=v;$('rv').textContent=r;$('fo').textContent=F.toFixed(2)+' N';$('ao').textContent=a.toFixed(2)+' m/s²';$('explain').textContent=`a = v²/r = ${v}²/${r} = ${a.toFixed(2)} m/s²; F = ma = ${m} × ${a.toFixed(2)} = ${F.toFixed(2)} N.`}\nfunction scene(){let c=$('sceneCanvas').getContext('2d'),w=700,h=390;grid(c,w,h);let kind=$('scene').value,v=+$('v3').value,r=+$('r3').value,cx=350,cy=205,rad=65+r*10; $('v3v').textContent=v;$('r3v').textContent=r;let text='';if(kind==='car'){text='Avtomobil burilganda ishqalanish markazga yo‘nalgan natijaviy kuchni ta’minlaydi.';c.strokeStyle='#64748b';c.lineWidth=24;c.beginPath();c.arc(cx,cy,rad,Math.PI*.8,Math.PI*1.8);c.stroke();let t=ang3%(Math.PI);let a=Math.PI*.8+t,x=cx+rad*Math.cos(a),y=cy+rad*Math.sin(a);c.save();c.translate(x,y);c.rotate(a+Math.PI/2);c.fillStyle='#2f75c5';c.fillRect(-20,-11,40,22);c.restore();arrow(c,x,y,x-Math.sin(a)*v*5,y+Math.cos(a)*v*5,'#2f75c5');arrow(c,x,y,x+(cx-x)*.35,y+(cy-y)*.35,'#f09a38')}else{c.strokeStyle='#23976b';c.lineWidth=3;c.beginPath();c.arc(cx,cy,rad,0,7);c.stroke();let x=cx+rad*Math.cos(ang3),y=cy+rad*Math.sin(ang3);if(kind==='ball'){text='Ip tarangligi sharni markaz tomon tortadi. Ip uzilsa, shar urinma bo‘ylab harakatlanadi.';c.strokeStyle='#64748b';c.beginPath();c.moveTo(cx,cy);c.lineTo(x,y);c.stroke();c.fillStyle='#f09a38';c.beginPath();c.arc(x,y,12,0,7);c.fill()}else{let sat=kind==='sat';text=sat?'Yer gravitatsiyasi sun’iy yo‘ldoshga markazga yo‘nalgan kuch beradi.':'Quyosh gravitatsiyasi sayyoraning orbital harakatini ta’minlaydi.';c.fillStyle=sat?'#23976b':'#f09a38';c.beginPath();c.arc(cx,cy,sat?28:22,0,7);c.fill();c.fillStyle='#f09a38';c.beginPath();c.arc(x,y,10,0,7);c.fill();c.fillStyle='#142747';c.font='bold 14px sans-serif';c.fillText(sat?'Yer':'Quyosh',cx-20,cy+rad*.45)}arrow(c,x,y,x+(cx-x)*.38,y+(cy-y)*.38,'#f09a38');arrow(c,x,y,x-Math.sin(ang3)*v*4,y+Math.cos(ang3)*v*4,'#2f75c5')}$('desc').textContent=text;c.fillStyle='#142747';c.font='bold 15px sans-serif';c.fillText(kind==='car'?'Avtomobil':kind==='ball'?'Ipga bog‘langan shar':kind==='sat'?'Sun’iy yo‘ldosh':'Sayyora',16,25)}\n['s1','r1','showv','showa'].forEach(id=>$(id).addEventListener('input',orbit));['m','v','r'].forEach(id=>$(id).addEventListener('input',force));$('calc').onclick=force;$('resetlab').onclick=()=>{$('m').value=2;$('v').value=5;$('r').value=3;force()};$('play1').onclick=()=>{run1=!run1;$('play1').textContent=run1?'Ⅱ To‘xtatish':'▶ Harakatni boshlash'};$('reset1').onclick=()=>{ang=0;run1=false;$('play1').textContent='▶ Harakatni boshlash';orbit()};['scene','v3','r3'].forEach(id=>$(id).addEventListener('input',scene));$('play3').onclick=()=>{run3=!run3;$('play3').textContent=run3?'Ⅱ To‘xtatish':'▶ Animatsiya'};$('reset3').onclick=()=>{ang3=0;run3=false;$('play3').textContent='▶ Animatsiya';scene()};\n$('quizform').onsubmit=e=>{e.preventDefault();let ans={q1:'b',q2:'c',q3:'c',q4:'a',q5:'b'},n=0;for(let q in ans){let x=document.querySelector(`input[name=\"${q}\"]:checked`);if(x&&x.value===ans[q])n++}$('result').textContent=`Natija: ${n}/5. `+(n===5?'Ajoyib! Barcha javoblar to‘g‘ri.':n>=3?'Yaxshi! Xato javoblarni qayta ko‘rib chiqing.':'Mavzuni o‘qib, simulyatsiyalarni yana sinab ko‘ring.')};$('clear').onclick=()=>{$('result').textContent='Javoblarni belgilang va tekshiring.'};\nfunction tick(){if(run1)ang+=.025*(+$('s1').value)/5;if(run3)ang3+=.02*(+$('v3').value)/6;orbit();scene();requestAnimationFrame(tick)}orbit();force();scene();requestAnimationFrame(tick);\n\u003c/script>\u003c/body>\u003c/html>", "3-mavzu": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>3-mavzu: Gravitatsiya maydonidagi harakat\u003c/title>\n\u003cstyle>\n:root{--bg:#071426;--panel:#10243c;--line:#29435f;--text:#edf5ff;--muted:#a9bed8;--cyan:#52d7f5;--gold:#ffd166;--green:#79e2a7}\n*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#163557,#071426 60%);color:var(--text);font:16px/1.5 system-ui,Segoe UI,sans-serif}header{text-align:center;padding:26px 16px 20px;border-bottom:1px solid var(--line)}header small{color:var(--cyan);letter-spacing:.12em;font-weight:800}h1{font-size:clamp(1.6rem,4vw,2.5rem);line-height:1.15;margin:8px auto}header p{max-width:850px;color:var(--muted);margin:10px auto}main{max-width:1180px;margin:auto;padding:16px;display:grid;gap:16px}.tabs{display:flex;flex-wrap:wrap;gap:8px}.tab,.btn{border:1px solid #42617f;border-radius:10px;padding:10px 13px;font-weight:750;cursor:pointer}.tab{background:#0d2036;color:var(--text)}.tab.active,.btn{background:var(--cyan);color:#052033;border-color:var(--cyan)}.btn.secondary{background:#203b59;color:var(--text);border-color:#42617f}.btn.gold{background:var(--gold);color:#2b2100;border-color:var(--gold)}.section{display:none}.section.active{display:block}.card{background:linear-gradient(145deg,#10243c,#0b1a2e);border:1px solid var(--line);border-radius:18px;padding:18px}.card h2{margin:0 0 5px}.lead,.note{color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(270px,1fr);gap:16px}.canvasWrap{position:relative;background:#061120;border:1px solid var(--line);border-radius:14px;overflow:hidden}canvas{display:block;width:100%;height:340px}.canvasLabel{position:absolute;left:10px;top:10px;background:#071426dc;border:1px solid #355474;padding:4px 8px;border-radius:7px;color:var(--muted);font-size:.8rem}.controls{display:grid;gap:12px}.control{background:#0a192b;border:1px solid #263f5c;padding:12px;border-radius:12px}.control label{display:flex;justify-content:space-between;gap:8px;font-weight:650;font-size:.92rem}.control output{color:var(--cyan);white-space:nowrap}input[type=range]{width:100%;accent-color:var(--cyan);margin-top:9px}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}.metric{padding:10px;background:#08182a;border:1px solid #243c57;border-radius:10px}.metric span{display:block;color:var(--muted);font-size:.8rem}.metric strong{color:var(--green);font-size:1.08rem;font-variant-numeric:tabular-nums}.formula{font-family:ui-monospace,Consolas,monospace;background:#071426;border-left:3px solid var(--gold);padding:10px 12px;border-radius:5px;overflow-wrap:anywhere}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.quiz{display:grid;gap:12px}.question{background:#0a192b;padding:14px;border:1px solid #263f5c;border-radius:12px}.question p{margin:0 0 8px;font-weight:750}.question label{display:block;margin:6px 0}.result{font-weight:800;color:var(--green)}footer{text-align:center;color:var(--muted);padding:10px 16px 26px}\n@media(max-width:780px){.layout{grid-template-columns:1fr}.card{padding:13px}canvas{height:300px}main{padding:10px}.tab{flex:1 1 45%}}@media(max-width:420px){.tab{flex-basis:100%}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\u003csmall>10-SINF FIZIKA · VIRTUAL LABORATORIYA\u003c/small>\u003ch1>3-mavzu: Gravitatsiya maydonidagi harakat\u003c/h1>\u003cp>Gravitatsion kuch, erkin tushish, otilgan jismlar va sun’iy yo‘ldoshlar harakatini interaktiv simulyatsiyalar yordamida o‘rganing.\u003c/p>\u003c/header>\n\u003cmain>\n\u003cnav class=\"tabs\">\n\u003cbutton class=\"tab active\" data-target=\"field\">1. Gravitatsiya maydoni\u003c/button>\n\u003cbutton class=\"tab\" data-target=\"motion\">2. Jismlarning harakati\u003c/button>\n\u003cbutton class=\"tab\" data-target=\"orbit\">3. Orbital harakat\u003c/button>\n\u003cbutton class=\"tab\" data-target=\"quiz\">Bilimni tekshirish\u003c/button>\n\u003c/nav>\n\u003csection id=\"field\" class=\"section active\">\u003cdiv class=\"card\">\n\u003ch2>1-reja. Gravitatsiya maydoni va uning xususiyatlari\u003c/h2>\u003cp class=\"lead\">Massalar bir-birini tortadi. Masofa oshgani sari gravitatsion kuch kamayadi.\u003c/p>\n\u003cdiv class=\"layout\">\u003cdiv>\u003cdiv class=\"canvasWrap\">\u003ccanvas id=\"fieldCanvas\">\u003c/canvas>\u003cspan class=\"canvasLabel\">Kuch vektorlari va jismlar\u003c/span>\u003c/div>\u003cdiv class=\"metrics\">\u003cdiv class=\"metric\">\u003cspan>Gravitatsion kuch F\u003c/span>\u003cstrong id=\"forceMetric\">—\u003c/strong>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>Maydon tezlanishi (m₂ joyida)\u003c/span>\u003cstrong id=\"gMetric\">—\u003c/strong>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>Markazlar oralig‘i r\u003c/span>\u003cstrong id=\"rMetric\">—\u003c/strong>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>Yer sirtidagi g\u003c/span>\u003cstrong>9,81 m/s²\u003c/strong>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"controls\">\n\u003cdiv class=\"control\">\u003clabel for=\"massA\">1-jism massasi \u003coutput id=\"massAOut\">5 kg\u003c/output>\u003c/label>\u003cinput id=\"massA\" type=\"range\" min=\"1\" max=\"20\" value=\"5\">\u003c/div>\n\u003cdiv class=\"control\">\u003clabel for=\"massB\">2-jism massasi \u003coutput id=\"massBOut\">10 kg\u003c/output>\u003c/label>\u003cinput id=\"massB\" type=\"range\" min=\"1\" max=\"30\" value=\"10\">\u003c/div>\n\u003cdiv class=\"control\">\u003clabel for=\"distance\">Masofa r \u003coutput id=\"distanceOut\">2 m\u003c/output>\u003c/label>\u003cinput id=\"distance\" type=\"range\" min=\"1\" max=\"10\" step=\".5\" value=\"2\">\u003c/div>\n\u003cdiv class=\"formula\">F = Gm₁m₂/r²\u003cbr>g = Gm₁/r²\u003c/div>\u003cp class=\"note\">G = 6,6743 × 10⁻¹¹ N·m²/kg². Kichik jismlar orasidagi kuch nihoyatda kichik bo‘ladi. Chizmada kuch vektorlari tushunishni osonlashtirish uchun kattalashtirilgan.\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"motion\" class=\"section\">\u003cdiv class=\"card\">\n\u003ch2>2-reja. Gravitatsiya maydonida jismlarning harakati\u003c/h2>\u003cp class=\"lead\">Harakat turini tanlang, boshlang‘ich parametrlarni o‘zgartiring va traektoriyani kuzating.\u003c/p>\n\u003cdiv class=\"layout\">\u003cdiv>\u003cdiv class=\"canvasWrap\">\u003ccanvas id=\"motionCanvas\">\u003c/canvas>\u003cspan class=\"canvasLabel\" id=\"motionLabel\">Erkin tushish\u003c/span>\u003c/div>\n\u003cdiv class=\"metrics\">\u003cdiv class=\"metric\">\u003cspan>Vaqt t\u003c/span>\u003cstrong id=\"timeMetric\">0,00 s\u003c/strong>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>Tezlik moduli\u003c/span>\u003cstrong id=\"speedMetric\">0,00 m/s\u003c/strong>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>Balandlik y\u003c/span>\u003cstrong id=\"heightMetric\">80,0 m\u003c/strong>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>Gorizontal masofa x\u003c/span>\u003cstrong id=\"xMetric\">0,0 m\u003c/strong>\u003c/div>\u003c/div>\n\u003cdiv class=\"btns\">\u003cbutton class=\"btn\" id=\"startMotion\">▶ Boshlash\u003c/button>\u003cbutton class=\"btn secondary\" id=\"pauseMotion\">Ⅱ Pauza\u003c/button>\u003cbutton class=\"btn gold\" id=\"resetMotion\">↺ Qayta boshlash\u003c/button>\u003c/div>\u003c/div>\n\u003cdiv class=\"controls\">\n\u003cdiv class=\"control\">\u003clabel for=\"motionType\">Harakat turi\u003c/label>\u003cselect id=\"motionType\" style=\"width:100%;margin-top:8px;background:#10243c;color:#edf5ff;border:1px solid #42617f;border-radius:8px;padding:10px\">\u003coption value=\"fall\">Erkin tushish\u003c/option>\u003coption value=\"vertical\">Vertikal yuqoriga otilish\u003c/option>\u003coption value=\"projectile\">Burchak ostida otilish\u003c/option>\u003c/select>\u003c/div>\n\u003cdiv class=\"control\">\u003clabel for=\"initialHeight\">Boshlang‘ich balandlik \u003coutput id=\"initialHeightOut\">80 m\u003c/output>\u003c/label>\u003cinput id=\"initialHeight\" type=\"range\" min=\"20\" max=\"150\" value=\"80\">\u003c/div>\n\u003cdiv class=\"control\">\u003clabel for=\"initialSpeed\">Boshlang‘ich tezlik \u003coutput id=\"initialSpeedOut\">20 m/s\u003c/output>\u003c/label>\u003cinput id=\"initialSpeed\" type=\"range\" min=\"5\" max=\"40\" value=\"20\">\u003c/div>\n\u003cdiv class=\"control\">\u003clabel for=\"angle\">Otilish burchagi α \u003coutput id=\"angleOut\">45°\u003c/output>\u003c/label>\u003cinput id=\"angle\" type=\"range\" min=\"10\" max=\"80\" value=\"45\">\u003c/div>\n\u003cdiv class=\"formula\">Erkin tushish: h = gt²/2\u003cbr>Vertikal: y = y₀ + v₀t − gt²/2\u003cbr>Gorizontal: x = v₀cosα · t\u003c/div>\u003cp class=\"note\">Ideal modelda havoning qarshiligi hisobga olinmaydi, g = 9,81 m/s². Ko‘rsatkichlar fizik formulalar asosida hisoblanadi.\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"orbit\" class=\"section\">\u003cdiv class=\"card\">\n\u003ch2>3-reja. Gravitatsiya qonunlari va orbital harakat\u003c/h2>\u003cp class=\"lead\">Sun’iy yo‘ldosh Yer atrofida doiraviy orbitada harakatlanadi.\u003c/p>\n\u003cdiv class=\"layout\">\u003cdiv>\u003cdiv class=\"canvasWrap\">\u003ccanvas id=\"orbitCanvas\">\u003c/canvas>\u003cspan class=\"canvasLabel\">Yer atrofidagi sun’iy yo‘ldosh\u003c/span>\u003c/div>\n\u003cdiv class=\"metrics\">\u003cdiv class=\"metric\">\u003cspan>Orbital tezlik\u003c/span>\u003cstrong id=\"orbSpeed\">—\u003c/strong>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>Aylanish davri\u003c/span>\u003cstrong id=\"orbPeriod\">—\u003c/strong>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>Gravitatsion tezlanish\u003c/span>\u003cstrong id=\"orbG\">—\u003c/strong>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>Orbital radius r\u003c/span>\u003cstrong id=\"orbRadius\">—\u003c/strong>\u003c/div>\u003c/div>\n\u003cdiv class=\"btns\">\u003cbutton class=\"btn\" id=\"startOrbit\">▶ Harakat\u003c/button>\u003cbutton class=\"btn secondary\" id=\"pauseOrbit\">Ⅱ Pauza\u003c/button>\u003cbutton class=\"btn gold\" id=\"resetOrbit\">↺ Qayta\u003c/button>\u003c/div>\u003c/div>\n\u003cdiv class=\"controls\">\u003cdiv class=\"control\">\u003clabel for=\"orbitAltitude\">Balandlik h \u003coutput id=\"orbitAltitudeOut\">400 km\u003c/output>\u003c/label>\u003cinput id=\"orbitAltitude\" type=\"range\" min=\"200\" max=\"2000\" step=\"50\" value=\"400\">\u003c/div>\n\u003cdiv class=\"control\">\u003clabel for=\"satMass\">Yo‘ldosh massasi \u003coutput id=\"satMassOut\">500 kg\u003c/output>\u003c/label>\u003cinput id=\"satMass\" type=\"range\" min=\"100\" max=\"2000\" step=\"100\" value=\"500\">\u003c/div>\n\u003cdiv class=\"formula\">v = √(GM/r)\u003cbr>T = 2π√(r³/GM)\u003cbr>g = GM/r²\u003c/div>\u003cp class=\"note\">Yer massasi M = 5,972 × 10²⁴ kg; Yer radiusi R = 6371 km; G = 6,6743 × 10⁻¹¹ SI. Orbital radius r = R + h.\u003c/p>\u003cdiv class=\"control\">\u003cstrong>Esda tuting\u003c/strong>\u003cp class=\"note\">Ideal doiraviy orbitada yo‘ldosh massasi orbital tezlik va davrga ta’sir qilmaydi. Balandlik ortganda orbital tezlik kamayadi, aylanish davri ortadi.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"quiz\" class=\"section\">\u003cdiv class=\"card\">\u003ch2>Bilimingizni tekshiring\u003c/h2>\u003cp class=\"lead\">Har bir savol uchun bitta javobni tanlang.\u003c/p>\u003cform id=\"quizForm\" class=\"quiz\">\n\u003cdiv class=\"question\">\u003cp>1. Gravitatsion kuch masofaga qanday bog‘liq?\u003c/p>\u003clabel>\u003cinput type=\"radio\" name=\"q1\" value=\"a\"> Masofaga to‘g‘ri proporsional\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q1\" value=\"b\"> Masofa kvadratiga teskari proporsional\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q1\" value=\"c\"> Masofaga bog‘liq emas\u003c/label>\u003c/div>\n\u003cdiv class=\"question\">\u003cp>2. Yer sirtiga yaqin erkin tushish tezlanishi qancha?\u003c/p>\u003clabel>\u003cinput type=\"radio\" name=\"q2\" value=\"a\"> 3,0 m/s²\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q2\" value=\"b\"> 9,81 m/s²\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q2\" value=\"c\"> 100 m/s²\u003c/label>\u003c/div>\n\u003cdiv class=\"question\">\u003cp>3. Havoning qarshiligi bo‘lmasa, tushish tezlanishi nimaga bog‘liq?\u003c/p>\u003clabel>\u003cinput type=\"radio\" name=\"q3\" value=\"a\"> Jism massasiga\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q3\" value=\"b\"> Jism rangiga\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q3\" value=\"c\"> Gravitatsion maydonga\u003c/label>\u003c/div>\n\u003cdiv class=\"question\">\u003cp>4. Doiraviy orbitada balandlik ortsa, orbital tezlik qanday o‘zgaradi?\u003c/p>\u003clabel>\u003cinput type=\"radio\" name=\"q4\" value=\"a\"> Kamayadi\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q4\" value=\"b\"> Ortadi\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q4\" value=\"c\"> O‘zgarmaydi\u003c/label>\u003c/div>\n\u003cdiv class=\"question\">\u003cp>5. Gorizontga burchak ostida otilgan jismning ideal traektoriyasi qanday?\u003c/p>\u003clabel>\u003cinput type=\"radio\" name=\"q5\" value=\"a\"> To‘g‘ri chiziq\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q5\" value=\"b\"> Parabola\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q5\" value=\"c\"> Aylana\u003c/label>\u003c/div>\n\u003cbutton class=\"btn\" type=\"submit\">Javoblarni tekshirish\u003c/button>\u003cdiv id=\"quizResult\" class=\"result\" aria-live=\"polite\">\u003c/div>\u003c/form>\u003c/div>\u003c/section>\n\u003c/main>\u003cfooter>Virtual laboratoriya · Parametrlarni o‘zgartiring, kuzating va xulosa chiqaring.\u003c/footer>\n\n\u003cscript>\n'use strict';\nconst $=id=>document.getElementById(id),G=6.6743e-11,ME=5.972e24,RE=6.371e6,g0=9.81;\nconst fmt=(n,d=2)=>Number.isFinite(n)?n.toLocaleString('uz-UZ',{maximumFractionDigits:d,minimumFractionDigits:d}):'—';\nconst cvs={};let motionT=0,motionRunning=false,orbitAngle=0,orbitRunning=true,lastStamp=0;\nfunction setup(id){const c=$(id),ctx=c.getContext('2d');cvs[id]={c,ctx};function size(){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.max(1,Math.round(r.width*d));c.height=Math.max(1,Math.round(r.height*d));ctx.setTransform(d,0,0,d,0,0);drawAll()}new ResizeObserver(size).observe(c);size()}\nfunction clear(id){const {c,ctx}=cvs[id];ctx.clearRect(0,0,c.clientWidth,c.clientHeight);return {ctx,w:c.clientWidth,h:c.clientHeight}}\nfunction stars(ctx,w,h,n=55){for(let i=0;i\u003cn;i++){ctx.fillStyle=`rgba(180,220,255,${.15+(i%5)*.12})`;ctx.beginPath();ctx.arc((i*97+31)%Math.max(1,w),(i*53+17)%Math.max(1,h),i%7===0?1.5:.7,0,7);ctx.fill()}}\nfunction arrow(ctx,x1,y1,x2,y2,color,width=2){const a=Math.atan2(y2-y1,x2-x1);ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-8*Math.cos(a-.45),y2-8*Math.sin(a-.45));ctx.lineTo(x2-8*Math.cos(a+.45),y2-8*Math.sin(a+.45));ctx.closePath();ctx.fill()}\nfunction drawField(){const {ctx,w,h}=clear('fieldCanvas');stars(ctx,w,h,35);const m1=+$('massA').value,m2=+$('massB').value,r=+$('distance').value,cx=w/2,cy=h/2,sep=Math.min(w*.31,60+r*6),r1=13+Math.sqrt(m1)*2,r2=13+Math.sqrt(m2)*2;\nctx.strokeStyle='#52d7f544';for(let i=0;i\u003c15;i++){const a=i*Math.PI/7.5;ctx.beginPath();ctx.moveTo(cx-sep,cy);ctx.quadraticCurveTo(cx,cy+Math.sin(a)*h*.38,cx+sep,cy);ctx.stroke()}\nctx.setLineDash([4,5]);ctx.strokeStyle='#a9bed8';ctx.beginPath();ctx.moveTo(cx-sep,cy);ctx.lineTo(cx+sep,cy);ctx.stroke();ctx.setLineDash([]);\n[[cx-sep,r1,'#52d7f5','m₁'],[cx+sep,r2,'#ffd166','m₂']].forEach(([x,rad,col,label])=>{const g=ctx.createRadialGradient(x-rad*.3,cy-rad*.3,1,x,cy,rad*1.5);g.addColorStop(0,'#fff');g.addColorStop(.3,col);g.addColorStop(1,'#12304d');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,cy,rad,0,7);ctx.fill();ctx.fillStyle='#edf5ff';ctx.textAlign='center';ctx.font='bold 13px system-ui';ctx.fillText(label,x,cy+rad+18)});\narrow(ctx,cx-sep+r1,cy-26,cx-sep+r1+35,cy-26,'#52d7f5');arrow(ctx,cx+sep-r2,cy+26,cx+sep-r2-35,cy+26,'#ffd166');\nctx.fillStyle='#a9bed8';ctx.textAlign='center';ctx.font='12px system-ui';ctx.fillText(`r = ${r.toFixed(1)} m`,cx,cy-13);\nconst F=G*m1*m2/(r*r),field=G*m1/(r*r);$('forceMetric').textContent=F.toExponential(3)+' N';$('gMetric').textContent=field.toExponential(3)+' m/s²';$('rMetric').textContent=fmt(r,1)+' m';\n}\nfunction motionValues(t){const type=$('motionType').value,y0=+$('initialHeight').value,v0=+$('initialSpeed').value,a=+$('angle').value*Math.PI/180;let x=0,y=0,vx=0,vy=0;\nif(type==='fall'){y=y0-.5*g0*t*t;vy=-g0*t}\nelse if(type==='vertical'){y=y0+v0*t-.5*g0*t*t;vy=v0-g0*t}\nelse{x=v0*Math.cos(a)*t;y=y0+v0*Math.sin(a)*t-.5*g0*t*t;vx=v0*Math.cos(a);vy=v0*Math.sin(a)-g0*t}\nreturn {x,y,vx,vy,speed:Math.hypot(vx,vy)}}\nfunction motionEnd(){const type=$('motionType').value,y0=+$('initialHeight').value,v=+$('initialSpeed').value,a=+$('angle').value*Math.PI/180;if(type==='fall')return Math.sqrt(2*y0/g0);if(type==='vertical')return (v+Math.sqrt(v*v+2*g0*y0))/g0;const vy=v*Math.sin(a);return (vy+Math.sqrt(vy*vy+2*g0*y0))/g0}\nfunction drawMotion(){const {ctx,w,h}=clear('motionCanvas');stars(ctx,w,h,25);const type=$('motionType').value,y0=+$('initialHeight').value,v0=+$('initialSpeed').value,a=+$('angle').value*Math.PI/180,T=motionEnd(),t=Math.min(motionT,T),p=motionValues(t);\n$('motionLabel').textContent=type==='fall'?'Erkin tushish':type==='vertical'?'Vertikal yuqoriga otilish':'Burchak ostida otilish';\nconst ground=h-35;ctx.strokeStyle='#79e2a7';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(15,ground);ctx.lineTo(w-15,ground);ctx.stroke();ctx.fillStyle='#a9bed8';ctx.font='12px system-ui';ctx.fillText('Yer sathi',18,ground+19);\nlet maxX=Math.max(40,type==='projectile'?v0*Math.cos(a)*T:10),maxY=Math.max(y0,type==='vertical'?y0+v0*v0/(2*g0):y0+25);const scaleX=(w-50)/Math.max(maxX,1),scaleY=(ground-35)/Math.max(maxY,1),sx=20,sy=ground;\nctx.strokeStyle='#52d7f5';ctx.lineWidth=2;ctx.beginPath();let started=false;for(let i=0;i\u003c=100;i++){const q=motionValues(T*i/100),px=sx+q.x*scaleX,py=sy-q.y*scaleY;if(!started){ctx.moveTo(px,py);started=true}else ctx.lineTo(px,py)}ctx.stroke();\nconst bx=sx+p.x*scaleX,by=sy-p.y*scaleY;const grd=ctx.createRadialGradient(bx-3,by-4,1,bx,by,12);grd.addColorStop(0,'#fff');grd.addColorStop(.4,'#ffd166');grd.addColorStop(1,'#b96d16');ctx.fillStyle=grd;ctx.beginPath();ctx.arc(bx,by,9,0,7);ctx.fill();arrow(ctx,bx,by,bx+p.vx*1.5,by-p.vy*1.5,'#79e2a7',2);\n$('timeMetric').textContent=fmt(t)+' s';$('speedMetric').textContent=fmt(p.speed)+' m/s';$('heightMetric').textContent=fmt(Math.max(0,p.y))+' m';$('xMetric').textContent=fmt(p.x)+' m';\nif(t>=T){motionRunning=false;motionT=T}\n}\nfunction drawOrbit(){const {ctx,w,h}=clear('orbitCanvas');stars(ctx,w,h,65);const alt=+$('orbitAltitude').value*1000,r=RE+alt,v=Math.sqrt(G*ME/r),T=2*Math.PI*Math.sqrt(r**3/(G*ME)),gg=G*ME/(r*r),cx=w/2,cy=h/2,rad=Math.min(w,h)*(.22+($('orbitAltitude').value-200)/1800*.13),earth=Math.min(w,h)*.14;\nctx.strokeStyle='#52d7f566';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,rad,0,7);ctx.stroke();\nconst eg=ctx.createRadialGradient(cx-earth*.35,cy-earth*.4,1,cx,cy,earth*1.35);eg.addColorStop(0,'#a7efff');eg.addColorStop(.35,'#238bd1');eg.addColorStop(.7,'#14528c');eg.addColorStop(1,'#071426');ctx.fillStyle=eg;ctx.beginPath();ctx.arc(cx,cy,earth,0,7);ctx.fill();\nctx.strokeStyle='#79e2a755';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx-earth*.18,cy-earth*.05,earth*.75,-.9,.7);ctx.stroke();ctx.beginPath();ctx.arc(cx+earth*.15,cy+earth*.15,earth*.35,2,4.8);ctx.stroke();\nconst sx=cx+rad*Math.cos(orbitAngle),sy=cy+rad*Math.sin(orbitAngle);ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(sx,sy,7,0,7);ctx.fill();ctx.fillStyle='#52d7f5';ctx.fillRect(sx-14,sy-3,8,6);ctx.fillRect(sx+6,sy-3,8,6);arrow(ctx,sx,sy,sx-16*Math.sin(orbitAngle),sy+16*Math.cos(orbitAngle),'#79e2a7',2);\n$('orbSpeed').textContent=fmt(v/1000,3)+' km/s';$('orbPeriod').textContent=fmt(T/60,1)+' min';$('orbG').textContent=fmt(gg,2)+' m/s²';$('orbRadius').textContent=fmt(r/1000,0)+' km';\n}\nfunction drawAll(){if(cvs.fieldCanvas)drawField();if(cvs.motionCanvas)drawMotion();if(cvs.orbitCanvas)drawOrbit()}\ndocument.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===b.dataset.target));drawAll()}));\n['massA','massB','distance'].forEach(id=>$(id).addEventListener('input',()=>{$(id+'Out').textContent=$(id).value+(id==='distance'?' m':' kg');drawField()}));\n['initialHeight','initialSpeed','angle'].forEach(id=>$(id).addEventListener('input',()=>{$(id+'Out').textContent=$(id).value+(id==='angle'?'°':id==='initialHeight'?' m':' m/s');motionT=0;drawMotion()}));\n$('motionType').addEventListener('change',()=>{motionT=0;motionRunning=false;drawMotion()});\n$('startMotion').addEventListener('click',()=>{if(motionT>=motionEnd())motionT=0;motionRunning=true});$('pauseMotion').addEventListener('click',()=>motionRunning=false);$('resetMotion').addEventListener('click',()=>{motionRunning=false;motionT=0;drawMotion()});\n['orbitAltitude','satMass'].forEach(id=>$(id).addEventListener('input',()=>{$(id+'Out').textContent=$(id).value+(id==='orbitAltitude'?' km':' kg');drawOrbit()}));\n$('startOrbit').addEventListener('click',()=>orbitRunning=true);$('pauseOrbit').addEventListener('click',()=>orbitRunning=false);$('resetOrbit').addEventListener('click',()=>{orbitAngle=0;drawOrbit()});\n$('quizForm').addEventListener('submit',e=>{e.preventDefault();const ans={q1:'b',q2:'b',q3:'c',q4:'a',q5:'b'};let score=0;for(const [q,a] of Object.entries(ans)){if(document.querySelector(`input[name=\"${q}\"]:checked`)?.value===a)score++}$('quizResult').textContent=`Natija: ${score}/5 ta to‘g‘ri javob.`+(score===5?' A’lo!':score>=3?' Yaxshi! Mavzuni yana bir bor takrorlang.':' Mavzuni takrorlab, qayta urinib ko‘ring.');});\nfunction animate(stamp){if(!lastStamp)lastStamp=stamp;const dt=Math.min((stamp-lastStamp)/1000,.05);lastStamp=stamp;if(motionRunning){motionT+=dt;if(motionT>=motionEnd()){motionT=motionEnd();motionRunning=false}drawMotion()}if(orbitRunning){orbitAngle+=dt*.65;if(orbitAngle>Math.PI*2)orbitAngle-=Math.PI*2;drawOrbit()}requestAnimationFrame(animate)}\nsetup('fieldCanvas');setup('motionCanvas');setup('orbitCanvas');drawAll();requestAnimationFrame(animate);\n\u003c/script>\n\u003c/body>\u003c/html>", "4-mavzu": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>4-mavzu: Masalalar yechish\u003c/title>\n\u003cstyle>\n:root{--bg:#f3f6fb;--card:#fff;--ink:#18243a;--muted:#60708a;--blue:#225bd6;--cyan:#12a6bd;--orange:#f59e0b;--line:#dce5f1;--green:#138a58;--red:#c24141}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}\nheader{background:linear-gradient(120deg,#123a83,#176fba 60%,#16a6b7);color:white;padding:28px 18px 32px}\n.wrap{max-width:1120px;margin:auto;padding:0 16px}header h1{margin:0 0 8px;font-size:clamp(1.65rem,4vw,2.55rem);line-height:1.15}header p{margin:0;max-width:800px;color:#eaf7ff}\nnav{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 3px 14px #18243a0a}\n.navin{display:flex;gap:8px;overflow:auto;padding:10px 16px;max-width:1120px;margin:auto}\nnav a{white-space:nowrap;text-decoration:none;color:var(--ink);padding:8px 12px;border-radius:9px;font-size:.92rem}nav a:hover{background:#eaf1ff;color:var(--blue)}\nmain{max-width:1120px;margin:22px auto;padding:0 16px 42px}\nsection{scroll-margin-top:78px;margin:20px 0 28px}\nh2{font-size:1.45rem;margin:0 0 14px}h3{margin:0 0 10px;font-size:1.08rem}\n.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 5px 18px #1b35500a}\n.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid .card{margin:0}\n.formula{background:#edf4ff;border:1px solid #d5e5ff;padding:12px 14px;border-radius:10px;font-weight:700;color:#17479c;display:inline-block;margin:4px 0}\n.small{color:var(--muted);font-size:.92rem}.tag{display:inline-block;background:#e7f8f8;color:#087887;border-radius:999px;padding:3px 9px;font-size:.78rem;font-weight:700}\nbutton{border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:white;font:inherit;font-weight:650;cursor:pointer;margin:4px 4px 4px 0}\nbutton.secondary{background:#eaf0fa;color:#1f3d6e}button.orange{background:#d97706}button:hover{filter:brightness(.96)}\ninput[type=number],select{width:100%;padding:10px;border:1px solid #cbd7e7;border-radius:9px;background:white;color:var(--ink);font:inherit}\nlabel{display:block;font-size:.9rem;font-weight:650;margin:8px 0 4px}\n.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}\ncanvas{display:block;width:100%;height:300px;border-radius:12px;background:linear-gradient(#f8fbff,#edf5ff);border:1px solid var(--line)}\n.result{background:#f0faf5;border:1px solid #c6edda;border-radius:10px;padding:12px;margin-top:10px}\n.problem{border-left:4px solid var(--cyan);padding:10px 14px;background:#f7fcfd;border-radius:0 10px 10px 0;margin:12px 0}\n.solution{display:none;padding:12px 14px;background:#f5f8fd;border-radius:10px;margin-top:8px}.solution.show{display:block}\ntable{border-collapse:collapse;width:100%;margin:8px 0}td,th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}th{background:#f0f5fb}\n.quizq{padding:14px 0;border-bottom:1px solid var(--line)}.quizq label{font-weight:400;display:flex;gap:8px;align-items:flex-start;margin:8px 0}.quizq input{margin-top:5px}\nfooter{text-align:center;color:var(--muted);padding:24px}\n@media(max-width:720px){.grid{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}canvas{height:250px}.card{padding:14px}}\n@media(max-width:430px){.controls{grid-template-columns:1fr}nav a{font-size:.85rem;padding:7px 9px}}\n@media print{nav,button,.controls{display:none!important}body{background:#fff}.card{box-shadow:none;break-inside:avoid}header{background:#fff;color:#111;border-bottom:2px solid #333}header p{color:#333}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\u003cdiv class=\"wrap\">\n\u003cspan class=\"tag\">10-sinf fizika\u003c/span>\n\u003ch1>4-mavzu: Masalalar yechish\u003c/h1>\n\u003cp>Markazga intilma kuch va gravitatsiya maydonidagi harakat. Formulalar, bosqichma-bosqich yechimlar, interaktiv simulyatsiyalar va bilimni tekshirish testi.\u003c/p>\n\u003c/div>\u003c/header>\n\u003cnav>\u003cdiv class=\"navin\">\n\u003ca href=\"#formulalar\">Formulalar\u003c/a>\u003ca href=\"#markaz\">1. Markazga intilma kuch\u003c/a>\u003ca href=\"#gravitatsiya\">2. Gravitatsiya\u003c/a>\u003ca href=\"#aralash\">3. Aralash masalalar\u003c/a>\u003ca href=\"#test\">Test\u003c/a>\n\u003c/div>\u003c/nav>\n\u003cmain>\n\u003csection id=\"kirish\">\n\u003cdiv class=\"card\">\u003ch2>Dars maqsadi\u003c/h2>\n\u003cp>Aylana bo‘ylab harakat, gravitatsion tortishish, erkin tushish va orbital harakatga doir masalalarni fizik formulalar yordamida yechish.\u003c/p>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003ch3>Masala yechish algoritmi\u003c/h3>\u003col>\u003cli>Berilganlarni yozing.\u003c/li>\u003cli>Topilishi kerak bo‘lgan kattalikni aniqlang.\u003c/li>\u003cli>Mos formulani tanlang.\u003c/li>\u003cli>Qiymatlarni SI birliklariga o‘tkazing.\u003c/li>\u003cli>Hisoblang va javobni birlik bilan yozing.\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv>\u003ch3>Doimiy kattaliklar\u003c/h3>\u003cp>\u003cb>G\u003c/b> = 6,67 × 10⁻¹¹ N·m²/kg²\u003c/p>\u003cp>\u003cb>g\u003c/b> ≈ 9,8 m/s² (Yer sirtiga yaqin)\u003c/p>\u003cp>\u003cb>Yer radiusi\u003c/b> R ≈ 6,37 × 10⁶ m\u003c/p>\u003cp>\u003cb>Yer massasi\u003c/b> M ≈ 5,97 × 10²⁴ kg\u003c/p>\u003c/div>\n\u003c/div>\u003c/div>\n\u003c/section>\n\u003csection id=\"formulalar\">\n\u003ch2>Asosiy formulalar jadvali\u003c/h2>\u003cdiv class=\"card\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Kattalik\u003c/th>\u003cth>Formula\u003c/th>\u003cth>Izoh\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Markazga intilma tezlanish\u003c/td>\u003ctd>a = v²/r\u003c/td>\u003ctd>v — tezlik, r — radius\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Markazga intilma kuch\u003c/td>\u003ctd>F = mv²/r\u003c/td>\u003ctd>Kuch markazga yo‘nalgan\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Chiziqli va burchak tezlik\u003c/td>\u003ctd>v = ωr\u003c/td>\u003ctd>ω — burchak tezlik\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Aylanish davri\u003c/td>\u003ctd>v = 2πr/T\u003c/td>\u003ctd>T — bir aylanish vaqti\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Butun olam tortishish qonuni\u003c/td>\u003ctd>F = Gm₁m₂/r²\u003c/td>\u003ctd>r — jismlar markazlari orasidagi masofa\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Gravitatsion tezlanish\u003c/td>\u003ctd>g = GM/r²\u003c/td>\u003ctd>Markazdan r masofada\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Erkin tushish\u003c/td>\u003ctd>v = v₀ + gt; h = v₀t + gt²/2\u003c/td>\u003ctd>Pastga yo‘nalish musbat deb olindi\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Potensial energiya (Yer sirtiga yaqin)\u003c/td>\u003ctd>Eₚ = mgh\u003c/td>\u003ctd>h — tanlangan sathdan balandlik\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Birinchi kosmik tezlik\u003c/td>\u003ctd>v₁ = √(GM/R) = √(gR)\u003c/td>\u003ctd>Aylana orbitaga yaqinlashgan holda\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Ikkinchi kosmik tezlik\u003c/td>\u003ctd>v₂ = √(2GM/R) = √(2gR)\u003c/td>\u003ctd>Ideal holatda qochish tezligi\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003cp class=\"small\">Eslatma: vektor kattaliklarning yo‘nalishi muhim. Erkin tushish formulalarida g pastga yo‘nalgan tezlanish modulidir.\u003c/p>\u003c/div>\n\u003c/section>\n\u003csection id=\"markaz\">\n\u003ch2>1-reja. Markazga intilma kuch\u003c/h2>\n\u003cdiv class=\"grid\">\n\u003cdiv class=\"card\">\u003ch3>Namuna masala 1\u003c/h3>\u003cp>Massasi 2 kg jism radiusi 4 m aylana bo‘ylab 6 m/s tezlikda harakatlanmoqda. Markazga intilma kuchni toping.\u003c/p>\n\u003cdiv class=\"formula\">F = mv²/r\u003c/div>\n\u003cp>\u003cb>Berilgan:\u003c/b> m = 2 kg; v = 6 m/s; r = 4 m.\u003c/p>\u003cp>\u003cb>Yechish:\u003c/b> F = 2 × 6² / 4 = 72 / 4 = 18 N.\u003c/p>\u003cp>\u003cb>Javob:\u003c/b> 18 N.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Namuna masala 2\u003c/h3>\u003cp>Avtomobil 10 m radiusli burilishdan 5 m/s tezlikda o‘tmoqda. Markazga intilma tezlanishni toping.\u003c/p>\u003cdiv class=\"formula\">a = v²/r\u003c/div>\u003cp>\u003cb>Yechish:\u003c/b> a = 5² / 10 = 25 / 10 = 2,5 m/s².\u003c/p>\u003cp>\u003cb>Javob:\u003c/b> 2,5 m/s².\u003c/p>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Simulyatsiya: aylana bo‘ylab harakat\u003c/h3>\u003cp class=\"small\">Massa, tezlik va radiusni o‘zgartiring. Jismning harakati, tezlik vektori va markazga intilma kuch vektori yangilanadi.\u003c/p>\n\u003cdiv class=\"controls\">\n\u003cdiv>\u003clabel for=\"mass\">Massa m (kg)\u003c/label>\u003cinput id=\"mass\" type=\"number\" min=\"0.1\" max=\"20\" step=\"0.1\" value=\"2\">\u003c/div>\n\u003cdiv>\u003clabel for=\"speed\">Tezlik v (m/s)\u003c/label>\u003cinput id=\"speed\" type=\"number\" min=\"0.1\" max=\"30\" step=\"0.1\" value=\"6\">\u003c/div>\n\u003cdiv>\u003clabel for=\"radius\">Radius r (m)\u003c/label>\u003cinput id=\"radius\" type=\"number\" min=\"0.5\" max=\"15\" step=\"0.5\" value=\"4\">\u003c/div>\n\u003c/div>\u003ccanvas id=\"circleCanvas\" aria-label=\"Aylana bo‘ylab harakat animatsiyasi\">\u003c/canvas>\n\u003cdiv class=\"result\" id=\"circleResult\">Markazga intilma kuch: 18 N\u003c/div>\n\u003cbutton id=\"circleStart\">Boshlash\u003c/button>\u003cbutton class=\"secondary\" id=\"circlePause\">To‘xtatish\u003c/button>\u003cbutton class=\"secondary\" id=\"circleReset\">Qayta boshlash\u003c/button>\n\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Mustaqil masala\u003c/h3>\u003cp>Massasi 0,5 kg bo‘lgan jism 2 m radiusli aylana bo‘ylab 8 m/s tezlikda harakatlanadi. Markazga intilma kuchni toping.\u003c/p>\u003cbutton class=\"secondary\" onclick=\"toggleSolution('sol1')\">Yechimini ko‘rsatish\u003c/button>\u003cdiv id=\"sol1\" class=\"solution\">F = mv²/r = 0,5 × 8² / 2 = 0,5 × 64 / 2 = \u003cb>16 N\u003c/b>.\u003c/div>\u003c/div>\n\u003c/section>\n\u003csection id=\"gravitatsiya\">\n\u003ch2>2-reja. Gravitatsiya maydonidagi harakat\u003c/h2>\n\u003cdiv class=\"grid\">\n\u003cdiv class=\"card\">\u003ch3>Namuna masala 3: erkin tushish\u003c/h3>\u003cp>Jism tinch holatdan 3 s davomida erkin tushdi. h va v ni toping. Havoning qarshiligini hisobga olmang.\u003c/p>\u003cdiv class=\"formula\">h = gt²/2; v = gt\u003c/div>\u003cp>\u003cb>Yechish:\u003c/b> h = 9,8 × 3² / 2 = 44,1 m.\u003c/p>\u003cp>v = 9,8 × 3 = 29,4 m/s.\u003c/p>\u003cp>\u003cb>Javob:\u003c/b> h = 44,1 m; v = 29,4 m/s pastga.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Namuna masala 4: tortishish kuchi\u003c/h3>\u003cp>Massalari 5 kg va 10 kg bo‘lgan jismlar markazlari orasidagi masofa 2 m. Ular orasidagi tortishish kuchini hisoblang.\u003c/p>\u003cdiv class=\"formula\">F = Gm₁m₂/r²\u003c/div>\u003cp>\u003cb>Yechish:\u003c/b> F = 6,67×10⁻¹¹ × 5 × 10 / 2² ≈ 8,34×10⁻¹⁰ N.\u003c/p>\u003cp>\u003cb>Javob:\u003c/b> taxminan 8,34 × 10⁻¹⁰ N.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Simulyatsiya: erkin tushish\u003c/h3>\u003cp class=\"small\">Boshlang‘ich tezlik va vaqtni o‘zgartiring. Animatsiyada jismning tushishi, balandlik va tezlik ko‘rsatiladi. Model Yer sirtiga yaqin, g doimiy bo‘lgan holat uchun.\u003c/p>\n\u003cdiv class=\"controls\">\n\u003cdiv>\u003clabel for=\"height\">Boshlang‘ich balandlik (m)\u003c/label>\u003cinput id=\"height\" type=\"number\" min=\"1\" max=\"500\" step=\"1\" value=\"100\">\u003c/div>\n\u003cdiv>\u003clabel for=\"v0\">Boshlang‘ich tezlik pastga (m/s)\u003c/label>\u003cinput id=\"v0\" type=\"number\" min=\"0\" max=\"40\" step=\"1\" value=\"0\">\u003c/div>\n\u003cdiv>\u003clabel for=\"fallTime\">Vaqt (s)\u003c/label>\u003cinput id=\"fallTime\" type=\"number\" min=\"0.1\" max=\"10\" step=\"0.1\" value=\"3\">\u003c/div>\n\u003c/div>\u003ccanvas id=\"fallCanvas\" aria-label=\"Erkin tushish animatsiyasi\">\u003c/canvas>\n\u003cdiv class=\"result\" id=\"fallResult\">\u003c/div>\u003cbutton id=\"fallRun\">Animatsiyani boshlash\u003c/button>\u003cbutton class=\"secondary\" id=\"fallStop\">To‘xtatish\u003c/button>\u003cbutton class=\"secondary\" id=\"fallReset\">Qayta boshlash\u003c/button>\n\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Mustaqil masala\u003c/h3>\u003cp>Jism 20 m balandlikdan tinch holatdan tushmoqda. Havoning qarshiligini hisobga olmasdan, tushish vaqtini toping. g = 10 m/s² deb oling.\u003c/p>\u003cbutton class=\"secondary\" onclick=\"toggleSolution('sol2')\">Yechimini ko‘rsatish\u003c/button>\u003cdiv id=\"sol2\" class=\"solution\">h = gt²/2 → t = √(2h/g) = √(40/10) = √4 = \u003cb>2 s\u003c/b>.\u003c/div>\u003c/div>\n\u003c/section>\n\u003csection id=\"aralash\">\n\u003ch2>3-reja. Aralash masalalar va orbital harakat\u003c/h2>\n\u003cdiv class=\"grid\">\n\u003cdiv class=\"card\">\u003ch3>Namuna masala 5: yo‘ldosh\u003c/h3>\u003cp>Sun’iy yo‘ldosh aylana orbitada harakatlanadi. Orbita radiusi r va markaziy jism massasi M ma’lum bo‘lsa, orbital tezlik qanday topiladi?\u003c/p>\u003cdiv class=\"formula\">v = √(GM/r)\u003c/div>\u003cp>Bu natija gravitatsion kuch markazga intilma kuch vazifasini bajarishidan kelib chiqadi: GMm/r² = mv²/r. Yo‘ldosh massasi qisqaradi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Namuna masala 6: orbital tezlanish\u003c/h3>\u003cp>Jism Yer markazidan r masofada aylanmoqda. Gravitatsion tezlanish:\u003c/p>\u003cdiv class=\"formula\">g(r) = GM/r²\u003c/div>\u003cp>Masofa 2 baravar ortsa, g yangi qiymati avvalgisining 1/4 qismiga teng bo‘ladi, chunki tezlanish masofaning kvadratiga teskari proporsional.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Simulyatsiya: gravitatsiya va orbital tezlik\u003c/h3>\u003cp class=\"small\">Yer massasi va radiusi uchun idealizatsiyalangan model. Orbita radiusi Yer markazidan o‘lchanadi; qiymat Yer radiusidan kichik bo‘lishi mumkin emas.\u003c/p>\n\u003cdiv class=\"controls\">\n\u003cdiv>\u003clabel for=\"orbitAlt\">Yer sirtidan balandlik (km)\u003c/label>\u003cinput id=\"orbitAlt\" type=\"number\" min=\"0\" max=\"100000\" step=\"100\" value=\"400\">\u003c/div>\n\u003cdiv>\u003clabel for=\"satMass\">Yo‘ldosh massasi (kg)\u003c/label>\u003cinput id=\"satMass\" type=\"number\" min=\"1\" max=\"10000\" step=\"1\" value=\"1000\">\u003c/div>\n\u003cdiv>\u003clabel for=\"orbitSpeed\">Animatsiya tezligi\u003c/label>\u003cinput id=\"orbitSpeed\" type=\"number\" min=\"0.2\" max=\"3\" step=\"0.1\" value=\"1\">\u003c/div>\n\u003c/div>\u003ccanvas id=\"orbitCanvas\" aria-label=\"Yer atrofidagi sun’iy yo‘ldosh animatsiyasi\">\u003c/canvas>\n\u003cdiv class=\"result\" id=\"orbitResult\">\u003c/div>\u003cbutton id=\"orbitStart\">Boshlash\u003c/button>\u003cbutton class=\"secondary\" id=\"orbitPause\">To‘xtatish\u003c/button>\u003cbutton class=\"secondary\" id=\"orbitReset\">Qayta boshlash\u003c/button>\n\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Mustaqil aralash masalalar\u003c/h3>\n\u003cdiv class=\"problem\">\u003cb>1.\u003c/b> 3 kg jism 6 m radiusli aylana bo‘ylab 4 m/s tezlikda harakatlanadi. Markazga intilma kuchni toping.\u003c/div>\u003cbutton class=\"secondary\" onclick=\"toggleSolution('sol3')\">Yechimini ko‘rsatish\u003c/button>\u003cdiv id=\"sol3\" class=\"solution\">F = mv²/r = 3 × 16 / 6 = \u003cb>8 N\u003c/b>.\u003c/div>\n\u003cdiv class=\"problem\">\u003cb>2.\u003c/b> Yer sirtiga yaqin joyda 2 kg jismning og‘irlik kuchini g = 9,8 m/s² deb hisoblang.\u003c/div>\u003cbutton class=\"secondary\" onclick=\"toggleSolution('sol4')\">Yechimini ko‘rsatish\u003c/button>\u003cdiv id=\"sol4\" class=\"solution\">P = mg = 2 × 9,8 = \u003cb>19,6 N\u003c/b>.\u003c/div>\n\u003cdiv class=\"problem\">\u003cb>3.\u003c/b> Aylana orbitada gravitatsion kuch 20 N, yo‘ldosh massasi 5 kg, orbital radius 10 m bo‘lsa, orbital tezlikni toping.\u003c/div>\u003cbutton class=\"secondary\" onclick=\"toggleSolution('sol5')\">Yechimini ko‘rsatish\u003c/button>\u003cdiv id=\"sol5\" class=\"solution\">F = mv²/r → v = √(Fr/m) = √(20 × 10 / 5) = √40 ≈ \u003cb>6,32 m/s\u003c/b>.\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection id=\"test\">\n\u003ch2>Bilimni tekshirish testi\u003c/h2>\u003cdiv class=\"card\">\u003cp>10 ta savolga javob bering, so‘ng “Natijani tekshirish” tugmasini bosing.\u003c/p>\u003cform id=\"quizForm\">\n\u003cdiv class=\"quizq\">\u003cb>1. Markazga intilma kuch formulasi qaysi?\u003c/b>\u003clabel>\u003cinput type=\"radio\" name=\"q1\" value=\"a\"> F = mv/r\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q1\" value=\"b\"> F = mv²/r\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q1\" value=\"c\"> F = mr/v²\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q1\" value=\"d\"> F = mg/r\u003c/label>\u003c/div>\n\u003cdiv class=\"quizq\">\u003cb>2. Tezlik 2 marta ortib, radius o‘zgarmasa, markazga intilma kuch qanday o‘zgaradi?\u003c/b>\u003clabel>\u003cinput type=\"radio\" name=\"q2\" value=\"a\"> 2 marta ortadi\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q2\" value=\"b\"> 4 marta ortadi\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q2\" value=\"c\"> 2 marta kamayadi\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q2\" value=\"d\"> O‘zgarmaydi\u003c/label>\u003c/div>\n\u003cdiv class=\"quizq\">\u003cb>3. Markazga intilma kuch qaysi tomonga yo‘naladi?\u003c/b>\u003clabel>\u003cinput type=\"radio\" name=\"q3\" value=\"a\"> Harakat yo‘nalishida\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q3\" value=\"b\"> Markazdan tashqariga\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q3\" value=\"c\"> Aylana markaziga\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q3\" value=\"d\"> Doimo yuqoriga\u003c/label>\u003c/div>\n\u003cdiv class=\"quizq\">\u003cb>4. Gravitatsion tortishish kuchi masofaga qanday bog‘liq?\u003c/b>\u003clabel>\u003cinput type=\"radio\" name=\"q4\" value=\"a\"> r ga to‘g‘ri proporsional\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q4\" value=\"b\"> r² ga to‘g‘ri proporsional\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q4\" value=\"c\"> r² ga teskari proporsional\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q4\" value=\"d\"> Masofaga bog‘liq emas\u003c/label>\u003c/div>\n\u003cdiv class=\"quizq\">\u003cb>5. Yer sirtiga yaqin erkin tushish tezlanishi taxminan qancha?\u003c/b>\u003clabel>\u003cinput type=\"radio\" name=\"q5\" value=\"a\"> 1,6 m/s²\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q5\" value=\"b\"> 9,8 m/s²\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q5\" value=\"c\"> 98 m/s²\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q5\" value=\"d\"> 0 m/s²\u003c/label>\u003c/div>\n\u003cdiv class=\"quizq\">\u003cb>6. Tinch holatdan erkin tushishda 2 s ichida qancha yo‘l bosiladi? g = 10 m/s².\u003c/b>\u003clabel>\u003cinput type=\"radio\" name=\"q6\" value=\"a\"> 10 m\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q6\" value=\"b\"> 20 m\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q6\" value=\"c\"> 40 m\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q6\" value=\"d\"> 5 m\u003c/label>\u003c/div>\n\u003cdiv class=\"quizq\">\u003cb>7. Butun olam tortishish qonunida G nimani bildiradi?\u003c/b>\u003clabel>\u003cinput type=\"radio\" name=\"q7\" value=\"a\"> Erkin tushish tezlanishi\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q7\" value=\"b\"> Gravitatsion doimiy\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q7\" value=\"c\"> Jism og‘irligi\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q7\" value=\"d\"> Orbital radius\u003c/label>\u003c/div>\n\u003cdiv class=\"quizq\">\u003cb>8. Agar aylana orbitada F = 8 N, m = 2 kg va r = 4 m bo‘lsa, tezlik qancha?\u003c/b>\u003clabel>\u003cinput type=\"radio\" name=\"q8\" value=\"a\"> 2 m/s\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q8\" value=\"b\"> 4 m/s\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q8\" value=\"c\"> 8 m/s\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q8\" value=\"d\"> 16 m/s\u003c/label>\u003c/div>\n\u003cdiv class=\"quizq\">\u003cb>9. Yer sirtiga yaqin potensial energiya formulasi qaysi?\u003c/b>\u003clabel>\u003cinput type=\"radio\" name=\"q9\" value=\"a\"> Eₚ = mgh\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q9\" value=\"b\"> Eₚ = mv\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q9\" value=\"c\"> Eₚ = F/r\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q9\" value=\"d\"> Eₚ = gt\u003c/label>\u003c/div>\n\u003cdiv class=\"quizq\">\u003cb>10. Orbital harakatda yo‘ldoshni orbitada ushlab turuvchi kuch qaysi?\u003c/b>\u003clabel>\u003cinput type=\"radio\" name=\"q10\" value=\"a\"> Ishqalanish kuchi\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q10\" value=\"b\"> Arximed kuchi\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q10\" value=\"c\"> Gravitatsion kuch\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q10\" value=\"d\"> Elektr kuchi\u003c/label>\u003c/div>\n\u003cbutton type=\"button\" id=\"checkQuiz\">Natijani tekshirish\u003c/button>\u003cbutton type=\"reset\" class=\"secondary\" id=\"resetQuiz\">Qayta ishlash\u003c/button>\n\u003c/form>\u003cdiv id=\"quizResult\" class=\"result\" style
