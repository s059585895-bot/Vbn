i class=\"fa-solid fa-display mr-1\">\u003c/i> Interaktiv Canvas Visualizatsiyasi\u003c/span>\n                    \u003cbutton onclick=\"resetRichag()\" class=\"text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg transition border border-slate-600 flex items-center gap-1.5\">\n                        \u003ci class=\"fa-solid fa-rotate-left\">\u003c/i> Qayta o'rnatish\n                    \u003c/button>\n                \u003c/div>\n                \u003cdiv class=\"relative w-full h-[320px] sm:h-[380px] bg-slate-950/80 flex items-center justify-center p-2\">\n                    \u003ccanvas id=\"richagCanvas\" class=\"w-full h-full block rounded-lg\">\u003c/canvas>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Realtime Controls and Metrics Grid -->\n            \u003cdiv class=\"grid grid-cols-1 lg:grid-cols-2 gap-6\">\n                \u003c!-- Left Side Controls (F1, L1) -->\n                \u003cdiv class=\"bg-slate-800 border border-slate-700 rounded-2xl p-5 space-y-4 relative overflow-hidden\">\n                    \u003cdiv class=\"absolute top-0 left-0 w-2 h-full bg-blue-500\">\u003c/div>\n                    \u003cdiv class=\"flex justify-between items-center pb-2 border-b border-slate-700\">\n                        \u003ch3 class=\"font-bold text-blue-400 flex items-center gap-2\">\n                            \u003ci class=\"fa-solid fa-weight-hanging\">\u003c/i> Chap Taraf (Kuch F₁)\n                        \u003c/h3>\n                        \u003cspan class=\"bg-blue-500/10 border border-blue-500/30 text-blue-400 font-mono text-sm px-2.5 py-1 rounded-lg font-bold\" id=\"val-m1\">\n                            M₁ = 100.0 N·m\n                        \u003c/span>\n                    \u003c/div>\n\n                    \u003cdiv class=\"space-y-3\">\n                        \u003cdiv>\n                            \u003cdiv class=\"flex justify-between text-sm mb-1\">\n                                \u003clabel class=\"text-slate-300 font-medium\">Chap Yuk Massasi (m₁ / F₁):\u003c/label>\n                                \u003cspan class=\"font-mono text-blue-400 font-bold\">\u003cspan id=\"lbl-f1\">20\u003c/span> N (\u003cspan id=\"lbl-m1-kg\">2\u003c/span> kg)\u003c/span>\n                            \u003c/div>\n                            \u003cinput type=\"range\" id=\"input-f1\" min=\"5\" max=\"100\" step=\"5\" value=\"20\" oninput=\"updateRichag()\" class=\"w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer\">\n                        \u003c/div>\n\n                        \u003cdiv>\n                            \u003cdiv class=\"flex justify-between text-sm mb-1\">\n                                \u003clabel class=\"text-slate-300 font-medium\">Chap Elka Masofasi (l₁):\u003c/label>\n                                \u003cspan class=\"font-mono text-blue-400 font-bold\">\u003cspan id=\"lbl-l1\">5.0\u003c/span> m\u003c/span>\n                            \u003c/div>\n                            \u003cinput type=\"range\" id=\"input-l1\" min=\"1\" max=\"10\" step=\"0.5\" value=\"5\" oninput=\"updateRichag()\" class=\"w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer\">\n                        \u003c/div>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Right Side Controls (F2, L2) -->\n                \u003cdiv class=\"bg-slate-800 border border-slate-700 rounded-2xl p-5 space-y-4 relative overflow-hidden\">\n                    \u003cdiv class=\"absolute top-0 left-0 w-2 h-full bg-emerald-500\">\u003c/div>\n                    \u003cdiv class=\"flex justify-between items-center pb-2 border-b border-slate-700\">\n                        \u003ch3 class=\"font-bold text-emerald-400 flex items-center gap-2\">\n                            \u003ci class=\"fa-solid fa-weight-hanging\">\u003c/i> O'ng Taraf (Kuch F₂)\n                        \u003c/h3>\n                        \u003cspan class=\"bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-mono text-sm px-2.5 py-1 rounded-lg font-bold\" id=\"val-m2\">\n                            M₂ = 100.0 N·m\n                        \u003c/span>\n                    \u003c/div>\n\n                    \u003cdiv class=\"space-y-3\">\n                        \u003cdiv>\n                            \u003cdiv class=\"flex justify-between text-sm mb-1\">\n                                \u003clabel class=\"text-slate-300 font-medium\">O'ng Yuk Massasi (m₂ / F₂):\u003c/label>\n                                \u003cspan class=\"font-mono text-emerald-400 font-bold\">\u003cspan id=\"lbl-f2\">40\u003c/span> N (\u003cspan id=\"lbl-m2-kg\">4\u003c/span> kg)\u003c/span>\n                            \u003c/div>\n                            \u003cinput type=\"range\" id=\"input-f2\" min=\"5\" max=\"100\" step=\"5\" value=\"40\" oninput=\"updateRichag()\" class=\"w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer\">\n                        \u003c/div>\n\n                        \u003cdiv>\n                            \u003cdiv class=\"flex justify-between text-sm mb-1\">\n                                \u003clabel class=\"text-slate-300 font-medium\">O'ng Elka Masofasi (l₂):\u003c/label>\n                                \u003cspan class=\"font-mono text-emerald-400 font-bold\">\u003cspan id=\"lbl-l2\">2.5\u003c/span> m\u003c/span>\n                            \u003c/div>\n                            \u003cinput type=\"range\" id=\"input-l2\" min=\"1\" max=\"10\" step=\"0.5\" value=\"2.5\" oninput=\"updateRichag()\" class=\"w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer\">\n                        \u003c/div>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Formula Explanation Box -->\n            \u003cdiv class=\"bg-slate-800/50 border border-slate-700/60 rounded-2xl p-4 sm:p-5 grid grid-cols-1 md:grid-cols-3 gap-4 text-center\">\n                \u003cdiv class=\"p-3 bg-slate-900/60 rounded-xl border border-slate-800\">\n                    \u003cp class=\"text-xs text-slate-400 mb-1\">Chap Kuch Momenti (M₁)\u003c/p>\n                    \u003cp class=\"font-mono font-bold text-blue-400 text-lg\">\u003cspan id=\"calc-m1-formula\">20 N × 5.0 m\u003c/span> = \u003cspan id=\"calc-m1-res\">100 N·m\u003c/span>\u003c/p>\n                \u003c/div>\n                \u003cdiv class=\"p-3 bg-slate-900/60 rounded-xl border border-slate-800\">\n                    \u003cp class=\"text-xs text-slate-400 mb-1\">Kuchdan Yutish (l₁ / l₂)\u003c/p>\n                    \u003cp class=\"font-mono font-bold text-purple-400 text-lg\" id=\"calc-richag-gain\">2.0 marta\u003c/p>\n                \u003c/div>\n                \u003cdiv class=\"p-3 bg-slate-900/60 rounded-xl border border-slate-800\">\n                    \u003cp class=\"text-xs text-slate-400 mb-1\">O'ng Kuch Momenti (M₂)\u003c/p>\n                    \u003cp class=\"font-mono font-bold text-emerald-400 text-lg\">\u003cspan id=\"calc-m2-formula\">40 N × 2.5 m\u003c/span> = \u003cspan id=\"calc-m2-res\">100 N·m\u003c/span>\u003c/p>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003c!-- ================= TAB 2: BLOKLAR SIMULYATORI ================= -->\n        \u003csection id=\"section-bloklar\" class=\"space-y-6 hidden\">\n            \u003c!-- Header Description -->\n            \u003cdiv class=\"bg-slate-800/80 border border-slate-700 rounded-2xl p-5\">\n                \u003ch2 class=\"text-lg font-bold text-white flex items-center gap-2 mb-2\">\n                    \u003ci class=\"fa-solid fa-arrows-up-down text-blue-400\">\u003c/i> Qo'zg'almas va Qo'zg'aluvchan Bloklar\n                \u003c/h2>\n                \u003cp class=\"text-sm text-slate-300\">\n                    \u003cb>Qo'zg'almas blok:\u003c/b> Faqat kuch yo'nalishini o'zgartiradi, kuchdan yutish bermaydi ($F = P$). \u003cbr>\n                    \u003cb>Qo'zg'aluvchan blok:\u003c/b> Kuchdan \u003cb>2 marta yutish\u003c/b> beradi ($F = P / 2$), ammo masofadan 2 marta yutqaziladi ($s = 2h$).\n                \u003c/p>\n            \u003c/div>\n\n            \u003c!-- Controls Panel -->\n            \u003cdiv class=\"bg-slate-800 border border-slate-700 rounded-2xl p-5 grid grid-cols-1 md:grid-cols-3 gap-6 items-center\">\n                \u003cdiv>\n                    \u003clabel class=\"text-sm font-medium text-slate-300 block mb-1\">Yuk Og'irligi (P / mg):\u003c/label>\n                    \u003cdiv class=\"flex items-center gap-3\">\n                        \u003cinput type=\"range\" id=\"input-p-mass\" min=\"20\" max=\"200\" step=\"10\" value=\"100\" oninput=\"updateBloklar()\" class=\"w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer\">\n                        \u003cspan class=\"font-mono text-amber-400 font-bold whitespace-nowrap\">\u003cspan id=\"lbl-p-mass\">100\u003c/span> N\u003c/span>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003cdiv>\n                    \u003clabel class=\"text-sm font-medium text-slate-300 block mb-1\">Ipni Tortish Masofasi (s):\u003c/label>\n                    \u003cdiv class=\"flex items-center gap-3\">\n                        \u003cinput type=\"range\" id=\"input-rope-pull\" min=\"0\" max=\"100\" value=\"0\" oninput=\"updateBloklar()\" class=\"w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer\">\n                        \u003cspan class=\"font-mono text-blue-400 font-bold whitespace-nowrap\">\u003cspan id=\"lbl-rope-pull\">0\u003c/span> %\u003c/span>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003cdiv class=\"flex gap-2\">\n                    \u003cbutton id=\"btn-pull-anim\" onclick=\"toggleRopePullAnimation()\" class=\"flex-1 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20\">\n                        \u003ci class=\"fa-solid fa-play\" id=\"icon-anim-play\">\u003c/i> \u003cspan id=\"lbl-anim-play\">Avto Tortish\u003c/span>\n                    \u003c/button>\n                    \u003cbutton onclick=\"resetBloklar()\" class=\"bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium py-2 px-3 rounded-xl transition border border-slate-600\">\n                        \u003ci class=\"fa-solid fa-rotate-left\">\u003c/i>\n                    \u003c/button>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Canvas Comparison View -->\n            \u003cdiv class=\"grid grid-cols-1 md:grid-cols-2 gap-6\">\n                \u003c!-- Fixed Pulley Box -->\n                \u003cdiv class=\"bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-xl flex flex-col\">\n                    \u003cdiv class=\"p-3.5 bg-slate-800/80 border-b border-slate-700 flex justify-between items-center\">\n                        \u003ch3 class=\"font-bold text-white text-sm flex items-center gap-2\">\n                            \u003cspan class=\"w-2.5 h-2.5 rounded-full bg-blue-500\">\u003c/span> Qo'zg'almas Blok\n                        \u003c/h3>\n                        \u003cspan class=\"text-xs bg-blue-500/10 border border-blue-500/30 text-blue-400 px-2 py-0.5 rounded font-mono font-semibold\">Yutish: 1x (Yo'q)\u003c/span>\n                    \u003c/div>\n                    \u003cdiv class=\"h-[340px] bg-slate-950/80 relative flex-grow\">\n                        \u003ccanvas id=\"canvasFixedPulley\" class=\"w-full h-full block\">\u003c/canvas>\n                    \u003c/div>\n                    \u003cdiv class=\"p-4 bg-slate-900/80 border-t border-slate-700/60 grid grid-cols-2 gap-2 text-xs font-mono\">\n                        \u003cdiv class=\"bg-slate-800 p-2 rounded-lg border border-slate-700/50\">\n                            \u003cspan class=\"text-slate-400 block\">Kerakli Kuch (F):\u003c/span>\n                            \u003cspan class=\"text-blue-400 font-bold text-sm\" id=\"fixed-f-val\">100 N\u003c/span>\n                        \u003c/div>\n                        \u003cdiv class=\"bg-slate-800 p-2 rounded-lg border border-slate-700/50\">\n                            \u003cspan class=\"text-slate-400 block\">Ko'tarilish (h):\u003c/span>\n                            \u003cspan class=\"text-emerald-400 font-bold text-sm\" id=\"fixed-h-val\">0.0 m\u003c/span>\n                        \u003c/div>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Movable Pulley Box -->\n                \u003cdiv class=\"bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-xl flex flex-col\">\n                    \u003cdiv class=\"p-3.5 bg-slate-800/80 border-b border-slate-700 flex justify-between items-center\">\n                        \u003ch3 class=\"font-bold text-white text-sm flex items-center gap-2\">\n                            \u003cspan class=\"w-2.5 h-2.5 rounded-full bg-emerald-500\">\u003c/span> Qo'zg'aluvchan Blok\n                        \u003c/h3>\n                        \u003cspan class=\"text-xs bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-2 py-0.5 rounded font-mono font-semibold\">Yutish: 2x (Kuchdan)\u003c/span>\n                    \u003c/div>\n                    \u003cdiv class=\"h-[340px] bg-slate-950/80 relative flex-grow\">\n                        \u003ccanvas id=\"canvasMovablePulley\" class=\"w-full h-full block\">\u003c/canvas>\n                    \u003c/div>\n                    \u003cdiv class=\"p-4 bg-slate-900/80 border-t border-slate-700/60 grid grid-cols-2 gap-2 text-xs font-mono\">\n                        \u003cdiv class=\"bg-slate-800 p-2 rounded-lg border border-slate-700/50\">\n                            \u003cspan class=\"text-slate-400 block\">Kerakli Kuch (F = P/2):\u003c/span>\n                            \u003cspan class=\"text-emerald-400 font-bold text-sm\" id=\"movable-f-val\">50 N\u003c/span>\n                        \u003c/div>\n                        \u003cdiv class=\"bg-slate-800 p-2 rounded-lg border border-slate-700/50\">\n                            \u003cspan class=\"text-slate-400 block\">Ko'tarilish (h = s/2):\u003c/span>\n                            \u003cspan class=\"text-emerald-400 font-bold text-sm\" id=\"movable-h-val\">0.0 m\u003c/span>\n                        \u003c/div>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003c!-- ================= TAB 3: CHIG'IRIQ SIMULYATORI ================= -->\n        \u003csection id=\"section-chigiriq\" class=\"space-y-6 hidden\">\n            \u003c!-- Top Explanation Header -->\n            \u003cdiv class=\"bg-slate-800/80 border border-slate-700 rounded-2xl p-5\">\n                \u003ch2 class=\"text-lg font-bold text-white flex items-center gap-2 mb-2\">\n                    \u003ci class=\"fa-solid fa-compact-disc text-purple-400\">\u003c/i> Chig'iriq (Wheel and Axle) Mexanizmi\n                \u003c/h2>\n                \u003cp class=\"text-sm text-slate-300\">\n                    Chig'iriq bir xil o'qda joylashgan ikki xil radiusli g'altak va valdan iborat. Katta radiusli g'ildirakka ($R$) qo'llanilgan kuch ($F$) kichik radiusli valga ($r$) osilgan og'ir yukni ($P$) ko'taradi:\n                    \u003cspan class=\"inline-block bg-slate-900 px-2 py-0.5 rounded text-purple-400 font-mono font-bold ml-1\">F · R = P · r\u003c/span>\n                \u003c/p>\n            \u003c/div>\n\n            \u003c!-- Main Interactive Canvas and Dynamic Controls -->\n            \u003cdiv class=\"grid grid-cols-1 lg:grid-cols-3 gap-6\">\n                \u003c!-- Visual Canvas Display -->\n                \u003cdiv class=\"lg:col-span-2 bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-xl flex flex-col\">\n                    \u003cdiv class=\"p-3.5 bg-slate-800/80 border-b border-slate-700 flex justify-between items-center\">\n                        \u003cspan class=\"text-xs font-semibold uppercase tracking-wider text-slate-400\">\u003ci class=\"fa-solid fa-eye mr-1\">\u003c/i> Chig'iriq Ko'rinishi (Yon va Frontal)\u003c/span>\n                        \u003cspan id=\"chigiriq-balance-tag\" class=\"text-xs px-2.5 py-1 rounded-lg font-mono font-bold bg-purple-500/10 border border-purple-500/30 text-purple-300\">\n                            Yutish: 3.0 marta\n                        \u003c/span>\n                    \u003c/div>\n                    \u003cdiv class=\"h-[360px] bg-slate-950/80 relative\">\n                        \u003ccanvas id=\"chigiriqCanvas\" class=\"w-full h-full block\">\u003c/canvas>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Interactive Settings Column -->\n                \u003cdiv class=\"bg-slate-800 border border-slate-700 rounded-2xl p-5 space-y-5 flex flex-col justify-between\">\n                    \u003cdiv class=\"space-y-4\">\n                        \u003ch3 class=\"font-bold text-white border-b border-slate-700 pb-2 flex items-center gap-2\">\n                            \u003ci class=\"fa-solid fa-sliders text-purple-400\">\u003c/i> Parametrlarni Sozlash\n                        \u003c/h3>\n\n                        \u003c!-- Radius R (Large Wheel) -->\n                        \u003cdiv>\n                            \u003cdiv class=\"flex justify-between text-sm mb-1\">\n                                \u003clabel class=\"text-slate-300 font-medium\">G'ildirak Radiusi (R):\u003c/label>\n                                \u003cspan class=\"font-mono text-purple-400 font-bold\">\u003cspan id=\"lbl-chigiriq-R\">30\u003c/span> cm\u003c/span>\n                            \u003c/div>\n                            \u003cinput type=\"range\" id=\"input-chigiriq-R\" min=\"15\" max=\"50\" step=\"5\" value=\"30\" oninput=\"updateChigiriq()\" class=\"w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer\">\n                        \u003c/div>\n\n                        \u003c!-- Radius r (Small Axle) -->\n                        \u003cdiv>\n                            \u003cdiv class=\"flex justify-between text-sm mb-1\">\n                                \u003clabel class=\"text-slate-300 font-medium\">Val Radiusi (r):\u003c/label>\n                                \u003cspan class=\"font-mono text-indigo-400 font-bold\">\u003cspan id=\"lbl-chigiriq-r\">10\u003c/span> cm\u003c/span>\n                            \u003c/div>\n                            \u003cinput type=\"range\" id=\"input-chigiriq-r\" min=\"5\" max=\"20\" step=\"1\" value=\"10\" oninput=\"updateChigiriq()\" class=\"w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer\">\n                        \u003c/div>\n\n                        \u003c!-- Load P -->\n                        \u003cdiv>\n                            \u003cdiv class=\"flex justify-between text-sm mb-1\">\n                                \u003clabel class=\"text-slate-300 font-medium\">Yuk Og'irligi (P):\u003c/label>\n                                \u003cspan class=\"font-mono text-amber-400 font-bold\">\u003cspan id=\"lbl-chigiriq-P\">150\u003c/span> N\u003c/span>\n                            \u003c/div>\n                            \u003cinput type=\"range\" id=\"input-chigiriq-P\" min=\"30\" max=\"300\" step=\"15\" value=\"150\" oninput=\"updateChigiriq()\" class=\"w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer\">\n                        \u003c/div>\n                    \u003c/div>\n\n                    \u003c!-- Calculated Force Card -->\n                    \u003cdiv class=\"bg-slate-900/90 border border-purple-500/30 rounded-xl p-4 space-y-2\">\n                        \u003cdiv class=\"text-xs text-slate-400\">Kerakli Qo'l Kuchi (F):\u003c/div>\n                        \u003cdiv class=\"text-2xl font-mono font-extrabold text-purple-400 flex items-baseline justify-between\">\n                            \u003cspan id=\"calc-chigiriq-F\">50.0 N\u003c/span>\n                            \u003cspan class=\"text-xs text-slate-400 font-normal\">F = P · (r / R)\u003c/span>\n                        \u003c/div>\n                        \u003cdiv class=\"text-xs text-slate-400 pt-1 border-t border-slate-800 flex justify-between\">\n                            \u003cspan>Kuchdan yutish:\u003c/span>\n                            \u003cspan class=\"font-bold text-emerald-400\" id=\"calc-chigiriq-gain\">3.0 marta\u003c/span>\n                        \u003c/div>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n    \u003c/main>\n\n    \u003c!-- Footer -->\n    \u003cfooter class=\"bg-slate-800 border-t border-slate-700/80 py-4 mt-8 text-center text-xs text-slate-400\">\n        \u003cdiv class=\"max-w-7xl mx-auto px-4\">\n            \u003cp>Fizika fanidan interaktiv ko'rgazmali simulyator kodi. Momentlar qoidasi va oddiy mexanizmlar darsi uchun.\u003c/p>\n        \u003c/div>\n    \u003c/footer>\n\n    \u003c!-- INTERACTIVE JAVASCRIPT LOGIC -->\n    \u003cscript>\n        // Global Tab Switcher\n        function switchTab(tabName) {\n            ['richag', 'bloklar', 'chigiriq'].forEach(tab => {\n                const sec = document.getElementById(`section-${tab}`);\n                const btn = document.getElementById(`tab-${tab}`);\n                if (tab === tabName) {\n                    sec.classList.remove('hidden');\n                    btn.className = \"flex-1 sm:flex-initial px-4 py-2 rounded-lg font-medium text-sm transition-all duration-200 flex items-center justify-center gap-2 bg-blue-600 text-white shadow-sm\";\n                } else {\n                    sec.classList.add('hidden');\n                    btn.className = \"flex-1 sm:flex-initial px-4 py-2 rounded-lg font-medium text-sm transition-all duration-200 flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200\";\n                }\n            });\n            // Resize Canvas contexts on tab change\n            setTimeout(resizeAllCanvases, 50);\n        }\n\n        // Window Resize Handling\n        window.addEventListener('resize', resizeAllCanvases);\n\n        function resizeAllCanvases() {\n            initRichagCanvas();\n            initBloklarCanvases();\n            initChigiriqCanvas();\n        }\n\n        // =================================================================\n        // 1. RICHAG (LEVER) SIMULATION ENGINE\n        // =================================================================\n        let richagCanvas, richagCtx;\n        let currentAngle = 0; // Current tilt angle in radians\n        let targetAngle = 0;  // Target tilt angle based on torque net\n\n        function initRichagCanvas() {\n            richagCanvas = document.getElementById('richagCanvas');\n            if (!richagCanvas) return;\n            const container = richagCanvas.parentElement;\n            richagCanvas.width = container.clientWidth;\n            richagCanvas.height = container.clientHeight;\n            richagCtx = richagCanvas.getContext('2d');\n        }\n\n        function updateRichag() {\n            const f1 = parseFloat(document.getElementById('input-f1').value);\n            const l1 = parseFloat(document.getElementById('input-l1').value);\n            const f2 = parseFloat(document.getElementById('input-f2').value);\n            const l2 = parseFloat(document.getElementById('input-l2').value);\n\n            // Calculate torques\n            const m1 = f1 * l1;\n            const m2 = f2 * l2;\n\n            // Update DOM labels\n            document.getElementById('lbl-f1').innerText = f1;\n            document.getElementById('lbl-m1-kg').innerText = (f1 / 10).toFixed(1);\n            document.getElementById('lbl-l1').innerText = l1.toFixed(1);\n            document.getElementById('val-m1').innerText = `M₁ = ${m1.toFixed(1)} N·m`;\n\n            document.getElementById('lbl-f2').innerText = f2;\n            document.getElementById('lbl-m2-kg').innerText = (f2 / 10).toFixed(1);\n            document.getElementById('lbl-l2').innerText = l2.toFixed(1);\n            document.getElementById('val-m2').innerText = `M₂ = ${m2.toFixed(1)} N·m`;\n\n            // Formulas box\n            document.getElementById('calc-m1-formula').innerText = `${f1} N × ${l1.toFixed(1)} m`;\n            document.getElementById('calc-m1-res').innerText = `${m1.toFixed(0)} N·m`;\n            document.getElementById('calc-m2-formula').innerText = `${f2} N × ${l2.toFixed(1)} m`;\n            document.getElementById('calc-m2-res').innerText = `${m2.toFixed(0)} N·m`;\n\n            const gain = (l1 / l2).toFixed(2);\n            document.getElementById('calc-richag-gain').innerText = `${gain} marta`;\n\n            // Status Badge & Target Angle Calculation\n            const badge = document.getElementById('richag-status-badge');\n            const diff = m1 - m2;\n\n            if (Math.abs(diff) \u003c 0.1) {\n                targetAngle = 0;\n                badge.className = \"px-4 py-2 rounded-xl text-sm font-bold bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 flex items-center gap-2 whitespace-nowrap\";\n                badge.innerHTML = `\u003ci class=\"fa-solid fa-circle-check\">\u003c/i> \u003cspan>Muvozanatda (M₁ = M₂)\u003c/span>`;\n            } else if (diff > 0) {\n                // Left heavier -> tilts counter-clockwise (negative angle)\n                targetAngle = -Math.min(Math.PI / 10, (diff / 200) * (Math.PI / 8));\n                badge.className = \"px-4 py-2 rounded-xl text-sm font-bold bg-blue-500/10 border border-blue-500/30 text-blue-400 flex items-center gap-2 whitespace-nowrap\";\n                badge.innerHTML = `\u003ci class=\"fa-solid fa-arrow-left font-bold\">\u003c/i> \u003cspan>Chapga og'gan (M₁ > M₂)\u003c/span>`;\n            } else {\n                // Right heavier -> tilts clockwise (positive angle)\n                targetAngle = Math.min(Math.PI / 10, (Math.abs(diff) / 200) * (Math.PI / 8));\n                badge.className = \"px-4 py-2 rounded-xl text-sm font-bold bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 flex items-center gap-2 whitespace-nowrap\";\n                badge.innerHTML = `\u003ci class=\"fa-solid fa-arrow-right font-bold\">\u003c/i> \u003cspan>O'ngga og'gan (M₂ > M₁)\u003c/span>`;\n            }\n        }\n\n        function resetRichag() {\n            document.getElementById('input-f1').value = 20;\n            document.getElementById('input-l1').value = 5;\n            document.getElementById('input-f2').value = 40;\n            document.getElementById('input-l2').value = 2.5;\n            updateRichag();\n        }\n\n        function drawRichagFrame() {\n            if (!richagCtx) return;\n            const w = richagCanvas.width;\n            const h = richagCanvas.height;\n\n            richagCtx.clearRect(0, 0, w, h);\n\n            // Pivot point coordinates (Center)\n            const cx = w / 2;\n            const cy = h * 0.65;\n            const maxLeverLength = Math.min(w * 0.42, 350); // Max half-lever length in pixels\n\n            // Smooth angle transition (easing)\n            currentAngle += (targetAngle - currentAngle) * 0.1;\n\n            // Draw Ground Stand / Fulcrum\n            richagCtx.fillStyle = '#334155';\n            richagCtx.fillRect(cx - 80, cy + 60, 160, 15); // Stand base\n\n            richagCtx.beginPath();\n            richagCtx.moveTo(cx, cy);\n            richagCtx.lineTo(cx - 35, cy + 60);\n            richagCtx.lineTo(cx + 35, cy + 60);\n            richagCtx.closePath();\n            richagCtx.fillStyle = '#64748b';\n            richagCtx.fill();\n            richagCtx.strokeStyle = '#94a3b8';\n            richagCtx.lineWidth = 2;\n            richagCtx.stroke();\n\n            // Center Pin Pivot Circle\n            richagCtx.beginPath();\n            richagCtx.arc(cx, cy, 7, 0, Math.PI * 2);\n            richagCtx.fillStyle = '#f8fafc';\n            richagCtx.fill();\n\n            // Save state for rotating lever beam\n            richagCtx.save();\n            richagCtx.translate(cx, cy);\n            richagCtx.rotate(currentAngle);\n\n            // Draw Lever Wooden Beam\n            richagCtx.fillStyle = '#f59e0b';\n            richagCtx.fillRect(-maxLeverLength, -10, maxLeverLength * 2, 20);\n            richagCtx.lineWidth = 2;\n            richagCtx.strokeStyle = '#d97706';\n            richagCtx.strokeRect(-maxLeverLength, -10, maxLeverLength * 2, 20);\n\n            // Draw Ruler Marks along the beam\n            richagCtx.fillStyle = '#78350f';\n            for (let i = -10; i \u003c= 10; i++) {\n                if (i === 0) continue;\n                const markX = (i / 10) * maxLeverLength;\n                const markHeight = (i % 5 === 0) ? 12 : 6;\n                richagCtx.fillRect(markX - 1, -10, 2, markHeight);\n            }\n\n            // Get current inputs for rendering weights\n            const f1 = parseFloat(document.getElementById('input-f1').value);\n            const l1 = parseFloat(document.getElementById('input-l1').value);\n            const f2 = parseFloat(document.getElementById('input-f2').value);\n            const l2 = parseFloat(document.getElementById('input-l2').value);\n\n            // Left Weight Position\n            const leftX = -(l1 / 10) * maxLeverLength;\n            drawWeight(richagCtx, leftX, 10, f1, '#3b82f6', `F₁=${f1}N`, `l₁=${l1}m`);\n\n            // Right Weight Position\n            const rightX = (l2 / 10) * maxLeverLength;\n            drawWeight(richagCtx, rightX, 10, f2, '#10b981', `F₂=${f2}N`, `l₂=${l2}m`);\n\n            richagCtx.restore();\n\n            requestAnimationFrame(drawRichagFrame);\n        }\n\n        function drawWeight(ctx, x, y, forceValue, color, labelForce, labelLength) {\n            const size = 24 + (forceValue / 100) * 26; // Dynamic box size based on mass\n\n            // Rope line connecting weight to beam\n            ctx.beginPath();\n            ctx.moveTo(x, y);\n            ctx.lineTo(x, y + 25);\n            ctx.strokeStyle = '#cbd5e1';\n            ctx.lineWidth = 2;\n            ctx.stroke();\n\n            // Weight Box Body\n            ctx.fillStyle = color;\n            ctx.beginPath();\n            ctx.roundRect(x - size / 2, y + 25, size, size, 8);\n            ctx.fill();\n            ctx.strokeStyle = '#ffffff';\n            ctx.lineWidth = 1.5;\n            ctx.stroke();\n\n            // Weight Hook Ring\n            ctx.beginPath();\n            ctx.arc(x, y + 20, 5, 0, Math.PI * 2);\n            ctx.strokeStyle = '#cbd5e1';\n            ctx.lineWidth = 2;\n            ctx.stroke();\n\n            // Labels inside box\n            ctx.fillStyle = '#ffffff';\n            ctx.font = 'bold 11px Inter, sans-serif';\n            ctx.textAlign = 'center';\n            ctx.fillText(`${forceValue}N`, x, y + 25 + size / 2 + 4);\n\n            // Force Arrow (Vector) pointing down\n            ctx.beginPath();\n            ctx.moveTo(x, y + 25 + size + 5);\n            ctx.lineTo(x, y + 25 + size + 35);\n            ctx.strokeStyle = color;\n            ctx.lineWidth = 3;\n            ctx.stroke();\n\n            // Arrow Tip\n            ctx.beginPath();\n            ctx.moveTo(x - 5, y + 25 + size + 28);\n            ctx.lineTo(x, y + 25 + size + 36);\n            ctx.lineTo(x + 5, y + 25 + size + 28);\n            ctx.fillStyle = color;\n            ctx.fill();\n\n            // Distance Label\n            ctx.fillStyle = '#94a3b8';\n            ctx.font = '11px Inter, sans-serif';\n            ctx.fillText(labelLength, x, -18);\n        }\n\n        // =================================================================\n        // 2. BLOKLAR (PULLEYS) SIMULATION ENGINE\n        // =================================================================\n        let fixedCanvas, fixedCtx, movableCanvas, movableCtx;\n        let isAutoPulling = false;\n        let pullAnimDirection = 1;\n\n        function initBloklarCanvases() {\n            fixedCanvas = document.getElementById('canvasFixedPulley');\n            movableCanvas = document.getElementById('canvasMovablePulley');\n            if (!fixedCanvas || !movableCanvas) return;\n\n            const w = fixedCanvas.parentElement.clientWidth;\n            const h = fixedCanvas.parentElement.clientHeight;\n\n            fixedCanvas.width = w;\n            fixedCanvas.height = h;\n            movableCanvas.width = w;\n            movableCanvas.height = h;\n\n            fixedCtx = fixedCanvas.getContext('2d');\n            movableCtx = movableCanvas.getContext('2d');\n\n            updateBloklar();\n        }\n\n        function updateBloklar() {\n            const pMass = parseFloat(document.getElementById('input-p-mass').value);\n            const pullPct = parseFloat(document.getElementById('input-rope-pull').value) / 100;\n\n            document.getElementById('lbl-p-mass').innerText = pMass;\n            document.getElementById('lbl-rope-pull').innerText = Math.round(pullPct * 100);\n\n            // Fixed Pulley Metrics\n            document.getElementById('fixed-f-val').innerText = `${pMass} N`;\n            const fixedH = pullPct * 2.0; // Max 2.0 meters\n            document.getElementById('fixed-h-val').innerText = `${fixedH.toFixed(2)} m`;\n\n            // Movable Pulley Metrics\n            const movableF = pMass / 2;\n            const movableH = pullPct * 1.0; // Half height lift for same rope pulled\n            document.getElementById('movable-f-val').innerText = `${movableF.toFixed(1)} N`;\n            document.getElementById('movable-h-val').innerText = `${movableH.toFixed(2)} m`;\n\n            drawFixedPulley(fixedCtx, fixedCanvas.width, fixedCanvas.height, pMass, pullPct);\n            drawMovablePulley(movableCtx, movableCanvas.width, movableCanvas.height, pMass, pullPct);\n        }\n\n        function toggleRopePullAnimation() {\n            isAutoPulling = !isAutoPulling;\n            const btnLabel = document.getElementById('lbl-anim-play');\n            const btnIcon = document.getElementById('icon-anim-play');\n\n            if (isAutoPulling) {\n                btnLabel.innerText = \"To'xtatish\";\n                btnIcon.className = \"fa-solid fa-pause\";\n                requestAnimationFrame(animateRopeLoop);\n            } else {\n                btnLabel.innerText = \"Avto Tortish\";\n                btnIcon.className = \"fa-solid fa-play\";\n            }\n        }\n\n        function animateRopeLoop() {\n            if (!isAutoPulling) return;\n\n            const slider = document.getElementById('input-rope-pull');\n            let val = parseFloat(slider.value);\n\n            val += pullAnimDirection * 0.8;\n            if (val >= 100) {\n                val = 100;\n                pullAnimDirection = -1;\n            } else if (val \u003c= 0) {\n                val = 0;\n                pullAnimDirection = 1;\n            }\n\n            slider.value = val;\n            updateBloklar();\n\n            requestAnimationFrame(animateRopeLoop);\n        }\n\n        function resetBloklar() {\n            isAutoPulling = false;\n            document.getElementById('lbl-anim-play').innerText = \"Avto Tortish\";\n            document.getElementById('icon-anim-play').className = \"fa-solid fa-play\";\n            document.getElementById('input-p-mass').value = 100;\n            document.getElementById('input-rope-pull').value = 0;\n            updateBloklar();\n        }\n\n        // Draw Fixed Pulley\n        function drawFixedPulley(ctx, w, h, loadN, pullRatio) {\n            ctx.clearRect(0, 0, w, h);\n\n            const cx = w / 2;\n            const topY = 40;\n            const pulleyR = 28;\n\n            // Ceiling mount\n            ctx.fillStyle = '#475569';\n            ctx.fillRect(cx - 40, 0, 80, 15);\n            ctx.beginPath();\n            ctx.moveTo(cx, 15);\n            ctx.lineTo(cx, topY);\n            ctx.strokeStyle = '#94a3b8';\n            ctx.lineWidth = 4;\n            ctx.stroke();\n\n            // Pulley Wheel\n            ctx.beginPath();\n            ctx.arc(cx, topY, pulleyR, 0, Math.PI * 2);\n            ctx.fillStyle = '#3b82f6';\n            ctx.fill();\n            ctx.lineWidth = 3;\n            ctx.strokeStyle = '#60a5fa';\n            ctx.stroke();\n\n            // Inner axle\n            ctx.beginPath();\n            ctx.arc(cx, topY, 6, 0, Math.PI * 2);\n            ctx.fillStyle = '#ffffff';\n            ctx.fill();\n\n            // Calculate Load Position (Left side of pulley)\n            const baseLoadY = h - 70;\n            const maxLift = h - 160;\n            const loadY = baseLoadY - (pullRatio * maxLift);\n\n            // Left Rope (to Load)\n            ctx.beginPath();\n            ctx.moveTo(cx - pulleyR, topY);\n            ctx.lineTo(cx - pulleyR, loadY);\n            ctx.strokeStyle = '#cbd5e1';\n            ctx.lineWidth = 3;\n            ctx.stroke();\n\n            // Right Rope (Hand pull)\n            const handY = topY + 40 + (pullRatio * maxLift);\n            ctx.beginPath();\n            ctx.moveTo(cx + pulleyR, topY);\n            ctx.lineTo(cx + pulleyR, handY);\n            ctx.strokeStyle = '#cbd5e1';\n            ctx.lineWidth = 3;\n            ctx.stroke();\n\n            // Load Box (Left)\n            const boxSize = 38;\n            ctx.fillStyle = '#f59e0b';\n            ctx.fillRect(cx - pulleyR - boxSize / 2, loadY, boxSize, boxSize);\n            ctx.fillStyle = '#ffffff';\n            ctx.font = 'bold 11px Inter';\n            ctx.textAlign = 'center';\n            ctx.fillText(`${loadN}N`, cx - pulleyR, loadY + boxSize / 2 + 4);\n\n            // Hand Pull Vector (Right)\n            ctx.fillStyle = '#60a5fa';\n            ctx.beginPath();\n            ctx.arc(cx + pulleyR, handY, 8, 0, Math.PI * 2);\n            ctx.fill();\n\n            // Pull Direction Arrow Down\n            ctx.beginPath();\n            ctx.moveTo(cx + pulleyR, handY + 8);\n            ctx.lineTo(cx + pulleyR, handY + 32);\n            ctx.strokeStyle = '#3b82f6';\n            ctx.lineWidth = 3;\n            ctx.stroke();\n            ctx.fillStyle = '#3b82f6';\n            ctx.fillText(`F = ${loadN}N`, cx + pulleyR + 35, handY + 22);\n        }\n\n        // Draw Movable Pulley\n        function drawMovablePulley(ctx, w, h, loadN, pullRatio) {\n            ctx.clearRect(0, 0, w, h);\n\n            const cx = w / 2;\n            const pulleyR = 28;\n\n            // Ceiling mount for Fixed rope end (Left)\n            ctx.fillStyle = '#475569';\n            ctx.fillRect(cx - 60, 0, 120, 15);\n\n            // Left rope anchor point\n            const anchorX = cx - pulleyR;\n            ctx.beginPath();\n            ctx.moveTo(anchorX, 15);\n            ctx.lineTo(anchorX, 30);\n            ctx.strokeStyle = '#94a3b8';\n            ctx.lineWidth = 3;\n            ctx.stroke();\n\n            // Movable Pulley Position (moves at half speed of rope pull)\n            const basePulleyY = h - 90;\n            const maxLift = (h - 160) / 2;\n            const pulleyY = basePulleyY - (pullRatio * maxLift);\n\n            // Rope from Left Anchor -> Down to Movable Pulley -> Up to Hand (Right)\n            ctx.beginPath();\n            ctx.moveTo(anchorX, 25);\n            ctx.lineTo(anchorX, pulleyY);\n            ctx.arc(cx, pulleyY, pulleyR, Math.PI, 0, true);\n\n            const handY = Math.max(30, basePulleyY - (pullRatio * maxLift * 2));\n            ctx.lineTo(cx + pulleyR, handY);\n            ctx.strokeStyle = '#cbd5e1';\n            ctx.lineWidth = 3;\n            ctx.stroke();\n\n            // Movable Pulley Wheel Body\n            ctx.beginPath();\n            ctx.arc(cx, pulleyY, pulleyR, 0, Math.PI * 2);\n            ctx.fillStyle = '#10b981';\n            ctx.fill();\n            ctx.lineWidth = 3;\n            ctx.strokeStyle = '#34d399';\n            ctx.stroke();\n\n            // Axle Pin\n            ctx.beginPath();\n            ctx.arc(cx, pulleyY, 6, 0, Math.PI * 2);\n            ctx.fillStyle = '#ffffff';\n            ctx.fill();\n\n            // Load hanging below movable pulley\n            const boxSize = 38;\n            const boxY = pulleyY + pulleyR + 15;\n\n            ctx.beginPath();\n            ctx.moveTo(cx, pulleyY + 6);\n            ctx.lineTo(cx, boxY);\n            ctx.strokeStyle = '#94a3b8';\n            ctx.lineWidth = 2;\n            ctx.stroke();\n\n            ctx.fillStyle = '#f59e0b';\n            ctx.fillRect(cx - boxSize / 2, boxY, boxSize, boxSize);\n            ctx.fillStyle = '#ffffff';\n            ctx.font = 'bold 11px Inter';\n            ctx.textAlign = 'center';\n            ctx.fillText(`${loadN}N`, cx, boxY + boxSize / 2 + 4);\n\n            // Pull Hand Indicator (Right)\n            ctx.fillStyle = '#10b981';\n            ctx.beginPath();\n            ctx.arc(cx + pulleyR, handY, 8, 0, Math.PI * 2);\n            ctx.fill();\n\n            // Force Arrow UP\n            ctx.beginPath();\n            ctx.moveTo(cx + pulleyR, handY - 8);\n            ctx.lineTo(cx + pulleyR, handY - 32);\n            ctx.strokeStyle = '#10b981';\n            ctx.lineWidth = 3;\n            ctx.stroke();\n            ctx.fillStyle = '#10b981';\n            ctx.fillText(`F = ${(loadN/2).toFixed(1)}N`, cx + pulleyR + 40, handY - 16);\n        }\n\n        // =================================================================\n        // 3. CHIG'IRIQ (WHEEL & AXLE) SIMULATION ENGINE\n        // =================================================================\n        let chigiriqCanvas, chigiriqCtx;\n        let chigiriqRotation = 0;\n\n        function initChigiriqCanvas() {\n            chigiriqCanvas = document.getElementById('chigiriqCanvas');\n            if (!chigiriqCanvas) return;\n            const container = chigiriqCanvas.parentElement;\n            chigiriqCanvas.width = container.clientWidth;\n            chigiriqCanvas.height = container.clientHeight;\n            chigiriqCtx = chigiriqCanvas.getContext('2d');\n            updateChigiriq();\n        }\n\n        function updateChigiriq() {\n            const R = parseFloat(document.getElementById('input-chigiriq-R').value);\n            const r = parseFloat(document.getElementById('input-chigiriq-r').value);\n            const P = parseFloat(document.getElementById('input-chigiriq-P').value);\n\n            // Calculations\n            const F = P * (r / R);\n            const gain = R / r;\n\n            document.getElementById('lbl-chigiriq-R').innerText = R;\n            document.getElementById('lbl-chigiriq-r').innerText = r;\n            document.getElementById('lbl-chigiriq-P').innerText = P;\n\n            document.getElementById('calc-chigiriq-F').innerText = `${F.toFixed(1)} N`;\n            document.getElementById('calc-chigiriq-gain').innerText = `${gain.toFixed(1)} marta`;\n            document.getElementById('chigiriq-balance-tag').innerText = `Kuchdan yutish: ${gain.toFixed(1)} marta`;\n\n            drawChigiriqFrame();\n        }\n\n        function drawChigiriqFrame() {\n            if (!chigiriqCtx) return;\n            const w = chigiriqCanvas.width;\n            const h = chigiriqCanvas.height;\n\n            chigiriqCtx.clearRect(0, 0, w, h);\n\n            const R = parseFloat(document.getElementById('input-chigiriq-R').value);\n            const r = parseFloat(document.getElementById('input-chigiriq-r').value);\n            const P = parseFloat(document.getElementById('input-chigiriq-P').value);\n            const F = P * (r / R);\n\n            // Side View Center (Left half)\n            const cx1 = w * 0.3;\n            const cy = h * 0.5;\n\n            // Visual Scale Factors\n            const pxR = R * 2.8;\n            const pxr = r * 2.8;\n\n            // Increment subtle rotation angle for life\n            chigiriqRotation += 0.005;\n\n            // ---------------- DRAW FRONT WHEEL VIEW (LEFT) ----------------\n            // Outer Big Wheel (Radius R)\n            chigiriqCtx.beginPath();\n            chigiriqCtx.arc(cx1, cy, pxR, 0, Math.PI * 2);\n            chigiriqCtx.fillStyle = 'rgba(168, 85, 247, 0.15)';\n            chigiriqCtx.fill();\n            chigiriqCtx.strokeStyle = '#c084fc';\n            chigiriqCtx.lineWidth = 4;\n            chigiriqCtx.stroke();\n\n            // Inner Small Axle (Radius r)\n            chigiriqCtx.beginPath();\n            chigiriqCtx.arc(cx1, cy, pxr, 0, Math.PI * 2);\n            chigiriqCtx.fillStyle = 'rgba(99, 102, 241, 0.3)';\n            chigiriqCtx.fill();\n            chigiriqCtx.strokeStyle = '#818cf8';\n            chigiriqCtx.lineWidth = 3;\n            chigiriqCtx.stroke();\n\n            // Wheel Spokes\n            for (let i = 0; i \u003c 4; i++) {\n                const angle = chigiriqRotation + (i * Math.PI / 2);\n                chigiriqCtx.beginPath();\n                chigiriqCtx.moveTo(cx1, cy);\n                chigiriqCtx.lineTo(cx1 + Math.cos(angle) * pxR, cy + Math.sin(angle) * pxR);\n                chigiriqCtx.strokeStyle = 'rgba(192, 132, 252, 0.4)';\n                chigiriqCtx.lineWidth = 2;\n                chigiriqCtx.stroke();\n            }\n\n            // Rope on Big Wheel (Outer Force F) - Right side of big wheel\n            chigiriqCtx.beginPath();\n            chigiriqCtx.moveTo(cx1 + pxR, cy);\n            chigiriqCtx.lineTo(cx1 + pxR, cy + 100);\n            chigiriqCtx.strokeStyle = '#c084fc';\n            chigiriqCtx.lineWidth = 3;\n            chigiriqCtx.stroke();\n\n            // Force Arrow F\n            chigiriqCtx.fillStyle = '#c084fc';\n            chigiriqCtx.font = 'bold 12px Inter';\n            chigiriqCtx.fillText(`F = ${F.toFixed(1)}N`, cx1 + pxR + 10, cy + 80);\n\n            // Rope on Small Axle (Inner Load P) - Left side of axle\n            chigiriqCtx.beginPath();\n            chigiriqCtx.moveTo(cx1 - pxr, cy);\n            chigiriqCtx.lineTo(cx1 - pxr, cy + 110);\n            chigiriqCtx.strokeStyle = '#f59e0b';\n            chigiriqCtx.lineWidth = 3;\n            chigiriqCtx.stroke();\n\n            // Load Box P\n            chigiriqCtx.fillStyle = '#f59e0b';\n            chigiriqCtx.fillRect(cx1 - pxr - 18, cy + 110, 36, 30);\n            chigiriqCtx.fillStyle = '#ffffff';\n            chigiriqCtx.font = 'bold 11px Inter';\n            chigiriqCtx.textAlign = 'center';\n            chigiriqCtx.fillText(`${P}N`, cx1 - pxr, cy + 128);\n\n            // Center Pin\n            chigiriqCtx.beginPath();\n            chigiriqCtx.arc(cx1, cy, 6, 0, Math.PI * 2);\n            chigiriqCtx.fillStyle = '#ffffff';\n            chigiriqCtx.fill();\n\n            // ---------------- DRAW 3D PROFILE VIEW (RIGHT) ----------------\n            const cx2 = w * 0.75;\n            \n            // Stand Support\n            chigiriqCtx.fillStyle = '#334155';\n            chigiriqCtx.fillRect(cx2 - 70, cy + 80, 140, 12);\n            \n            chigiriqCtx.beginPath();\n            chigiriqCtx.moveTo(cx2 - 40, cy + 80);\n            chigiriqCtx.lineTo(cx2 - 10, cy);\n            chigiriqCtx.lineTo(cx2 + 10, cy);\n            chigiriqCtx.lineTo(cx2 + 40, cy + 80);\n            chigiriqCtx.fillStyle = '#475569';\n            chigiriqCtx.fill();\n\n            // Axle Shaft Cylinder (Horizontal)\n            chigiriqCtx.fillStyle = '#818cf8';\n            chigiriqCtx.fillRect(cx2 - 50, cy - pxr, 100, pxr * 2);\n            chigiriqCtx.strokeStyle = '#6366f1';\n            chigiriqCtx.lineWidth = 2;\n            chigiriqCtx.strokeRect(cx2 - 50, cy - pxr, 100, pxr * 2);\n\n            // Big Wheel Disk (Side view profile)\n            chigiriqCtx.fillStyle = '#c084fc';\n            chigiriqCtx.fillRect(cx2 + 20, cy - pxR, 15, pxR * 2);\n            chigiriqCtx.strokeStyle = '#e9d5ff';\n            chigiriqCtx.strokeRect(cx2 + 20, cy - pxR, 15, pxR * 2);\n\n            // Labels for Radii R and r\n            chigiriqCtx.fillStyle = '#e2e8f0';\n            chigiriqCtx.font = '12px Inter';\n            chigiriqCtx.textAlign = 'center';\n            chigiriqCtx.fillText(`G'ildirak (R = ${R}cm)`, cx1, cy - pxR - 15);\n            chigiriqCtx.fillText(`Val (r = ${r}cm)`, cx1, cy - pxr - 8);\n        }\n\n        // =================================================================\n        // INITIALIZATION ON LOAD\n        // =================================================================\n        window.onload = function() {\n            initRichagCanvas();\n            initBloklarCanvases();\n            initChigiriqCanvas();\n\n            updateRichag();\n            updateBloklar();\n            updateChigiriq();\n\n            // Start main animation frame loop for Richag tilt transition\n            requestAnimationFrame(drawRichagFrame);\n        };\n    \u003c/script>\n\u003c/body>\n\u003c/html>", "14-mavzu": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\" class=\"h-full bg-slate-900 text-slate-100\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  \u003ctitle>14-mavzu: Masalalar Yechish - Kuch Momenti va Oddiy Mexanizmlar\u003c/title>\n  \u003c!-- Tailwind CSS CDN -->\n  \u003cscript src=\"https://cdn.tailwindcss.com\">\u003c/script>\n  \u003c!-- FontAwesome Icons -->\n  \u003clink rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\">\n  \u003c!-- Google Fonts: Inter -->\n  \u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n  \u003cstyle>\n    body {\n      font-family: 'Inter', sans-serif;\n    }\n    /* Custom Scrollbar */\n    ::-webkit-scrollbar {\n      width: 8px;\n      height: 8px;\n    }\n    ::-webkit-scrollbar-track {\n      background: #0f172a;\n    }\n    ::-webkit-scrollbar-thumb {\n      background: #334155;\n      border-radius: 4px;\n    }\n    ::-webkit-scrollbar-thumb:hover {\n      background: #475569;\n    }\n    .tab-btn.active {\n      background-color: #2563eb;\n      color: #ffffff;\n      box-shadow: 0 4px 14px 0 rgba(37, 99, 235, 0.39);\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody class=\"h-full flex flex-col justify-between overflow-x-hidden\">\n\n  \u003c!-- TOP HEADER -->\n  \u003cheader class=\"bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-50\">\n    \u003cdiv class=\"max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between\">\n      \u003cdiv class=\"flex items-center space-x-3\">\n        \u003cdiv class=\"w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white text-xl font-bold shadow-lg shadow-blue-500/30\">\n          \u003ci class=\"fa-solid fa-scale-balanced\">\u003c/i>\n        \u003c/div>\n        \u003cdiv>\n          \u003ch1 class=\"text-lg font-bold text-white tracking-wide\">14-Mavzu: Masalalar Yechish\u003c/h1>\n          \u003cp class=\"text-xs text-blue-400\">Kuch momenti, Momentlar qoidasi va Oddiy mexanizmlar\u003c/p>\n        \u003c/div>\n      \u003c/div>\n      \u003c!-- Tab Navigation Buttons -->\n      \u003cnav class=\"flex space-x-1 sm:space-x-2 bg-slate-900/60 p-1.5 rounded-xl border border-slate-700/60\">\n        \u003cbutton onclick=\"switchTab('formulas')\" id=\"tab-formulas\" class=\"tab-btn active px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium transition-all duration-200 flex items-center space-x-2\">\n          \u003ci class=\"fa-solid fa-book-bookmark\">\u003c/i>\n          \u003cspan class=\"hidden md:inline\">Formulalar\u003c/span>\n        \u003c/button>\n        \u003cbutton onclick=\"switchTab('lab')\" id=\"tab-lab\" class=\"tab-btn px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-slate-300 hover:text-white transition-all duration-200 flex items-center space-x-2\">\n          \u003ci class=\"fa-solid fa-flask\">\u003c/i>\n          \u003cspan>Masala Lab-Simulyatori\u003c/span>\n        \u003c/button>\n        \u003cbutton onclick=\"switchTab('sandbox')\" id=\"tab-sandbox\" class=\"tab-btn px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-slate-300 hover:text-white transition-all duration-200 flex items-center space-x-2\">\n          \u003ci class=\"fa-solid fa-screwdriver-wrench\">\u003c/i>\n          \u003cspan class=\"hidden md:inline\">Amaliy Sandbox\u003c/span>\n        \u003c/button>\n      \u003c/nav>\n    \u003c/div>\n  \u003c/header>\n\n  \u003c!-- MAIN CONTENT CONTAINER -->\n  \u003cmain class=\"max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full\">\n\n    \u003c!-- ================================================================= -->\n    \u003c!-- SECTION 1: FORMULAS & INTERACTIVE REFERENCE -->\n    \u003c!-- ================================================================= -->\n    \u003csection id=\"section-formulas\" class=\"space-y-6\">\n      \u003cdiv class=\"bg-slate-800/40 border border-slate-700/60 rounded-2xl p-6\">\n        \u003ch2 class=\"text-xl font-bold text-white mb-2 flex items-center gap-2\">\n          \u003ci class=\"fa-solid fa-graduation-cap text-blue-400\">\u003c/i>\n          Nazariy Formulalar va Qonuniyatlar Kalkulyatori\n        \u003c/h2>\n        \u003cp class=\"text-slate-400 text-sm\">\n          Har bir formulaga tegishli kattaliklarni o'zgartirib, natijani real vaqt rejimida hisoblang va qonuniyatni o'rganing.\n        \u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6\">\n\n        \u003c!-- Formula 1: Kuch Momenti -->\n        \u003cdiv class=\"bg-slate-800/80 border border-slate-700 rounded-2xl p-5 hover:border-blue-500/50 transition duration-300 flex flex-col justify-between shadow-xl\">\n          \u003cdiv>\n            \u003cdiv class=\"flex justify-between items-start mb-4\">\n              \u003cspan class=\"px-2.5 py-1 bg-blue-500/10 text-blue-400 border border-blue-500/20 text-xs font-semibold rounded-lg\">1-Formulalar Vizualizatsiyasi\u003c/span>\n              \u003ci class=\"fa-solid fa-rotate-right text-slate-500\">\u003c/i>\n            \u003c/div>\n            \u003ch3 class=\"text-lg font-bold text-white mb-1\">Kuch Momenti (M)\u003c/h3>\n            \u003cp class=\"text-xs text-slate-400 mb-4\">Jismni aylantiruvchi kuch va uning elkasi ko'paytmasi.\u003c/p>\n            \n            \u003cdiv class=\"bg-slate-900/80 p-3 rounded-xl text-center mb-4 border border-slate-700/50\">\n              \u003cspan class=\"text-2xl font-extrabold text-blue-400 tracking-wider\">M = F · l\u003c/span>\n            \u003c/div>\n\n            \u003c!-- Interactive Inputs -->\n            \u003cdiv class=\"space-y-3 text-xs\">\n              \u003cdiv>\n                \u003cdiv class=\"flex justify-between text-slate-300 mb-1\">\n                  \u003cspan>Kuch ($F$):\u003c/span>\n                  \u003cspan id=\"f1-val\" class=\"font-bold text-blue-400\">10 N\u003c/span>\n                \u003c/div>\n                \u003cinput type=\"range\" id=\"f1-range\" min=\"1\" max=\"100\" value=\"10\" oninput=\"calcMoment()\" class=\"w-full accent-blue-500 bg-slate-700 h-1.5 rounded-lg\">\n              \u003c/div>\n              \u003cdiv>\n                \u003cdiv class=\"flex justify-between text-slate-300 mb-1\">\n                  \u003cspan>Kuch elkasi ($l$):\u003c/span>\n                  \u003cspan id=\"l1-val\" class=\"font-bold text-blue-400\">2.0 m\u003c/span>\n                \u003c/div>\n                \u003cinput type=\"range\" id=\"l1-range\" min=\"0.1\" max=\"5.0\" step=\"0.1\" value=\"2.0\" oninput=\"calcMoment()\" class=\"w-full accent-blue-500 bg-slate-700 h-1.5 rounded-lg\">\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"mt-4 pt-3 border-t border-slate-700/60 bg-blue-950/30 -mx-5 -mb-5 p-4 rounded-b-2xl border-blue-900/30\">\n            \u003cspan class=\"text-xs text-slate-400\">Hisoblangan Moment ($M$):\u003c/span>\n            \u003cdiv id=\"m1-result\" class=\"text-xl font-black text-emerald-400 mt-0.5\">20 N·m\u003c/div>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- Formula 2: Richag Muvozanat Qoidasi -->\n        \u003cdiv class=\"bg-slate-800/80 border border-slate-700 rounded-2xl p-5 hover:border-blue-500/50 transition duration-300 flex flex-col justify-between shadow-xl\">\n          \u003cdiv>\n            \u003cdiv class=\"flex justify-between items-start mb-4\">\n              \u003cspan class=\"px-2.5 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-semibold rounded-lg\">2-Richag Qoidasi\u003c/span>\n              \u003ci class=\"fa-solid fa-balance-scale text-slate-500\">\u003c/i>\n            \u003c/div>\n            \u003ch3 class=\"text-lg font-bold text-white mb-1\">Momentlar Qoidasi\u003c/h3>\n            \u003cp class=\"text-xs text-slate-400 mb-4\">Muvozanat sharti: $F_1 \\cdot l_1 = F_2 \\cdot l_2$\u003c/p>\n            \n            \u003cdiv class=\"bg-slate-900/80 p-3 rounded-xl text-center mb-4 border border-slate-700/50\">\n              \u003cspan class=\"text-lg font-extrabold text-emerald-400 tracking-wider\">F₁ · l₁ = F₂ · l₂\u003c/span>\n            \u003c/div>\n\n            \u003c!-- Interactive Inputs -->\n            \u003cdiv class=\"space-y-3 text-xs\">\n              \u003cdiv class=\"grid grid-cols-2 gap-2\">\n                \u003cdiv>\n                  \u003clabel class=\"text-slate-400\">F₁ (N):\u003c/label>\n                  \u003cinput type=\"number\" id=\"f1-richag\" value=\"40\" oninput=\"calcRichag()\" class=\"w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white\">\n                \u003c/div>\n                \u003cdiv>\n                  \u003clabel class=\"text-slate-400\">l₁ (m):\u003c/label>\n                  \u003cinput type=\"number\" id=\"l1-richag\" value=\"1.5\" step=\"0.1\" oninput=\"calcRichag()\" class=\"w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white\">\n                \u003c/div>\n              \u003c/div>\n              \u003cdiv class=\"grid grid-cols-2 gap-2\">\n                \u003cdiv>\n                  \u003clabel class=\"text-slate-400\">l₂ (m):\u003c/label>\n                  \u003cinput type=\"number\" id=\"l2-richag\" value=\"3.0\" step=\"0.1\" oninput=\"calcRichag()\" class=\"w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white\">\n                \u003c/div>\n                \u003cdiv>\n                  \u003clabel class=\"text-emerald-400 font-semibold\">Kerak F₂ (N):\u003c/label>\n                  \u003cdiv id=\"f2-required\" class=\"w-full bg-slate-900/90 border border-emerald-500/50 rounded p-1.5 font-bold text-emerald-400\">20 N\u003c/div>\n                \u003c/div>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"mt-4 pt-3 border-t border-slate-700/60 bg-emerald-950/20 -mx-5 -mb-5 p-4 rounded-b-2xl border-emerald-900/30 text-xs text-slate-300\">\n            \u003ci class=\"fa-solid fa-circle-info text-emerald-400 mr-1\">\u003c/i>\n            Elka $l_2$ 2 baravar ortsa, talab qilinadigan kuch $F_2$ 2 baravar kamayadi.\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- Formula 3: Qo'zg'almas va Qo'zg'aluvchan Bloklar -->\n        \u003cdiv class=\"bg-slate-800/80 border border-slate-700 rounded-2xl p-5 hover:border-blue-500/50 transition duration-300 flex flex-col justify-between shadow-xl\">\n          \u003cdiv>\n            \u003cdiv class=\"flex justify-between items-start mb-4\">\n              \u003cspan class=\"px-2.5 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs font-semibold rounded-lg\">3-Bloklar Uroqligi\u003c/span>\n              \u003ci class=\"fa-solid fa-gear text-slate-500\">\u003c/i>\n            \u003c/div>\n            \u003ch3 class=\"text-lg font-bold text-white mb-1\">Bloklar Qoidasi\u003c/h3>\n            \u003cp class=\"text-xs text-slate-400 mb-4\">Qo'zg'almas: kuch berilishi o'zgaradi. Qo'zg'aluvchan: 2 marta kuchdan yutadi.\u003c/p>\n\n            \u003cdiv class=\"space-y-3 text-xs\">\n              \u003cdiv class=\"bg-slate-900/80 p-2.5 rounded-xl border border-slate-700/50\">\n                \u003cdiv class=\"flex justify-between text-slate-300\">\n                  \u003cspan>Qo'zg'almas blok ($F = P$):\u003c/span>\n                  \u003cspan id=\"fixed-block-force\" class=\"font-bold text-amber-400\">100 N\u003c/span>\n                \u003c/div>\n              \u003c/div>\n              \u003cdiv class=\"bg-slate-900/80 p-2.5 rounded-xl border border-slate-700/50\">\n                \u003cdiv class=\"flex justify-between text-slate-300\">\n                  \u003cspan>Qo'zg'aluvchan blok ($F = P/2$):\u003c/span>\n                  \u003cspan id=\"movable-block-force\" class=\"font-bold text-emerald-400\">50 N\u003c/span>\n                \u003c/div>\n              \u003c/div>\n              \u003cdiv>\n                \u003clabel class=\"text-slate-400\">Yuk og'irligi ($P$, N):\u003c/label>\n                \u003cinput type=\"range\" id=\"block-weight\" min=\"10\" max=\"500\" value=\"100\" step=\"10\" oninput=\"calcBlocks()\" class=\"w-full accent-amber-500 bg-slate-700 h-1.5 rounded-lg mt-1\">\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"mt-4 pt-3 border-t border-slate-700/60 bg-amber-950/20 -mx-5 -mb-5 p-4 rounded-b-2xl border-amber-900/30 text-xs text-slate-300\">\n            \u003cspan class=\"text-slate-400\">Mexanikaning Oltin Qoidasi:\u003c/span>\n            \u003cp class=\"font-semibold text-amber-300 mt-0.5\">Kuchdan necha marta yutshak, masofada shuncha marta yutqazamiz ($A_1 = A_2$).\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- ================================================================= -->\n    \u003c!-- SECTION 2: INTERACTIVE PROBLEM SOLVING LAB & SIMULATOR -->\n    \u003c!-- ================================================================= -->\n    \u003csection id=\"section-lab\" class=\"hidden space-y-6\">\n      \n      \u003c!-- Top Control / Task Generator Header -->\n      \u003cdiv class=\"bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4\">\n        \u003cdiv>\n          \u003cdiv class=\"flex items-center space-x-2\">\n            \u003cspan id=\"problem-badge\" class=\"px-2.5 py-0.5 rounded-full text-xs font-bold bg-blue-500/20 text-blue-400 border border-blue-500/30\">1-Masala\u003c/span>\n            \u003ch2 class=\"text-lg font-bold text-white\">Richag Muvozanati va Kuch Momenti Masalasi\u003c/h2>\n          \u003c/div>\n          \u003cp id=\"problem-statement\" class=\"text-slate-300 text-sm mt-1\">\n            Massa/Kuch $F_1 = 120\\text{ N}$ yuk chap tarafda $l_1 = 1.0\\text{ m}$ masofaga qo'yilgan. Richagni muvozanatlash uchun o'ng tarafda $l_2 = 2.0\\text{ m}$ elkada qancha $F_2$ kuch qo'llash kerak?\n          \u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"flex flex-wrap items-center gap-2 w-full lg:w-auto justify-end\">\n          \u003cbutton onclick=\"generateRandomProblem()\" class=\"px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-xs font-semibold transition flex items-center gap-2 border border-slate-600\">\n            \u003ci class=\"fa-solid fa-dice text-amber-400\">\u003c/i>\n            Yangi Masala\n          \u003c/button>\n          \u003cbutton onclick=\"resetLab()\" class=\"px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-xs font-semibold transition flex items-center gap-2 border border-slate-600\">\n            \u003ci class=\"fa-solid fa-rotate-left\">\u003c/i>\n            Qayta Tiklash\n          \u003c/button>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- Main Canvas & Control Panel Grid -->\n      \u003cdiv class=\"grid grid-cols-1 lg:grid-cols-12 gap-6\">\n\n        \u003c!-- Visual Canvas Simulator (8 cols) -->\n        \u003cdiv class=\"lg:col-span-7 bg-slate-800/90 border border-slate-700 rounded-2xl p-4 flex flex-col justify-between shadow-2xl relative min-h-[380px]\">\n          \u003cdiv class=\"flex justify-between items-center mb-2\">\n            \u003cspan class=\"text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2\">\n              \u003ci class=\"fa-solid fa-eye text-blue-400\">\u003c/i> Real-Vaqt Vizual Simulyatsiya\n            \u003c/span>\n            \u003cdiv id=\"balance-status-badge\" class=\"px-3 py-1 rounded-full text-xs font-extrabold bg-slate-700 text-slate-300 border border-slate-600\">\n              Kutilmoqda...\n            \u003c/div>\n          \u003c/div>\n\n          \u003c!-- Canvas Element -->\n          \u003cdiv class=\"w-full flex-grow bg-slate-900 rounded-xl overflow-hidden border border-slate-700/80 relative flex items-center justify-center p-2\">\n            \u003ccanvas id=\"leverCanvas\" class=\"w-full h-full block cursor-crosshair\">\u003c/canvas>\n          \u003c/div>\n\n          \u003c!-- Interactive Sliders for Student Input -->\n          \u003cdiv class=\"mt-4 bg-slate-900/80 p-4 rounded-xl border border-slate-700/60 space-y-3\">\n            \u003cdiv class=\"flex items-center justify-between\">\n              \u003cspan class=\"text-xs font-semibold text-emerald-400\">O'ng taraf kuchi $F_2$ ni sozlang:\u003c/span>\n              \u003cspan id=\"student-f2-display\" class=\"text-sm font-extrabold text-emerald-400 bg-emerald-950/60 border border-emerald-500/30 px-3 py-0.5 rounded-lg\">60 N\u003c/span>\n            \u003c/div>\n            \u003cinput type=\"range\" id=\"student-f2-input\" min=\"5\" max=\"300\" value=\"60\" step=\"5\" oninput=\"updateLabState()\" class=\"w-full accent-emerald-500 bg-slate-700 h-2 rounded-lg cursor-pointer\">\n\n            \u003cdiv class=\"flex gap-2 pt-2\">\n              \u003cbutton onclick=\"checkAnswer()\" class=\"flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm rounded-xl transition shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2\">\n                \u003ci class=\"fa-solid fa-circle-check\">\u003c/i>\n                Muvozanatni Tekshirish\n              \u003c/button>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- Problem Analysis & Step-by-Step Solver (5 cols) -->\n        \u003cdiv class=\"lg:col-span-5 bg-slate-800/90 border border-slate-700 rounded-2xl p-5 flex flex-col justify-between shadow-2xl\">\n          \u003cdiv>\n            \u003ch3 class=\"text-md font-bold text-white mb-3 pb-2 border-b border-slate-700 flex items-center gap-2\">\n              \u003ci class=\"fa-solid fa-list-check text-indigo-400\">\u003c/i>\n              Bosqichma-Bosqich Tahlil & Yechim\n            \u003c/h3>\n\n            \u003c!-- Result Feedback Alert -->\n            \u003cdiv id=\"feedback-box\" class=\"hidden mb-4 p-4 rounded-xl border text-xs leading-relaxed transition-all duration-300\">\n              \u003c!-- Dynamic JS content -->\n            \u003c/div>\n\n            \u003c!-- Given / Formula / Steps Container -->\n            \u003cdiv class=\"space-y-3 text-xs\">\n              \u003cdiv class=\"bg-slate-900/60 p-3 rounded-xl border border-slate-700/50\">\n                \u003cspan class=\"text-slate-400 font-semibold block mb-1\">1. Berilgan kattaliklar:\u003c/span>\n                \u003cdiv class=\"grid grid-cols-2 gap-2 text-slate-200 font-mono\">\n                  \u003cdiv>$F_1 = \u003cspan id=\"given-f1\">120\u003c/span>\\text{ N}$\u003c/div>\n                  \u003cdiv>$l_1 = \u003cspan id=\"given-l1\">1.0\u003c/span>\\text{ m}$\u003c/div>\n                  \u003cdiv>$l_2 = \u003cspan id=\"given-l2\">2.0\u003c/span>\\text{ m}$\u003c/div>\n                  \u003cdiv>$F_2 = \\text{? (topilishi kerak)}$\u003c/div>\n                \u003c/div>\n              \u003c/div>\n\n              \u003cdiv class=\"bg-slate-900/60 p-3 rounded-xl border border-slate-700/50\">\n                \u003cspan class=\"text-slate-400 font-semibold block mb-1\">2. Asosiy Formula:\u003c/span>\n                \u003cp class=\"text-indigo-300 font-mono text-center py-1\">F₁ · l₁ = F₂ · l₂  ⇒  F₂ = (F₁ · l₁) / l₂\u003c/p>\n              \u003c/div>\n\n              \u003cdiv class=\"bg-slate-900/60 p-3 rounded-xl border border-slate-700/50\">\n                \u003cspan class=\"text-slate-400 font-semibold block mb-1\">3. Hisoblash bosqichi:\u003c/span>\n                \u003cdiv id=\"step-calculation\" class=\"text-slate-300 font-mono\">\n                  $F_2 = (120 \\times 1.0) / 2.0 = 60\\text{ N}$\n                \u003c/div>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"mt-4 pt-3 border-t border-slate-700/60 text-xs text-slate-400 flex justify-between items-center\">\n            \u003cspan>To'g'ri javoblar: \u003cstrong id=\"score-counter\" class=\"text-emerald-400\">0\u003c/strong>\u003c/span>\n            \u003cspan class=\"text-slate-500\">Momentlar muvozanat qoidasi\u003c/span>\n          \u003c/div>\n        \u003c/div>\n\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- ================================================================= -->\n    \u003c!-- SECTION 3: REAL LIFE CASES SANDBOX -->\n    \u003c!-- ================================================================= -->\n    \u003csection id=\"section-sandbox\" class=\"hidden space-y-6\">\n      \n      \u003cdiv class=\"bg-slate-800/40 border border-slate-700/60 rounded-2xl p-6\">\n        \u003ch2 class=\"text-xl font-bold text-white mb-2 flex items-center gap-2\">\n          \u003ci class=\"fa-solid fa-industry text-amber-400\">\u003c/i>\n          Amaliy Vaziyatlar (Real Life Cases) Interaktiv Sandboksi\n        \u003c/h2>\n        \u003cp class=\"text-slate-400 text-sm\">\n          Kundalik hayotimiz va texnikadagi oddiy mexanizmlarni simulyatsiya qiling. Kuchdan yutish ko'rsatkichini va masofadan yutqazishni amalda tekshiring.\n        \u003c/p>\n      \u003c/div>\n\n      \u003c!-- Case Selection Tabs -->\n      \u003cdiv class=\"flex space-x-3 border-b border-slate-700 pb-2\">\n        \u003cbutton onclick=\"selectCase('pliers')\" id=\"case-btn-pliers\" class=\"case-btn px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold transition flex items-center gap-2\">\n          \u003ci class=\"fa-solid fa-scissors\">\u003c/i> Ombur (Sim Qirqgich)\n        \u003c/button>\n        \u003cbutton onclick=\"selectCase('well')\" id=\"case-btn-well\" class=\"case-btn px-4 py-2 bg-slate-800 text-slate-300 hover:text-white rounded-xl text-xs font-bold transition flex items-center gap-2\">\n          \u003ci class=\"fa-solid fa-faucet-drip\">\u003c/i> Quduq Chig'irig'i\n        \u003c/button>\n        \u003cbutton onclick=\"selectCase('crane')\" id=\"case-btn-crane\" class=\"case-btn px-4 py-2 bg-slate-800 text-slate-300 hover:text-white rounded-xl text-xs font-bold transition flex items-center gap-2\">\n          \u003ci class=\"fa-solid fa-truck-pickup\">\u003c/i> Qurilish Krani Bloklari\n        \u003c/button>\n      \u003c/div>\n\n      \u003c!-- Active Case Container -->\n      \u003cdiv class=\"bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl grid grid-cols-1 md:grid-cols-12 gap-6\">\n        \n        \u003c!-- Interactive Controls (5 cols) -->\n        \u003cdiv class=\"md:col-span-5 space-y-5\">\n          \u003cdiv id=\"case-info-header\">\n            \u003ch3 id=\"case-title\" class=\"text-lg font-bold text-white\">Ombur Yordamida Sim Qirqish\u003c/h3>\n            \u003cp id=\"case-desc\" class=\"text-xs text-slate-400 mt-1\">\n              Omburning dastalari uzunligi va pichoq elkasi nisbati orqali kuchdan qanday yutishimizni kuzating.\n            \u003c/p>\n          \u003c/div>\n\n          \u003c!-- Dynamic Controls Box -->\n          \u003cdiv id=\"case-controls-box\" class=\"space-y-4 bg-slate-900/80 p-4 rounded-xl border border-slate-700\">\n            \u003c!-- Dynamically Rendered Controls via JS -->\n          \u003c/div>\n\n          \u003c!-- Mechanical Advantage Box -->\n          \u003cdiv class=\"bg-gradient-to-r from-blue-900/40 to-indigo-900/40 border border-blue-500/30 p-4 rounded-xl space-y-2\">\n            \u003cdiv class=\"flex justify-between items-center text-xs\">\n              \u003cspan class=\"text-slate-300\">Kuchdan Yutish Nisbati ($K$):\u003c/span>\n              \u003cspan id=\"advantage-value\" class=\"text-lg font-black text-emerald-400\">4.0 marta\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"flex justify-between items-center text-xs\">\n              \u003cspan class=\"text-slate-300\">Hosil bo'lgan Yakuniy Kuch ($F_{hosil}$):\u003c/span>\n              \u003cspan id=\"resulting-force-value\" class=\"text-base font-bold text-blue-300\">200 N\u003c/span>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- Case Visual Display (7 cols) -->\n        \u003cdiv class=\"md:col-span-7 bg-slate-900 rounded-xl border border-slate-700 p-4 flex flex-col justify-between relative min-h-[300px]\">\n          \u003cdiv class=\"text-xs font-semibold text-slate-400 mb-2 flex justify-between\">\n            \u003cspan>\u003ci class=\"fa-solid fa-cubes-stacked text-amber-400 mr-1\">\u003c/i> Mexanizm Animatsiyasi\u003c/span>\n            \u003cspan id=\"case-status-tag\" class=\"text-emerald-400 font-bold\">Aktiv\u003c/span>\n          \u003c/div>\n\n          \u003c!-- Sandbox Canvas -->\n          \u003cdiv class=\"w-full h-64 bg-slate-950 rounded-lg overflow-hidden border border-slate-800 relative\">\n            \u003ccanvas id=\"sandboxCanvas\" class=\"w-full h-full block\">\u003c/canvas>\n          \u003c/div>\n\n          \u003cdiv id=\"case-explanation-footer\" class=\"mt-3 text-xs text-slate-300 bg-slate-800/80 p-3 rounded-lg border border-slate-700/80\">\n            \u003c!-- Dynamic explanation text -->\n          \u003c/div>\n        \u003c/div>\n\n      \u003c/div>\n\n    \u003c/section>\n\n  \u003c/main>\n\n  \u003c!-- FOOTER -->\n  \u003cfooter class=\"bg-slate-950 border-t border-slate-800 py-4 mt-8\">\n    \u003cdiv class=\"max-w-7xl mx-auto px-4 text-center text-xs text-slate-500\">\n      14-mavzu Masalalar Yechish Simulyatori &copy; Fizika Fani O'quv-Metodik Interaktiv Trenajyori\n    \u003c/div>\n  \u003c/footer>\n\n  \u003c!-- ================================================================= -->\n  \u003c!-- JAVASCRIPT LOGIC & SIMULATION ENGINE -->\n  \u003c!-- ================================================================= -->\n  \u003cscript>\n    // GLOBAL STATE & TAB SWITCHING\n    let currentTab = 'formulas';\n\n    function switchTab(tabId) {\n      currentTab = tabId;\n      document.querySelectorAll('section').forEach(sec => sec.classList.add('hidden'));\n      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));\n\n      document.getElementById(`section-${tabId}`).classList.remove('hidden');\n      document.getElementById(`tab-${tabId}`).classList.add('active');\n\n      if (tabId === 'lab') {\n        initLabCanvas();\n        drawLeverSimulator();\n      } else if (tabId === 'sandbox') {\n        initSandboxCanvas();\n        renderSandboxCase();\n      }\n    }\n\n    // ==========================================\n    // SECTION 1: FORMULA CALCULATORS LOGIC\n    // ==========================================\n    function calcMoment() {\n      const F = parseFloat(document.getElementById('f1-range').value);\n      const l = parseFloat(document.getElementById('l1-range').value);\n      const M = F * l;\n\n      document.getElementById('f1-val').innerText = F + ' N';\n      document.getElementById('l1-val').innerText = l.toFixed(1) + ' m';\n      document.getElementById('m1-result').innerText = M.toFixed(1) + ' N·m';\n    }\n\n    function calcRichag() {\n      const F1 = parseFloat(document.getElementById('f1-richag').value) || 0;\n      const l1 = parseFloat(document.getElementById('l1-richag').value) || 0;\n      const l2 = parseFloat(document.getElementById('l2-richag').value) || 1;\n\n      const F2 = (F1 * l1) / (l2 \u003c= 0 ? 1 : l2);\n      document.getElementById('f2-required').innerText = F2.toFixed(1) + ' N';\n    }\n\n    function calcBlocks() {\n      const P = parseFloat(document.getElementById('block-weight').value);\n      document.getElementById('fixed-block-force').innerText = P + ' N';\n      document.getElementById('movable-block-force').innerText = (P / 2).toFixed(1) + ' N';\n    }\n\n    // ==========================================\n    // SECTION 2: PROBLEM SOLVING LAB & CANVAS\n    // ==========================================\n    let currentProblem = {\n      f1: 120,\n      l1: 1.0,\n      l2: 2.0,\n      correctF2: 60,\n      studentF2: 60,\n      isChecked: false,\n      isCorrect: false\n    };\n\n    let score = 0;\n    let labCanvas, labCtx;\n    let currentTiltAngle = 0; // Animation tilt angle for leverage\n\n    function initLabCanvas() {\n      labCanvas = document.getElementById('leverCanvas');\n      labCtx = labCanvas.getContext('2d');\n      resizeCanvas(labCanvas);\n      window.addEventListener('resize', () => {\n        if(currentTab === 'lab') {\n          resizeCanvas(labCanvas);\n          drawLeverSimulator();\n        }\n      });\n    }\n\n    function resizeCanvas(canvas) {\n      if(!canvas || !canvas.parentElement) return;\n      canvas.width = canvas.parentElement.clientWidth;\n      canvas.height = canvas.parentElement.clientHeight || 300;\n    }\n\n    function generateRandomProblem() {\n      const possibleL1 = [0.5, 1.0, 1.5, 2.0];\n      const possibleL2 = [1.0, 1.5, 2.0, 2.5, 3.0];\n      const possibleF1 = [40, 60, 80, 100, 120, 150, 200];\n\n      const f1 = possibleF1[Math.floor(Math.random() * possibleF1.length)];\n      const l1 = possibleL1[Math.floor(Math.random() * possibleL1.length)];\n      let l2 = possibleL2[Math.floor(Math.random() * possibleL2.length)];\n\n      const correctF2 = (f1 * l1) / l2;\n\n      currentProblem = {\n        f1: f1,\n        l1: l1,\n        l2: l2,\n        correctF2: correctF2,\n        studentF2: Math.round(correctF2 * (0.6 + Math.random() * 0.8)),\n        isChecked: false,\n        isCorrect: false\n      };\n\n      // UI Update\n      document.getElementById('problem-statement').innerHTML = \n        `Massa/Kuch $F_1 = ${f1}\\\\text{ N}$ yuk chap tarafda $l_1 = ${l1.toFixed(1)}\\\\text{ m}$ masofaga qo'yilgan. Richagni muvozanatlash uchun o'ng tarafda $l_2 = ${l2.toFixed(1)}\\\\text{ m}$ elkada qancha $F_2$ kuch qo'llash kerak?`;\n\n      document.getElementById('given-f1').innerText = f1;\n      document.getElementById('given-l1').innerText = l1.toFixed(1);\n      document.getElementById('given-l2').innerText = l2.toFixed(1);\n\n      document.getElementById('student-f2-input').value = currentProblem.studentF2;\n      document.getElementById('student-f2-display').innerText = currentProblem.studentF2 + ' N';\n\n      document.getElementById('feedback-box').classList.add('hidden');\n      document.getElementById('balance-status-badge').innerText = 'Kutilmoqda...';\n      document.getElementById('balance-status-badge').className = 'px-3 py-1 rounded-full text-xs font-extrabold bg-slate-700 text-slate-300 border border-slate-600';\n\n      updateLabState();\n    }\n\n    function updateLabState() {\n      const val = parseFloat(document.getElementById('stude
