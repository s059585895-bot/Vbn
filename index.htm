0;border-bottom:1px solid var(--line);align-items:flex-start}.step:last-child{border:0}.step input{width:20px;height:20px;accent-color:var(--green);margin-top:3px}.step.done span{text-decoration:line-through;color:var(--muted)}\ntextarea{min-height:110px;resize:vertical}.footer-nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}\n.notice{padding:12px 14px;border-radius:12px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;font-size:.9rem}.success{padding:12px 14px;border-radius:12px;background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}\n.barline{height:12px;border-radius:99px;background:#e2e8f0;overflow:hidden;margin-top:8px}.barline div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));width:0;transition:width .4s}\n.small{font-size:.85rem}.hidden{display:none!important}\n@media(max-width:760px){.hero,.grid2{grid-template-columns:1fr}.hero-art{min-height:180px}.cards{grid-template-columns:1fr}.equipment{grid-template-columns:repeat(2,minmax(0,1fr))}.controls{grid-template-columns:1fr}.readings{grid-template-columns:1fr 1fr}.nav{margin-right:-8px}.footer-nav .btn{padding:10px 12px}}\n@media print{header,.nav,.progress,.footer-nav,.actions,.btn{display:none!important}body{background:white}.panel{display:block!important;page-break-after:always}.box,.card{box-shadow:none}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\n \u003cdiv>\u003cdiv class=\"brand\">Virtual fizika laboratoriyasi · 10-sinf\u003c/div>\u003cdiv class=\"header-title\">Qiya tekislikning FIKini aniqlash\u003c/div>\u003c/div>\n \u003cdiv class=\"pill\">LABORATORIYA ISHI № 11\u003c/div>\n\u003c/header>\n\u003cmain>\n\u003cdiv class=\"progress\">\u003cdiv id=\"progressFill\">\u003c/div>\u003c/div>\n\u003cnav class=\"nav\" id=\"nav\">\u003c/nav>\n\n\u003csection class=\"panel active\" data-title=\"Kirish\">\n \u003cdiv class=\"hero\">\n  \u003cdiv>\u003cdiv class=\"eyebrow\">Laboratoriya ishi № 11\u003c/div>\u003ch1>Qiya tekislikning foydali ish koeffitsiyentini aniqlash\u003c/h1>\n   \u003cp>Virtual tajribani bajaring: yukni qiya tekislik bo‘ylab torting, kuch va masofani o‘lchang, ishlarni hisoblang va FIKni aniqlang.\u003c/p>\n   \u003cdiv class=\"actions\">\u003cbutton class=\"btn\" onclick=\"go(1)\">Laboratoriyani boshlash →\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"go(2)\">Nazariyani ko‘rish\u003c/button>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"hero-art\">\n   \u003csvg viewBox=\"0 0 480 300\" role=\"img\" aria-label=\"Qiya tekislik va yuk tasviri\">\n    \u003cdefs>\u003clinearGradient id=\"ramp\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\u003cstop stop-color=\"#93c5fd\"/>\u003cstop offset=\"1\" stop-color=\"#2563eb\"/>\u003c/linearGradient>\u003clinearGradient id=\"block\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\u003cstop stop-color=\"#c4b5fd\"/>\u003cstop offset=\"1\" stop-color=\"#7c3aed\"/>\u003c/linearGradient>\u003c/defs>\n    \u003cpath d=\"M45 250 L390 250 L390 90 Z\" fill=\"#dbeafe\" stroke=\"#93c5fd\" stroke-width=\"2\"/>\n    \u003cpath d=\"M70 240 L380 100 L380 116 L70 256 Z\" fill=\"url(#ramp)\"/>\n    \u003cpath d=\"M70 256 L380 116\" stroke=\"#1d4ed8\" stroke-width=\"4\"/>\n    \u003cg transform=\"translate(226 160) rotate(-24)\">\n     \u003crect x=\"-35\" y=\"-28\" width=\"70\" height=\"52\" rx=\"8\" fill=\"url(#block)\" stroke=\"#5b21b6\" stroke-width=\"2\"/>\n     \u003cpath d=\"M-20 -12h40M-20 0h40\" stroke=\"#ede9fe\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n    \u003c/g>\n    \u003cpath d=\"M228 151 L315 111\" stroke=\"#dc2626\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003cpath d=\"M315 111l-15 0 7 13\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"4\"/>\n    \u003ctext x=\"265\" y=\"92\" fill=\"#b91c1c\" font-size=\"15\" font-weight=\"700\">F\u003c/text>\n    \u003cpath d=\"M72 276H380\" stroke=\"#64748b\" stroke-width=\"2\"/>\u003cpath d=\"M72 270v12M380 270v12\" stroke=\"#64748b\" stroke-width=\"2\"/>\u003ctext x=\"220\" y=\"294\" fill=\"#334155\" font-size=\"14\">s — qiya tekislik uzunligi\u003c/text>\n    \u003cpath d=\"M405 250V92\" stroke=\"#059669\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/>\u003cpath d=\"M398 100l7 -8 7 8M398 242l7 8 7 -8\" fill=\"none\" stroke=\"#059669\" stroke-width=\"2\"/>\u003ctext x=\"414\" y=\"174\" fill=\"#047857\" font-size=\"14\" font-weight=\"700\">h\u003c/text>\n    \u003cpath d=\"M42 250h360\" stroke=\"#475569\" stroke-width=\"3\"/>\u003cpath d=\"M65 255v20m28 -20v20m-28 0h28\" stroke=\"#64748b\" stroke-width=\"3\"/>\n   \u003c/svg>\n  \u003c/div>\n \u003c/div>\n \u003cdiv class=\"cards\">\n  \u003cdiv class=\"card\" onclick=\"go(2)\">\u003cdiv class=\"num\">01\u003c/div>\u003ch3>Nazariy bilim\u003c/h3>\u003cp class=\"muted small\">Asosiy kattaliklar va formulalarni o‘rganing.\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\" onclick=\"go(5)\">\u003cdiv class=\"num\">02\u003c/div>\u003ch3>Virtual tajriba\u003c/h3>\u003cp class=\"muted small\">Parametrlarni o‘zgartirib, o‘lchovlarni bajaring.\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\" onclick=\"go(9)\">\u003cdiv class=\"num\">03\u003c/div>\u003ch3>Natija va test\u003c/h3>\u003cp class=\"muted small\">Hisoblarni tahlil qiling va bilimni tekshiring.\u003c/p>\u003c/div>\n \u003c/div>\n\u003c/section>\n\n\u003csection class=\"panel\" data-title=\"Reja\">\n \u003cdiv class=\"eyebrow\">Dars tuzilishi\u003c/div>\u003ch2>Laboratoriya ishining rejasi\u003c/h2>\n \u003cdiv class=\"cards\">\n  \u003cdiv class=\"card\" onclick=\"showPlan(0)\">\u003cdiv class=\"num\">1\u003c/div>\u003ch3>Maqsad va jihozlar\u003c/h3>\u003cp class=\"muted\">Laboratoriya ishining maqsadi, zarur jihozlar va bajarish tartibini o‘rganish.\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\" onclick=\"showPlan(1)\">\u003cdiv class=\"num\">2\u003c/div>\u003ch3>Tajribani bajarish\u003c/h3>\u003cp class=\"muted\">Kuch va masofani o‘lchab, to‘la hamda foydali ishlarni hisoblash.\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\" onclick=\"showPlan(2)\">\u003cdiv class=\"num\">3\u003c/div>\u003ch3>FIK va xulosa\u003c/h3>\u003cp class=\"muted\">FIKni aniqlash va tajriba natijalari bo‘yicha xulosa chiqarish.\u003c/p>\u003c/div>\n \u003c/div>\n \u003cdiv class=\"box\" style=\"margin-top:16px\">\u003ch3 id=\"planTitle\">1-reja. Maqsad va jihozlar\u003c/h3>\u003cp id=\"planText\">Tajriba orqali qiya tekislikning FIKini aniqlash uchun zarur o‘lchovlar va hisob-kitoblarni o‘rganamiz.\u003c/p>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"panel\" data-title=\"Nazariya\">\n \u003cdiv class=\"eyebrow\">Nazariy ma’lumot\u003c/div>\u003ch2>Qiya tekislik va foydali ish koeffitsiyenti\u003c/h2>\n \u003cp>Qiya tekislik — yukni ma’lum balandlikka ko‘tarishda kerakli kuchni kamaytirishga yordam beradigan oddiy mexanizm. Bunda ko‘pincha kuch kamayadi, ammo bosib o‘tiladigan masofa ortadi.\u003c/p>\n \u003cdiv class=\"grid2\">\n  \u003cdiv class=\"box\">\u003ch3>Asosiy kattaliklar\u003c/h3>\n   \u003cp>\u003cb>F\u003c/b> — tortish kuchi, nyuton (N).\u003c/p>\u003cp>\u003cb>s\u003c/b> — qiya tekislik bo‘ylab masofa, metr (m).\u003c/p>\u003cp>\u003cb>m\u003c/b> — yuk massasi, kilogramm (kg).\u003c/p>\u003cp>\u003cb>h\u003c/b> — vertikal balandlik, metr (m).\u003c/p>\u003cp>\u003cb>g\u003c/b> — erkin tushish tezlanishi, 9,8 m/s².\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"box\">\u003ch3>Asosiy formulalar\u003c/h3>\n   \u003cdiv class=\"formula\">A\u003csub>to‘la\u003c/sub> = F · s\u003csmall>Jismni qiya tekislik bo‘ylab tortishda bajarilgan ish.\u003c/small>\u003c/div>\n   \u003cdiv class=\"formula\">A\u003csub>foydali\u003c/sub> = m · g · h\u003csmall>Yukning potensial energiyasi ortishiga teng foydali ish.\u003c/small>\u003c/div>\n   \u003cdiv class=\"formula\">η = (A\u003csub>foydali\u003c/sub> / A\u003csub>to‘la\u003c/sub>) · 100%\u003csmall>Foydali ish koeffitsiyenti (FIK), foizda.\u003c/small>\u003c/div>\n  \u003c/div>\n \u003c/div>\n \u003cdiv class=\"notice\" style=\"margin-top:16px\">Muhim: A = F·s formulasi kuch doimiy yoki o‘rtacha kuch sifatida o‘lchangan holatda qo‘llanadi. Jism boshlanish va tugashda bir xil kinetik energiyaga ega bo‘lsa, foydali ish mgh ga teng. Ishqalanish mavjud bo‘lsa, to‘la ishning bir qismi issiqlikka sarflanadi.\u003c/div>\n\u003c/section>\n\n\u003csection class=\"panel\" data-title=\"Jihozlar\">\n \u003cdiv class=\"eyebrow\">Tajriba tayyorgarligi\u003c/div>\u003ch2>Zarur laboratoriya jihozlari\u003c/h2>\u003cp class=\"muted\">Jihoz ustiga bosing — uning vazifasi haqida ma’lumot oling.\u003c/p>\n \u003cdiv class=\"equipment\" id=\"equipment\">\u003c/div>\n \u003cdiv class=\"box\" style=\"margin-top:14px\">\u003ch3 id=\"equipTitle\">Qiya tekislik\u003c/h3>\u003cp id=\"equipDesc\">Yukni ma’lum balandlikka ko‘tarish uchun foydalaniladigan sirt.\u003c/p>\u003c/div>\n \u003ch3 style=\"margin-top:22px\">Bajarish tartibi\u003c/h3>\n \u003cdiv class=\"box\" id=\"steps\">\u003c/div>\n\u003c/section>\n\n\u003csection class=\"panel\" data-title=\"Qurilma\">\n \u003cdiv class=\"eyebrow\">Virtual laboratoriya\u003c/div>\u003ch2>Tajriba qurilmasi\u003c/h2>\n \u003cp>Slayderlar yordamida yuk massasini, qiya tekislik uzunligini, balandlikni va ishqalanishni o‘zgartiring. Tasvir va hisoblangan ko‘rsatkichlar yangilanadi.\u003c/p>\n \u003cdiv class=\"grid2\">\n  \u003cdiv class=\"labscene\">\u003csvg id=\"scene\" viewBox=\"0 0 600 380\" aria-label=\"Interaktiv qiya tekislik qurilmasi\">\u003c/svg>\u003c/div>\n  \u003cdiv class=\"stack\">\n   \u003cdiv class=\"controls\">\n    \u003cdiv class=\"control\">\u003clabel for=\"mass\">Yuk massasi \u003coutput id=\"massOut\">1.0 kg\u003c/output>\u003c/label>\u003cinput id=\"mass\" type=\"range\" min=\"0.2\" max=\"2\" step=\"0.1\" value=\"1\">\u003c/div>\n    \u003cdiv class=\"control\">\u003clabel for=\"length\">Tekislik uzunligi \u003coutput id=\"lengthOut\">1.0 m\u003c/output>\u003c/label>\u003cinput id=\"length\" type=\"range\" min=\"0.5\" max=\"2\" step=\"0.1\" value=\"1\">\u003c/div>\n    \u003cdiv class=\"control\">\u003clabel for=\"height\">Balandlik \u003coutput id=\"heightOut\">0.4 m\u003c/output>\u003c/label>\u003cinput id=\"height\" type=\"range\" min=\"0.1\" max=\"0.9\" step=\"0.1\" value=\"0.4\">\u003c/div>\n    \u003cdiv class=\"control\">\u003clabel for=\"friction\">Ishqalanish μ \u003coutput id=\"frictionOut\">0.20\u003c/output>\u003c/label>\u003cinput id=\"friction\" type=\"range\" min=\"0\" max=\"0.5\" step=\"0.05\" value=\"0.2\">\u003c/div>\n   \u003c/div>\n   \u003cdiv class=\"readings\">\n    \u003cdiv class=\"reading\">\u003cspan>Tortish kuchi F\u003c/span>\u003cstrong id=\"forceRead\">— N\u003c/strong>\u003c/div>\n    \u003cdiv class=\"reading\">\u003cspan>To‘la ish\u003c/span>\u003cstrong id=\"totalRead\">— J\u003c/strong>\u003c/div>\n    \u003cdiv class=\"reading\">\u003cspan>Foydali ish\u003c/span>\u003cstrong id=\"usefulRead\">— J\u003c/strong>\u003c/div>\n   \u003c/div>\n   \u003cdiv class=\"box\">\u003cspan class=\"muted small\">Joriy FIK\u003c/span>\u003cdiv class=\"meter\" id=\"effRead\">— %\u003c/div>\u003cdiv class=\"barline\">\u003cdiv id=\"effBar\">\u003c/div>\u003c/div>\u003c/div>\n   \u003cdiv class=\"actions\">\u003cbutton class=\"btn\" onclick=\"pullLoad()\">▶ Yukni tortish\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"measure()\">O‘lchash\u003c/button>\u003cbutton class=\"btn green\" onclick=\"addTrial()\">Natijani jadvalga kiritish\u003c/button>\u003c/div>\n   \u003cp id=\"labStatus\" class=\"muted small\">Tajriba parametrlarini tanlang va “Yukni tortish” tugmasini bosing.\u003c/p>\n  \u003c/div>\n \u003c/div>\n\u003c/section>\n\n\u003csection class=\"panel\" data-title=\"Hisoblash\">\n \u003cdiv class=\"eyebrow\">Hisob-kitoblar\u003c/div>\u003ch2>Ish va FIKni hisoblash\u003c/h2>\n \u003cp>Quyidagi hisoblar joriy tajriba parametrlariga bog‘langan. Parametrlarni o‘zgartirsangiz, natijalar avtomatik yangilanadi.\u003c/p>\n \u003cdiv class=\"grid2\">\n  \u003cdiv class=\"box\">\u003ch3>1. To‘la ish\u003c/h3>\u003cdiv class=\"formula\" id=\"calcTotal\">A\u003csub>to‘la\u003c/sub> = F · s\u003c/div>\u003cp id=\"calcTotalSteps\" class=\"muted\">\u003c/p>\u003c/div>\n  \u003cdiv class=\"box\">\u003ch3>2. Foydali ish\u003c/h3>\u003cdiv class=\"formula\" id=\"calcUseful\">A\u003csub>foydali\u003c/sub> = m · g · h\u003c/div>\u003cp id=\"calcUsefulSteps\" class=\"muted\">\u003c/p>\u003c/div>\n \u003c/div>\n \u003cdiv class=\"box\" style=\"margin-top:14px\">\u003ch3>3. FIK\u003c/h3>\u003cdiv class=\"formula\" id=\"calcEff\">η = (A\u003csub>foydali\u003c/sub> / A\u003csub>to‘la\u003c/sub>) · 100%\u003c/div>\u003cp id=\"calcEffSteps\" class=\"muted\">\u003c/p>\u003cdiv class=\"success\" id=\"calcInterpret\">Parametrlarni o‘zgartirib natijani kuzating.\u003c/div>\u003c/div>\n \u003cdiv class=\"notice\" style=\"margin-top:14px\">Ideal modelda ishqalanish bo‘lmasa, FIK 100% ga yaqinlashadi. Haqiqiy qurilmada qo‘shimcha yo‘qotishlar bo‘lishi mumkin.\u003c/div>\n\u003c/section>\n\n\u003csection class=\"panel\" data-title=\"Jadval\">\n \u003cdiv class=\"eyebrow\">Tajriba natijalari\u003c/div>\u003ch2>O‘lchovlar jadvali\u003c/h2>\n \u003cp>Kamida uch xil tajriba bajaring. Har bir tajriba uchun parametrlarni o‘zgartirib, yukni torting va “Natijani jadvalga kiritish” tugmasini bosing.\u003c/p>\n \u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>№\u003c/th>\u003cth>m (kg)\u003c/th>\u003cth>F (N)\u003c/th>\u003cth>s (m)\u003c/th>\u003cth>h (m)\u003c/th>\u003cth>A to‘la (J)\u003c/th>\u003cth>A foydali (J)\u003c/th>\u003cth>FIK (%)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"resultsBody\">\u003ctr>\u003ctd colspan=\"8\" class=\"muted\">Hozircha natijalar yo‘q.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n \u003cdiv class=\"grid2\" style=\"margin-top:14px\">\u003cdiv class=\"box\">\u003cspan class=\"muted small\">Tajribalar soni\u003c/span>\u003cdiv class=\"meter\" id=\"trialCount\">0\u003c/div>\u003c/div>\u003cdiv class=\"box\">\u003cspan class=\"muted small\">O‘rtacha FIK\u003c/span>\u003cdiv class=\"meter\" id=\"avgEff\">— %\u003c/div>\u003c/div>\u003c/div>\n \u003cdiv class=\"actions\">\u003cbutton class=\"btn\" onclick=\"downloadCSV()\">Natijalarni CSV sifatida saqlash\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"clearTrials()\">Jadvalni tozalash\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"window.print()\">Chop etish / PDF\u003c/button>\u003c/div>\n \u003cp id=\"saveStatus\" class=\"muted small\">\u003c/p>\n\u003c/section>\n\n\u003csection class=\"panel\" data-title=\"Tahlil\">\n \u003cdiv class=\"eyebrow\">Natijalarni tahlil qilish\u003c/div>\u003ch2>Ishqalanish FIKga qanday ta’sir qiladi?\u003c/h2>\n \u003cdiv class=\"grid2\">\n  \u003cdiv class=\"box\">\u003ch3>Ideal qiya tekislik\u003c/h3>\u003csvg viewBox=\"0 0 300 140\" style=\"width:100%\">\u003cpath d=\"M20 115L250 115L250 30Z\" fill=\"#dbeafe\" stroke=\"#93c5fd\" stroke-width=\"2\"/>\u003cpath d=\"M40 108L240 38\" stroke=\"#2563eb\" stroke-width=\"10\" stroke-linecap=\"round\"/>\u003crect x=\"118\" y=\"64\" width=\"36\" height=\"25\" rx=\"5\" fill=\"#8b5cf6\" transform=\"rotate(-19 136 76)\"/>\u003ctext x=\"20\" y=\"20\" fill=\"#047857\" font-size=\"13\" font-weight=\"700\">μ = 0\u003c/text>\u003c/svg>\u003cp>Yo‘qotishlar e’tiborga olinmasa, to‘la ish foydali ishga teng bo‘ladi.\u003c/p>\u003cdiv class=\"formula\">η ≈ 100%\u003c/div>\u003c/div>\n  \u003cdiv class=\"box\">\u003ch3>Haqiqiy qiya tekislik\u003c/h3>\u003csvg viewBox=\"0 0 300 140\" style=\"width:100%\">\u003cpath d=\"M20 115L250 115L250 30Z\" fill=\"#ede9fe\" stroke=\"#c4b5fd\" stroke-width=\"2\"/>\u003cpath d=\"M40 108L240 38\" stroke=\"#7c3aed\" stroke-width=\"10\" stroke-linecap=\"round\"/>\u003crect x=\"118\" y=\"64\" width=\"36\" height=\"25\" rx=\"5\" fill=\"#64748b\" transform=\"rotate(-19 136 76)\"/>\u003cpath d=\"M115 88l-12 13m24 -8l-12 13m24 -8l-12 13\" stroke=\"#ea580c\" stroke-width=\"3\"/>\u003ctext x=\"20\" y=\"20\" fill=\"#c2410c\" font-size=\"13\" font-weight=\"700\">μ &gt; 0\u003c/text>\u003c/svg>\u003cp>Ishqalanish sabab energiyaning bir qismi issiqlikka aylanadi.\u003c/p>\u003cdiv class=\"formula\">η &lt; 100%\u003c/div>\u003c/div>\n \u003c/div>\n \u003cdiv class=\"box\" style=\"margin-top:14px\">\u003ch3>Joriy parametrlar uchun FIK\u003c/h3>\u003cdiv id=\"analysisEff\" class=\"meter\">— %\u003c/div>\u003cp id=\"analysisText\">Ishqalanish qiymatini o‘zgartirib, natijani kuzating.\u003c/p>\u003c/div>\n \u003cdiv class=\"box\" style=\"margin-top:14px\">\u003ch3>Xulosa savollari\u003c/h3>\u003cp>1. Qiya tekislik qanday vazifani bajaradi?\u003c/p>\u003ctextarea id=\"answer1\" placeholder=\"Javobingizni yozing...\">\u003c/textarea>\u003cp>2. To‘la va foydali ish qanday aniqlanadi?\u003c/p>\u003ctextarea id=\"answer2\" placeholder=\"Javobingizni yozing...\">\u003c/textarea>\u003cp>3. Ishqalanish ortganda FIK qanday o‘zgaradi va nima uchun?\u003c/p>\u003ctextarea id=\"answer3\" placeholder=\"Javobingizni yozing...\">\u003c/textarea>\u003cdiv class=\"actions\">\u003cbutton class=\"btn\" onclick=\"checkConclusion()\">Xulosani tekshirish\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"fillConclusion()\">Namunaviy xulosani ko‘rish\u003c/button>\u003c/div>\u003cdiv id=\"conclusionFeedback\" style=\"margin-top:12px\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"panel\" data-title=\"Test\">\n \u003cdiv class=\"eyebrow\">Bilimni tekshirish\u003c/div>\u003ch2>Yakuniy test\u003c/h2>\u003cp>Har bir savol uchun bitta javob tanlang, so‘ng “Testni tekshirish” tugmasini bosing.\u003c/p>\n \u003cdiv id=\"quiz\">\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn\" onclick=\"checkQuiz()\">Testni tekshirish\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"resetQuiz()\">Qayta ishlash\u003c/button>\u003c/div>\u003cdiv id=\"quizResult\" style=\"margin-top:14px\">\u003c/div>\n\u003c/section>\n\n\u003csection class=\"panel\" data-title=\"Yakun\">\n \u003cdiv class=\"hero\">\u003cdiv>\u003cdiv class=\"eyebrow\">Laboratoriya yakuni\u003c/div>\u003ch1>LABORATORIYA ISHI YAKUNLANDI!\u003c/h1>\u003cp>Qiya tekislikning FIKini tajriba orqali aniqladingiz, fizik kattaliklarni o‘lchadingiz, ishlarni hisoblab chiqdingiz va natijalarni tahlil qildingiz.\u003c/p>\u003cdiv class=\"actions\">\u003cbutton class=\"btn\" onclick=\"go(5)\">Tajribani qayta bajarish\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"go(7)\">Natijalarni ko‘rish\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"go(8)\">Yakuniy test\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"hero-art\">\u003csvg viewBox=\"0 0 300 240\">\u003ccircle cx=\"150\" cy=\"120\" r=\"86\" fill=\"#dbeafe\"/>\u003ccircle cx=\"150\" cy=\"120\" r=\"63\" fill=\"#c4b5fd\"/>\u003cpath d=\"M112 120l25 25 52-58\" fill=\"none\" stroke=\"#fff\" stroke-width=\"13\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M65 205l18-15m134 10l18 15M150 18v-12\" stroke=\"#7c3aed\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\n \u003cdiv class=\"box\" style=\"margin-top:16px\">\u003ch3>Esda tuting\u003c/h3>\u003cdiv class=\"formula\">η = (A\u003csub>foydali\u003c/sub> / A\u003csub>to‘la\u003c/sub>) · 100%\u003c/div>\u003cp class=\"muted\">FIK foydali ishning to‘la ishga nisbatini foizlarda ifodalaydi. Haqiqiy mexanizmlarda energiya yo‘qotishlari sababli FIK odatda 100% dan kichik.\u003c/p>\u003c/div>\n\u003c/section>\n\n\u003cdiv class=\"footer-nav\">\u003cbutton class=\"btn secondary\" id=\"prevBtn\" onclick=\"go(current-1)\">← Oldingi\u003c/button>\u003cspan class=\"muted small\" id=\"pageLabel\">1 / 9\u003c/span>\u003cbutton class=\"btn\" id=\"nextBtn\" onclick=\"go(current+1)\">Keyingi →\u003c/button>\u003c/div>\n\u003c/main>\n\u003cscript>\nconst panels=[...document.querySelectorAll('.panel')], nav=document.getElementById('nav');\nlet current=0, measured=false, trials=[], moving=false;\npanels.forEach((p,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+p.dataset.title;b.onclick=()=>go(i);nav.appendChild(b)});\nfunction go(i){i=Math.max(0,Math.min(panels.length-1,i));current=i;panels.forEach((p,j)=>p.classList.toggle('active',j===i));[...nav.children].forEach((b,j)=>b.classList.toggle('active',j===i));document.getElementById('progressFill').style.width=((i+1)/panels.length*100)+'%';document.getElementById('pageLabel').textContent=(i+1)+' / '+panels.length;document.getElementById('prevBtn').disabled=i===0;document.getElementById('nextBtn').disabled=i===panels.length-1;window.scrollTo({top:0,behavior:'smooth'});if(i===5)updateCalc()}\nconst plans=[['1-reja. Maqsad va jihozlar','Jihozlar bilan tanishamiz, massani, uzunlikni va balandlikni o‘lchashni o‘rganamiz.'],['2-reja. Tajribani bajarish','Yukni qiya tekislik bo‘ylab tekis tortib, kuch va masofani o‘lchaymiz hamda bajarilgan ishlarni hisoblaymiz.'],['3-reja. FIK va xulosa','Foydali ishning to‘la ishga nisbatini aniqlab, ishqalanishning ta’sirini tahlil qilamiz.']];\nfunction showPlan(i){document.getElementById('planTitle').textContent=plans[i][0];document.getElementById('planText').textContent=plans[i][1]}\nconst equipment=[['📐','Qiya tekislik','Yuk harakatlanadigan qiya sirt. Uzunligi s va balandligi h o‘lchanadi.'],['🧱','Yuk / brusok','Massasi tarozi bilan aniqlanadi; birlik — kg.'],['🪝','Dinamometr','Yukni tortish kuchini o‘lchaydi; birlik — N.'],['📏','Chizg‘ich','Masofani va tekislik o‘lchamlarini aniqlash uchun.'],['⚖️','Tarozi','Yuk massasini kilogrammda aniqlaydi.'],['↕️','Balandlik o‘lchagich','Vertikal balandlik h ni o‘lchaydi; birlik — m.'],['🧮','Hisoblash vositasi','Ish va FIKni formulalar orqali hisoblash uchun.'],['📋','Natijalar jadvali','O‘lchov va hisob natijalarini yozib borish uchun.']];\nconst eq=document.getElementById('equipment');equipment.forEach((e,i)=>{let d=document.createElement('button');d.className='equip';d.innerHTML=`\u003cspan class=\"emoji\">${e[0]}\u003c/span>\u003cb>${e[1]}\u003c/b>\u003csmall>Ko‘rish uchun bosing\u003c/small>`;d.onclick=()=>{document.getElementById('equipTitle').textContent=e[1];document.getElementById('equipDesc').textContent=e[2]};eq.appendChild(d)});\nconst procedure=['Qiya tekislikni tayanchga o‘rnating.','Yukning massasini aniqlang.','Tekislik uzunligi va balandligini o‘lchang.','Yukni dinamometrga ulang.','Yukni tekis harakat bilan yuqoriga torting.','Dinamometr ko‘rsatgan kuchni qayd eting.','Bosib o‘tilgan masofani aniqlang.','To‘la va foydali ishni hisoblang.','FIKni foizlarda aniqlang.','Natijalar asosida xulosa chiqaring.'];\ndocument.getElementById('steps').innerHTML=procedure.map((s,i)=>`\u003clabel class=\"step\">\u003cinput type=\"checkbox\">\u003cspan>\u003cb>${i+1}.\u003c/b> ${s}\u003c/span>\u003c/label>`).join('');\nconst $=id=>document.getElementById(id), val=id=>Number($(id).value), fmt=(x,n=2)=>Number(x).toFixed(n);\nfunction getData(){let m=val('mass'),s=val('length'),h=val('height'),mu=val('friction');if(h>=s){h=Math.max(.1,s-.1);$('height').value=h;$('heightOut').textContent=fmt(h,1)+' m'}const sin=h/s,cos=Math.sqrt(Math.max(0,1-sin*sin)),F=m*9.8*(sin+mu*cos),At=F*s,Af=m*9.8*h,eta=At>0?Af/At*100:0;return {m,s,h,mu,F,At,Af,eta,sin,cos}}\nfunction updateScene(){const d=getData();$('massOut').textContent=fmt(d.m,1)+' kg';$('lengthOut').textContent=fmt(d.s,1)+' m';$('heightOut').textContent=fmt(d.h,1)+' m';$('frictionOut').textContent=fmt(d.mu,2);let x0=80,y0=300,x1=490,y1=300-d.h/d.s*190;let dx=x1-x0,dy=y1-y0,ang=Math.atan2(dy,dx)*180/Math.PI;let pos=Number($('scene').dataset.pos||.42),bx=x0+dx*pos,by=y0+dy*pos;\n$('scene').innerHTML=`\u003cdefs>\u003clinearGradient id=\"slope\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\u003cstop stop-color=\"#93c5fd\"/>\u003cstop offset=\"1\" stop-color=\"#2563eb\"/>\u003c/linearGradient>\u003clinearGradient id=\"load\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\u003cstop stop-color=\"#c4b5fd\"/>\u003cstop offset=\"1\" stop-color=\"#7c3aed\"/>\u003c/linearGradient>\u003c/defs>\n\u003cpath d=\"M45 300H545\" stroke=\"#64748b\" stroke-width=\"4\"/>\u003cpath d=\"M${x0} ${y0}L${x1} ${y1}L${x1} ${y0}Z\" fill=\"#dbeafe\" stroke=\"#93c5fd\" stroke-width=\"2\"/>\u003cpath d=\"M${x0} ${y0}L${x1} ${y1}\" stroke=\"url(#slope)\" stroke-width=\"15\" stroke-linecap=\"round\"/>\n\u003cpath d=\"M${x1+22} ${y0}V${y1}\" stroke=\"#059669\" stroke-width=\"2\" stroke-dasharray=\"5 5\"/>\u003ctext x=\"${x1+29}\" y=\"${(y0+y1)/2}\" font-size=\"15\" fill=\"#047857\" font-weight=\"700\">h=${fmt(d.h,1)} m\u003c/text>\n\u003cpath d=\"M${x0} ${y0+24}H${x1}\" stroke=\"#64748b\" stroke-width=\"2\"/>\u003cpath d=\"M${x0} ${y0+18}v12M${x1} ${y0+18}v12\" stroke=\"#64748b\" stroke-width=\"2\"/>\u003ctext x=\"${(x0+x1)/2-35}\" y=\"${y0+45}\" fill=\"#334155\" font-size=\"15\">s=${fmt(d.s,1)} m\u003c/text>\n\u003cg transform=\"translate(${bx} ${by-5}) rotate(${ang})\">\u003crect x=\"-27\" y=\"-34\" width=\"54\" height=\"34\" rx=\"6\" fill=\"url(#load)\" stroke=\"#5b21b6\" stroke-width=\"2\"/>\u003cpath d=\"M-16 -23h32M-16 -13h32\" stroke=\"#ede9fe\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\u003c/g>\n\u003cpath d=\"M${bx+12} ${by-48}l70 -27\" stroke=\"#dc2626\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cpath d=\"M${bx+82} ${by-75}l-13 -1 6 12\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"3\"/>\u003ctext x=\"${bx+82}\" y=\"${by-84}\" fill=\"#b91c1c\" font-weight=\"700\" font-size=\"15\">F=${fmt(d.F,2)} N\u003c/text>\n\u003cpath d=\"M${bx-15} ${by-4}l-48 18\" stroke=\"#059669\" stroke-width=\"3\"/>\u003cpath d=\"M${bx-63} ${by+14}l5 -12 7 9\" fill=\"none\" stroke=\"#059669\" stroke-width=\"3\"/>\u003ctext x=\"18\" y=\"32\" fill=\"#334155\" font-size=\"15\" font-weight=\"700\">m=${fmt(d.m,1)} kg\u003c/text>\u003ctext x=\"18\" y=\"53\" fill=\"#64748b\" font-size=\"13\">μ=${fmt(d.mu,2)}\u003c/text>\n\u003crect x=\"18\" y=\"66\" width=\"145\" height=\"44\" rx=\"9\" fill=\"#fff\" stroke=\"#cbd5e1\"/>\u003ctext x=\"29\" y=\"84\" fill=\"#64748b\" font-size=\"11\">DINAMOMETR\u003c/text>\u003ctext x=\"29\" y=\"101\" fill=\"#1d4ed8\" font-size=\"16\" font-weight=\"800\">${fmt(d.F,2)} N\u003c/text>`;\n$('forceRead').textContent=fmt(d.F,2)+' N';$('totalRead').textContent=fmt(d.At,2)+' J';$('usefulRead').textContent=fmt(d.Af,2)+' J';$('effRead').textContent=fmt(d.eta,1)+'%';$('effBar').style.width=Math.max(0,Math.min(100,d.eta))+'%';$('analysisEff').textContent=fmt(d.eta,1)+'%';$('analysisText').textContent=`μ = ${fmt(d.mu,2)} bo‘lganda tortish kuchi ${fmt(d.F,2)} N, to‘la ish ${fmt(d.At,2)} J. Ishqalanish oshishi bilan, boshqa shartlar o‘zgarmasa, FIK kamayadi.`;updateCalc()}\n['mass','length','height','friction'].forEach(id=>$(id).addEventListener('input',()=>{measured=false;updateScene()}));\nfunction updateCalc(){if(!$('calcTotal'))return;const d=getData();$('calcTotal').innerHTML=`A\u003csub>to‘la\u003c/sub> = F · s = ${fmt(d.F,2)} · ${fmt(d.s,2)} = ${fmt(d.At,2)} J`;$('calcTotalSteps').textContent='Tortish kuchi qiya tekislik bo‘ylab bosib o‘tilgan masofaga ko‘paytiriladi.';$('calcUseful').innerHTML=`A\u003csub>foydali\u003c/sub> = m · g · h = ${fmt(d.m,2)} · 9,8 · ${fmt(d.h,2)} = ${fmt(d.Af,2)} J`;$('calcUsefulSteps').textContent='Yukning potensial energiyasi ortishi hisoblanadi.';$('calcEff').innerHTML=`η = (${fmt(d.Af,2)} / ${fmt(d.At,2)}) · 100% = ${fmt(d.eta,1)}%`;$('calcEffSteps').textContent='Foydali ish to‘la ishga bo‘linadi va 100% ga ko‘paytiriladi.';$('calcInterpret').textContent=d.mu===0?'Ideal, ishqalanishsiz model: FIK 100% ga teng (yaxlitlash farqi bo‘lishi mumkin).':`Ishqalanish mavjud: energiyaning bir qismi issiqlikka sarflanadi. Hisoblangan FIK ${fmt(d.eta,1)}%.`}\nfunction pullLoad(){if(moving)return;moving=true;$('labStatus').textContent='Yuk qiya tekislik bo‘ylab tortilmoqda…';let start=performance.now(),duration=1300;function frame(t){let p=Math.min(1,(t-start)/duration);$('scene').dataset.pos=.12+.76*p;updateScene();if(p\u003c1)requestAnimationFrame(frame);else{moving=false;measured=true;$('labStatus').textContent='Yuk yuqoriga yetkazildi. Endi kuch va masofani o‘lchashingiz mumkin.'}}requestAnimationFrame(frame)}\nfunction measure(){const d=getData();measured=true;$('labStatus').textContent=`O‘lchovlar: F = ${fmt(d.F,2)} N, s = ${fmt(d.s,2)} m, h = ${fmt(d.h,2)} m. Natijani jadvalga kiritishingiz mumkin.`}\nfunction addTrial(){if(!measured){$('labStatus').textContent='Avval “Yukni tortish” yoki “O‘lchash” tugmasini bosing.';return}let d=getData();trials.push(d);renderTrials();$('labStatus').textContent='Natija jadvalga qo‘shildi.';$('saveStatus').textContent='Oxirgi natija jadvalga qo‘shildi.'}\nfunction renderTrials(){const body=$('resultsBody');if(!trials.length)body.innerHTML='\u003ctr>\u003ctd colspan=\"8\" class=\"muted\">Hozircha natijalar yo‘q.\u003c/td>\u003c/tr>';else body.innerHTML=trials.map((d,i)=>`\u003ctr>\u003ctd>${i+1}\u003c/td>\u003ctd>${fmt(d.m,2)}\u003c/td>\u003ctd>${fmt(d.F,2)}\u003c/td>\u003ctd>${fmt(d.s,2)}\u003c/td>\u003ctd>${fmt(d.h,2)}\u003c/td>\u003ctd>${fmt(d.At,2)}\u003c/td>\u003ctd>${fmt(d.Af,2)}\u003c/td>\u003ctd>${fmt(d.eta,1)}\u003c/td>\u003c/tr>`).join('');$('trialCount').textContent=trials.length;$('avgEff').textContent=trials.length?fmt(trials.reduce((a,b)=>a+b.eta,0)/trials.length,1)+'%':'— %'}\nfunction clearTrials(){trials=[];renderTrials();$('saveStatus').textContent='Jadval tozalandi.'}\nfunction downloadCSV(){if(!trials.length){$('saveStatus').textContent='Avval kamida bitta tajriba natijasini jadvalga kiriting.';return}let rows=[['№','m (kg)','F (N)','s (m)','h (m)','A tola (J)','A foydali (J)','FIK (%)'],...trials.map((d,i)=>[i+1,d.m,d.F,d.s,d.h,d.At,d.Af,d.eta])];let csv='\\uFEFF'+rows.map(r=>r.join(';')).join('\\r\\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='qiya_tekislik_FIK_natijalari.csv';a.click();URL.revokeObjectURL(url);$('saveStatus').textContent='CSV fayli tayyorlandi.'}\nfunction checkConclusion(){let a=[$('answer1').value,$('answer2').value,$('answer3').value],count=a.filter(x=>x.trim().length>12).length;$('conclusionFeedback').innerHTML=count===3?'\u003cdiv class=\"success\">Barcha savollarga javob yozildi. Javoblaringizni tajriba natijalari va formulalar bilan solishtirib tekshiring.\u003c/div>':`\u003cdiv class=\"notice\">${count}/3 javob to‘ldirilgan. Har bir savolga batafsil javob yozing.\u003c/div>`}\nfunction fillConclusion(){$('answer1').value='Qiya tekislik yukni kamroq kuch bilan balandlikka ko‘tarishga yordam beradi, lekin bosib o‘tiladigan masofa ortadi.';$('answer2').value='To‘la ish A = F·s, foydali ish esa A = mgh formulalari bilan hisoblanadi.';$('answer3').value='Ishqalanish ortsa, ko‘proq ish energiyaning issiqlikka aylanishiga sarflanadi. Shu sababli FIK kamayadi.';checkConclusion()}\nconst questions=[\n{q:'Qiya tekislik bo‘ylab bajarilgan to‘la ish qanday hisoblanadi?',a:['A = F / s','A = F · s','A = m / h','A = F + m'],correct:1,why:'Doimiy yoki o‘rtacha kuch uchun ish kuch va masofa ko‘paytmasiga teng.'},\n{q:'Foydali ish qaysi formula orqali topiladi?',a:['A = mgh','A = F / s','A = mg / s','A = Fh / s'],correct:0,why:'Yuk h balandlikka ko‘tarilganda potensial energiyasi mgh ga ortadi.'},\n{q:'FIK qanday aniqlanadi?',a:['To‘la ishning foydali ishga nisbati','Foydali ishning to‘la ishga nisbati × 100%','Kuchning masofaga nisbati','Massaning balandlikka nisbati'],correct:1,why:'FIK foydali ishning to‘la ishga nisbatini foizlarda ifodalaydi.'},\n{q:'Ishqalanish kuchi ortsa, boshqa shartlar bir xil bo‘lganda FIK odatda qanday o‘zgaradi?',a:['Ortadi','Kamayadi','O‘zgarmaydi','Har doim 100% bo‘ladi'],correct:1,why:'Ishqalanish sabab to‘la ish ortadi, foydali ish esa o‘zgarmasa FIK kamayadi.'},\n{q:'Haqiqiy qiya tekislikning FIKi nima sababdan 100% dan kichik bo‘ladi?',a:['Massa yo‘qoladi','Masofa nol bo‘ladi','Energiya bir qismi ishqalanish va boshqa yo‘qotishlarga sarflanadi','Balandlik doim o‘zgaradi'],correct:2,why:'Haqiqiy mexanizmlarda energiyaning bir qismi foydali ishga aylanmaydi.'}\n];\nfunction renderQuiz(){$('quiz').innerHTML=questions.map((q,i)=>`\u003cdiv class=\"question\" id=\"q${i}\">\u003cb>${i+1}. ${q.q}\u003c/b>${q.a.map((a,j)=>`\u003clabel>\u003cinput type=\"radio\" name=\"quiz${i}\" value=\"${j}\"> ${String.fromCharCode(65+j)}) ${a}\u003c/label>`).join('')}\u003cdiv class=\"feedback\" id=\"fb${i}\">\u003c/div>\u003c/div>`).join('')}\nfunction checkQuiz(){let score=0;questions.forEach((q,i)=>{let selected=document.querySelector(`input[name=\"quiz${i}\"]:checked`),fb=$('fb'+i);if(selected&&Number(selected.value)===q.correct){score++;fb.style.color='#047857';fb.textContent='To‘g‘ri! '+q.why}else{fb.style.color='#b91c1c';fb.textContent='To‘g‘ri javob: '+String.fromCharCode(65+q.correct)+'. '+q.why}});$('quizResult').innerHTML=`\u003cdiv class=\"${score>=4?'success':'notice'}\">\u003cb>Natija: ${score}/5 (${score*20}%)\u003c/b>\u003cbr>${score===5?'A’lo! Mavzuni juda yaxshi o‘zlashtirdingiz.':score>=3?'Yaxshi. Xato javoblarni ko‘rib chiqing.':'Formulalarni qayta o‘rganib, testni yana bajaring.'}\u003c/div>`}\nfunction resetQuiz(){$$('input[type=radio]').forEach(x=>x.checked=false);questions.forEach((q,i)=>$('fb'+i).textContent='');$('quizResult').innerHTML=''}\nfunction $$(sel){return [...document.querySelectorAll(sel)]}\nrenderQuiz();updateScene();go(0);\n\u003c/script>\n\u003c/body>\n\u003c/html>", "12-mavzu": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>12-mavzu — Massa markazi, muvozanat va kuch momenti\u003c/title>\n\u003cstyle>\n:root{--navy:#18234b;--blue:#4263eb;--purple:#7654d6;--cyan:#13b8c9;--bg:#f4f6ff;--ink:#202747;--muted:#66708e;--card:#fff;--line:#e1e6f5;--green:#15966b;--orange:#ef8c35}\n*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,\"Segoe UI\",sans-serif;background:linear-gradient(135deg,#f5f7ff,#eef1ff);color:var(--ink);line-height:1.55}\nheader{background:linear-gradient(120deg,#17234d,#4737a2 65%,#7654d6);color:white;padding:26px 18px 22px}\n.wrap{max-width:1150px;margin:auto}header h1{margin:5px 0 8px;font-size:clamp(1.55rem,4vw,2.6rem);line-height:1.15}header p{margin:0;color:#e3e7ff;max-width:780px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.76rem;font-weight:800;color:#b9c7ff}\nnav{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}button,.navbtn{border:0;border-radius:12px;padding:10px 14px;background:#e9edff;color:#29345e;font-weight:750;cursor:pointer;transition:.18s}button:hover,.navbtn:hover{transform:translateY(-1px);filter:brightness(.98)}button.primary{background:var(--blue);color:white}button.dark{background:var(--navy);color:white}button.ghost{background:#fff;border:1px solid var(--line)}button:focus-visible,input:focus-visible{outline:3px solid #8cb4ff;outline-offset:2px}\nmain{max-width:1150px;margin:22px auto;padding:0 16px 42px}.tabs{display:flex;gap:8px;overflow:auto;padding:3px 0 15px}.tabs button{white-space:nowrap}.tabs button.active{background:var(--navy);color:white}\n.section{display:none}.section.active{display:block;animation:fade .25s ease}@keyframes fade{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:none}}\n.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 25px #263b7710;min-width:0}.card h2,.card h3{margin:0 0 10px;line-height:1.25}.card h2{font-size:1.25rem}.card h3{font-size:1.05rem}.muted{color:var(--muted)}.formula{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#f0f3ff;border:1px solid #dfe5ff;border-radius:10px;padding:10px 12px;display:inline-block;margin:5px 0;font-size:1.02rem;overflow-wrap:anywhere}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.control{background:#f8f9ff;border:1px solid #e8ebfa;border-radius:12px;padding:10px}.control label{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;font-weight:700}.control output{color:var(--blue);font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:var(--blue);margin:10px 0 2px}canvas{display:block;width:100%;height:250px;border-radius:14px;background:linear-gradient(#fbfcff,#f0f4ff);border:1px solid var(--line);touch-action:pan-y}.canvas-tall{height:310px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.stat{padding:11px;border-radius:12px;background:#f6f7ff;border:1px solid var(--line);flex:1;min-width:120px}.stat strong{display:block;font-size:1.12rem;color:var(--blue)}.note{border-left:4px solid var(--cyan);padding:10px 13px;background:#effcff;border-radius:0 10px 10px 0;margin:10px 0}.warning{border-left-color:var(--orange);background:#fff8ef}.good{color:var(--green);font-weight:800}.bad{color:#c23d50;font-weight:800}.small{font-size:.88rem}.list{padding-left:20px}.list li{margin:6px 0}.pill{display:inline-block;border-radius:999px;padding:4px 9px;background:#eeeaff;color:#5944a5;font-size:.78rem;font-weight:800}.separator{height:1px;background:var(--line);margin:15px 0}.result{min-height:28px;margin-top:10px;font-weight:700}.quiz-option{display:block;width:100%;text-align:left;margin:7px 0;background:#f7f8ff;border:1px solid var(--line);font-weight:600}.quiz-option.selected{border-color:var(--blue);background:#edf1ff}.quiz-option.correct{border-color:#15966b;background:#eafaf3}.quiz-option.wrong{border-color:#d84c60;background:#fff0f2}.progress{height:8px;background:#e6e9f7;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));width:0%}\nfooter{text-align:center;color:var(--muted);padding:12px 16px 28px}.symbol{font-size:1.5rem;margin-right:5px}\n@media(max-width:760px){.grid,.grid3{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.card{padding:14px}canvas{height:220px}.canvas-tall{height:260px}header{padding-top:20px}}\n@media(max-width:400px){.controls{grid-template-columns:1fr}.tabs button{padding:9px 11px;font-size:.85rem}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\u003cdiv class=\"wrap\">\n\u003cdiv class=\"eyebrow\">Virtual fizika laboratoriyasi · 8–10-sinflar\u003c/div>\n\u003ch1>12-mavzu. Massa markazi, muvozanat turlari va kuch momenti\u003c/h1>\n\u003cp>Parametrlarni o‘zgartiring, tajribalarni bajaring va fizik qonuniyatlarni kuzating.\u003c/p>\n\u003cnav>\u003cbutton class=\"primary\" onclick=\"go('home')\">⌂ Bosh sahifa\u003c/button>\u003cbutton onclick=\"go('mass')\">1. Massa markazi\u003c/button>\u003cbutton onclick=\"go('balance')\">2. Muvozanat\u003c/button>\u003cbutton onclick=\"go('moment')\">3. Kuch momenti\u003c/button>\u003cbutton onclick=\"go('quiz')\">Test va masalalar\u003c/button>\u003c/nav>\n\u003c/div>\u003c/header>\n\u003cmain>\n\u003cdiv class=\"tabs\" id=\"tabs\">\n\u003cbutton class=\"active\" data-page=\"home\" onclick=\"go('home')\">Kirish\u003c/button>\n\u003cbutton data-page=\"mass\" onclick=\"go('mass')\">Massa markazi\u003c/button>\n\u003cbutton data-page=\"balance\" onclick=\"go('balance')\">Muvozanat\u003c/button>\n\u003cbutton data-page=\"moment\" onclick=\"go('moment')\">Kuch momenti\u003c/button>\n\u003cbutton data-page=\"quiz\" onclick=\"go('quiz')\">Mustahkamlash\u003c/button>\n\u003c/div>\n\u003csection class=\"section active\" id=\"home\">\n\u003cdiv class=\"grid\">\n\u003cdiv class=\"card\">\u003cspan class=\"pill\">DARS REJASI\u003c/span>\u003ch2>Bugungi mavzu\u003c/h2>\n\u003col class=\"list\">\u003cli>Jismning massa markazi va uni aniqlash usullari.\u003c/li>\u003cli>Barqaror, beqaror va farqsiz muvozanat.\u003c/li>\u003cli>Kuch momenti, momentlar qoidasi va oddiy mexanizmlar.\u003c/li>\u003c/ol>\n\u003cdiv class=\"note\">Maslahat: har bir simulyatsiyada slayderlarni siljiting va natija qanday o‘zgarishini oldindan taxmin qiling.\u003c/div>\n\u003cbutton class=\"primary\" onclick=\"go('mass')\">Darsni boshlash →\u003c/button>\u003c/div>\n\u003cdiv class=\"card\">\u003ch2>Asosiy formulalar\u003c/h2>\n\u003cdiv class=\"formula\">x\u003csub>cm\u003c/sub> = Σ(mᵢxᵢ) / Σmᵢ\u003c/div>\u003cbr>\n\u003cdiv class=\"formula\">ΣF⃗ = 0 &nbsp; va &nbsp; ΣM = 0\u003c/div>\u003cbr>\n\u003cdiv class=\"formula\">M = F · l\u003c/div>\u003cbr>\n\u003cdiv class=\"formula\">F₁l₁ = F₂l₂\u003c/div>\n\u003cp class=\"muted small\">Bu yerda \u003cb>l\u003c/b> — kuch yelkasi, ya’ni aylanish o‘qidan kuchning ta’sir chizig‘igacha bo‘lgan perpendikulyar masofa.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"grid3\" style=\"margin-top:16px\">\n\u003cdiv class=\"card\">\u003ch3>\u003cspan class=\"symbol\">🎯\u003c/span>Maqsad\u003c/h3>\u003cp class=\"muted\">Massa markazini topish, muvozanatni farqlash va kuch momentini hisoblash.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>\u003cspan class=\"symbol\">🧪\u003c/span>Tajriba\u003c/h3>\u003cp class=\"muted\">Jismlar massasi, joylashuvi, kuch va yelkani o‘zgartirib ko‘ring.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>\u003cspan class=\"symbol\">✓\u003c/span>Natija\u003c/h3>\u003cp class=\"muted\">Testlar va masalalar yordamida tushunchalarni tekshiring.\u003c/p>\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" id=\"mass\">\n\u003cdiv class=\"grid\">\n\u003cdiv class=\"card\">\u003ch2>1. Massa markazi nima?\u003c/h2>\n\u003cp>\u003cb>Massa markazi\u003c/b> — jism yoki jismlar sistemasining massasini hisoblashda uning taqsimlanishini ifodalovchi nuqta. Bir jinsli, simmetrik tayoqning massa markazi o‘rtasida bo‘ladi. Massa markazi ba’zan jism materiali joylashmagan nuqtada ham bo‘lishi mumkin, masalan, halqaning markazida.\u003c/p>\n\u003cp>Yer sirtiga yaqin, gravitatsiya maydoni bir xil deb qaralganda, og‘irlik markazi massa markazi bilan mos tushadi.\u003c/p>\n\u003cdiv class=\"formula\">x\u003csub>cm\u003c/sub> = (m₁x₁ + m₂x₂)/(m₁ + m₂)\u003c/div>\n\u003cp class=\"small muted\">m — massa (kg), x — koordinata (m). Ikki o‘lchamda y koordinatasi ham xuddi shu usulda hisoblanadi.\u003c/p>\n\u003cdiv class=\"note\">\u003cb>Simmetriya:\u003c/b> bir jinsli doira va halqaning massa markazi geometrik markazda bo‘ladi. Halqada bu nuqta materialning tashqarisida joylashgan.\u003c/div>\n\u003c/div>\n\u003cdiv class=\"card\">\u003ch2>Simulyatsiya 1 · Ikki jism\u003c/h2>\u003ccanvas id=\"massCanvas\" aria-label=\"Ikki jism va massa markazi tasviri\">\u003c/canvas>\n\u003cdiv class=\"controls\">\n\u003cdiv class=\"control\">\u003clabel>1-jism massasi \u003coutput id=\"m1v\">3 kg\u003c/output>\u003c/label>\u003cinput id=\"m1\" type=\"range\" min=\"1\" max=\"10\" value=\"3\">\u003c/div>\n\u003cdiv class=\"control\">\u003clabel>2-jism massasi \u003coutput id=\"m2v\">7 kg\u003c/output>\u003c/label>\u003cinput id=\"m2\" type=\"range\" min=\"1\" max=\"10\" value=\"7\">\u003c/div>\n\u003cdiv class=\"control\">\u003clabel>1-jism koordinatasi \u003coutput id=\"x1v\">−3 m\u003c/output>\u003c/label>\u003cinput id=\"x1\" type=\"range\" min=\"-5\" max=\"5\" value=\"-3\">\u003c/div>\n\u003cdiv class=\"control\">\u003clabel>2-jism koordinatasi \u003coutput id=\"x2v\">4 m\u003c/output>\u003c/label>\u003cinput id=\"x2\" type=\"range\" min=\"-5\" max=\"5\" value=\"4\">\u003c/div>\n\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-top:10px\">\u003cbutton class=\"ghost\" onclick=\"equalMass()\">Massalarni tenglashtirish\u003c/button>\u003cbutton class=\"ghost\" onclick=\"resetMass()\">Boshlang‘ich holat\u003c/button>\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-top:10px\">\u003cdiv class=\"stat\">Massa markazi\u003cstrong id=\"cmOut\">1.9 m\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">Jami massa\u003cstrong id=\"sumM\">10 kg\u003c/strong>\u003c/div>\u003c/div>\n\u003cdiv class=\"formula\" id=\"cmFormula\">xcm = ...\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdiv class=\"grid\" style=\"margin-top:16px\">\n\u003cdiv class=\"card\">\u003ch2>Simulyatsiya 2 · Osib aniqlash\u003c/h2>\n\u003cp>Notekis plastinkani turli nuqtalardan osib, shovun yo‘nalishlarini belgilang. Ikki vertikal chiziq kesishgan nuqta massa markazini ko‘rsatadi.\u003c/p>\n\u003ccanvas id=\"hangCanvas\" class=\"canvas-tall\" aria-label=\"Osilgan plastinka va shovun chiziqlari\">\u003c/canvas>\n\u003cdiv class=\"row\">\u003cbutton onclick=\"hang(1)\">1-nuqtadan osish\u003c/button>\u003cbutton onclick=\"hang(2)\">2-nuqtadan osish\u003c/button>\u003cbutton class=\"primary\" onclick=\"findHang()\">Massa markazini topish\u003c/button>\u003cbutton class=\"ghost\" onclick=\"resetHang()\">Qayta boshlash\u003c/button>\u003c/div>\n\u003cdiv class=\"result\" id=\"hangResult\">Tajriba boshlash uchun osish nuqtasini tanlang.\u003c/div>\n\u003c/div>\n\u003cdiv class=\"card\">\u003ch2>Massa markazi qayerda?\u003c/h2>\n\u003cdiv class=\"grid3\">\n\u003cdiv>\u003csvg viewBox=\"0 0 100 75\" width=\"100%\">\u003crect x=\"8\" y=\"30\" width=\"84\" height=\"14\" rx=\"5\" fill=\"#91a9ff\"/>\u003ccircle cx=\"50\" cy=\"37\" r=\"5\" fill=\"#f04d79\"/>\u003cpath d=\"M50 10V27\" stroke=\"#7654d6\" stroke-width=\"2\"/>\u003cpath d=\"M45 22L50 28L55 22\" fill=\"none\" stroke=\"#7654d6\" stroke-width=\"2\"/>\u003c/svg>\u003cb>Tayoq\u003c/b>\u003cp class=\"muted small\">Bir jinsli tayoqning o‘rtasi.\u003c/p>\u003c/div>\n\u003cdiv>\u003csvg viewBox=\"0 0 100 75\" width=\"100%\">\u003ccircle cx=\"50\" cy=\"37\" r=\"25\" fill=\"none\" stroke=\"#91a9ff\" stroke-width=\"12\"/>\u003ccircle cx=\"50\" cy=\"37\" r=\"4\" fill=\"#f04d79\"/>\u003cpath d=\"M50 7V27M20 37H42\" stroke=\"#7654d6\" stroke-dasharray=\"3 3\"/>\u003c/svg>\u003cb>Halqa\u003c/b>\u003cp class=\"muted small\">Markaz bo‘shliqda bo‘lishi mumkin.\u003c/p>\u003c/div>\n\u003cdiv>\u003csvg viewBox=\"0 0 100 75\">\u003ccircle cx=\"50\" cy=\"37\" r=\"25\" fill=\"#91a9ff\"/>\u003ccircle cx=\"50\" cy=\"37\" r=\"4\" fill=\"#f04d79\"/>\u003cpath d=\"M50 5V27M20 37H42\" stroke=\"#7654d6\" stroke-dasharray=\"3 3\"/>\u003c/svg>\u003cb>Doira\u003c/b>\u003cp class=\"muted small\">Bir jinsli doiraning markazi.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"note\">Osib aniqlash usulida jism tinch turganda massa markazi shovun chizig‘i bo‘ylab, osish nuqtasining tagida yotadi.\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" id=\"balance\">\n\u003cdiv class=\"card\">\u003ch2>2. Muvozanat turlari\u003c/h2>\u003cp>Jism tinch turishi uchun natijaviy kuch nol bo‘lishi, aylanma muvozanatda esa natijaviy kuch momenti ham nol bo‘lishi kerak.\u003c/p>\u003cdiv class=\"formula\">ΣF⃗ = 0 &nbsp;&nbsp; ΣM = 0\u003c/div>\n\u003cdiv class=\"grid3\" style=\"margin-top:12px\">\n\u003cdiv class=\"card\">\u003cspan class=\"pill\">BARQAROR\u003c/span>\u003ch3>Botiq sirt\u003c/h3>\u003cp class=\"small\">Ozroq siljitib qo‘yib yuborilganda jism muvozanat holatiga qaytishga intiladi. Potensial energiya shu holatda minimum.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cspan class=\"pill\">BEQAROR\u003c/span>\u003ch3>Qavariq sirt\u003c/h3>\u003cp class=\"small\">Ozroq siljitilganda jism muvozanat holatidan uzoqlashadi. Tepada potensial energiya maksimum bo‘ladi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cspan class=\"pill\">FARQSIZ\u003c/span>\u003ch3>Gorizontal sirt\u003c/h3>\u003cp class=\"small\">Ideal gorizontal sirt bo‘ylab siljitilganda balandlik va potensial energiya o‘zgarmaydi; yangi holatda qoladi.\u003c/p>\u003c/div>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"card\" style=\"margin-top:16px\">\u003ch2>Simulyatsiya 3 · Sharni siljiting\u003c/h2>\n\u003cp class=\"muted small\">Har bir tajribada “Siljitish” tugmasini bosing, so‘ng “Qo‘yib yuborish”ni tanlang. Bu soddalashtirilgan modelda ishqalanish va so‘nish sifat jihatdan ko‘rsatiladi.\u003c/p>\n\u003cdiv class=\"grid3\">\n\u003cdiv class=\"card\">\u003ch3>Barqaror muvozanat\u003c/h3>\u003ccanvas id=\"stableCanvas\" aria-label=\"Botiq sirt ichidagi shar\">\u003c/canvas>\u003cdiv class=\"row\">\u003cbutton onclick=\"shiftBall('stable',-1)\">← Siljitish\u003c/button>\u003cbutton onclick=\"shiftBall('stable',1)\">Siljitish →\u003c/button>\u003cbutton class=\"primary\" onclick=\"releaseBall('stable')\">Qo‘yib yuborish\u003c/button>\u003c/div>\u003cdiv class=\"result\" id=\"stableText\">Shar muvozanat holatida.\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Beqaror muvozanat\u003c/h3>\u003ccanvas id=\"unstableCanvas\" aria-label=\"Qavariq sirt ustidagi shar\">\u003c/canvas>\u003cdiv class=\"row\">\u003cbutton onclick=\"shiftBall('unstable',-1)\">← Siljitish\u003c/button>\u003cbutton onclick=\"shiftBall('unstable',1)\">Siljitish →\u003c/button>\u003cbutton class=\"primary\" onclick=\"releaseBall('unstable')\">Qo‘yib yuborish\u003c/button>\u003c/div>\u003cdiv class=\"result\" id=\"unstableText\">Shar qavariq sirt tepasida.\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Farqsiz muvozanat\u003c/h3>\u003ccanvas id=\"neutralCanvas\" aria-label=\"Gorizontal sirt ustidagi shar\">\u003c/canvas>\u003cdiv class=\"row\">\u003cbutton onclick=\"shiftBall('neutral',-1)\">← Siljitish\u003c/button>\u003cbutton onclick=\"shiftBall('neutral',1)\">Siljitish →\u003c/button>\u003cbutton class=\"primary\" onclick=\"releaseBall('neutral')\">Qo‘yib yuborish\u003c/button>\u003c/div>\u003cdiv class=\"result\" id=\"neutralText\">Shar yangi joyida qoladi.\u003c/div>\u003c/div>\n\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" id=\"moment\">\n\u003cdiv class=\"grid\">\n\u003cdiv class=\"card\">\u003ch2>3. Kuch momenti\u003c/h2>\n\u003cp>Kuch momenti jismni aylantirish ta’sirini ifodalaydi. Kuch kattaroq yoki yelka uzunroq bo‘lsa, aylantiruvchi ta’sir ortadi.\u003c/p>\n\u003cdiv class=\"formula\">M = F · l\u003c/div>\n\u003cul class=\"list\">\u003cli>\u003cb>M\u003c/b> — kuch momenti (N·m).\u003c/li>\u003cli>\u003cb>F\u003c/b> — kuch (N).\u003c/li>\u003cli>\u003cb>l\u003c/b> — kuch yelkasi (m), perpendikulyar masofa.\u003c/li>\u003c/ul>\n\u003cdiv class=\"formula\">F₁l₁ = F₂l₂\u003c/div>\n\u003cp>Ideal richag muvozanatida qarama-qarshi momentlar kattalik jihatdan teng bo‘ladi. Masalan, qisqa yelkadagi katta kuchni uzun yelkadagi kichik kuch muvozanatlashi mumkin.\u003c/p>\n\u003cdiv class=\"note\">Richagning aylanish yo‘nalishini faqat yuk massasi emas, balki massa (yoki kuch) va yelka ko‘paytmasi belgilaydi.\u003c/div>\n\u003c/div>\n\u003cdiv class=\"card\">\u003ch2>Simulyatsiya 4 · Interaktiv richag\u003c/h2>\u003ccanvas id=\"leverCanvas\" class=\"canvas-tall\" aria-label=\"Yuklari o‘zgaradigan richag\">\u003c/canvas>\n\u003cdiv class=\"controls\">\n\u003cdiv class=\"control\">\u003clabel>Chap massa \u003coutput id=\"lm1v\">8 kg\u003c/output>\u003c/label>\u003cinput id=\"lm1\" type=\"range\" min=\"1\" max=\"20\" value=\"8\">\u003c/div>\n\u003cdiv class=\"control\">\u003clabel>O‘ng massa \u003coutput id=\"lm2v\">4 kg\u003c/output>\u003c/label>\u003cinput id=\"lm2\" type=\"range\" min=\"1\" max=\"20\" value=\"4\">\u003c/div>\n\u003cdiv class=\"control\">\u003clabel>Chap yelka \u003coutput id=\"ll1v\">1.0 m\u003c/output>\u003c/label>\u003cinput id=\"ll1\" type=\"range\" min=\"0.2\" max=\"2\" step=\"0.1\" value=\"1\">\u003c/div>\n\u003cdiv class=\"control\">\u003clabel>O‘ng yelka \u003coutput id=\"ll2v\">2.0 m\u003c/output>\u003c/label>\u003cinput id=\"ll2\" type=\"range\" min=\"0.2\" max=\"2\" step=\"0.1\" value=\"2\">\u003c/div>\n\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-top:10px\">\u003cbutton class=\"primary\" onclick=\"balanceLever()\">Muvozanatni topish\u003c/button>\u003cbutton class=\"ghost\" onclick=\"resetLever()\">Qayta boshlash\u003c/button>\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-top:10px\">\u003cdiv class=\"stat\">Chap moment\u003cstrong id=\"mom1\">78.48 N·m\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">O‘ng moment\u003cstrong id=\"mom2\">78.48 N·m\u003c/strong>\u003c/div>\u003c/div>\n\u003cdiv class=\"result\" id=\"leverResult\">Momentlar teng: richag muvozanatda.\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdiv class=\"grid\" style=\"margin-top:16px\">\n\u003cdiv class=\"card\">\u003ch2>Simulyatsiya 5 · Kuch va yelka\u003c/h2>\u003ccanvas id=\"wrenchCanvas\" aria-label=\"Gayka kaliti kuch momenti\">\u003c/canvas>\n\u003cdiv class=\"controls\">\n\u003cdiv class=\"control\">\u003clabel>Kuch \u003coutput id=\"forceV\">30 N\u003c/output>\u003c/label>\u003cinput id=\"force\" type=\"range\" min=\"5\" max=\"100\" value=\"30\">\u003c/div>\n\u003cdiv class=\"control\">\u003clabel>Kuch yelkasi \u003coutput id=\"armV\">0.30 m\u003c/output>\u003c/label>\u003cinput id=\"arm\" type=\"range\" min=\"0.05\" max=\"1\" step=\"0.05\" value=\"0.3\">\u003c/div>\n\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-top:8px\">\u003cdiv class=\"stat\">Kuch momenti\u003cstrong id=\"wrenchM\">9 N·m\u003c/strong>\u003c/div>\u003cbutton onclick=\"doubleForce()\">Kuchni 2 baravar\u003c/button>\u003cbutton onclick=\"doubleArm()\">Yelkani 2 baravar\u003c/button>\u003c/div>\n\u003cp class=\"muted small\">Yelka yoki kuch ikki baravar oshsa, boshqa kattalik o‘zgarmaganda moment ham ikki baravar oshadi.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"card\">\u003ch2>Simulyatsiya 6 · Hayotdagi mexanizmlar\u003c/h2>\n\u003cdiv class=\"grid3\">\n\u003cbutton class=\"ghost\" onclick=\"mechanism('seesaw')\">⚖️ Arg‘imchoq\u003c/button>\n\u003cbutton class=\"ghost\" onclick=\"mechanism('door')\">🚪 Eshik\u003c/button>\n\u003cbutton class=\"ghost\" onclick=\"mechanism('wrench')\">🔧 Kalit\u003c/button>\n\u003cbutton class=\"ghost\" onclick=\"mechanism('scale')\">⚖️ Tarozi\u003c/button>\n\u003cbutton class=\"ghost\" onclick=\"mechanism('scissors')\">✂️ Qaychi\u003c/button>\n\u003cbutton class=\"ghost\" onclick=\"mechanism('pliers')\">🗜️ Ombur\u003c/button>\n\u003c/div>\n\u003cdiv class=\"separator\">\u003c/div>\u003ch3 id=\"mechTitle\">Arg‘imchoq\u003c/h3>\u003cp id=\"mechText\">Tayanchdan uzoqroq o‘tirgan yengilroq kishi, yaqinroq o‘tirgan og‘irroq kishini muvozanatlashi mumkin.\u003c/p>\u003cdiv class=\"formula\" id=\"mechFormula\">m₁gl₁ = m₂gl₂\u003c/div>\n\u003ccanvas id=\"mechCanvas\" aria-label=\"Tanlangan oddiy mexanizm\">\u003c/canvas>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" id=\"quiz\">\n\u003cdiv class=\"grid\">\n\u003cdiv class=\"card\">\u003ch2>Bilimni tekshirish · 10 test\u003c/h2>\u003cdiv class=\"progress\">\u003cspan id=\"quizProgress\">\u003c/span>\u003c/div>\u003cp id=\"quizCount\" class=\"muted small\">1 / 10-savol\u003c/p>\u003ch3 id=\"question\">\u003c/h3>\u003cdiv id=\"options\">\u003c/div>\u003cdiv class=\"result\" id=\"feedback\">\u003c/div>\u003cdiv class=\"row\">\u003cbutton class=\"primary\" id=\"nextQ\" onclick=\"nextQuestion()\" disabled>Keyingi savol →\u003c/button>\u003cbutton class=\"ghost\" onclick=\"restartQuiz()\">Qayta boshlash\u003c/button>\u003c/div>\u003cdiv id=\"scoreBox\" class=\"note\" style=\"display:none\">\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch2>Fizik masalalar\u003c/h2>\n\u003cdetails open>\u003csummary>\u003cb>1-masala. Massa markazi\u003c/b>\u003c/summary>\u003cp>2 kg jism x = 0 m da, 6 kg jism x = 4 m da. Massa markazini toping.\u003c/p>\u003cbutton onclick=\"showSolution(1)\">Yechimni ko‘rsatish\u003c/button>\u003cp id=\"sol1\" class=\"result\">\u003c/p>\u003c/details>\u003cdiv class=\"separator\">\u003c/div>\n\u003cdetails>\u003csummary>\u003cb>2-masala. Kuch momenti\u003c/b>\u003c/summary>\u003cp>40 N kuch 0,25 m yelkaga perpendikulyar ta’sir qiladi. Momentni toping.\u003c/p>\u003cbutton onclick=\"showSolution(2)\">Yechimni ko‘rsatish\u003c/button>\u003cp id=\"sol2\" class=\"result\">\u003c/p>\u003c/details>\u003cdiv class=\"separator\">\u003c/div>\n\u003cdetails>\u003csummary>\u003cb>3-masala. Richag\u003c/b>\u003c/summary>\u003cp>20 N kuch 0,8 m yelkada. Ikkinchi kuch 0,4 m yelkada muvozanat hosil qilishi uchun qancha bo‘lishi kerak?\u003c/p>\u003cbutton onclick=\"showSolution(3)\">Yechimni ko‘rsatish\u003c/button>\u003cp id=\"sol3\" class=\"result\">\u003c/p>\u003c/details>\u003cdiv class=\"separator\">\u003c/div>\n\u003cdetails>\u003csummary>\u003cb>4-masala. Massa markazi\u003c/b>\u003c/summary>\u003cp>3 kg jism x = −2 m da, 3 kg jism x = 4 m da. Massa markazini toping.\u003c/p>\u003cbutton onclick=\"showSolution(4)\">Yechimni ko‘rsatish\u003c/button>\u003cp id=\"sol4\" class=\"result\">\u003c/p>\u003c/details>\u003cdiv class=\"separator\">\u003c/div>\n\u003cdetails>\u003csummary>\u003cb>5-masala. Kuch yelkasi\u003c/b>\u003c/summary>\u003cp>Moment 15 N·m, kuch 50 N. Kuch yelkasini toping.\u003c/p>\u003cbutton onclick=\"showSolution(5)\">Yechimni ko‘rsatish\u003c/button>\u003cp id=\"sol5\" class=\"result\">\u003c/p>\u003c/details>\n\u003c/div>\n\u003c/div>\n\u003cdiv class=\"card\" style=\"margin-top:16px\">\u003ch2>Dars yakuni\u003c/h2>\u003cul class=\"list\">\u003cli>Massa markazi massalarning fazoda qanday taqsimlanganini ifodalaydi.\u003c/li>\u003cli>Barqaror, beqaror va farqsiz muvozanat jismning kichik siljishga javobi bilan farqlanadi.\u003c/li>\u003cli>Kuch momenti kuch va yelka ko‘paytmasiga teng (kuch yelkaga perpendikulyar bo‘lganda).\u003c/li>\u003cli>Richag muvozanatida qarama-qarshi momentlar tenglashadi.\u003c/li>\u003c/ul>\u003cp>\u003cb>Uyga vazifa:\u003c/b> kundalik hayotdan kuch momentiga oid uchta misol toping va ularda aylanish o‘qi, kuch hamda yelkani aniqlang.\u003c/p>\u003clabel for=\"reflection\">\u003cb>O‘z xulosangizni yozing:\u003c/b>\u003c/label>\u003ctextarea id=\"reflection\" rows=\"3\" style=\"width:100%;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:10px\" placeholder=\"Bugun men ... ni o‘rgandim\">\u003c/textarea>\u003c/div>\n\u003c/section>\n\u003cdiv class=\"row\" style=\"justify-content:space-between;margin-top:20px\">\u003cbutton class=\"ghost\" onclick=\"stepPage(-1)\">← Oldingi\u003c/button>\u003cspan class=\"muted small\" id=\"pageLabel\">Kirish\u003c/span>\u003cbutton class=\"primary\" onclick=\"stepPage(1)\">Keyingi →\u003c/button>\u003c/div>\n\u003c/main>\n\u003cfooter>Virtual fizika laboratoriyasi · Massa markazi · Muvozanat · Kuch momenti\u003c/footer>\n\u003cscript>\nconst pages=['home','mass','balance','moment','quiz'];let current='home';\nfunction go(id){current=id;document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===id));document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));document.getElementById('pageLabel').textContent=({home:'Kirish',mass:'Massa markazi',balance:'Muvozanat',moment:'Kuch momenti',quiz:'Mustahkamlash'})[id];setTimeout(drawAll,40);window.scrollTo({top:0,behavior:'smooth'})}\nfunction stepPage(d){go(pages[Math.max(0,Math.min(pages.length-1,pages.indexOf(current)+d))])}\nfunction canvasCtx(id){let c=document.getElementById(id);if(!c)return null;let r=c.getBoundingClientRect();if(r.width\u003c2)return null;let dpr=window.devicePixelRatio||1;c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);let x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);return {c,x,w:r.width,h:r.height}}\nfunction line(x,a,b,c,d,color='#8794b7',width=2){x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.strokeStyle=color;x.lineWidth=width;x.stroke()}\nfunction circle(x,a,b,r,fill,stroke){x.beginPath();x.arc(a,b,r,0,Math.PI*2);x.fillStyle=fill;x.fill();if(stroke){x.strokeStyle=stroke;x.lineWidth=2;x.stroke()}}\nfunction text(x,t,a,b,color='#344064',font='12px system-ui'){x.fillStyle=color;x.font=font;x.textAlign='center';x.fillText(t,a,b)}\nfunction roundRect(x,a,b,w,h,r,fill){x.beginPath();x.roundRect(a,b,w,h,r);x.fillStyle=fill;x.fill()}\nfunction val(id){return +document.getElementById(id).value}\nfunction fmt(n,d=2){return Number(n).toFixed(d).replace('.',',')}\nfunction drawMass(){let z=canvasCtx('massCanvas');if(!z)return;let{x,w,h}=z.x?{x:z.x,w:z.w,h:z.h}:{};let m1=val('m1'),m2=val('m2'),x1=val('x1'),x2=val('x2'),cm=(m1*x1+m2*x2)/(m1+m2);let px=v=>w/2+v*(w*.43/5),y=h*.55;line(x,18,y,w-18,y,'#9aa6c4',2);for(let i=-5;i\u003c=5;i++){let xx=px(i);line(x,xx,y-5,xx,y+5,'#8b97b7');text(x,String(i),xx,y+20,'#66708e','10px system-ui')}line(x,px(x1),y,px(x1),y-35,'#4263eb',2);line(x,px(x2),y,px(x2),y-35,'#13a7b8',2);circle(x,px(x1),y-42,Math.min(23,9+m1*1.3),'#7392ff','#3658d4');circle(x,px(x2),y-42,Math.min(23,9+m2*1.3),'#4dd0d7','#148c9a');text(x,'m₁='+m1+' kg',px(x1),y-73,'#3658d4','bold 11px system-ui');text(x,'m₂='+m2+' kg',px(x2),y-73,'#148c9a','bold 11px system-ui');line(x,px(cm),y+28,px(cm),y-10,'#ed4775',3);circle(x,px(cm),y-12,5,'#ed4775');text(x,'Massa markazi',px(cm),y+46,'#c52d5a','bold 11px system-ui');document.getElementById('m1v').textContent=m1+' kg';document.getElementById('m2v').textContent=m2+' kg';document.getElementById('x1v').textContent=x1+' m';document.getElementById('x2v').textContent=x2+' m';document.getElementById('cmOut').textContent=fmt(cm)+' m';document.getElementById('sumM').textContent=(m1+m2)+' kg';document.getElementById('cmFormula').textContent='xcm = ('+m1+'×('+x1+') + '+m2+'×('+x2+')) / '+(m1+m2)+' = '+fmt(cm)+' m'}\n['m1','m2','x1','x2'].forEach(id=>document.getElementById(id).addEventListener('input',drawMass));\nfunction equalMass(){document.getElementById('m2').value=val('m1');drawMass()}function resetMass(){[['m1',3],['m2',7],['x1',-3],['x2',4]].forEach(a=>document.getElementById(a[0]).value=a[1]);drawMass()}\nlet hangState={one:false,two:false,found:false};\nfunction drawHang(){let z=canvasCtx('hangCanvas');if(!z)return;let{x,w,h}=z;let cx=w*.5,cy=h*.47; // stylized irregular plate\nx.beginPath();x.moveTo(cx-80,cy-70);x.lineTo(cx+35,cy-90);x.lineTo(cx+88,cy-25);x.lineTo(cx+62,cy+65);x.lineTo(cx-25,cy+84);x.lineTo(cx-90,cy+25);x.closePath();x.fillStyle='#9bb0ff';x.fill();x.strokeStyle='#4567d8';x.lineWidth=2;x.stroke();\nlet mx=cx-5,my=cy+8;circle(x,mx,my,5,'#e94575');if(hangState.one){circle(x,cx-65,cy-45,5,'#7654d6');line(x,cx-65,cy-45,cx-65,h-12,'#7654d6',2);text(x,'1',cx-65,cy-55,'#7654d6','bold 12px system-ui')}if(hangState.two){circle(x,cx+60,cy-50,5,'#13a7b8');line(x,cx+60,cy-50,cx+60,h-12,'#13a7b8',2);text(x,'2',cx+60,cy-60,'#148c9a','bold 12px system-ui')}if(hangState.found){circle(x,mx,my,9,'#e94575');text(x,'Massa markazi',mx+42,my+18,'#c52d5a','bold 11px system-ui')}text(x,'Notekis plastinka',cx,h-10,'#66708e','12px system-ui')}\nfunction hang(n){if(n===1)hangState.one=true;else hangState.two=true;hangState.found=false;document.getElementById('hangResult').textContent='Shovun chizig‘i chizildi. Endi boshqa nuqtadan osib ko‘ring.';drawHang()}function findHang(){if(!hangState.one||!hangState.two){document.getElementById('hangResult').textContent='Avval plastinkani ikkala nuqtadan ham osing.';return}hangState.found=true;drawHang();document.getElementById('hangResult').textContent='Xulosa: shovun chiziqlari kesishgan nuqta massa markazini beradi.'}function resetHang(){hangState={one:false,two:false,found:false};drawHang();document.getElementById('hangResult').textContent='Tajriba boshlash uchun osish nuqtasini tanlang.'}\nlet balls={stable:0,unstable:0,neutral:0},released={stable:false,unstable:false,neutral:false};\nfunction drawBall(type){let z=canvasCtx(type+'Canvas');if(!z)return;let{x,w,h}=z;let cx=w/2,base=h*.72,amp=Math.min(w*.34,110),off=balls[type]*amp/2;line(x,10,base,w-10,base,'#b7c1dd',1);x.beginPath();if(type==='stable'){x.moveTo(12,base-4);x.quadraticCurveTo(cx,base+80,w-12,base-4);x.strokeStyle='#7388c7';x.lineWidth=3;x.stroke();let bx=Math.max(22,Math.min(w-22,cx+off));let by=base+80*(1-Math.pow((bx-cx)/amp,2))-14;circle(x,bx,by,13,'#6d8cff','#3658d4');text(x,'Botiq sirt',cx,base+27,'#66708e')}else if(type==='unstable'){x.moveTo(12,base+55);x.quadraticCurveTo(cx,base-95,w-12,base+55);x.strokeStyle='#7388c7';x.lineWidth=3;x.stroke();let bx=Math.max(22,Math.min(w-22,cx+off));let by=base+55-150*(1-Math.pow((bx-cx)/amp,2))-14;circle(x,bx,by,13,'#ffb65c','#d17a23');text(x,'Qavariq sirt',cx,base+70,'#66708e')}else{line(x,12,base+10,w-12,base+10,'#7388c7',3);let bx=Math.max(22,Math.min(w-22,cx+off));circle(x,bx,base-4,13,'#43c7c8','#148c9a');text(x,'Gorizontal sirt',cx,base+34,'#66708e')} }\nfunction shiftBall(type,dir){balls[type]=Math.max(-1,Math.min(1,balls[type]+dir*.38));released[type]=false;drawBall(type);document.getElementById(type+'Text').textContent='Shar muvozanatdan '+(dir\u003c0?'chapga':'o‘ngga')+' siljitildi.'}\nfunction releaseBall(type){if(type==='stable'){balls[type]*=.12;document.getElementById(type+'Text').textContent='Barqaror: shar muvozanat tomon qaytadi.'}else if(type==='unstable'){balls[type]=balls[type]===0?.7:Math.sign(balls[type]);document.getElementById(type+'Text').textContent='Beqaror: shar tepadan chetga siljiydi.'}else{document.getElementById(type+'Text').textContent='Farqsiz: ideal sirt bo‘ylab yangi joyida qoladi.'}drawBall(type)}\nfunction drawLever(){let z=canvasCtx('leverCanvas');if(!z)return;let{x,w,h}=z,m1=val('lm1'),m2=val('lm2'),l1=val('ll1'),l2=val('ll2'),M1=m1*9.81*l1,M2=m2*9.81*l2,d=M1-M2;let cx=w/2,scale=Math.min(w*.38/Math.max(l1,l2),85),ang=Math.max(-.32,Math.min(.32,d*.003));let leftX=cx-l1*scale,rightX=cx+l2*scale,cy=h*.53;line(x,leftX,cy+Math.tan(ang)*(leftX-cx),rightX,cy+Math.tan(ang)*(rightX-cx),'#4963c5',7);x.beginPath();x.moveTo(cx-18,h*.86);x.lineTo(cx+18,h*.86);x.lineTo(cx,h*.61);x.closePath();x.fillStyle='#7654d6';x.fill();let ly=cy+Math.tan(ang)*(leftX-cx),ry=cy+Math.tan(ang)*(rightX-cx);roundRect(x,leftX-15,ly-34,30,30,5,'#7190ff');roundRect(x,rightX-15,ry-34,30,30,5,'#44c7cb');line(x,leftX,ly-5,leftX,ly-25,'#3153bf',2);line(x,rightX,ry-5,rightX,ry-25,'#148c9a',2);text(x,m1+' kg',leftX,ly-43,'#3153bf','bold 11px system-ui');text(x,m2+' kg',rightX,ry-43,'#148c9a','bold 11px system-ui');text(x,'l₁='+l1.toFixed(1)+' m',leftX,cy+45);text(x,'l₂='+l2.toFixed(1)+' m',rightX,cy+45);document.getElementById('lm1v').textContent=m1+' kg';document.getElementById('lm2v').textContent=m2+' kg';document.getElementById('ll1v').textContent=l1.toFixed(1)+' m';document.getElementById('ll2v').textContent=l2.toFixed(1)+' m';document.getElementById('mom1').textContent=fmt(M1)+' N·m';document.getElementById('mom2').textContent=fmt(M2)+' N·m';let delta=M1-M2;document.getElementById('leverResult').textContent=Math.abs(delta)\u003c.5?'Momentlar teng: richag muvozanatda.':(delta>0?'Chap moment kattaroq: chap tomon pastga intiladi.':'O‘ng moment kattaroq: o‘ng tomon pastga intiladi.')+' (ΔM = '+fmt(delta)+' N·m)'}\n['lm1','lm2','ll1','ll2'].forEach(id=>document.getElementById(id).addEventListener('input',drawLever));\nfunction balanceLever(){let m1=val('lm1'),m2=val('lm2'),l1=val('ll1');document.getElementById('ll2').value=Math.max(.2,Math.min(2,Math.round((m1*l1/m2)*10)/10));drawLever()}\nfunction resetLever(){[['lm1',8],['lm2',4],['ll1',1],['ll2',2]].forEach(a=>document.getElementById(a[0]).value=a[1]);drawLever()}\nfunction drawWrench(){let z=canvasCtx('wrenchCanvas');if(!z)return;let{x,w,h}=z,F=val('force'),l=val('arm'),cx=w*.18,cy=h*.65,ex=Math.min(w*.85,cx+l*w*.68);line(x,cx,cy,ex,cy,'#6579ca',12);circle(x,cx,cy,10,'#7654d6');line(x,ex,cy-8,ex,cy-45,'#ef8c35',3);line(x,ex,cy-45,ex-7,cy-34,'#ef8c35',3);line(x,ex,cy-45,ex+7,cy-34,'#ef8c35',3);text(x,'F = '+F+' N',ex,cy-58,'#bd6a20','bold 12px system-ui');text(x,'l = '+l.toFixed(2)+' m',(cx+ex)/2,cy+28,'#344064','bold 12px system-ui');document.getElementById('forceV').textContent=F+' N';document.getElementById('armV').textContent=l.toFixed(2)+' m';document.getElementById('wrenchM').textContent=fmt(F*l)+' N·m'}\n['force','arm'].forEach(id=>document.getElementById(id).addEventListener('input',drawWrench));function doubleForce(){document.getElementById('force').value=Math.min(100,val('force')*2);drawWrench()}function doubleArm(){document.getElementById('arm').value=Math.min(1,Math.round(val('arm')*2*100)/100);drawWrench()}\nconst mechs={seesaw:['Arg‘imchoq','Tayanchdan uzoqroq joylashgan kichik kuch ham katta moment hosil qilishi mumkin.','m₁gl₁ = m₂gl₂'],door:['Eshik tutqichi','Tutqich aylanish o‘qidan uzoqda joylashadi. Shu sababli bir xil kuch kattaroq moment hosil qiladi.','M = F·l'],wrench:['Gayka kaliti','Uzun kalitning yelkasi katta, shuning uchun bir xil kuch bilan kattaroq moment hosil qilinadi.','M = F·l'],scale:['Ikki pallali tarozi','Teng yelkali tarozida teng massalar teng moment hosil qilib muvozanat beradi.','m₁gl = m₂gl'],scissors:['Qaychi','Qaychining markaziy birikmasi aylanish o‘qi vazifasini bajaradi. Dastakdagi kuch pichoqlarda kuch momentini yuzaga keltiradi.','M = F·l'],pliers:['Ombur','Ombur dastaklari uzun yelka, jag‘lari esa qisqaroq yelka hosil qiladi; bu kuchni oshirishga yordam beradi.','F₁l₁ ≈ F₂l₂']};\nfunction mechanism(k){let a=mechs[k];document.getElementById('mechTitle').textContent=a[0];document.getElementById('mechText').textContent=a[1];document.getElementById('mechFormula').textContent=a[2];drawMechanism(k)}\nfunction drawMechanism(k='seesaw'){let z=canvasCtx('mechCanvas');if(!z)return;let{x,w,h}=z,cx=w/2,cy=h*.55; if(k==='door'){roundRect(x,w*.22,h*.15,w*.42,h*.68,5,'#d2ddff');line(x,w*.22,h*.15,w*.22,h*.83,'#526bc4',3);circle(x,w*.59,cy,5,'#ef8c35');line(x,w*.59,cy,w*.59,cy-35,'#ef8c35',3);text(x,'Aylanish o‘qi',w*.15,h*.92)}else if(k==='wrench'){line(x,w*.2,cy,w*.78,cy,'#6579ca',14);circle(x,w*.2,cy,10,'#7654d6');line(x,w*.78,cy,w*.78,cy-45,'#ef8c35',3);text(x,'Uzun yelka',w*.52,cy+30)}else if(k==='scissors'||k==='pliers'){let dx=k==='scissors'?55:45;line(x,cx,cy,cx-dx,h*.2,'#6579ca',7);line(x,cx,cy,cx+dx,h*.2,'#6579ca',7);line(x,cx,cy,cx-dx,h*.9,'#13a7b8',7);line(x,cx,cy,cx+dx,h*.9,'#13a7b8',7);circle(x,cx,cy,8,'#ef8c35');text(x,'Aylanish o‘qi',cx,cy-15)}else{line(x,w*.15,cy,w*.85,cy,'#6579ca',7);x.beginPath();x.moveTo(cx-24,h*.87);x.lineTo(cx+24,h*.87);x.lineTo(cx,h*.58);x.closePath();x.fillStyle='#7654d6';x.fill();circle(x,w*.25,cy-18,18,'#7190ff');circle(x,w*.75,cy-18,18,'#44c7cb');line(x,w*.25,cy,w*.25,cy-18,'#3658d4',2);line(x,w*.75,cy,w*.75,cy-18,'#148c9a',2);text(x,'l₁',w*.25,cy+27);text(x,'l₂',w*.75,cy+27)}}\nconst questions=[\n['Ikki moddiy nuqtaning massa markazi qaysi kattaliklarga bog‘liq?',['Faqat koordinatalariga','Faqat massalariga','Massalari va koordinatalariga','Faqat shakliga'],2,'Massa markazi massalar va ularning koordinatalari bilan aniqlanadi.'],\n['Bir jinsli tayoqning massa markazi qayerda?',['Bir uchida','O‘rtasida','Har doim tashqarida','Tayoq uzunligiga bog‘liq emas'],1,'Simmetrik, bir jinsli tayoqning massa markazi uning o‘rtasida.'],\n['Botiq idish ichidagi shar qanday muvozanatda bo‘ladi?',['Barqaror','Beqaror','Farqsiz','Muvozanat bo‘lmaydi'],0,'Shar biroz siljitilganda pastki holatga qaytishga intiladi.'],\n['Qavariq sirt tepasidagi shar qanday muvozanatda?',['Barqaror','Beqaror','Farqsiz','Faqat ishqalanishda barqaror'],1,'Ozgina siljish sharni tepadan uzoqlashtiradi.'],\n['Ideal gorizontal tekislikdagi shar uchun qaysi holat mos?',['Barqaror','Beqaror','Farqsiz','Aylanma muvozanat mumkin emas'],2,'Balandlik va potensial energiya o‘zgarmaydi.'],\n['Kuch momenti formulasi qaysi?',['M=F/l','M=F·l','M=m/v','M=F+l'],1,'Kuch yelkaga perpendikulyar bo‘lganda M=F·l.'],\n['Kuch yelkasi nima?',['Richag uzunligining hammasi','Kuchning kattaligi','O‘qdan kuch ta’sir chizig‘igacha perpendikulyar masofa','Jism massasi'],2,'Yelka — aylanish o‘qidan kuch ta’sir chizig‘igacha bo‘lgan eng qisqa masofa.'],\n['20 N kuch 0,5 m yelkada qanday moment hosil qiladi?',['10 N·m','40 N·m','20,5 N·m','0,025 N·m'],0,'M=20×0,5=10 N·m.'],\n['Ideal richag muvozanatida nima teng?',['Faqat massalar','Yelkalar','Qarama-qarshi kuch momentlari','Kuchlar yo‘nalishi'],2,'Muvozanatda qarama-qarshi yo‘nalgan momentlar kattalik jihatdan teng.'],\n['Eshik tutqichi nega chetroqda joylashadi?',['Eshikni bezash uchun','Kuch yelkasini oshirib, ochishni osonlashtirish uchun','Eshik massasini kamaytirish uchun','Ishqalanishni yo‘qotish uchun'],1,'Aylanish o‘qidan uzoqroq nuqtada yelka va moment kattaroq bo‘ladi.']\n];let qi=0,answers=Array(questions.length).fill(null);\nfunction renderQ(){let q=questions[qi];document.getElementById('quizCount').textContent=(qi+1)+' / '+questions.length+'-savol';document.getElementById('quizProgress').style.width=(qi/questions.length*100)+'%';document.getElementById('question').textContent=q[0];let o=document.getElementById('options');o.innerHTML='';q[1].forEach((s,i)=>{let b=document.createElement('button');b.className='quiz-option';b.textContent=String.fromCharCode(65+i)+'. '+s;if(answers[qi]!==null){if(i===q[2])b.classList.add('correct');else if(i===answers[qi])b.classList.add('wrong')}b.onclick=()=>answerQ(i);o.appendChild(b)});document.getElementById('feedback').textContent=answers[qi]===null?'':q[3];document.getElementById('nextQ').disabled=answers[qi]===null;document.getElementById('nextQ').textContent=qi===questions.length-1?'Natijani ko‘rish':'Keyingi savol →';document.getElementById('scoreBox').style.display='none'}\nfunction answerQ(i){if(answers[qi]!==null)return;answers[qi]=i;renderQ();document.getElementById('feedback').textContent=(i===questions[qi][2]?'To‘g‘ri! ':'Noto‘g‘ri. ')+questions[qi][3];document.getElementById('nextQ').disabled=false}\nfunction nextQuestion(){if(qi\u003cquestions.length-1){qi++;renderQ()}else{let score=answers.reduce((s,a,i)=>s+(a===questions[i][2]?1:0),0);let b=document.getElementById('scoreBox');b.style.display='block';b.textContent='Natija: '+score+'/10 ('+score*10+'%). '+(score>=8?'Ajoyib! Mavzuni yaxshi o‘zlashtirgansiz.':score>=5?'Yaxshi urinish. Xato javoblarni takrorlang.':'Formulalar va simulyatsiyalarni yana bir bor ko‘rib chiqing.');document.getElementById('quizProgress').style.width='100%';document.getElementById('nextQ').disabled=true}}\nfunction restartQuiz(){qi=0;answers=Array(questions.length).fill(null);renderQ()}\nfunction showSolution(n){let a={1:'Berilgan: m₁=2 kg, x₁=0 m; m₂=6 kg, x₂=4 m. xcm=(2×0+6×4)/(2+6)=24/8=3 m.',2:'M=F·l=40×0,25=10 N·m.',3:'F₁l₁=F₂l₂. F₂=(20×0,8)/0,4=40 N.',4:'xcm=(3×(−2)+3×4)/(3+3)=(−6+12)/6=1 m.',5:'l=M/F=15/50=0,30 m.'};document.getElementById('sol'+n).textContent=a[n]}\nfunction drawAll(){drawMass();drawHang();['stable','unstable','neutral'].forEach(drawBall);drawLever();drawWrench();drawMechanism()}\nwindow.addEventListener('resize',()=>{clearTimeout(window._resizeT);window._resizeT=setTimeout(drawAll,120)});\nrenderQ();mechanism('seesaw');drawAll();\n\u003c/script>\n\u003c/body>\n\u003c/html>", "13-mavzu": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n    \u003cmeta charset=\"UTF-8\">\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    \u003ctitle>Oddiy Mexanizmlar va Momentlar Qoidasi - Interaktiv Simulyatsiya\u003c/title>\n    \u003c!-- Tailwind CSS CDN -->\n    \u003cscript src=\"https://cdn.tailwindcss.com\">\u003c/script>\n    \u003c!-- FontAwesome Icons -->\n    \u003clink rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\">\n    \u003c!-- Google Fonts Inter -->\n    \u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n    \u003cstyle>\n        body {\n            font-family: 'Inter', sans-serif;\n        }\n        canvas {\n            touch-action: none;\n        }\n        /* Custom styled range sliders */\n        input[type=range] {\n            accent-color: #3b82f6;\n        }\n    \u003c/style>\n\u003c/head>\n\u003cbody class=\"bg-slate-900 text-slate-100 min-h-screen flex flex-col\">\n\n    \u003c!-- Navbar Header -->\n    \u003cheader class=\"bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-lg\">\n        \u003cdiv class=\"max-w-7xl mx-auto px-4 py-3 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3\">\n            \u003cdiv class=\"flex items-center space-x-3\">\n                \u003cdiv class=\"p-2.5 bg-blue-600 rounded-xl shadow-md shadow-blue-500/20\">\n                    \u003ci class=\"fa-solid me-0 fa-atom text-2xl text-white\">\u003c/i>\n                \u003c/div>\n                \u003cdiv>\n                    \u003ch1 class=\"text-xl font-bold text-white tracking-tight\">Oddiy Mexanizmlar\u003c/h1>\n                    \u003cp class=\"text-xs text-slate-400\">13-mavzu. Momentlar qoidasiga asoslangan simulyator\u003c/p>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Tab Navigation Buttons -->\n            \u003cnav class=\"flex bg-slate-900/80 p-1.5 rounded-xl border border-slate-700/80 w-full sm:w-auto overflow-x-auto\">\n                \u003cbutton id=\"tab-richag\" onclick=\"switchTab('richag')\" class=\"flex-1 sm:flex-initial px-4 py-2 rounded-lg font-medium text-sm transition-all duration-200 flex items-center justify-center gap-2 bg-blue-600 text-white shadow-sm\">\n                    \u003ci class=\"fa-solid fa-scale-balanced\">\u003c/i> \u003cspan>Richag\u003c/span>\n                \u003c/button>\n                \u003cbutton id=\"tab-bloklar\" onclick=\"switchTab('bloklar')\" class=\"flex-1 sm:flex-initial px-4 py-2 rounded-lg font-medium text-sm transition-all duration-200 flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200\">\n                    \u003ci class=\"fa-solid fa-arrows-up-down\">\u003c/i> \u003cspan>Bloklar\u003c/span>\n                \u003c/button>\n                \u003cbutton id=\"tab-chigiriq\" onclick=\"switchTab('chigiriq')\" class=\"flex-1 sm:flex-initial px-4 py-2 rounded-lg font-medium text-sm transition-all duration-200 flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200\">\n                    \u003ci class=\"fa-solid fa-compact-disc\">\u003c/i> \u003cspan>Chig'iriq\u003c/span>\n                \u003c/button>\n            \u003c/nav>\n        \u003c/div>\n    \u003c/header>\n\n    \u003c!-- Main Content Container -->\n    \u003cmain class=\"flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8\">\n\n        \u003c!-- ================= TAB 1: RICHAG SIMULYATORI ================= -->\n        \u003csection id=\"section-richag\" class=\"space-y-6\">\n            \u003c!-- Information Banner -->\n            \u003cdiv class=\"bg-slate-800/80 border border-slate-700 rounded-2xl p-4 sm:p-5 flex flex-col md:flex-row justify-between items-start md:items-center gap-4\">\n                \u003cdiv>\n                    \u003ch2 class=\"text-lg font-bold text-white flex items-center gap-2\">\n                        \u003cspan class=\"text-blue-400\">\u003ci class=\"fa-solid fa-circle-info\">\u003c/i>\u003c/span>\n                        Richag Muvozanat Sharti\n                    \u003c/h2>\n                    \u003cp class=\"text-sm text-slate-300 mt-1\">\n                        Richag muvozanatda bo'lishi uchun soat mili bo'yicha va unga qarshi yo'nalgan kuch momentlari teng bo'lishi kerak: \n                        \u003cspan class=\"inline-block bg-slate-900 px-2 py-0.5 rounded text-blue-400 font-mono font-semibold ml-1\">M₁ = M₂\u003c/span> \n                        ya'ni \u003cspan class=\"inline-block bg-slate-900 px-2 py-0.5 rounded text-emerald-400 font-mono font-semibold\">F₁ · l₁ = F₂ · l₂\u003c/span>\n                    \u003c/p>\n                \u003c/div>\n                \u003cdiv id=\"richag-status-badge\" class=\"px-4 py-2 rounded-xl text-sm font-bold bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 flex items-center gap-2 whitespace-nowrap\">\n                    \u003ci class=\"fa-solid fa-circle-check\">\u003c/i> \u003cspan>Muvozanatda\u003c/span>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Simulation Canvas Card -->\n            \u003cdiv class=\"bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-xl\">\n                \u003cdiv class=\"p-4 bg-slate-800/50 border-b border-slate-700/60 flex items-center justify-between\">\n                    \u003cspan class=\"text-xs font-semibold uppercase tracking-wider text-slate-400\">\u003c
