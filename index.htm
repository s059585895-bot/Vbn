nt-f2-input').value);\n      currentProblem.studentF2 = val;\n      document.getElementById('student-f2-display').innerText = val + ' N';\n\n      // Recalculate Tilt Angle based on moment difference\n      const moment1 = currentProblem.f1 * currentProblem.l1;\n      const moment2 = val * currentProblem.l2;\n      const diff = moment1 - moment2; // positive -> left tilts down\n\n      // Target angle clamped between -20 deg and +20 deg\n      currentTiltAngle = Math.max(-0.35, Math.min(0.35, (diff / 100) * 0.15));\n\n      drawLeverSimulator();\n    }\n\n    function checkAnswer() {\n      const moment1 = currentProblem.f1 * currentProblem.l1;\n      const moment2 = currentProblem.studentF2 * currentProblem.l2;\n      const diff = Math.abs(moment1 - moment2);\n\n      const feedbackBox = document.getElementById('feedback-box');\n      const badge = document.getElementById('balance-status-badge');\n      feedbackBox.classList.remove('hidden');\n\n      if (diff \u003c 0.1) {\n        currentProblem.isCorrect = true;\n        score++;\n        document.getElementById('score-counter').innerText = score;\n\n        badge.innerText = 'MUVOZANATDA!';\n        badge.className = 'px-3 py-1 rounded-full text-xs font-extrabold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 animate-pulse';\n\n        feedbackBox.className = 'mb-4 p-4 rounded-xl border bg-emerald-950/40 border-emerald-500/40 text-emerald-300 text-xs leading-relaxed';\n        feedbackBox.innerHTML = `\n          \u003cdiv class=\"font-bold text-sm mb-1 flex items-center gap-2\">\u003ci class=\"fa-solid fa-circle-check text-emerald-400\">\u003c/i> Barchasi To'g'ri!\u003c/div>\n          Kiritilgan kuch $F_2 = ${currentProblem.studentF2}\\\\text{ N}$ va elka $l_2 = ${currentProblem.l2}\\\\text{ m}$ bergan moment $M_2 = ${moment2.toFixed(1)}\\\\text{ N·m}$ ga teng bo'lib, chap tarafdagi $M_1 = ${moment1.toFixed(1)}\\\\text{ N·m}$ momentni to'liq muvozanatladi.\n        `;\n      } else {\n        currentProblem.isCorrect = false;\n        badge.innerText = 'MUVOZANATSIZ!';\n        badge.className = 'px-3 py-1 rounded-full text-xs font-extrabold bg-rose-500/20 text-rose-400 border border-rose-500/40';\n\n        const direction = moment1 > moment2 ? 'chap tarafga og\\'moqda (kuch yetarli emas)' : 'o\\'ng tarafga og\\'moqda (kuch oshib ketgan)';\n\n        feedbackBox.className = 'mb-4 p-4 rounded-xl border bg-rose-950/40 border-rose-500/40 text-rose-300 text-xs leading-relaxed';\n        feedbackBox.innerHTML = `\n          \u003cdiv class=\"font-bold text-sm mb-1 flex items-center gap-2\">\u003ci class=\"fa-solid fa-triangle-exclamation text-rose-400\">\u003c/i> Muvozanat Buzildi!\u003c/div>\n          Richag hozirda \u003cstrong>${direction}\u003c/strong>.\u003cbr>\n          Chap moment $M_1 = ${moment1.toFixed(1)}\\\\text{ N·m}$, O'ng moment $M_2 = ${moment2.toFixed(1)}\\\\text{ N·m}$.\u003cbr>\n          To'g'ri javob uchun formula: $F_2 = (${currentProblem.f1} \\\\times ${currentProblem.l1}) / ${currentProblem.l2} = ${currentProblem.correctF2.toFixed(1)}\\\\text{ N}$.\n        `;\n      }\n\n      // Step by step text update\n      document.getElementById('step-calculation').innerHTML = `\n        $F_2 = (${currentProblem.f1} \\\\times ${currentProblem.l1.toFixed(1)}) / ${currentProblem.l2.toFixed(1)} = \\\\mathbf{${currentProblem.correctF2.toFixed(1)}\\\\text{ N}}$\n      `;\n\n      drawLeverSimulator();\n    }\n\n    function resetLab() {\n      updateLabState();\n      document.getElementById('feedback-box').classList.add('hidden');\n    }\n\n    function drawLeverSimulator() {\n      if (!labCtx || !labCanvas) return;\n\n      const w = labCanvas.width;\n      const h = labCanvas.height;\n      const cX = w / 2;\n      const cY = h * 0.65;\n\n      labCtx.clearRect(0, 0, w, h);\n\n      // Draw Pivot Support (Tayanch uchburchagi)\n      labCtx.save();\n      labCtx.fillStyle = '#475569';\n      labCtx.beginPath();\n      labCtx.moveTo(cX, cY);\n      labCtx.lineTo(cX - 25, cY + 50);\n      labCtx.lineTo(cX + 25, cY + 50);\n      labCtx.closePath();\n      labCtx.fill();\n      labCtx.strokeStyle = '#94a3b8';\n      labCtx.lineWidth = 2;\n      labCtx.stroke();\n\n      // Pivot Pin Circle\n      labCtx.fillStyle = '#38bdf8';\n      labCtx.beginPath();\n      labCtx.arc(cX, cY, 6, 0, Math.PI * 2);\n      labCtx.fill();\n      labCtx.restore();\n\n      // Lever Beam (Aylanuvchi to'sin)\n      labCtx.save();\n      labCtx.translate(cX, cY);\n      labCtx.rotate(currentTiltAngle);\n\n      const beamLength = Math.min(w * 0.8, 480);\n      const halfBeam = beamLength / 2;\n\n      // Draw Main Beam\n      labCtx.fillStyle = '#334155';\n      labCtx.strokeStyle = '#64748b';\n      labCtx.lineWidth = 3;\n      labCtx.beginPath();\n      labCtx.roundRect(-halfBeam, -8, beamLength, 16, 6);\n      labCtx.fill();\n      labCtx.stroke();\n\n      // Scale ticks on beam\n      labCtx.fillStyle = '#94a3b8';\n      for (let x = -halfBeam + 20; x \u003c= halfBeam - 20; x += 20) {\n        labCtx.fillRect(x - 1, -6, 2, 12);\n      }\n\n      // Compute Pixel Positions for Forces based on arms\n      // Scale: Max arm 3.0m corresponds to halfBeam - 20px\n      const scale = (halfBeam - 30) / 3.0;\n\n      const leftX = -currentProblem.l1 * scale;\n      const rightX = currentProblem.l2 * scale;\n\n      // Draw Left Load / Force Arrow (F1)\n      drawForceVector(labCtx, leftX, -8, currentProblem.f1, 'F₁ = ' + currentProblem.f1 + 'N', '#38bdf8', true);\n\n      // Draw Right Student Force Arrow (F2)\n      drawForceVector(labCtx, rightX, -8, currentProblem.studentF2, 'F₂ = ' + currentProblem.studentF2 + 'N', '#10b981', true);\n\n      labCtx.restore();\n\n      // Ground Line\n      labCtx.strokeStyle = '#334155';\n      labCtx.lineWidth = 2;\n      labCtx.beginPath();\n      labCtx.moveTo(cX - 120, cY + 50);\n      labCtx.lineTo(cX + 120, cY + 50);\n      labCtx.stroke();\n    }\n\n    function drawForceVector(ctx, x, y, magnitude, label, color, isDownwards = true) {\n      ctx.save();\n      ctx.translate(x, y);\n\n      const arrowLen = Math.min(80, 25 + magnitude * 0.25);\n\n      // Weight Box / Vector Start\n      ctx.fillStyle = color;\n      ctx.strokeStyle = color;\n      ctx.lineWidth = 3;\n\n      // Arrow Shaft\n      ctx.beginPath();\n      ctx.moveTo(0, 0);\n      ctx.lineTo(0, isDownwards ? arrowLen : -arrowLen);\n      ctx.stroke();\n\n      // Arrow Head\n      const headY = isDownwards ? arrowLen : -arrowLen;\n      const headDir = isDownwards ? 1 : -1;\n      ctx.beginPath();\n      ctx.moveTo(0, headY);\n      ctx.lineTo(-6, headY - 10 * headDir);\n      ctx.lineTo(6, headY - 10 * headDir);\n      ctx.closePath();\n      ctx.fill();\n\n      // Label Text\n      ctx.font = 'bold 12px Inter, sans-serif';\n      ctx.fillStyle = '#f8fafc';\n      ctx.textAlign = 'center';\n      ctx.fillText(label, 0, isDownwards ? arrowLen + 18 : -arrowLen - 10);\n\n      ctx.restore();\n    }\n\n    // ==========================================\n    // SECTION 3: REAL LIFE CASES SANDBOX LOGIC\n    // ==========================================\n    let activeCase = 'pliers';\n    let sandboxCanvas, sandboxCtx;\n\n    let caseParams = {\n      pliers: { handleLen: 16, bladeLen: 4, inputForce: 50 },\n      well: { wheelR: 40, axleR: 10, inputForce: 80 },\n      crane: { pulleys: 2, loadWeight: 200 }\n    };\n\n    function initSandboxCanvas() {\n      sandboxCanvas = document.getElementById('sandboxCanvas');\n      sandboxCtx = sandboxCanvas.getContext('2d');\n      resizeCanvas(sandboxCanvas);\n    }\n\n    function selectCase(caseName) {\n      activeCase = caseName;\n      document.querySelectorAll('.case-btn').forEach(b => {\n        b.classList.remove('bg-blue-600', 'text-white');\n        b.classList.add('bg-slate-800', 'text-slate-300');\n      });\n      document.getElementById(`case-btn-${caseName}`).classList.add('bg-blue-600', 'text-white');\n\n      renderSandboxCase();\n    }\n\n    function renderSandboxCase() {\n      const controlsBox = document.getElementById('case-controls-box');\n      const title = document.getElementById('case-title');\n      const desc = document.getElementById('case-desc');\n      const footer = document.getElementById('case-explanation-footer');\n\n      if (activeCase === 'pliers') {\n        title.innerText = \"Ombur Yordamida Sim Qirqish\";\n        desc.innerText = \"Omburning dastalari uzunligi va pichoq elkasi nisbati orqali kuchdan yutish simulyatsiyasi.\";\n\n        const p = caseParams.pliers;\n        controlsBox.innerHTML = `\n          \u003cdiv>\n            \u003cdiv class=\"flex justify-between text-xs text-slate-300 mb-1\">\n              \u003cspan>Dasta Elka Uzunligi ($L_{dasta}$):\u003c/span>\n              \u003cspan class=\"font-bold text-blue-400\">${p.handleLen} cm\u003c/span>\n            \u003c/div>\n            \u003cinput type=\"range\" min=\"8\" max=\"24\" value=\"${p.handleLen}\" oninput=\"caseParams.pliers.handleLen = parseFloat(this.value); updateSandboxCalculations();\" class=\"w-full accent-blue-500 bg-slate-700 h-1.5 rounded-lg\">\n          \u003c/div>\n          \u003cdiv>\n            \u003cdiv class=\"flex justify-between text-xs text-slate-300 mb-1\">\n              \u003cspan>Pichoq Elka Uzunligi ($L_{pichoq}$):\u003c/span>\n              \u003cspan class=\"font-bold text-blue-400\">${p.bladeLen} cm\u003c/span>\n            \u003c/div>\n            \u003cinput type=\"range\" min=\"2\" max=\"6\" value=\"${p.bladeLen}\" oninput=\"caseParams.pliers.bladeLen = parseFloat(this.value); updateSandboxCalculations();\" class=\"w-full accent-blue-500 bg-slate-700 h-1.5 rounded-lg\">\n          \u003c/div>\n          \u003cdiv>\n            \u003cdiv class=\"flex justify-between text-xs text-slate-300 mb-1\">\n              \u003cspan>Qo'l Bilan Berilgan Kuch ($F_{qo'l}$):\u003c/span>\n              \u003cspan class=\"font-bold text-emerald-400\">${p.inputForce} N\u003c/span>\n            \u003c/div>\n            \u003cinput type=\"range\" min=\"10\" max=\"150\" value=\"${p.inputForce}\" step=\"5\" oninput=\"caseParams.pliers.inputForce = parseFloat(this.value); updateSandboxCalculations();\" class=\"w-full accent-emerald-500 bg-slate-700 h-1.5 rounded-lg\">\n          \u003c/div>\n        `;\n\n        footer.innerHTML = `\u003ci class=\"fa-solid fa-lightbulb text-amber-400 mr-1\">\u003c/i> Ombur dastasiga berilgan kichik kuch pichoq qismida necha marta ko'payib, simni oson kesishini ko'rishingiz mumkin.`;\n\n      } else if (activeCase === 'well') {\n        title.innerText = \"Quduq Chig'irig'i (Chox va G'ildirak)\";\n        desc.innerText = \"G'ildirak radiusi ($R$) va val radiusi ($r$) nisbati bo'yicha chig'iriq muvozanati.\";\n\n        const p = caseParams.well;\n        controlsBox.innerHTML = `\n          \u003cdiv>\n            \u003cdiv class=\"flex justify-between text-xs text-slate-300 mb-1\">\n              \u003cspan>Chig'iriq Dasta Radiusi ($R$):\u003c/span>\n              \u003cspan class=\"font-bold text-blue-400\">${p.wheelR} cm\u003c/span>\n            \u003c/div>\n            \u003cinput type=\"range\" min=\"20\" max=\"60\" value=\"${p.wheelR}\" oninput=\"caseParams.well.wheelR = parseFloat(this.value); updateSandboxCalculations();\" class=\"w-full accent-blue-500 bg-slate-700 h-1.5 rounded-lg\">\n          \u003c/div>\n          \u003cdiv>\n            \u003cdiv class=\"flex justify-between text-xs text-slate-300 mb-1\">\n              \u003cspan>Baraban Radiusi ($r$):\u003c/span>\n              \u003cspan class=\"font-bold text-blue-400\">${p.axleR} cm\u003c/span>\n            \u003c/div>\n            \u003cinput type=\"range\" min=\"5\" max=\"15\" value=\"${p.axleR}\" oninput=\"caseParams.well.axleR = parseFloat(this.value); updateSandboxCalculations();\" class=\"w-full accent-blue-500 bg-slate-700 h-1.5 rounded-lg\">\n          \u003c/div>\n          \u003cdiv>\n            \u003cdiv class=\"flex justify-between text-xs text-slate-300 mb-1\">\n              \u003cspan>Aylantirish Kuchi ($F$):\u003c/span>\n              \u003cspan class=\"font-bold text-emerald-400\">${p.inputForce} N\u003c/span>\n            \u003c/div>\n            \u003cinput type=\"range\" min=\"20\" max=\"200\" value=\"${p.inputForce}\" step=\"10\" oninput=\"caseParams.well.inputForce = parseFloat(this.value); updateSandboxCalculations();\" class=\"w-full accent-emerald-500 bg-slate-700 h-1.5 rounded-lg\">\n          \u003c/div>\n        `;\n\n        footer.innerHTML = `\u003ci class=\"fa-solid fa-lightbulb text-amber-400 mr-1\">\u003c/i> Chig'iriq dastasini 1 marta to'liq aylantirganda ko'p masofa bosiladi, lekin og'ir suv paqirini juda yengil ko'tarish imkonini beradi.`;\n\n      } else if (activeCase === 'crane') {\n        title.innerText = \"Qurilish Krani Bloklar Tizimi\";\n        desc.innerText = \"Polispast va qo'zg'aluvchan bloklar soni bo'yicha yuk ko'tarish.\";\n\n        const p = caseParams.crane;\n        controlsBox.innerHTML = `\n          \u003cdiv>\n            \u003cdiv class=\"flex justify-between text-xs text-slate-300 mb-1\">\n              \u003cspan>Qo'zg'aluvchan Bloklar Soni ($n$):\u003c/span>\n              \u003cspan class=\"font-bold text-blue-400\">${p.pulleys} ta\u003c/span>\n            \u003c/div>\n            \u003cinput type=\"range\" min=\"1\" max=\"4\" value=\"${p.pulleys}\" step=\"1\" oninput=\"caseParams.crane.pulleys = parseInt(this.value); updateSandboxCalculations();\" class=\"w-full accent-blue-500 bg-slate-700 h-1.5 rounded-lg\">\n          \u003c/div>\n          \u003cdiv>\n            \u003cdiv class=\"flex justify-between text-xs text-slate-300 mb-1\">\n              \u003cspan>Yuk Og'irligi ($P$):\u003c/span>\n              \u003cspan class=\"font-bold text-amber-400\">${p.loadWeight} N\u003c/span>\n            \u003c/div>\n            \u003cinput type=\"range\" min=\"100\" max=\"1000\" value=\"${p.loadWeight}\" step=\"50\" oninput=\"caseParams.crane.loadWeight = parseFloat(this.value); updateSandboxCalculations();\" class=\"w-full accent-amber-500 bg-slate-700 h-1.5 rounded-lg\">\n          \u003c/div>\n        `;\n\n        footer.innerHTML = `\u003ci class=\"fa-solid fa-lightbulb text-amber-400 mr-1\">\u003c/i> Bloklar soni ortgani sari kranning dvigateli talab qiladigan tortish kuchi $2n$ marta kamayadi.`;\n      }\n\n      updateSandboxCalculations();\n    }\n\n    function updateSandboxCalculations() {\n      let advantage = 1;\n      let resultingForce = 0;\n\n      if (activeCase === 'pliers') {\n        const p = caseParams.pliers;\n        advantage = p.handleLen / p.bladeLen;\n        resultingForce = p.inputForce * advantage;\n      } else if (activeCase === 'well') {\n        const p = caseParams.well;\n        advantage = p.wheelR / p.axleR;\n        resultingForce = p.inputForce * advantage;\n      } else if (activeCase === 'crane') {\n        const p = caseParams.crane;\n        advantage = p.pulleys * 2;\n        resultingForce = p.loadWeight / advantage;\n      }\n\n      document.getElementById('advantage-value').innerText = advantage.toFixed(1) + ' marta';\n      document.getElementById('resulting-force-value').innerText = resultingForce.toFixed(1) + ' N';\n\n      drawSandboxCanvas();\n    }\n\n    function drawSandboxCanvas() {\n      if (!sandboxCtx || !sandboxCanvas) return;\n      const w = sandboxCanvas.width;\n      const h = sandboxCanvas.height;\n      const cX = w / 2;\n      const cY = h / 2;\n\n      sandboxCtx.clearRect(0, 0, w, h);\n\n      if (activeCase === 'pliers') {\n        // Draw Pliers Schematic\n        const p = caseParams.pliers;\n        sandboxCtx.save();\n        sandboxCtx.translate(cX, cY);\n\n        // Pivot point\n        sandboxCtx.fillStyle = '#f59e0b';\n        sandboxCtx.beginPath();\n        sandboxCtx.arc(0, 0, 8, 0, Math.PI * 2);\n        sandboxCtx.fill();\n\n        // Handle\n        const handlePixel = p.handleLen * 6;\n        const bladePixel = p.bladeLen * 12;\n\n        // Top Handle / Lower Blade\n        sandboxCtx.strokeStyle = '#38bdf8';\n        sandboxCtx.lineWidth = 8;\n        sandboxCtx.beginPath();\n        sandboxCtx.moveTo(-handlePixel, -25);\n        sandboxCtx.lineTo(0, 0);\n        sandboxCtx.lineTo(bladePixel, -10);\n        sandboxCtx.stroke();\n\n        // Bottom Handle / Upper Blade\n        sandboxCtx.strokeStyle = '#38bdf8';\n        sandboxCtx.beginPath();\n        sandboxCtx.moveTo(-handlePixel, 25);\n        sandboxCtx.lineTo(0, 0);\n        sandboxCtx.lineTo(bladePixel, 10);\n        sandboxCtx.stroke();\n\n        // Wire object being cut\n        sandboxCtx.fillStyle = '#ef4444';\n        sandboxCtx.beginPath();\n        sandboxCtx.arc(bladePixel - 5, 0, 7, 0, Math.PI * 2);\n        sandboxCtx.fill();\n\n        sandboxCtx.restore();\n\n      } else if (activeCase === 'well') {\n        // Draw Well Wheel Schematic\n        const p = caseParams.well;\n        sandboxCtx.save();\n        sandboxCtx.translate(cX, cY);\n\n        // Outer Wheel\n        sandboxCtx.strokeStyle = '#38bdf8';\n        sandboxCtx.lineWidth = 4;\n        sandboxCtx.beginPath();\n        sandboxCtx.arc(0, 0, p.wheelR * 1.8, 0, Math.PI * 2);\n        sandboxCtx.stroke();\n\n        // Inner Axle\n        sandboxCtx.fillStyle = '#64748b';\n        sandboxCtx.beginPath();\n        sandboxCtx.arc(0, 0, p.axleR * 2.2, 0, Math.PI * 2);\n        sandboxCtx.fill();\n\n        // Handle Arm\n        sandboxCtx.strokeStyle = '#10b981';\n        sandboxCtx.lineWidth = 5;\n        sandboxCtx.beginPath();\n        sandboxCtx.moveTo(0, 0);\n        sandboxCtx.lineTo(0, -p.wheelR * 1.8);\n        sandboxCtx.stroke();\n\n        sandboxCtx.restore();\n\n      } else if (activeCase === 'crane') {\n        // Draw Crane Pulley schematic\n        const p = caseParams.crane;\n        sandboxCtx.save();\n        sandboxCtx.translate(cX, 40);\n\n        // Beam Support\n        sandboxCtx.fillStyle = '#475569';\n        sandboxCtx.fillRect(-60, 0, 120, 10);\n\n        // Pulleys\n        for (let i = 0; i \u003c p.pulleys; i++) {\n          const px = -20 + i * 25;\n          sandboxCtx.strokeStyle = '#38bdf8';\n          sandboxCtx.lineWidth = 3;\n          sandboxCtx.beginPath();\n          sandboxCtx.arc(px, 30, 12, 0, Math.PI * 2);\n          sandboxCtx.stroke();\n\n          // Rope lines\n          sandboxCtx.strokeStyle = '#94a3b8';\n          sandboxCtx.lineWidth = 1.5;\n          sandboxCtx.beginPath();\n          sandboxCtx.moveTo(px - 12, 10);\n          sandboxCtx.lineTo(px - 12, 90);\n          sandboxCtx.stroke();\n        }\n\n        // Hanging Load\n        sandboxCtx.fillStyle = '#f59e0b';\n        sandboxCtx.fillRect(-25, 90, 50, 40);\n        sandboxCtx.fillStyle = '#0f172a';\n        sandboxCtx.font = 'bold 10px Inter';\n        sandboxCtx.textAlign = 'center';\n        sandboxCtx.fillText(p.loadWeight + ' N', 0, 114);\n\n        sandboxCtx.restore();\n      }\n    }\n\n    // INITIALIZATION ON LOAD\n    window.onload = function () {\n      calcMoment();\n      calcRichag();\n      calcBlocks();\n\n      initLabCanvas();\n      generateRandomProblem();\n\n      initSandboxCanvas();\n      renderSandboxCase();\n    };\n  \u003c/script>\n\u003c/body>\n\u003c/html>", "loyiha": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\" class=\"dark\">\n\u003chead>\n    \u003cmeta charset=\"UTF-8\">\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    \u003ctitle>Loyiha Ishi: Oddiy Mexanizmlarni Yasash va Tadqiq Etish\u003c/title>\n    \u003c!-- Tailwind CSS -->\n    \u003cscript src=\"https://cdn.tailwindcss.com\">\u003c/script>\n    \u003c!-- FontAwesome Icons -->\n    \u003clink rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\">\n    \u003c!-- Chart.js for dynamic graphs -->\n    \u003cscript src=\"https://cdn.jsdelivr.net/npm/chart.js\">\u003c/script>\n    \u003cscript>\n        tailwind.config = {\n            darkMode: 'class',\n            theme: {\n                extend: {\n                    colors: {\n                        stem: {\n                            50: '#f0f9ff',\n                            100: '#e0f2fe',\n                            500: '#0284c7',\n                            600: '#0369a1',\n                            700: '#035485',\n                            800: '#075985',\n                            900: '#0c4a6e',\n                            accent: '#f59e0b'\n                        }\n                    }\n                }\n            }\n        }\n    \u003c/script>\n    \u003cstyle>\n        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');\n        body {\n            font-family: 'Inter', sans-serif;\n        }\n        .canvas-container {\n            position: relative;\n            width: 100%;\n            height: 420px;\n            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);\n        }\n        /* Custom Scrollbar */\n        ::-webkit-scrollbar {\n            width: 6px;\n            height: 6px;\n        }\n        ::-webkit-scrollbar-track {\n            background: #1e293b;\n        }\n        ::-webkit-scrollbar-thumb {\n            background: #334155;\n            border-radius: 3px;\n        }\n        ::-webkit-scrollbar-thumb:hover {\n            background: #475569;\n        }\n        @media print {\n            body * {\n                visibility: hidden;\n            }\n            #printable-report, #printable-report * {\n                visibility: visible;\n            }\n            #printable-report {\n                position: absolute;\n                left: 0;\n                top: 0;\n                width: 100%;\n                color: #000 !important;\n                background: #fff !important;\n            }\n            .no-print {\n                display: none !important;\n            }\n        }\n    \u003c/style>\n\u003c/head>\n\u003cbody class=\"bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-amber-500 selection:text-slate-900\">\n\n    \u003c!-- Header / Navigation -->\n    \u003cheader class=\"border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40\">\n        \u003cdiv class=\"max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between\">\n            \u003cdiv class=\"flex items-center space-x-3\">\n                \u003cdiv class=\"w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-sky-500 flex items-center justify-center text-slate-950 font-bold text-xl shadow-lg shadow-amber-500/20\">\n                    \u003ci class=\"fa-solid fa-gears\">\u003c/i>\n                \u003c/div>\n                \u003cdiv>\n                    \u003ch1 class=\"text-lg font-bold text-white leading-tight\">STEM Laboratoriyasi\u003c/h1>\n                    \u003cp class=\"text-xs text-slate-400\">Oddiy mexanizmlarni yasash va tadqiq etish\u003c/p>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Tab Navigation Buttons -->\n            \u003cnav class=\"flex items-center space-x-1 sm:space-x-2 bg-slate-950 p-1 rounded-xl border border-slate-800\">\n                \u003cbutton onclick=\"switchTab('theory')\" id=\"tab-btn-theory\" class=\"tab-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition flex items-center space-x-2 bg-sky-600 text-white shadow\">\n                    \u003ci class=\"fa-solid fa-book-open\">\u003c/i>\n                    \u003cspan class=\"hidden sm:inline\">1. Nazariya va Tahlil\u003c/span>\n                    \u003cspan class=\"sm:hidden\">Nazariya\u003c/span>\n                \u003c/button>\n                \u003cbutton onclick=\"switchTab('builder')\" id=\"tab-btn-builder\" class=\"tab-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition flex items-center space-x-2 text-slate-400 hover:text-white hover:bg-slate-800\">\n                    \u003ci class=\"fa-solid fa-hammer\">\u003c/i>\n                    \u003cspan class=\"hidden sm:inline\">2. Konstruktor va Yasash\u003c/span>\n                    \u003cspan class=\"sm:hidden\">Yasash\u003c/span>\n                \u003c/button>\n                \u003cbutton onclick=\"switchTab('lab')\" id=\"tab-btn-lab\" class=\"tab-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition flex items-center space-x-2 text-slate-400 hover:text-white hover:bg-slate-800\">\n                    \u003ci class=\"fa-solid fa-flask-vial\">\u003c/i>\n                    \u003cspan class=\"hidden sm:inline\">3. Sinov va Taqdimot\u003c/span>\n                    \u003cspan class=\"sm:hidden\">Sinov\u003c/span>\n                \u003c/button>\n            \u003c/nav>\n        \u003c/div>\n    \u003c/header>\n\n    \u003c!-- Main Content Container -->\n    \u003cmain class=\"flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6\">\n\n        \u003c!-- ================= TAB 1: NAZARIYA VA TUZILISHI ================= -->\n        \u003csection id=\"tab-theory\" class=\"tab-content space-y-6\">\n            \u003c!-- Intro Banner -->\n            \u003cdiv class=\"bg-gradient-to-r from-sky-900/40 via-slate-900 to-amber-950/30 border border-slate-800 rounded-2xl p-6 relative overflow-hidden\">\n                \u003cdiv class=\"max-w-3xl\">\n                    \u003cspan class=\"inline-block px-3 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs font-semibold rounded-full mb-3\">Loyiha Rejasi - 1-Bosqich\u003c/span>\n                    \u003ch2 class=\"text-2xl sm:text-3xl font-extrabold text-white tracking-tight\">Oddiy Mexanizmlarning Tuzilishi va Ishlash Prinsiplari\u003c/h2>\n                    \u003cp class=\"mt-2 text-slate-300 text-sm sm:text-base leading-relaxed\">\n                        Oddiy mexanizmlar — bu kuch yo'nalishini yoki kattaligini o'zgartirish orqali og'ir ishlarni kamroq kuch sarflab bajarishga imkon beruvchi muhandislik vositalaridir. Barcha mexanizmlar \u003cstrong>\"Mexanikaning oltin qoidasi\"\u003c/strong>ga bo'ysunadi: \u003cem>\"Kuchdan necha marta yutsak, masofadan shuncha marta yutqazamiz\"\u003c/em> (Bajarilgan ish o'zgarmaydi).\n                    \u003c/p>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Interactive Mechanism Cards -->\n            \u003cdiv class=\"grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4\">\n                \n                \u003c!-- Mechanism 1: Richag -->\n                \u003cdiv class=\"bg-slate-900 border border-slate-800 rounded-2xl p-5 hover:border-sky-500/50 transition duration-300 flex flex-col justify-between group\">\n                    \u003cdiv>\n                        \u003cdiv class=\"w-12 h-12 rounded-xl bg-sky-500/10 border border-sky-500/20 text-sky-400 flex items-center justify-center text-2xl mb-4 group-hover:scale-110 transition\">\n                            \u003ci class=\"fa-solid fa-scale-balanced\">\u003c/i>\n                        \u003c/div>\n                        \u003ch3 class=\"text-lg font-bold text-white mb-1\">Richag (Lever)\u003c/h3>\n                        \u003cp class=\"text-xs text-sky-400 mb-3 font-mono\">F₁ · L₁ = F₂ · L₂\u003c/p>\n                        \u003cp class=\"text-xs text-slate-400 leading-relaxed mb-4\">\n                            Tayanch nuqtasi atrofida aylana oladigan qattiq jism. Yelkalari nisbati ($L_1 / L_2$) hisobiga kuchdan karrali yutish imkonini beradi.\n                        \u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"border-t border-slate-800/80 pt-3 text-xs text-slate-300 space-y-1 bg-slate-950/50 p-3 rounded-lg\">\n                        \u003cdiv class=\"flex justify-between\">\u003cspan class=\"text-slate-500\">Kuchdan yutish:\u003c/span> \u003cspan class=\"font-semibold text-emerald-400\">L₁ / L₂ barobar\u003c/span>\u003c/div>\n                        \u003cdiv class=\"flex justify-between\">\u003cspan class=\"text-slate-500\">Qo'llanilishi:\u003c/span> \u003cspan>Kran, qaychi, manjanik\u003c/span>\u003c/div>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Mechanism 2: Bloklar -->\n                \u003cdiv class=\"bg-slate-900 border border-slate-800 rounded-2xl p-5 hover:border-sky-500/50 transition duration-300 flex flex-col justify-between group\">\n                    \u003cdiv>\n                        \u003cdiv class=\"w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center text-2xl mb-4 group-hover:scale-110 transition\">\n                            \u003ci class=\"fa-solid fa-circle-notch\">\u003c/i>\n                        \u003c/div>\n                        \u003ch3 class=\"text-lg font-bold text-white mb-1\">Bloklar Tizimi\u003c/h3>\n                        \u003cp class=\"text-xs text-amber-400 mb-3 font-mono\">F = P / (2n)\u003c/p>\n                        \u003cp class=\"text-xs text-slate-400 leading-relaxed mb-4\">\n                            Qo'zg'almas blok faqat kuch yo'nalishini o'zgartiradi. Qo'zg'aluvchan blok esa kuchdan 2 marta yutish beradi. Ularning birikmasi — Polispast deyiladi.\n                        \u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"border-t border-slate-800/80 pt-3 text-xs text-slate-300 space-y-1 bg-slate-950/50 p-3 rounded-lg\">\n                        \u003cdiv class=\"flex justify-between\">\u003cspan class=\"text-slate-500\">Kuchdan yutish:\u003c/span> \u003cspan class=\"font-semibold text-emerald-400\">2ⁿ (n - harakatli blok)\u003c/span>\u003c/div>\n                        \u003cdiv class=\"flex justify-between\">\u003cspan class=\"text-slate-500\">Qo'llanilishi:\u003c/span> \u003cspan>Qurilish kranlari, liftlar\u003c/span>\u003c/div>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Mechanism 3: Chig'iriq -->\n                \u003cdiv class=\"bg-slate-900 border border-slate-800 rounded-2xl p-5 hover:border-sky-500/50 transition duration-300 flex flex-col justify-between group\">\n                    \u003cdiv>\n                        \u003cdiv class=\"w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center text-2xl mb-4 group-hover:scale-110 transition\">\n                            \u003ci class=\"fa-solid fa-compact-disc\">\u003c/i>\n                        \u003c/div>\n                        \u003ch3 class=\"text-lg font-bold text-white mb-1\">Chig'iriq (Winch)\u003c/h3>\n                        \u003cp class=\"text-xs text-emerald-400 mb-3 font-mono\">F = P · (r / R)\u003c/p>\n                        \u003cp class=\"text-xs text-slate-400 leading-relaxed mb-4\">\n                            Bir o'qqa mahkamlangan turli radiusli g'altak va dasta (baraban). Dasta radiusi (R) val radiusidan (r) qancha katta bo'lsa, yutuq shuncha yuqori.\n                        \u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"border-t border-slate-800/80 pt-3 text-xs text-slate-300 space-y-1 bg-slate-950/50 p-3 rounded-lg\">\n                        \u003cdiv class=\"flex justify-between\">\u003cspan class=\"text-slate-500\">Kuchdan yutish:\u003c/span> \u003cspan class=\"font-semibold text-emerald-400\">R / r barobar\u003c/span>\u003c/div>\n                        \u003cdiv class=\"flex justify-between\">\u003cspan class=\"text-slate-500\">Qo'llanilishi:\u003c/span> \u003cspan>Kuduk chig'irig'i, lebyodka\u003c/span>\u003c/div>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Mechanism 4: Qiya Tekislik -->\n                \u003cdiv class=\"bg-slate-900 border border-slate-800 rounded-2xl p-5 hover:border-sky-500/50 transition duration-300 flex flex-col justify-between group\">\n                    \u003cdiv>\n                        \u003cdiv class=\"w-12 h-12 rounded-xl bg-purple-500/10 border border-purple-500/20 text-purple-400 flex items-center justify-center text-2xl mb-4 group-hover:scale-110 transition\">\n                            \u003ci class=\"fa-solid fa-play -rotate-90\">\u003c/i>\n                        \u003c/div>\n                        \u003ch3 class=\"text-lg font-bold text-white mb-1\">Qiya Tekislik\u003c/h3>\n                        \u003cp class=\"text-xs text-purple-400 mb-3 font-mono\">F = P · sin(α) + F_ishk\u003c/p>\n                        \u003cp class=\"text-xs text-slate-400 leading-relaxed mb-4\">\n                            Gorizontga nisbatan burchak ostida joylashgan tekislik. Og'ir yuklarni balandlikka kamroq kuch bilan ko'tarishga yordam beradi.\n                        \u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"border-t border-slate-800/80 pt-3 text-xs text-slate-300 space-y-1 bg-slate-950/50 p-3 rounded-lg\">\n                        \u003cdiv class=\"flex justify-between\">\u003cspan class=\"text-slate-500\">Kuchdan yutish:\u003c/span> \u003cspan class=\"font-semibold text-emerald-400\">L / h = 1 / sin(α)\u003c/span>\u003c/div>\n                        \u003cdiv class=\"flex justify-between\">\u003cspan class=\"text-slate-500\">Qo'llanilishi:\u003c/span> \u003cspan>Pandus, vint, pona\u003c/span>\u003c/div>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Formulas and Physics Breakdown Table -->\n            \u003cdiv class=\"bg-slate-900 border border-slate-800 rounded-2xl p-6\">\n                \u003ch3 class=\"text-lg font-bold text-white mb-4 flex items-center space-x-2\">\n                    \u003ci class=\"fa-solid fa-calculator text-amber-400\">\u003c/i>\n                    \u003cspan>Tadqiqot Metodologiyasi va Fizik Formula va Formulalar\u003c/span>\n                \u003c/h3>\n                \u003cdiv class=\"overflow-x-auto\">\n                    \u003ctable class=\"w-full text-left text-xs sm:text-sm text-slate-300\">\n                        \u003cthead class=\"bg-slate-950 text-slate-400 uppercase text-[10px] sm:text-xs\">\n                            \u003ctr>\n                                \u003cth class=\"p-3\">Kattalik / Tushuncha\u003c/th>\n                                \u003cth class=\"p-3\">Belgisi va Birligi\u003c/th>\n                                \u003cth class=\"p-3\">Hisoblash Formulasi\u003c/th>\n                                \u003cth class=\"p-3\">Fizik Ma'nosi\u003c/th>\n                            \u003c/tr>\n                        \u003c/thead>\n                        \u003ctbody class=\"divide-y divide-slate-800/60 font-mono\">\n                            \u003ctr class=\"hover:bg-slate-800/30\">\n                                \u003ctd class=\"p-3 font-sans font-semibold text-white\">Foydali Ish ($A_f$)\u003c/td>\n                                \u003ctd class=\"p-3 text-sky-400\">Joul (J)\u003c/td>\n                                \u003ctd class=\"p-3 text-amber-300\">A_f = P · h\u003c/td>\n                                \u003ctd class=\"p-3 font-sans text-slate-400\">Yukni to'g'ridan-to'g'ri ko'tarish uchun ketgan ish (P = m·g)\u003c/td>\n                            \u003c/tr>\n                            \u003ctr class=\"hover:bg-slate-800/30\">\n                                \u003ctd class=\"p-3 font-sans font-semibold text-white\">To'liq Ish ($A_t$)\u003c/td>\n                                \u003ctd class=\"p-3 text-sky-400\">Joul (J)\u003c/td>\n                                \u003ctd class=\"p-3 text-amber-300\">A_t = F_amaldagi · s\u003c/td>\n                                \u003ctd class=\"p-3 font-sans text-slate-400\">Mexanizm yordamida amalda sarflangan to'liq ish (s - bosib o'tilgan yo'l)\u003c/td>\n                            \u003c/tr>\n                            \u003ctr class=\"hover:bg-slate-800/30\">\n                                \u003ctd class=\"p-3 font-sans font-semibold text-white\">Foydali Ish Koeffitsiyenti (FIK / $\\eta$)\u003c/td>\n                                \u003ctd class=\"p-3 text-sky-400\">Foiz (%)\u003c/td>\n                                \u003ctd class=\"p-3 text-emerald-400\">η = (A_f / A_t) · 100%\u003c/td>\n                                \u003ctd class=\"p-3 font-sans text-slate-400\">Mexanizmning samaradorlik darajasi (ishqalanish sababli doim &lt; 100%)\u003c/td>\n                            \u003c/tr>\n                            \u003ctr class=\"hover:bg-slate-800/30\">\n                                \u003ctd class=\"p-3 font-sans font-semibold text-white\">Ideal Mexanik Yutuq (MA)\u003c/td>\n                                \u003ctd class=\"p-3 text-sky-400\">Birliksiz (Nisbat)\u003c/td>\n                                \u003ctd class=\"p-3 text-purple-300\">MA = F_kutilgan / P\u003c/td>\n                                \u003ctd class=\"p-3 font-sans text-slate-400\">Ishqalanishsiz sharoitdagi nazariy kuchdan yutish karraliligi\u003c/td>\n                            \u003c/tr>\n                        \u003c/tbody>\n                    \u003c/table>\n                \u003c/div>\n            \u003c/div>\n            \n            \u003cdiv class=\"flex justify-end\">\n                \u003cbutton onclick=\"switchTab('builder')\" class=\"px-6 py-3 bg-gradient-to-r from-sky-600 to-sky-500 hover:from-sky-500 hover:to-sky-400 text-white font-semibold rounded-xl shadow-lg shadow-sky-600/30 transition flex items-center space-x-2\">\n                    \u003cspan>2-Bosqich: Konstruktor va Yasashga o'tish\u003c/span>\n                    \u003ci class=\"fa-solid fa-arrow-right\">\u003c/i>\n                \u003c/button>\n            \u003c/div>\n        \u003c/section>\n\n        \u003c!-- ================= TAB 2: KONSTRUKTOR VA YASASH ================= -->\n        \u003csection id=\"tab-builder\" class=\"tab-content hidden space-y-6\">\n            \u003cdiv class=\"bg-g 00 flex items-center space-x-2\">\n                                        \u003ci class=\"fa-solid fa-weight-hanging text-amber-400\">\u003c/i>\n                                        \u003cspan>Ko'tariladigan Yuk Og'irligi (P = m·g):\u003c/span>\n                                    \u003c/label>\n                                    \u003cspan id=\"val-weight\" class=\"font-mono text-amber-400 font-bold text-sm\">100 N\u003c/span>\n                                \u003c/div>\n                                \u003cinput type=\"range\" id=\"slider-weight\" min=\"20\" max=\"400\" step=\"10\" value=\"100\" oninput=\"updateControls()\" class=\"w-full accent-amber-500 bg-slate-800 h-2 rounded-lg cursor-pointer\">\n                                \u003cdiv class=\"flex justify-between text-[10px] text-slate-500 font-mono\">\n                                    \u003cspan>20 N\u003c/span>\n                                    \u003cspan>200 N\u003c/span>\n                                    \u003cspan>400 N\u003c/span>\n                                \u003c/div>\n                            \u003c/div>\n\n                            \u003c!-- Control 2: Parameter 1 (Ratio / Angle / Pulley count / Winch radius) -->\n                            \u003cdiv class=\"bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2\">\n                                \u003cdiv class=\"flex justify-between items-center text-xs\">\n                                    \u003clabel id=\"label-param1\" for=\"slider-param1\" class=\"font-semibold text-slate-200 flex items-center space-x-2\">\n                                        \u003ci class=\"fa-solid fa-arrows-left-right text-sky-400\">\u003c/i>\n                                        \u003cspan>Yelkalar Nisbati (L1 / L2):\u003c/span>\n                                    \u003c/label>\n                                    \u003cspan id=\"val-param1\" class=\"font-mono text-sky-400 font-bold text-sm\">2.0\u003c/span>\n
