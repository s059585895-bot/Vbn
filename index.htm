eTo(l,22);c.lineTo(l,H-b);c.lineTo(W-8,H-b);c.stroke();\n  c.fillText(Y.toFixed(1),2,32);c.fillText(T.toFixed(1)+' s',W-44,H-10);c.fillText('0',l-10,H-b+14);\n  c.strokeStyle=col;c.lineWidth=2.5;c.beginPath();\n  pts.forEach((q,i)=>{const X=l+(q[0]/T)*(W-l-8),Yp=H-b-(q[1]/Y)*(H-b-24);i?c.lineTo(X,Yp):c.moveTo(X,Yp)});c.stroke();\n}\nfunction reset(){cancelAnimationFrame(raf);st={t:0,s:0,run:false,pts:[[0,0,0]],last:0,done:false};$('res').innerHTML='';draw2();}\nfunction tick(now){\n  if(!st.run)return;\n  const p=par(),dt=Math.min(.05,(now-st.last)/1000)*$('sp').value;st.last=now;\n  st.t+=dt;st.s=.5*p.a*st.t*st.t;\n  if(st.s>=p.L){st.s=p.L;st.t=Math.sqrt(2*p.L/p.a);st.run=false;st.done=true;}\n  st.pts.push([st.t,p.a*st.t,st.s]);draw2();\n  if(st.done){$('res').innerHTML=`\u003ctable>\u003ctr>\u003cth>Natija\u003c/th>\u003cth>Qiymat\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Tezlanish a\u003c/td>\u003ctd>${p.a.toFixed(2)} m/s²\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Yo'l s\u003c/td>\u003ctd>${p.L} m\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Vaqt t\u003c/td>\u003ctd>${st.t.toFixed(2)} s\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Oxirgi tezlik v\u003c/td>\u003ctd>${(p.a*st.t).toFixed(2)} m/s\u003c/td>\u003c/tr>\u003c/table>`;return;}\n  raf=requestAnimationFrame(tick);\n}\n$('go').onclick=()=>{\n  const p=par();if(!p.moves){draw2();return;}\n  if(st.done)reset();\n  if(st.run)return;st.run=true;st.last=performance.now();raf=requestAnimationFrame(tick);\n};\n$('st').onclick=()=>{st.run=false;};\n$('rs').onclick=reset;\n['a2','m2','u2','l2'].forEach(i=>$(i).oninput=reset);\ndraw1();reset();\nmatchMedia('(prefers-color-scheme: dark)').onchange=()=>{draw1();draw2();};\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "9-mavzu": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Qiya tekislik va FIK — interaktiv taqdimot\u003c/title>\n\u003cstyle>\n:root{--navy:#121b3d;--blue:#2d5dbe;--purple:#6f4cc4;--cyan:#37bed2;--orange:#f49d42;--green:#2aa475;--red:#da5360;--ink:#232b42;--muted:#687389;--pale:#f1f5ff;--white:#fff}\n*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#e9edfa;color:var(--ink)}\n.deck{width:min(1100px,100%);margin:auto;padding:14px}\n.slide{display:none;min-height:min(690px,calc(100vh - 105px));background:var(--pale);border-radius:20px;overflow:hidden;position:relative;padding:clamp(22px,4vw,52px);box-shadow:0 12px 35px #1b285018}\n.slide.active{display:block}.slide:before{content:\"\";position:absolute;top:0;left:0;right:0;height:8px;background:linear-gradient(90deg,var(--purple),var(--cyan))}\nh1,h2,h3,p{margin-top:0} h1{font-size:clamp(30px,5vw,56px);line-height:1.1;color:white} h2{font-size:clamp(24px,3.5vw,36px);color:var(--navy);margin-bottom:22px} h3{color:var(--purple);margin-bottom:10px}\np,li{font-size:clamp(16px,2vw,20px);line-height:1.45} ul,ol{padding-left:1.25em} li{margin:.45em 0}\n.kicker{font-size:12px;font-weight:bold;letter-spacing:1.7px;color:var(--purple);text-transform:uppercase;margin-bottom:10px}\n.cover{background:radial-gradient(circle at 85% 20%,#7659cb 0,transparent 25%),linear-gradient(135deg,#121b3d,#202c63 70%,#3d3887);display:flex;flex-direction:column;justify-content:center}\n.cover h1{max-width:850px}.cover .sub{font-size:clamp(19px,2.7vw,28px);color:#6ce0ee;max-width:750px}.cover .small{color:#dce5ff;font-size:14px;margin-top:26px}\n.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}\n.card{background:white;border:1px solid #d8e4ff;border-radius:16px;padding:20px;box-shadow:0 5px 16px #1b285008}\n.card.dark{background:var(--navy);color:white;border-color:var(--navy)}.card.dark h3{color:var(--cyan)}\n.formula{font-size:clamp(22px,3vw,32px);font-weight:bold;color:var(--purple);text-align:center;padding:12px 4px}.formula.blue{color:var(--blue)}.formula.green{color:var(--green)}\n.note{font-size:14px;color:var(--muted)}.callout{border-left:5px solid var(--cyan);padding:12px 16px;background:#e4f8fc;border-radius:8px;font-size:16px;line-height:1.45}\n.diagram{width:100%;height:auto;max-height:390px;background:#fff;border-radius:14px;border:1px solid #d8e4ff}\n.controls{display:flex;gap:10px;align-items:center;justify-content:center;padding:12px;flex-wrap:wrap}\nbutton{border:0;background:var(--purple);color:white;border-radius:999px;padding:12px 20px;font-weight:bold;font-size:15px;cursor:pointer}\nbutton.secondary{background:white;color:var(--navy);border:1px solid #cbd5ee}button:disabled{opacity:.4;cursor:not-allowed}\n.progress{height:5px;background:#d8def0;border-radius:10px;overflow:hidden;margin:0 12px}.progress span{display:block;height:100%;width:6.25%;background:linear-gradient(90deg,var(--purple),var(--cyan));transition:width .2s}\n.slide-num{color:var(--muted);font-size:13px;min-width:70px;text-align:center}\nlabel{display:block;font-weight:bold;font-size:14px;margin:12px 0 6px}input[type=range]{width:100%;accent-color:var(--purple)}input[type=number]{width:100%;padding:10px;border:1px solid #cbd5ee;border-radius:8px;font-size:16px}\n.metric{background:#f3f6ff;border-radius:12px;padding:12px;text-align:center}.metric strong{display:block;font-size:clamp(20px,3vw,28px);color:var(--purple);margin-top:4px}\ntable{border-collapse:collapse;width:100%;background:white;border-radius:10px;overflow:hidden;font-size:14px}th,td{padding:10px;border:1px solid #dbe3f5;text-align:center}th{background:var(--navy);color:white}\n.footer{font-size:12px;color:var(--muted);position:absolute;bottom:14px;left:clamp(22px,4vw,52px)}\n@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}.slide{min-height:calc(100vh - 120px);padding:25px 20px 45px}.footer{left:20px}.hide-mobile{display:none}.controls button{padding:10px 15px}}\n@media print{body{background:white}.deck{width:100%;padding:0}.slide{display:block!important;page-break-after:always;min-height:95vh;border-radius:0;box-shadow:none}.controls,.progress{display:none}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"deck\">\n\u003csection class=\"slide cover active\">\n\u003cdiv class=\"kicker\" style=\"color:#6ce0ee\">FIZIKA • INTERAKTIV TAQDIMOT\u003c/div>\n\u003ch1>JISMNI QIYA TEKISLIK BO‘YLAB KO‘CHIRISHDA BAJARILGAN ISH\u003c/h1>\n\u003cdiv class=\"sub\">Qiya tekislikning foydali ish koeffitsiyenti (FIK)\u003c/div>\n\u003csvg viewBox=\"0 0 800 260\" class=\"diagram\" style=\"background:#ffffff12;border:0;margin-top:25px;max-width:700px\">\n\u003cline x1=\"70\" y1=\"220\" x2=\"730\" y2=\"220\" stroke=\"#cbd5ee\" stroke-width=\"3\"/>\n\u003cline x1=\"100\" y1=\"220\" x2=\"650\" y2=\"65\" stroke=\"#6ce0ee\" stroke-width=\"8\" stroke-linecap=\"round\"/>\n\u003crect x=\"330\" y=\"143\" width=\"76\" height=\"48\" rx=\"8\" fill=\"#f49d42\" transform=\"rotate(-15.7 368 167)\"/>\n\u003cpath d=\"M370 158 L455 134\" stroke=\"#55d7a2\" stroke-width=\"5\" stroke-linecap=\"round\"/>\u003cpath d=\"M455 134 l-16 -10 l4 18\" fill=\"#55d7a2\"/>\n\u003cpath d=\"M367 170 L367 224\" stroke=\"#da5360\" stroke-width=\"4\"/>\u003cpath d=\"M367 224 l-8 -13 h16z\" fill=\"#da5360\"/>\n\u003ctext x=\"468\" y=\"130\" fill=\"#55d7a2\" font-size=\"22\" font-weight=\"bold\">F\u003c/text>\u003ctext x=\"379\" y=\"210\" fill=\"#da5360\" font-size=\"20\" font-weight=\"bold\">mg\u003c/text>\n\u003ctext x=\"550\" y=\"160\" fill=\"#dce5ff\" font-size=\"18\">h\u003c/text>\u003ctext x=\"290\" y=\"244\" fill=\"#dce5ff\" font-size=\"18\">l — tekislik uzunligi\u003c/text>\n\u003c/svg>\n\u003cdiv class=\"small\">Mexanik ish • FIK • Ishqalanish • Virtual laboratoriya\u003c/div>\n\u003cdiv class=\"footer\" style=\"color:#cbd5ee\">01 / 16\u003c/div>\n\u003c/section>\n\n\u003csection class=\"slide\">\n\u003cdiv class=\"kicker\">Darsga kirish\u003c/div>\u003ch2>Dars maqsadi va kutilayotgan natijalar\u003c/h2>\n\u003cdiv class=\"grid2\">\n\u003cdiv class=\"card\">\u003ch3>Dars maqsadi\u003c/h3>\u003cul>\u003cli>Qiya tekislikning ishlash prinsipini tushunish.\u003c/li>\u003cli>Mexanik ishni formulalar bilan hisoblash.\u003c/li>\u003cli>FIKni aniqlash va natijani izohlash.\u003c/li>\u003cli>Ishqalanishning energiya sarfiga ta’sirini tahlil qilish.\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"card dark\">\u003ch3>O‘quvchi dars oxirida…\u003c/h3>\u003cul>\u003cli>\u003cb>m, h, l, F\u003c/b> kattaliklarini ajratadi.\u003c/li>\u003cli>\u003cb>A = Fl\u003c/b> va \u003cb>A\u003csub>foydali\u003c/sub> = mgh\u003c/b> formulalarini qo‘llaydi.\u003c/li>\u003cli>FIKni foizda hisoblaydi.\u003c/li>\u003cli>Kundalik hayotdagi rampalarni tushuntiradi.\u003c/li>\u003c/ul>\u003c/div>\n\u003c/div>\u003cdiv class=\"footer\">02 / 16\u003c/div>\n\u003c/section>\n\n\u003csection class=\"slide\">\n\u003cdiv class=\"kicker\">Asosiy tushuncha\u003c/div>\u003ch2>Qiya tekislik nima?\u003c/h2>\n\u003cdiv class=\"grid2\">\n\u003cdiv class=\"card\">\u003cp>\u003cb>Qiya tekislik\u003c/b> — yukni balandlikka ko‘tarishda kerakli kuchni kamaytirishga yordam beradigan oddiy mexanizm.\u003c/p>\u003cul>\u003cli>Kuch kamayishi evaziga yo‘l uzayadi.\u003c/li>\u003cli>Ideal holatda ish yutug‘i bo‘lmaydi.\u003c/li>\u003cli>Misollar: pandus, yuk rampasi, tog‘ yo‘li.\u003c/li>\u003c/ul>\u003cdiv class=\"callout\">Savol: nega yukni uzunroq yo‘l bo‘ylab ko‘tarish qulayroq bo‘lishi mumkin?\u003c/div>\u003c/div>\n\u003csvg viewBox=\"0 0 500 350\" class=\"diagram\">\u003cline x1=\"35\" y1=\"300\" x2=\"465\" y2=\"300\" stroke=\"#687389\" stroke-width=\"3\"/>\u003cline x1=\"70\" y1=\"300\" x2=\"400\" y2=\"90\" stroke=\"#2d5dbe\" stroke-width=\"7\"/>\u003cline x1=\"400\" y1=\"90\" x2=\"400\" y2=\"300\" stroke=\"#37bed2\" stroke-width=\"3\" stroke-dasharray=\"7 6\"/>\u003crect x=\"215\" y=\"190\" width=\"64\" height=\"42\" rx=\"6\" fill=\"#f49d42\" transform=\"rotate(-32.5 247 211)\"/>\u003cpath d=\"M250 202 L300 170\" stroke=\"#2aa475\" stroke-width=\"5\"/>\u003cpath d=\"M300 170 l-15 1 l8 12\" fill=\"#2aa475\"/>\u003ctext x=\"310\" y=\"164\" font-size=\"20\" fill=\"#2aa475\" font-weight=\"bold\">F\u003c/text>\u003ctext x=\"410\" y=\"190\" font-size=\"20\" fill=\"#37bed2\" font-weight=\"bold\">h\u003c/text>\u003ctext x=\"170\" y=\"330\" font-size=\"18\" fill=\"#2d5dbe\">l — yo‘l uzunligi\u003c/text>\u003c/svg>\n\u003c/div>\u003cp class=\"note\">O‘qituvchi izohi: qiya tekislik kuch va yo‘l o‘rtasidagi almashinuvni ko‘rsatadi.\u003c/p>\u003cdiv class=\"footer\">03 / 16\u003c/div>\n\u003c/section>\n\n\u003csection class=\"slide\">\n\u003cdiv class=\"kicker\">Model va kuchlar\u003c/div>\u003ch2>Qiya tekislikning fizik modeli\u003c/h2>\n\u003cdiv class=\"grid2\">\n\u003cdiv class=\"card\">\u003ch3>Belgilar\u003c/h3>\u003cul>\u003cli>\u003cb>m\u003c/b> — jism massasi (kg)\u003c/li>\u003cli>\u003cb>h\u003c/b> — vertikal balandlik (m)\u003c/li>\u003cli>\u003cb>l\u003c/b> — qiya sirt uzunligi (m)\u003c/li>\u003cli>\u003cb>α\u003c/b> — qiyalik burchagi\u003c/li>\u003cli>\u003cb>mg\u003c/b> — og‘irlik kuchi (N)\u003c/li>\u003cli>\u003cb>F\u003csub>ishq\u003c/sub>\u003c/b> — ishqalanish kuchi\u003c/li>\u003c/ul>\u003c/div>\n\u003csvg viewBox=\"0 0 520 380\" class=\"diagram\">\u003cline x1=\"30\" y1=\"320\" x2=\"485\" y2=\"320\" stroke=\"#687389\" stroke-width=\"3\"/>\u003cline x1=\"60\" y1=\"320\" x2=\"435\" y2=\"100\" stroke=\"#2d5dbe\" stroke-width=\"7\"/>\u003cline x1=\"435\" y1=\"100\" x2=\"435\" y2=\"320\" stroke=\"#37bed2\" stroke-width=\"3\" stroke-dasharray=\"7 6\"/>\u003crect x=\"225\" y=\"205\" width=\"70\" height=\"46\" rx=\"5\" fill=\"#f49d42\" transform=\"rotate(-30.4 260 228)\"/>\u003cpath d=\"M260 220 L325 182\" stroke=\"#2aa475\" stroke-width=\"5\"/>\u003cpath d=\"M325 182 l-15 0 l8 13\" fill=\"#2aa475\"/>\u003ctext x=\"332\" y=\"179\" font-size=\"19\" fill=\"#2aa475\" font-weight=\"bold\">F\u003c/text>\u003cpath d=\"M255 235 L255 295\" stroke=\"#da5360\" stroke-width=\"4\"/>\u003cpath d=\"M255 295 l-8 -13 h16z\" fill=\"#da5360\"/>\u003ctext x=\"265\" y=\"280\" font-size=\"18\" fill=\"#da5360\" font-weight=\"bold\">mg\u003c/text>\u003cpath d=\"M245 220 L190 252\" stroke=\"#6f4cc4\" stroke-width=\"4\"/>\u003cpath d=\"M190 252 l8 -14 l8 13z\" fill=\"#6f4cc4\"/>\u003ctext x=\"125\" y=\"264\" font-size=\"17\" fill=\"#6f4cc4\">Fᵢshq\u003c/text>\u003ctext x=\"445\" y=\"210\" font-size=\"20\" fill=\"#37bed2\" font-weight=\"bold\">h\u003c/text>\u003ctext x=\"165\" y=\"350\" font-size=\"18\" fill=\"#2d5dbe\">l\u003c/text>\u003c/svg>\n\u003c/div>\u003cdiv class=\"callout\">Kuchlarni chizmada ko‘rsatishda tortish kuchi harakat bo‘ylab yuqoriga, ishqalanish esa harakatga qarshi yo‘naladi.\u003c/div>\u003cdiv class=\"footer\">04 / 16\u003c/div>\n\u003c/section>\n\n\u003csection class=\"slide\">\n\u003cdiv class=\"kicker\">1-reja\u003c/div>\u003ch2>Jismni qiya tekislikda ko‘chirishda bajarilgan ish\u003c/h2>\n\u003cdiv class=\"grid3\">\n\u003cdiv class=\"card\">\u003ch3>Umumiy formula\u003c/h3>\u003cdiv class=\"formula\">A = Fs cos φ\u003c/div>\u003cp class=\"note\">Kuch va siljish orasidagi burchak hisobga olinadi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Kuch yo‘nalishi bo‘ylab\u003c/h3>\u003cdiv class=\"formula blue\">A = Fl\u003c/div>\u003cp class=\"note\">Kuch va siljish bir yo‘nalishda bo‘lsa.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Ideal qiya tekislik\u003c/h3>\u003cdiv class=\"formula green\">Fl = mgh\u003c/div>\u003cp class=\"note\">Ishqalanish bo‘lmaganda va jism bir tekis ko‘tarilganda.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"callout\" style=\"margin-top:20px\">\u003cb>Natija:\u003c/b> F = mgh/l. Bir xil balandlik uchun qiya tekislik uzaygan sari talab qilinadigan kuch kamayadi.\u003c/div>\n\u003cp class=\"note\" style=\"margin-top:15px\">Ishning SI birligi — joul (J); 1 J = 1 N·m.\u003c/p>\u003cdiv class=\"footer\">05 / 16\u003c/div>\n\u003c/section>\n\n\u003csection class=\"slide\">\n\u003cdiv class=\"kicker\">Simulyatsiya 1\u003c/div>\u003ch2>Tik ko‘tarish va qiya tekislikni taqqoslash\u003c/h2>\n\u003cdiv class=\"grid2\">\n\u003cdiv class=\"card\">\u003ch3>Parametrlarni o‘zgartiring\u003c/h3>\n\u003clabel for=\"mass1\">Massa: \u003cspan id=\"massLabel\">10\u003c/span> kg\u003c/label>\u003cinput id=\"mass1\" type=\"range\" min=\"2\" max=\"20\" value=\"10\" oninput=\"updateSim1()\">\n\u003clabel for=\"height1\">Balandlik: \u003cspan id=\"heightLabel\">2.0\u003c/span> m\u003c/label>\u003cinput id=\"height1\" type=\"range\" min=\"0.5\" max=\"3\" step=\"0.5\" value=\"2\" oninput=\"updateSim1()\">\n\u003clabel for=\"length1\">Tekislik uzunligi: \u003cspan id=\"lengthLabel\">5.0\u003c/span> m\u003c/label>\u003cinput id=\"length1\" type=\"range\" min=\"2\" max=\"8\" step=\"0.5\" value=\"5\" oninput=\"updateSim1()\">\n\u003cdiv class=\"callout\">Model: ishqalanish yo‘q, g = 10 m/s².\u003c/div>\u003c/div>\n\u003cdiv class=\"card dark\">\u003ch3>Hisoblangan natijalar\u003c/h3>\u003cdiv class=\"grid2\">\n\u003cdiv class=\"metric\">\u003cspan>Tik ko‘tarish kuchi\u003c/span>\u003cstrong id=\"verticalF\">100 N\u003c/strong>\u003c/div>\n\u003cdiv class=\"metric\">\u003cspan>Qiya tekislik kuchi\u003c/span>\u003cstrong id=\"inclineF\">40 N\u003c/strong>\u003c/div>\n\u003cdiv class=\"metric\">\u003cspan>Tik yo‘l\u003c/span>\u003cstrong id=\"verticalA\">200 J\u003c/strong>\u003c/div>\n\u003cdiv class=\"metric\">\u003cspan>Qiya yo‘l ishi\u003c/span>\u003cstrong id=\"inclineA\">200 J\u003c/strong>\u003c/div>\n\u003c/div>\u003cp style=\"color:#dce5ff;font-size:14px;margin-top:18px\">Ko‘ring: qiya tekislikda kuch kamayadi, lekin bosib o‘tiladigan yo‘l ortadi. Ideal holatda bajarilgan ish bir xil.\u003c/p>\u003c/div>\n\u003c/div>\u003cdiv class=\"footer\">06 / 16\u003c/div>\n\u003c/section>\n\n\u003csection class=\"slide\">\n\u003cdiv class=\"kicker\">Hisoblash\u003c/div>\u003ch2>Masala: yukni qiya tekislik bo‘ylab ko‘tarish\u003c/h2>\n\u003cdiv class=\"grid2\">\n\u003cdiv class=\"card dark\">\u003ch3>Berilgan\u003c/h3>\u003cp style=\"font-size:24px;color:white\">m = 10 kg\u003cbr>h = 2 m\u003cbr>l = 5 m\u003cbr>g = 10 m/s²\u003c/p>\u003cp style=\"color:#dce5ff\">Ishqalanish yo‘q, harakat bir tekis.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Yechish\u003c/h3>\u003cp>\u003cb>1. Tortish kuchi\u003c/b>\u003c/p>\u003cdiv class=\"formula\">F = mgh/l = 40 N\u003c/div>\u003cp>\u003cb>2. Tortish kuchining ishi\u003c/b>\u003c/p>\u003cdiv class=\"formula blue\">A = Fl = 200 J\u003c/div>\u003cp>\u003cb>3. Potensial energiya ortishi\u003c/b>\u003c/p>\u003cdiv class=\"formula green\">ΔEₚ = mgh = 200 J\u003c/div>\u003c/div>\n\u003c/div>\u003cdiv class=\"callout\">Ideal holatda sarflangan ish foydali ishga teng: A = ΔEp = 200 J.\u003c/div>\u003cdiv class=\"footer\">07 / 16\u003c/div>\n\u003c/section>\n\n\u003csection class=\"slide\">\n\u003cdiv class=\"kicker\">2-reja\u003c/div>\u003ch2>Qiya tekislikning foydali ish koeffitsiyenti (FIK)\u003c/h2>\n\u003cdiv class=\"grid2\">\n\u003cdiv class=\"card\">\u003ch3>Umumiy formula\u003c/h3>\u003cdiv class=\"formula\">η = A\u003csub>foydali\u003c/sub> / A\u003csub>sarflangan\u003c/sub> × 100%\u003c/div>\u003cp>FIK — sarflangan ishning qaysi qismi foydali natijaga aylanganini bildiradi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Qiya tekislik uchun\u003c/h3>\u003cdiv class=\"formula blue\">η = mgh / Fl × 100%\u003c/div>\u003cul>\u003cli>\u003cb>mgh\u003c/b> — potensial energiya ortishi.\u003c/li>\u003cli>\u003cb>Fl\u003c/b> — tortish kuchining ishi.\u003c/li>\u003cli>Ideal holatda η = 100%.\u003c/li>\u003cli>Ishqalanish bo‘lsa, odatda η &lt; 100%.\u003c/li>\u003c/ul>\u003c/div>\n\u003c/div>\u003cdiv class=\"footer\">08 / 16\u003c/div>\n\u003c/section>\n\n\u003csection class=\"slide\">\n\u003cdiv class=\"kicker\">Energiya balansi\u003c/div>\u003ch2>FIK animatsiyasi: energiya qayerga ketadi?\u003c/h2>\n\u003cdiv class=\"grid2\">\n\u003cdiv class=\"card\">\u003ch3>Sarflangan ish\u003c/h3>\u003cdiv class=\"formula blue\">250 J\u003c/div>\u003cdiv style=\"height:28px;background:#e4e9f6;border-radius:8px;overflow:hidden\">\u003cdiv style=\"height:100%;width:100%;background:#2d5dbe\">\u003c/div>\u003c/div>\u003cp class=\"note\">Jami kiruvchi energiya\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Energiya taqsimoti\u003c/h3>\u003cp>\u003cb style=\"color:#2aa475\">200 J — foydali\u003c/b>\u003c/p>\u003cdiv style=\"height:26px;background:#e4e9f6;border-radius:8px;overflow:hidden\">\u003cdiv style=\"height:100%;width:80%;background:#2aa475\">\u003c/div>\u003c/div>\u003cp style=\"margin-top:15px\">\u003cb style=\"color:#f49d42\">50 J — yo‘qotish\u003c/b>\u003c/p>\u003cdiv style=\"height:26px;background:#e4e9f6;border-radius:8px;overflow:hidden\">\u003cdiv style=\"height:100%;width:20%;background:#f49d42\">\u003c/div>\u003c/div>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"callout\" style=\"margin-top:20px\">η = 200 / 250 × 100% = \u003cb>80%\u003c/b>. Yo‘qotishlarning asosiy qismi ishqalanish tufayli issiqlikka aylanadi.\u003c/div>\u003cdiv class=\"footer\">09 / 16\u003c/div>\n\u003c/section>\n\n\u003csection class=\"slide\">\n\u003cdiv class=\"kicker\">Simulyatsiya 2\u003c/div>\u003ch2>FIK kalkulyatori\u003c/h2>\n\u003cdiv class=\"grid2\">\n\u003cdiv class=\"card\">\n\u003ch3>Qiymatlarni kiriting\u003c/h3>\n\u003cdiv class=\"grid2\">\n\u003cdiv>\u003clabel for=\"mcalc\">Massa m (kg)\u003c/label>\u003cinput id=\"mcalc\" type=\"number\" min=\"0.1\" step=\"0.1\" value=\"10\" oninput=\"calcFik()\">\u003c/div>\n\u003cdiv>\u003clabel for=\"hcalc\">Balandlik h (m)\u003c/label>\u003cinput id=\"hcalc\" type=\"number\" min=\"0.1\" step=\"0.1\" value=\"2\" oninput=\"calcFik()\">\u003c/div>\n\u003cdiv>\u003clabel for=\"lcalc\">Uzunlik l (m)\u003c/label>\u003cinput id=\"lcalc\" type=\"number\" min=\"0.1\" step=\"0.1\" value=\"5\" oninput=\"calcFik()\">\u003c/div>\n\u003cdiv>\u003clabel for=\"fcalc\">Kuch F (N)\u003c/label>\u003cinput id=\"fcalc\" type=\"number\" min=\"0.1\" step=\"0.1\" value=\"50\" oninput=\"calcFik()\">\u003c/div>\n\u003c/div>\u003clabel for=\"gcalc\">g (m/s²)\u003c/label>\u003cinput id=\"gcalc\" type=\"number\" min=\"1\" step=\"0.1\" value=\"10\" oninput=\"calcFik()\">\n\u003c/div>\n\u003cdiv class=\"card dark\">\u003ch3>Natija\u003c/h3>\u003cdiv class=\"metric\">\u003cspan>Foydali ish\u003c/span>\u003cstrong id=\"usefulWork\">200 J\u003c/strong>\u003c/div>\u003cdiv class=\"metric\" style=\"margin-top:10px\">\u003cspan>Sarflangan ish\u003c/span>\u003cstrong id=\"inputWork\">250 J\u003c/strong>\u003c/div>\u003cdiv class=\"metric\" style=\"margin-top:10px\">\u003cspan>FIK\u003c/span>\u003cstrong id=\"efficiency\">80%\u003c/strong>\u003c/div>\u003cp id=\"calcWarning\" style=\"color:#ffe1a8;font-size:14px;margin-top:14px\">\u003c/p>\u003c/div>\n\u003c/div>\u003cp class=\"note\">Modelning to‘g‘ri ishlashi uchun barcha qiymatlar musbat bo‘lishi kerak. Ideal holatda F = mgh/l.\u003c/p>\u003cdiv class=\"footer\">10 / 16\u003c/div>\n\u003c/section>\n\n\u003csection class=\"slide\">\n\u003cdiv class=\"kicker\">3-reja\u003c/div>\u003ch2>Ishqalanish kuchining FIKga ta’siri\u003c/h2>\n\u003cdiv class=\"grid2\">\n\u003cdiv class=\"card\">\u003ch3>Bir tekis yuqoriga harakat\u003c/h3>\u003cdiv class=\"formula\">F = mg sin α + μmg cos α\u003c/div>\u003cp>Bu formula qiya sirt bo‘ylab ishqalanish koeffitsiyenti bir xil bo‘lgan holat uchun.\u003c/p>\u003cul>\u003cli>μ — ishqalanish koeffitsiyenti.\u003c/li>\u003cli>Ishqalanish harakatga qarshi yo‘naladi.\u003c/li>\u003cli>μ ortsa, kerakli tortish kuchi ortadi.\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Taqqoslang\u003c/h3>\u003cdiv class=\"grid2\">\u003cdiv class=\"metric\">\u003cspan>Silliq sirt\u003c/span>\u003cstrong style=\"color:#2aa475\">Kam qarshilik\u003c/strong>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>G‘adir-budur sirt\u003c/span>\u003cstrong style=\"color:#f49d42\">Ko‘p qarshilik\u003c/strong>\u003c/div>\u003c/div>\u003cp style=\"margin-top:20px\">Bir xil yukni g‘adir-budur sirt bo‘ylab tortish uchun ko‘proq kuch va ish talab etiladi.\u003c/p>\u003cdiv class=\"callout\">Odatda ishqalanish ortishi bilan FIK kamayadi.\u003c/div>\u003c/div>\n\u003c/div>\u003cdiv class=\"footer\">11 / 16\u003c/div>\n\u003c/section>\n\n\u003csection class=\"slide\">\n\u003cdiv class=\"kicker\">Simulyatsiya 3\u003c/div>\u003ch2>Ishqalanishni o‘zgartirish\u003c/h2>\n\u003cdiv class=\"grid2\">\n\u003cdiv class=\"card\">\n\u003ch3>Model parametrlari\u003c/h3>\n\u003clabel for=\"mu\">Ishqalanish koeffitsiyenti μ: \u003cspan id=\"muLabel\">0.20\u003c/span>\u003c/label>\u003cinput id=\"mu\" type=\"range\" min=\"0\" max=\"0.8\" step=\"0.05\" value=\"0.2\" oninput=\"updateFriction()\">\n\u003clabel for=\"angle\">Qiyalik burchagi α: \u003cspan id=\"angleLabel\">25\u003c/span>°\u003c/label>\u003cinput id=\"angle\" type=\"range\" min=\"10\" max=\"45\" step=\"1\" value=\"25\" oninput=\"updateFriction()\">\n\u003cdiv class=\"callout\">Namuna: m = 10 kg, g = 10 m/s², l = 5 m.\u003c/div>\n\u003c/div>\n\u003cdiv class=\"card dark\">\u003ch3>Hisoblangan qiymatlar\u003c/h3>\u003cdiv class=\"grid2\">\n\u003cdiv class=\"metric\">\u003cspan>Tortish kuchi\u003c/span>\u003cstrong id=\"fricForce\">60.5 N\u003c/strong>\u003c/div>\n\u003cdiv class=\"metric\">\u003cspan>Ishqalanish kuchi\u003c/span>\u003cstrong id=\"fricForceOnly\">17.9 N\u003c/strong>\u003c/div>\n\u003cdiv class=\"metric\">\u003cspan>Sarflangan ish\u003c/span>\u003cstrong id=\"fricWork\">302.5 J\u003c/strong>\u003c/div>\n\u003cdiv class=\"metric\">\u003cspan>FIK\u003c/span>\u003cstrong id=\"fricEff\">65.9%\u003c/strong>\u003c/div>\n\u003c/div>\u003cp style=\"color:#dce5ff;font-size:13px;margin-top:12px\">Soddalashtirilgan model: jism tekislik bo‘ylab bir tekis harakatlanadi.\u003c/p>\u003c/div>\n\u003c/div>\u003cdiv class=\"footer\">12 / 16\u003c/div>\n\u003c/section>\n\n\u003csection class=\"slide\">\n\u003cdiv class=\"kicker\">Hayot bilan bog‘lash\u003c/div>\u003ch2>Qiya tekislikning amaliy ahamiyati\u003c/h2>\n\u003cdiv class=\"grid2\">\n\u003cdiv class=\"card\">\u003ch3>♿ Pandus\u003c/h3>\u003cp>Aravachalar va yuk aravalarini balandlikka olib chiqishni qulaylashtiradi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>🚚 Yuk rampasi\u003c/h3>\u003cp>Yukni mashinaga kamroq kuch bilan ko‘tarishga yordam beradi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>⛰ Tog‘ yo‘li\u003c/h3>\u003cp>Yo‘l uzayadi, lekin qiyalik kamayadi va ko‘tarilish qulaylashadi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>⚙ Konveyer\u003c/h3>\u003cp>Materiallarni balandlikka uzluksiz ko‘chirishda qo‘llanadi.\u003c/p>\u003c/div>\n\u003c/div>\u003cdiv class=\"callout\" style=\"margin-top:18px\">Amaliy loyihalashda qiyalik, ishqalanish, mustahkamlik va xavfsizlik hisobga olinadi.\u003c/div>\u003cdiv class=\"footer\">13 / 16\u003c/div>\n\u003c/section>\n\n\u003csection class=\"slide\">\n\u003cdiv class=\"kicker\">Tajriba\u003c/div>\u003ch2>Virtual laboratoriya mashg‘uloti\u003c/h2>\n\u003cdiv class=\"grid2\">\n\u003cdiv class=\"card\">\u003ch3>Ish tartibi\u003c/h3>\u003col>\u003cli>Yuk massasini aniqlang.\u003c/li>\u003cli>Qiya tekislikning h va l qiymatlarini o‘lchang.\u003c/li>\u003cli>Dinamometr bilan F ni o‘lchang.\u003c/li>\u003cli>A\u003csub>foydali\u003c/sub> = mgh ni hisoblang.\u003c/li>\u003cli>A\u003csub>sarflangan\u003c/sub> = Fl ni toping.\u003c/li>\u003cli>FIKni hisoblang va sirtlarni taqqoslang.\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Natijalar jadvali\u003c/h3>\u003ctable>\u003cthead>\u003ctr>\u003cth>№\u003c/th>\u003cth>m (kg)\u003c/th>\u003cth>h (m)\u003c/th>\u003cth>l (m)\u003c/th>\u003cth>F (N)\u003c/th>\u003cth>FIK (%)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"note\" style=\"margin-top:15px\">Muhokama: o‘lchov xatolari va ishqalanish natijaga qanday ta’sir qiladi?\u003c/p>\u003c/div>\n\u003c/div>\u003cdiv class=\"footer\">14 / 16\u003c/div>\n\u003c/section>\n\n\u003csection class=\"slide\">\n\u003cdiv class=\"kicker\">Mustahkamlash\u003c/div>\u003ch2>Test savollari\u003c/h2>\n\u003cdiv class=\"grid2\">\n\u003cdiv class=\"card\">\n\u003cp>\u003cb>1.\u003c/b> Mexanik ishning SI birligi qaysi?\u003cbr>A) N  B) J  C) W  D) kg\u003c/p>\n\u003cp>\u003cb>2.\u003c/b> Ideal qiya tekislikda qaysi tenglik to‘g‘ri?\u003cbr>A) Fl = mgh  B) F = mgh·l  C) Fl = mg/h  D) A = F/l\u003c/p>\n\u003cp>\u003cb>3.\u003c/b> FIK qanday topiladi?\u003cbr>A) Sarflangan/foydali ×100%\u003cbr>B) F·s\u003cbr>C) Foydali/sarflangan ×100%\u003cbr>D) m/h\u003c/p>\n\u003c/div>\n\u003cdiv class=\"card\">\n\u003cp>\u003cb>4.\u003c/b> Ishqalanish ortsa, odatda FIK…\u003cbr>A) ortadi  B) kamayadi  C) o‘zgarmaydi  D) 100% bo‘ladi\u003c/p>\n\u003cp>\u003cb>5.\u003c/b> Qaysi biri qiya tekislikka misol?\u003cbr>A) G‘ildirak  B) Richag  C) Blok  D) Pandus\u003c/p>\n\u003cdiv class=\"callout\">\u003cb>Javoblar kaliti:\u003c/b> 1—B, 2—A, 3—C, 4—B, 5—D.\u003c/div>\n\u003cp>\u003cb>Fikrlash savoli:\u003c/b> Nega rampa uzunroq bo‘lsa ham yukni ko‘tarish qulayroq bo‘lishi mumkin?\u003c/p>\n\u003c/div>\n\u003c/div>\u003cdiv class=\"footer\">15 / 16\u003c/div>\n\u003c/section>\n\n\u003csection class=\"slide cover\">\n\u003cdiv class=\"kicker\" style=\"color:#6ce0ee\">Yakun\u003c/div>\u003ch2 style=\"color:white;font-size:40px\">Xulosa\u003c/h2>\n\u003cdiv class=\"grid2\">\n\u003cdiv class=\"card dark\">\u003ch3>Asosiy formulalar\u003c/h3>\u003cdiv class=\"formula\" style=\"color:#6ce0ee\">Fl = mgh\u003c/div>\u003cdiv class=\"formula\" style=\"color:#6ce0ee\">η = Afoydali / Asarflangan × 100%\u003c/div>\u003c/div>\n\u003cdiv class=\"card dark\">\u003ch3>Esda tuting\u003c/h3>\u003cp style=\"color:white\">Qiya tekislik kuchni kamaytiradi, lekin yo‘lni uzaytiradi.\u003c/p>\u003cp style=\"color:white\">Ishqalanish sarflangan ishni oshiradi va FIKni kamaytiradi.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cp style=\"color:#dce5ff;margin-top:22px\">Foydalanilgan manbalar: maktab fizika darsligi; PhET Interactive Simulations — phet.colorado.edu; GeoGebra — geogebra.org.\u003c/p>\n\u003ch3 style=\"color:#6ce0ee;font-size:25px\">E’tiboringiz uchun rahmat!\u003c/h3>\u003cdiv class=\"footer\" style=\"color:#cbd5ee\">16 / 16\u003c/div>\n\u003c/section>\n\n\u003cdiv class=\"progress\">\u003cspan id=\"progressBar\">\u003c/span>\u003c/div>\n\u003cdiv class=\"controls\">\n\u003cbutton class=\"secondary\" id=\"prev\" onclick=\"move(-1)\">← Oldingi\u003c/button>\n\u003cspan class=\"slide-num\" id=\"slideNum\">1 / 16\u003c/span>\n\u003cbutton id=\"next\" onclick=\"move(1)\">Keyingi →\u003c/button>\n\u003cbutton class=\"secondary\" onclick=\"window.print()\">PDF / Chop etish\u003c/button>\n\u003c/div>\n\u003c/div>\n\u003cscript>\nlet current=0;\nconst slides=[...document.querySelectorAll('.slide')];\nfunction showSlide(i){current=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,n)=>s.classList.toggle('active',n===current));document.getElementById('slideNum').textContent=(current+1)+' / '+slides.length;document.getElementById('progressBar').style.width=((current+1)/slides.length*100)+'%';document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1}\nfunction move(d){showSlide(current+d)}\ndocument.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){move(1)}else if(e.key==='ArrowLeft'){move(-1)}});\nfunction updateSim1(){let m=+document.getElementById('mass1').value,h=+document.getElementById('height1').value,l=+document.getElementById('length1').value;document.getElementById('massLabel').textContent=m;document.getElementById('heightLabel').textContent=h.toFixed(1);document.getElementById('lengthLabel').textContent=l.toFixed(1);document.getElementById('verticalF').textContent=(m*10).toFixed(1)+' N';document.getElementById('inclineF').textContent=(m*10*h/l).toFixed(1)+' N';document.getElementById('verticalA').textContent=(m*10*h).toFixed(1)+' J';document.getElementById('inclineA').textContent=(m*10*h).toFixed(1)+' J'}\nfunction calcFik(){let m=+document.getElementById('mcalc').value,h=+document.getElementById('hcalc').value,l=+document.getElementById('lcalc').value,F=+document.getElementById('fcalc').value,g=+document.getElementById('gcalc').value;let useful=m*g*h,input=F*l;document.getElementById('usefulWork').textContent=Number.isFinite(useful)?useful.toFixed(1)+' J':'—';document.getElementById('inputWork').textContent=Number.isFinite(input)?input.toFixed(1)+' J':'—';let eff=input>0?useful/input*100:NaN;document.getElementById('efficiency').textContent=Number.isFinite(eff)?eff.toFixed(1)+'%':'—';let warn='';if([m,h,l,F,g].some(v=>v\u003c=0)||![m,h,l,F,g].every(Number.isFinite)){warn='Barcha qiymatlar musbat bo‘lishi kerak.'}else if(eff>100.01){warn='Ogohlantirish: natija 100% dan katta. Kiritilgan qiymatlarni yoki model shartlarini tekshiring.'}else if(F+1e-6\u003cm*g*h/l){warn='Bu kuch ishqalanishsiz modelda ham bir tekis ko‘tarish uchun yetarli emas.'}document.getElementById('calcWarning').textContent=warn}\nfunction updateFriction(){let mu=+document.getElementById('mu').value,deg=+document.getElementById('angle').value,rad=deg*Math.PI/180,m=10,g=10,l=5,h=l*Math.sin(rad);let normal=m*g*Math.cos(rad),fric=mu*normal,F=m*g*Math.sin(rad)+fric,input=F*l,useful=m*g*h,eff=useful/input*100;document.getElementById('muLabel').textContent=mu.toFixed(2);document.getElementById('angleLabel').textContent=deg;document.getElementById('fricForce').textContent=F.toFixed(1)+' N';document.getElementById('fricForceOnly').textContent=fric.toFixed(1)+' N';document.getElementById('fricWork').textContent=input.toFixed(1)+' J';document.getElementById('fricEff').textContent=eff.toFixed(1)+'%'}\nshowSlide(0);updateSim1();calcFik();updateFriction();\n\u003c/script>\n\u003c/body>\n\u003c/html>", "10-mavzu": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Masalalar yechish — Qiya tekislik, ish va FIK\u003c/title>\n\u003cstyle>\n:root{--navy:#101a3a;--blue:#3156d9;--violet:#7656e8;--cyan:#32c5d2;--ink:#17213c;--muted:#68738c;--paper:#f4f6fc;--white:#fff;--line:#e1e6f2;--green:#159b72;--orange:#ed9a32;--red:#d94c63}\n*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif;line-height:1.55}\nbutton,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 16px;font-weight:750;transition:.18s}button:hover{transform:translateY(-1px);filter:brightness(1.04)}button:focus-visible,input:focus-visible{outline:3px solid #8e9dff;outline-offset:2px}\n.topbar{position:sticky;top:0;z-index:20;background:rgba(16,26,58,.96);backdrop-filter:blur(12px);color:white;padding:10px 4vw;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-weight:850;letter-spacing:.2px}.brand span{color:#82e6eb}.topnav{display:flex;gap:7px;flex-wrap:wrap}.topnav button{background:transparent;color:#dce4ff;padding:8px 10px;font-size:.86rem}.topnav button.active,.topnav button:hover{background:#2b3865;color:white}\n.hero{background:radial-gradient(circle at 85% 20%,#755be7 0,transparent 32%),linear-gradient(120deg,#111a3a,#263f8d 72%,#2a7eaa);color:white;padding:55px 6vw 48px;position:relative;overflow:hidden}.hero:after{content:\"\";position:absolute;width:300px;height:300px;border:1px solid #ffffff25;border-radius:50%;right:5%;top:12%;box-shadow:0 0 0 35px #ffffff08,0 0 0 70px #ffffff05}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:.78rem;color:#b8f7f2;font-weight:850}.hero h1{font-size:clamp(2rem,4vw,3.5rem);line-height:1.1;max-width:900px;margin:12px 0}.hero p{max-width:760px;color:#e0e7ff;font-size:1.08rem}.hero-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.hero-tags span{border:1px solid #ffffff45;background:#ffffff12;padding:7px 12px;border-radius:99px;font-size:.88rem}\nmain{max-width:1240px;margin:auto;padding:26px 22px 70px}.section{margin:30px 0 42px;scroll-margin-top:82px}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}.section-head h2{font-size:clamp(1.45rem,2.5vw,2rem);margin:0;color:var(--navy)}.section-head p{margin:5px 0 0;color:var(--muted)}.number{display:inline-grid;place-items:center;width:38px;height:38px;background:#e6eaff;color:var(--blue);border-radius:12px;margin-right:9px;font-weight:900}\n.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}.card{grid-column:span 12;background:var(--white);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 8px 26px #2034660a;min-width:0}.half{grid-column:span 6}.third{grid-column:span 4}.card h3{margin:0 0 12px;font-size:1.15rem;color:var(--navy)}.muted{color:var(--muted)}.formula{background:#f0f3ff;border:1px solid #dce3ff;border-radius:13px;padding:12px 15px;font-size:1.08rem;font-weight:800;color:#243a9b;margin:10px 0}.formula small{display:block;font-weight:500;color:#657098;font-size:.8rem;margin-top:3px}.pill{display:inline-block;padding:4px 9px;border-radius:99px;background:#e6faf5;color:#087c5c;font-size:.78rem;font-weight:800}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.control{background:#f8f9ff;border:1px solid var(--line);padding:11px 12px;border-radius:13px}.control label{display:flex;justify-content:space-between;gap:8px;font-weight:750;font-size:.88rem;margin-bottom:7px}.control output{color:var(--blue);font-variant-numeric:tabular-nums}.control input[type=range]{width:100%;accent-color:var(--violet)}.control input[type=number]{width:100%;border:1px solid #cfd7ea;border-radius:8px;padding:8px;background:white}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.primary{background:linear-gradient(110deg,var(--blue),var(--violet));color:white}.secondary{background:#e9edff;color:#2b3eaa}.darkbtn{background:var(--navy);color:white}.ghost{background:#f0f2f8;color:#3b4660}.visual{background:linear-gradient(150deg,#f7f9ff,#edf2ff);border:1px solid #e1e7fa;border-radius:16px;overflow:hidden;min-height:260px;position:relative}.visual canvas{display:block;width:100%;height:290px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:13px}.stat{border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff}.stat span{display:block;color:var(--muted);font-size:.79rem}.stat strong{display:block;font-size:1.12rem;margin-top:3px;color:var(--navy);font-variant-numeric:tabular-nums}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:10px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.steps{counter-reset:step;list-style:none;padding:0}.steps li{counter-increment:step;padding:10px 12px 10px 44px;position:relative;border-bottom:1px solid var(--line)}.steps li:before{content:counter(step);position:absolute;left:0;top:9px;background:#e7eaff;color:#2f49bd;border-radius:9px;width:29px;height:29px;display:grid;place-items:center;font-weight:850}.answer{background:#eafaf4;border:1px solid #c4f0df;padding:13px 15px;border-radius:12px;margin-top:12px}.warning{background:#fff6e8;border:1px solid #ffe0a7;color:#7d5314;padding:12px 14px;border-radius:12px;margin-top:12px}.problem{border:1px solid var(--line);border-radius:16px;padding:17px;margin:12px 0;background:#fff}.problem summary{cursor:pointer;font-weight:800;color:var(--navy)}.problem .content{padding-top:12px}.small{font-size:.88rem}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px 9px}th{background:#f5f7ff;color:#3b4770}.quiz-q{padding:17px 0;border-bottom:1px solid var(--line)}.quiz-q p{font-weight:800;margin:0 0 10px}.option{display:block;border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:7px 0;cursor:pointer}.option:has(input:checked){background:#eef1ff;border-color:#9baaff}.feedback{font-size:.86rem;margin-top:7px}.correct{color:var(--green);font-weight:800}.incorrect{color:var(--red);font-weight:800}.barrow{display:grid;grid-template-columns:100px 1fr 60px;gap:9px;align-items:center;margin:10px 0;font-size:.87rem}.bar{height:14px;border-radius:20px;background:#edf0fa;overflow:hidden}.bar i{display:block;height:100%;border-radius:20px;transition:width .3s}.footer{text-align:center;padding:25px;color:#79839c;font-size:.85rem}.progress{height:4px;background:#ffffff25}.progress i{display:block;height:100%;width:0;background:#6fe5e7;transition:width .2s}.key{font-size:.78rem;background:#eef1f9;padding:2px 6px;border-radius:5px}\n@media(max-width:850px){.half,.third{grid-column:span 12}.topbar{align-items:flex-start;flex-direction:column}.topnav{width:100%}.hero{padding:38px 22px}.hero:after{right:-130px}.controls{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.section-head{align-items:flex-start;flex-direction:column}}\n@media(max-width:480px){main{padding:15px 12px 45px}.card{padding:15px;border-radius:16px}.hero h1{font-size:2rem}.topnav button{font-size:.78rem;padding:7px}.stats{grid-template-columns:1fr 1fr}.stat strong{font-size:1rem}.visual canvas{height:245px}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"progress\">\u003ci id=\"scrollProgress\">\u003c/i>\u003c/div>\n\u003cheader class=\"topbar\">\n  \u003cdiv class=\"brand\">PHY\u003cspan>SIM\u003c/span> · Fizika laboratoriyasi\u003c/div>\n  \u003cnav class=\"topnav\" aria-label=\"Bo‘limlar\">\n    \u003cbutton class=\"active\" data-jump=\"nazariya\">Nazariya\u003c/button>\u003cbutton data-jump=\"sim1\">Simulyatsiya 1\u003c/button>\u003cbutton data-jump=\"sim2\">FIK laboratoriyasi\u003c/button>\u003cbutton data-jump=\"sim3\">Ishqalanish\u003c/button>\u003cbutton data-jump=\"masalalar\">Masalalar\u003c/button>\u003cbutton data-jump=\"test\">Test\u003c/button>\n  \u003c/nav>\n\u003c/header>\n\u003csection class=\"hero\">\n  \u003cdiv class=\"eyebrow\">Interaktiv o‘quv resursi · 9–10-sinf\u003c/div>\n  \u003ch1>Qiya tekislik: harakat, ish va FIK\u003c/h1>\n  \u003cp>Formulalarni takrorlang, kuchlar yo‘nalishini kuzating, virtual tajribalar o‘tkazing va masalalarni bosqichma-bosqich yeching.\u003c/p>\n  \u003cdiv class=\"hero-tags\">\u003cspan>◈ 3 ta simulyatsiya\u003c/span>\u003cspan>∑ Avtomatik hisoblash\u003c/span>\u003cspan>✓ 8 ta test\u003c/span>\u003cspan>▱ Mobilga mos\u003c/span>\u003c/div>\n\u003c/section>\n\u003cmain>\n\u003csection class=\"section\" id=\"nazariya\">\n \u003cdiv class=\"section-head\">\u003cdiv>\u003ch2>\u003cspan class=\"number\">01\u003c/span>Nazariy formulalarni takrorlash\u003c/h2>\u003cp>Asosiy tushunchalar, belgilar va formulalar.\u003c/p>\u003c/div>\u003c/div>\n \u003cdiv class=\"grid\">\n  \u003carticle class=\"card half\">\u003ch3>Qiya tekislik geometriyasi\u003c/h3>\u003cp>Qiya tekislik yukni kichikroq kuch bilan ko‘tarishga yordam beradi, lekin bosib o‘tiladigan yo‘l uzayadi.\u003c/p>\n   \u003cdiv class=\"formula\">sin α = h/s \u003csmall>h — balandlik (m), s — tekislik uzunligi (m)\u003c/small>\u003c/div>\n   \u003cdiv class=\"formula\">cos α = √(s² − h²) / s \u003csmall>Bu yerda s ≥ h bo‘lishi kerak.\u003c/small>\u003c/div>\n   \u003cdiv class=\"formula\">h = s · sin α\u003c/div>\n  \u003c/article>\n  \u003carticle class=\"card half\">\u003ch3>Ish va foydali ish koeffitsiyenti\u003c/h3>\n   \u003cdiv class=\"formula\">A = F · s · cos θ \u003csmall>θ — kuch bilan siljish orasidagi burchak.\u003c/small>\u003c/div>\n   \u003cdiv class=\"formula\">A\u003csub>f\u003c/sub> = mgh \u003csmall>Foydali ish; m (kg), g (N/kg), h (m).\u003c/small>\u003c/div>\n   \u003cdiv class=\"formula\">η = (A\u003csub>f\u003c/sub> / A\u003csub>t\u003c/sub>) · 100% \u003csmall>A\u003csub>t\u003c/sub> — to‘liq bajarilgan ish.\u003c/small>\u003c/div>\n  \u003c/article>\n  \u003carticle class=\"card half\">\u003ch3>Kuchlar va muvozanat\u003c/h3>\n   \u003cdiv class=\"formula\">F = mg · sin α \u003csmall>Ishqalanishsiz, tekislik bo‘ylab bir tekis ko‘tarishda.\u003c/small>\u003c/div>\n   \u003cdiv class=\"formula\">N = mg · cos α\u003c/div>\n   \u003cdiv class=\"formula\">F\u003csub>ishq\u003c/sub> = μN \u003csmall>μ — sirpanish ishqalanish koeffitsiyenti.\u003c/small>\u003c/div>\n   \u003cp class=\"small muted\">Ishqalanish bo‘lsa va yuk bir tekis yuqoriga harakatlansa: F = mg sin α + μmg cos α.\u003c/p>\n  \u003c/article>\n  \u003carticle class=\"card half\">\u003ch3>Belgilar va o‘lchov birliklari\u003c/h3>\n   \u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Belgi\u003c/th>\u003cth>Ma’nosi\u003c/th>\u003cth>Birlik\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n   \u003ctr>\u003ctd>m\u003c/td>\u003ctd>massa\u003c/td>\u003ctd>kg\u003c/td>\u003c/tr>\u003ctr>\u003ctd>F, N\u003c/td>\u003ctd>kuch, tayanch reaksiya\u003c/td>\u003ctd>N\u003c/td>\u003c/tr>\u003ctr>\u003ctd>s, h\u003c/td>\u003ctd>yo‘l, balandlik\u003c/td>\u003ctd>m\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A\u003c/td>\u003ctd>mexanik ish\u003c/td>\u003ctd>J\u003c/td>\u003c/tr>\u003ctr>\u003ctd>μ, η\u003c/td>\u003ctd>ishqalanish koeffitsiyenti, FIK\u003c/td>\u003ctd>o‘lchovsiz, %\u003c/td>\u003c/tr>\n   \u003c/tbody>\u003c/table>\u003c/div>\n   \u003cp class=\"small muted\">Hisoblashlarda, agar boshqacha berilmagan bo‘lsa, g = 10 N/kg deb olinadi.\u003c/p>\n  \u003c/article>\n \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" id=\"sim1\">\n \u003cdiv class=\"section-head\">\u003cdiv>\u003ch2>\u003cspan class=\"number\">02\u003c/span>Simulyatsiya 1 — Qiya tekislik bo‘ylab harakat\u003c/h2>\u003cp>Parametrlarni o‘zgartiring va jismga ta’sir etuvchi kuchlarni kuzating.\u003c/p>\u003c/div>\u003cspan class=\"pill\">Interaktiv model\u003c/span>\u003c/div>\n \u003cdiv class=\"grid\">\n  \u003carticle class=\"card half\">\u003ch3>Parametrlar\u003c/h3>\u003cdiv class=\"controls\">\n   \u003cdiv class=\"control\">\u003clabel for=\"m1\">Massa \u003coutput id=\"m1o\">10 kg\u003c/output>\u003c/label>\u003cinput id=\"m1\" type=\"range\" min=\"1\" max=\"50\" value=\"10\">\u003c/div>\n   \u003cdiv class=\"control\">\u003clabel for=\"s1\">Tekislik uzunligi \u003coutput id=\"s1o\">5 m\u003c/output>\u003c/label>\u003cinput id=\"s1\" type=\"range\" min=\"2\" max=\"10\" step=\".5\" value=\"5\">\u003c/div>\n   \u003cdiv class=\"control\">\u003clabel for=\"h1\">Balandlik \u003coutput id=\"h1o\">1 m\u003c/output>\u003c/label>\u003cinput id=\"h1\" type=\"range\" min=\".5\" max=\"4.5\" step=\".1\" value=\"1\">\u003c/div>\n   \u003cdiv class=\"control\">\u003clabel for=\"mu1\">Ishqalanish μ \u003coutput id=\"mu1o\">0.00\u003c/output>\u003c/label>\u003cinput id=\"mu1\" type=\"range\" min=\"0\" max=\".5\" step=\".01\" value=\"0\">\u003c/div>\n  \u003c/div>\u003cdiv class=\"warning\" id=\"geomWarning\" hidden>Balandlik uzunlikdan katta bo‘la olmaydi. Qiymatlar avtomatik moslashtiriladi.\u003c/div>\n  \u003cdiv class=\"actions\">\u003cbutton class=\"primary\" id=\"start1\">▶ Boshlash\u003c/button>\u003cbutton class=\"secondary\" id=\"pause1\">Ⅱ Pauza\u003c/button>\u003cbutton class=\"ghost\" id=\"reset1\">↺ Qayta boshlash\u003c/button>\u003c/div>\n  \u003cdiv class=\"stats\">\u003cdiv class=\"stat\">\u003cspan>Qiyalik burchagi\u003c/span>\u003cstrong id=\"ang1\">11.5°\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003cspan>Kerakli tortish kuchi\u003c/span>\u003cstrong id=\"force1\">— N\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003cspan>Jism balandligi\u003c/span>\u003cstrong id=\"height1\">0.0 m\u003c/strong>\u003c/div>\u003c/div>\n  \u003c/article>\n  \u003carticle class=\"card half\">\u003ch3>Harakat animatsiyasi\u003c/h3>\u003cdiv class=\"visual\">\u003ccanvas id=\"canvas1\" aria-label=\"Qiya tekislikda yuk va kuchlar tasviri\">\u003c/canvas>\u003c/div>\u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"dot\" style=\"background:#3156d9\">\u003c/i>Tortish kuchi\u003c/span>\u003cspan>\u003ci class=\"dot\" style=\"background:#d94c63\">\u003c/i>Og‘irlik kuchi\u003c/span>\u003cspan>\u003ci class=\"dot\" style=\"background:#159b72\">\u003c/i>Tayanch reaksiya\u003c/span>\u003cspan>\u003ci class=\"dot\" style=\"background:#ed9a32\">\u003c/i>Ishqalanish\u003c/span>\u003c/div>\u003cp class=\"small muted\">Modelda yuk bir tekis yuqoriga tortiladi; vektorlar sxematik tarzda ko‘rsatilgan.\u003c/p>\u003c/article>\n \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" id=\"sim2\">\n \u003cdiv class=\"section-head\">\u003cdiv>\u003ch2>\u003cspan class=\"number\">03\u003c/span>Simulyatsiya 2 — FIKni tajribada aniqlash\u003c/h2>\u003cp>Massa, geometriya va tortuvchi kuchni o‘zgartirib, foydali va to‘liq ishni solishtiring.\u003c/p>\u003c/div>\u003c/div>\n \u003cdiv class=\"grid\">\n  \u003carticle class=\"card half\">\u003ch3>Tajriba sozlamalari\u003c/h3>\u003cdiv class=\"controls\">\n   \u003cdiv class=\"control\">\u003clabel for=\"m2\">Massa \u003coutput id=\"m2o\">10 kg\u003c/output>\u003c/label>\u003cinput id=\"m2\" type=\"range\" min=\"1\" max=\"60\" value=\"10\">\u003c/div>\n   \u003cdiv class=\"control\">\u003clabel for=\"s2\">Tekislik uzunligi \u003coutput id=\"s2o\">5 m\u003c/output>\u003c/label>\u003cinput id=\"s2\" type=\"range\" min=\"2\" max=\"12\" step=\".5\" value=\"5\">\u003c/div>\n   \u003cdiv class=\"control\">\u003clabel for=\"h2\">Balandlik \u003coutput id=\"h2o\">1 m\u003c/output>\u003c/label>\u003cinput id=\"h2\" type=\"range\" min=\".5\" max=\"5\" step=\".1\" value=\"1\">\u003c/div>\n   \u003cdiv class=\"control\">\u003clabel for=\"f2\">Tortuvchi kuch \u003coutput id=\"f2o\">30 N\u003c/output>\u003c/label>\u003cinput id=\"f2\" type=\"range\" min=\"10\" max=\"500\" step=\"5\" value=\"30\">\u003c/div>\n  \u003c/div>\u003cdiv id=\"warn2\" class=\"warning\" hidden>Geometriya yoki kuch qiymatini tekshiring: foydali ish to‘liq ishdan katta bo‘lmasligi kerak.\u003c/div>\n  \u003cdiv class=\"stats\">\u003cdiv class=\"stat\">\u003cspan>Foydali ish\u003c/span>\u003cstrong id=\"af2\">100 J\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003cspan>To‘liq ish\u003c/span>\u003cstrong id=\"at2\">150 J\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003cspan>FIK\u003c/span>\u003cstrong id=\"eta2\">66.7%\u003c/strong>\u003c/div>\u003c/div>\n  \u003cdiv class=\"actions\">\u003cbutton class=\"secondary\" id=\"addTrial\">＋ Natijani jadvalga qo‘shish\u003c/button>\u003cbutton class=\"ghost\" id=\"clearTrials\">Jadvalni tozalash\u003c/button>\u003c/div>\u003c/article>\n  \u003carticle class=\"card half\">\u003ch3>Ishlar taqqoslanishi\u003c/h3>\u003cdiv id=\"bars2\">\u003c/div>\u003cdiv class=\"formula\" id=\"conclusion2\">FIK — foydali ishning to‘liq ishga nisbati.\u003c/div>\u003cp class=\"small muted\">Ishqalanishsiz ideal holatda η = 100%. Real tajribada energiyaning bir qismi issiqlik va boshqa yo‘qotishlarga ketadi.\u003c/p>\u003c/article>\n  \u003carticle class=\"card\">\u003ch3>Tajriba natijalari jadvali\u003c/h3>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>m (kg)\u003c/th>\u003cth>s (m)\u003c/th>\u003cth>h (m)\u003c/th>\u003cth>F (N)\u003c/th>\u003cth>A\u003csub>f\u003c/sub> (J)\u003c/th>\u003cth>A\u003csub>t\u003c/sub> (J)\u003c/th>\u003cth>FIK (%)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"trialRows\">\u003ctr>\u003ctd colspan=\"8\" class=\"muted\">Hozircha natija yo‘q. “Natijani jadvalga qo‘shish” tugmasini bosing.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/article>\n \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" id=\"sim3\">\n \u003cdiv class=\"section-head\">\u003cdiv>\u003ch2>\u003cspan class=\"number\">04\u003c/span>Simulyatsiya 3 — Ishqalanishning ta’siri\u003c/h2>\u003cp>Ideal va ishqalanishli holatdagi kuch, ish va FIKni taqqoslang.\u003c/p>\u003c/div>\u003c/div>\n \u003cdiv class=\"grid\">\n  \u003carticle class=\"card half\">\u003ch3>Parametrlar\u003c/h3>\u003cdiv class=\"controls\">\n   \u003cdiv class=\"control\">\u003clabel for=\"m3\">Massa \u003coutput id=\"m3o\">50 kg\u003c/output>\u003c/label>\u003cinput id=\"m3\" type=\"range\" min=\"1\" max=\"100\" value=\"50\">\u003c/div>\n   \u003cdiv class=\"control\">\u003clabel for=\"s3\">Uzunlik \u003coutput id=\"s3o\">6 m\u003c/output>\u003c/label>\u003cinput id=\"s3\" type=\"range\" min=\"2\" max=\"12\" step=\".5\" value=\"6\">\u003c/div>\n   \u003cdiv class=\"control\">\u003clabel for=\"h3\">Balandlik \u003coutput id=\"h3o\">2 m\u003c/output>\u003c/label>\u003cinput id=\"h3\" type=\"range\" min=\".5\" max=\"5\" step=\".1\" value=\"2\">\u003c/div>\n   \u003cdiv class=\"control\">\u003clabel for=\"mu3\">Ishqalanish μ \u003coutput id=\"mu3o\">0.20\u003c/output>\u003c/label>\u003cinput id=\"mu3\" type=\"range\" min=\"0\" max=\".6\" step=\".01\" value=\".2\">\u003c/div>\n  \u003c/div>\u003cdiv class=\"stats\">\u003cdiv class=\"stat\">\u003cspan>Tayanch reaksiya N\u003c/span>\u003cstrong id=\"normal3\">471.4 N\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003cspan>Ishqalanish kuchi\u003c/span>\u003cstrong id=\"fric3\">94.3 N\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003cspan>Tortuvchi kuch\u003c/span>\u003cstrong id=\"pull3\">260.9 N\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003cspan>Foydali ish\u003c/span>\u003cstrong id=\"useful3\">1000 J\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003cspan>To‘liq ish\u003c/span>\u003cstrong id=\"total3\">1565.7 J\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003cspan>FIK\u003c/span>\u003cstrong id=\"eff3\">63.9%\u003c/strong>\u003c/div>\u003c/div>\u003c/article>\n  \u003carticle class=\"card half\">\u003ch3>Kuchlar va energiya\u003c/h3>\u003cdiv class=\"visual\">\u003ccanvas id=\"canvas3\" aria-label=\"Ishqalanish kuchi ko‘rsatilgan qiya tekislik\">\u003c/canvas>\u003c/div>\u003cdiv id=\"energyBars\">\u003c/div>\u003cp class=\"small muted\">Bir tekis harakatda tortuvchi kuch qiya tekislik bo‘ylab og‘irlik kuchining tarkibiy qismi va ishqalanishni muvozanatlaydi.\u003c/p>\u003c/article>\n \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" id=\"masalalar\">\n \u003cdiv class=\"section-head\">\u003cdiv>\u003ch2>\u003cspan class=\"number\">05\u003c/span>Masalalar yechish\u003c/h2>\u003cp>Yechimni oching yoki avval mustaqil urinib ko‘ring.\u003c/p>\u003c/div>\u003c/div>\n \u003cdiv class=\"grid\">\n  \u003carticle class=\"card\">\n   \u003ch3>1-masala · Sodda\u003c/h3>\u003cp>Massasi 10 kg yuk uzunligi 5 m, balandligi 1 m bo‘lgan ishqalanishsiz qiya tekislik bo‘ylab bir tekis ko‘tariladi. g = 10 N/kg.\u003c/p>\n   \u003cdetails class=\"problem\">\u003csummary>Yechimni bosqichma-bosqich ko‘rsatish\u003c/summary>\u003cdiv class=\"content\">\u003col class=\"steps\">\u003cli>Berilgan: m = 10 kg, s = 5 m, h = 1 m, g = 10 N/kg.\u003c/li>\u003cli>Foydali ish: A\u003csub>f\u003c/sub> = mgh = 10 · 10 · 1 = \u003cb>100 J\u003c/b>.\u003c/li>\u003cli>sin α = h/s = 1/5. Tortuvchi kuch: F = mg sin α = 100 · 0.2 = \u003cb>20 N\u003c/b>.\u003c/li>\u003cli>To‘liq ish: A\u003csub>t\u003c/sub> = Fs = 20 · 5 = \u003cb>100 J\u003c/b>.\u003c/li>\u003cli>FIK: η = 100/100 · 100% = \u003cb>100%\u003c/b>.\u003c/li>\u003c/ol>\u003cdiv class=\"answer\">Javob: A\u003csub>f\u003c/sub> = 100 J; F = 20 N; A\u003csub>t\u003c/sub> = 100 J; η = 100%.\u003c/div>\u003c/div>\u003c/details>\n  \u003c/article>\n  \u003carticle class=\"card\">\n   \u003ch3>2-masala · O‘rta\u003c/h3>\u003cp>Massasi 20 kg yuk uzunligi 8 m, balandligi 2 m bo‘lgan qiya tekislik bo‘ylab bir tekis ko‘tariladi. Tortuvchi kuch 100 N. g = 10 N/kg.\u003c/p>\n   \u003cdetails class=\"problem\">\u003csummary>Yechimni bosqichma-bosqich ko‘rsatish\u003c/summary>\u003cdiv class=\"content\">\u003col class=\"steps\">\u003cli>Foydali ish: A\u003csub>f\u003c/sub> = mgh = 20 · 10 · 2 = \u003cb>400 J\u003c/b>.\u003c/li>\u003cli>To‘liq ish: A\u003csub>t\u003c/sub> = Fs = 100 · 8 = \u003cb>800 J\u003c/b>.\u003c/li>\u003cli>FIK: η = 400/800 · 100% = \u003cb>50%\u003c/b>.\u003c/li>\u003cli>Ishqalanishsiz zarur kuch F = mgh/s = 400/8 = 50 N bo‘lardi. Berilgan 100 N kuch kattaroq; bir tekis harakat shartida farq ishqalanish yoki boshqa qarshiliklarni ko‘rsatadi.\u003c/li>\u003c/ol>\u003cdiv class=\"answer\">Javob: A\u003csub>f\u003c/sub> = 400 J; A\u003csub>t\u003c/sub> = 800 J; η = 50%.\u003c/div>\u003c/div>\u003c/details>\n  \u003c/article>\n  \u003carticle class=\"card\">\n   \u003ch3>3-masala · Murakkab va amaliy\u003c/h3>\u003cp>Massasi 50 kg quti uzunligi 6 m, balandligi 2 m bo‘lgan qiya tekislik bo‘ylab bir tekis yuqoriga tortiladi. μ = 0,2; g = 10 N/kg.\u003c/p>\n   \u003cdetails class=\"problem\">\u003csummary>Yechimni bosqichma-bosqich ko‘rsatish\u003c/summary>\u003cdiv class=\"content\">\u003col class=\"steps\">\u003cli>sin α = h/s = 2/6 = \u003cb>0,333\u003c/b>; cos α = √(1 − sin²α) ≈ \u003cb>0,943\u003c/b>.\u003c/li>\u003cli>Tayanch reaksiya: N = mg cos α = 50 · 10 · 0,943 ≈ \u003cb>471,4 N\u003c/b>.\u003c/li>\u003cli>Ishqalanish kuchi: F\u003csub>ishq\u003c/sub> = μN = 0,2 · 471,4 ≈ \u003cb>94,3 N\u003c/b>.\u003c/li>\u003cli>Tortuvchi kuch: F = mg sin α + F\u003csub>ishq\u003c/sub> = 500 · 0,333 + 94,3 ≈ \u003cb>260,9 N\u003c/b>.\u003c/li>\u003cli>Foydali ish: A\u003csub>f\u003c/sub> = mgh = 50 · 10 · 2 = \u003cb>1000 J\u003c/b>.\u003c/li>\u003cli>To‘liq ish: A\u003csub>t\u003c/sub> = Fs = 260,9 · 6 ≈ \u003cb>1565,7 J\u003c/b>.\u003c/li>\u003cli>Ishqalanishga qarshi ish: A\u003csub>ishq\u003c/sub> = F\u003csub>ishq\u003c/sub>s = 94,3 · 6 ≈ \u003cb>565,7 J\u003c/b>.\u003c/li>\u003cli>FIK: η = 1000/1565,7 · 100% ≈ \u003cb>63,9%\u003c/b>.\u003c/li>\u003c/ol>\u003cdiv class=\"answer\">Javob: N ≈ 471,4 N; F\u003csub>ishq\u003c/sub> ≈ 94,3 N; F ≈ 260,9 N; A\u003csub>f\u003c/sub> = 1000 J; A\u003csub>t\u003c/sub> ≈ 1565,7 J; η ≈ 63,9%.\u003c/div>\u003c/div>\u003c/details>\n  \u003c/article>\n  \u003carticle class=\"card\">\n   \u003ch3>4-masala · Mustaqil ishlash\u003c/h3>\u003cp>Massasi 15 kg yuk 4 m uzunlikdagi, 1,2 m balandlikdagi qiya tekislik bo‘ylab ishqalanishsiz ko‘tariladi. g = 10 N/kg. Tortuvchi kuch, foydali ish va FIKni toping.\u003c/p>\n   \u003cdetails class=\"problem\">\u003csummary>Tekshirish uchun javob\u003c/summary>\u003cdiv class=\"content\">\u003cp>F = mgh/s = 15·10·1,2/4 = \u003cb>45 N\u003c/b>. A\u003csub>f\u003c/sub> = mgh = \u003cb>180 J\u003c/b>. A\u003csub>t\u003c/sub> = Fs = 45·4 = \u003cb>180 J\u003c/b>. η = \u003cb>100%\u003c/b>.\u003c/p>\u003c/div>\u003c/details>\n  \u003c/article>\n  \u003carticle class=\"card\">\n   \u003ch3>5-masala · Ishqalanishli\u003c/h3>\u003cp>Massasi 10 kg yuk α = 30° burchakli tekislikda μ = 0,2 bilan bir tekis yuqoriga tortiladi. g = 10 N/kg. Zarur kuchni toping.\u003c/p>\n   \u003cdetails class=\"problem\">\u003csummary>Tekshirish uchun javob\u003c/summary>\u003cdiv class=\"content\">\u003cp>N = mg cos 30° ≈ 86,6 N. F\u003csub>ishq\u003c/sub> = 0,2·86,6 ≈ 17,3 N. F = mg sin 30° + F\u003csub>ishq\u003c/sub> = 50 + 17,3 = \u003cb>67,3 N\u003c/b>.\u003c/p>\u003c/div>\u003c/details>\n  \u003c/article>\n  \u003carticle class=\"card\">\n   \u003ch3>6-masala · Hayotiy vaziyat\u003c/h3>\u003cp>Ishchilar 300 N kuch bilan yukni 4 m uzunlikdagi pandus bo‘ylab ko‘tarib, uni 0,8 m balandlikka olib chiqishdi. Yuk massasi 100 kg. g = 10 N/kg. FIKni aniqlang.\u003c/p>\n   \u003cdetails class=\"problem\">\u003csummary>Tekshirish uchun javob\u003c/summary>\u003cdiv class=\"content\">\u003cp>A\u003csub>f\u003c/sub> = 100·10·0,8 = 800 J. A\u003csub>t\u003c/sub> = 300·4 = 1200 J. η = 800/1200·100% = \u003cb>66,7%\u003c/b>.\u003c/p>\u003c/div>\u003c/details>\n  \u003c/article>\n \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" id=\"test\">\n \u003cdiv class=\"section-head\">\u003cdiv>\u003ch2>\u003cspan class=\"number\">06\u003c/span>Bilimlarni tekshirish\u003c/h2>\u003cp>8 ta savol. Har bir savolda bitta to‘g‘ri javob mavjud.\u003c/p>\u003c/div>\u003c/div>\n \u003carticle class=\"card\">\n  \u003cform id=\"quizForm\">\n   \u003cdiv class=\"quiz-q\" data-answer=\"1\" data-explain=\"Ish kuch bilan siljishning kuch yo‘nalishidagi tarkibiy qismi ko‘paytmasiga teng.\">\u003cp>1. Kuch va siljish orasidagi burchak θ bo‘lsa, mexanik ish formulasi qaysi?\u003c/p>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q0\" value=\"0\"> A = F/s\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q0\" value=\"1\"> A = Fs cos θ\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q0\" value=\"2\"> A = mgh²\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q0\" value=\"3\"> A = F + s\u003c/label>\u003cdiv class=\"feedback\">\u003c/div>\u003c/div>\n   \u003cdiv class=\"quiz-q\" data-answer=\"2\" data-explain=\"Foydali ish yukning potensial energiyasi ortishiga teng: A_f = mgh.\">\u003cp>2. Yukni h balandlikka ko‘tarishda foydali ish nimaga teng?\u003c/p>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q1\" value=\"0\"> F/s\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q1\" value=\"1\"> μN\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q1\" value=\"2\"> mgh\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q1\" value=\"3\"> mg/h\u003c/label>\u003cdiv class=\"feedback\">\u003c/div>\u003c/div>\n   \u003cdiv class=\"quiz-q\" data-answer=\"0\" data-explain=\"FIK foydali ishning to‘liq ishga nisbatini foizda ifodalaydi.\">\u003cp>3. FIK qanday aniqlanadi?\u003c/p>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q2\" value=\"0\"> η = A_f/A_t · 100%\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q2\" value=\"1\"> η = A_t/A_f\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q2\" value=\"2\"> η = Fs²\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q2\" value=\"3\"> η = mg + h\u003c/label>\u003cdiv class=\"feedback\">\u003c/div>\u003c/div>\n   \u003cdiv class=\"quiz-q\" data-answer=\"3\" data-explain=\"Ishqalanish kuchi harakatga yoki harakatga intilishga qarshi yo‘naladi.\">\u003cp>4. Yuk qiya tekislik bo‘ylab yuqoriga harakatlanganda ishqalanish kuchi qaysi tomonga yo‘naladi?\u003c/p>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q3\" value=\"0\"> Yuqoriga\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q3\" value=\"1\"> Vertikal yuqoriga\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q3\" value=\"2\"> Har doim tashqariga\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q3\" value=\"3\"> Tekislik bo‘ylab pastga\u003c/label>\u003cdiv class=\"feedback\">\u003c/div>\u003c/div>\n   \u003cdiv class=\"quiz-q\" data-answer=\"1\" data-explain=\"N = mg cos α formulasi tekislikka perpendikulyar boshqa kuchlar bo‘lmagan holatda ishlatiladi.\">\u003cp>5. Qiya tekislikda tayanch reaksiya kuchi qaysi formula bilan aniqlanadi?\u003c/p>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q4\" value=\"0\"> N = mg sin α\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q4\" value=\"1\"> N = mg cos α\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q4\" value=\"2\"> N = μmg\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q4\" value=\"3\"> N = mgh\u003c/label>\u003cdiv class=\"feedback\">\u003c/div>\u003c/div>\n   \u003cdiv class=\"quiz-q\" data-answer=\"0\" data-explain=\"Ishqalanishsiz va boshqa yo‘qotishlarsiz ideal modelda foydali ish to‘liq ishga teng.\">\u003cp>6. Ideal, ishqalanishsiz qiya tekislikning FIKi qancha?\u003c/p>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q5\" value=\"0\"> 100%\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q5\" value=\"1\"> 50%\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q5\" value=\"2\"> 0%\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q5\" value=\"3\"> 150%\u003c/label>\u003cdiv class=\"feedback\">\u003c/div>\u003c/div>\n   \u003cdiv class=\"quiz-q\" data-answer=\"2\" data-explain=\"Ishqalanish kuchi F_ishq = μN.\">\u003cp>7. Sirpanish ishqalanish kuchi qaysi formula bilan ifodalanadi?\u003c/p>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q6\" value=\"0\"> F = mgh\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q6\" value=\"1\"> F = Fs\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q6\" value=\"2\"> F_ishq = μN\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q6\" value=\"3\"> F = s/h\u003c/label>\u003cdiv class=\"feedback\">\u003c/div>\u003c/div>\n   \u003cdiv class=\"quiz-q\" data-answer=\"3\" data-explain=\"Ishqalanish mavjud bo‘lganda tashqi kuch bajargan ishning bir qismi issiqlikka aylanadi, shu sababli FIK odatda 100% dan kichik.\">\u003cp>8. Nima sababdan real qiya tekislikda FIK odatda 100% dan kichik?\u003c/p>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q7\" value=\"0\"> Massa yo‘qoladi\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q7\" value=\"1\"> Balandlik manfiy bo‘ladi\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q7\" value=\"2\"> Tortuvchi kuch doim nol\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"q7\" value=\"3\"> Energiyaning bir qismi issiqlik va boshqa yo‘qotishlarga ketadi\u003c/label>\u003cdiv class=\"feedback\">\u003c/div>\u003c/div>\n   \u003cdiv class=\"actions\">\u003cbutton type=\"submit\" class=\"primary\">Natijani tekshirish\u003c/button>\u003cbutton type=\"button\" id=\"resetQuiz\" class=\"ghost\">Qayta ishlash\u003c/button>\u003c/div>\n  \u003c/form>\n  \u003cdiv id=\"quizResult\" class=\"answer\" hidden aria-live=\"polite\">\u003c/div>\n \u003c/article>\n\u003c/section>\n\u003csection class=\"section\" id=\"xulosa\">\n \u003cdiv class=\"section-head\">\u003cdiv>\u003ch2>\u003cspan class=\"number\">07\u003c/span>Xulosa va mustahkamlash\u003c/h2>\u003cp>Esda tuting.\u003c/p>\u003c/div>\u003c/div>\n \u003cdiv class=\"grid\">\n  \u003carticle class=\"card third\">\u003ch3>01 · Kuch va yo‘l\u003c/h3>\u003cp>Qiya tekislik yukni kichikroq kuch bilan ko‘tarishga yordam beradi, biroq yo‘lni uzaytiradi.\u003c/p>\u003c/article>\n  \u003carticle class=\"card third\">\u003ch3>02 · Ishqalanish\u003c/h3>\u003cp>Ishqalanish qo‘shimcha kuch va ish talab qiladi; energiyaning bir qismi issiqlikka aylanadi.\u003c/p>\u003c/article>\n  \u003carticle class=\"card third\">\u003ch3>03 · FIK\u003c/h3>\u003cp>FIK foydali ishning to‘liq ishga nisbatidir. Real qurilmalarda u odatda 100% dan kichik bo‘ladi.\u003c/p>\u003c/article>\n \u003c/div>\n\u003c/section>\n\u003c/main>\n\u003cfooter class=\"footer\">PHYSim · Qiya tekislik, mexanik ish va foydali ish koeffitsiyenti · Bitta HTML faylda ishlaydi\u003c/footer>\n\u003cscript>\nconst $=id=>document.getElementById(id);\nconst num=id=>Number($(id).value);\nconst fmt=(v,d=1)=>Number.isFinite(v)?v.toLocaleString('uz-UZ',{maximumFractionDigits:d,minimumFractionDigits:0}):'—';\nconst g=10;\nfunction geometry(s,h){h=Math.min(h,s*.98);let si=h/s,co=Math.sqrt(Math.max(0,1-si*si));return {h,si,co,ang:Math.asin(si)*180/Math.PI};}\nfunction drawRamp(canvasId, data, moving=false, friction=false){\n const c=$(canvasId),ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1,w=c.clientWidth||500,h=c.clientHeight||290;\n c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);\n ctx.lineCap='round';ctx.lineJoin='round';\n const left=42,base=h-35,topY=35,right=w-35,availW=right-left,availH=base-topY;\n const ratio=Math.min(availW/Math.max(data.s,1),availH/Math.max(data.h,1));\n const dx=data.s*ratio,dy=data.h*ratio,x0=left,y0=base,x1=x0+dx,y1=y0-dy;\n // grid\n ctx.strokeStyle='#e0e6f5';ctx.lineWidth=1;\n for(let x=20;x\u003cw;x+=30){ctx.beginPath();ctx.moveTo(x,10);ctx.lineTo(x,h-20);ctx.stroke()}\n for(let y=20;y\u003ch;y+=30){ctx.beginPath();ctx.moveTo(10,y);ctx.lineTo(w-10,y);ctx.stroke()}\n ctx.fillStyle='#dce5ff';ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.lineTo(x1,y0);ctx.closePath();ctx.fill();\n ctx.strokeStyle='#6679c7';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();\n ctx.strokeStyle='#93a1c9';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x0,y0+1);ctx.lineTo(x1,y0+1);ctx.stroke();\n // labels\n ctx.fillStyle='#536180';ctx.font='12px system-ui';ctx.fillText('s = '+fmt(data.s,1)+' m',(x0+x1)/2-22,y0+20);ctx.fillText('h = '+fmt(data.h,1)+' m',Math.min(w-72,x1+6),(y0+y1)/2);\n const t=moving?(data.t||0):.62;const bx=x0+dx*t,by=y0-dy*t;\n // block rotated\n const angle=-Math.atan2(dy,dx),bw=32,bh=24;\n ctx.save();ctx.translate(bx,by-12);ctx.rotate(angle);ctx.fillStyle='#3156d9';ctx.strokeStyle='#203b9c';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-bw/2,-bh/2,bw,bh,5);ctx.fill();ctx.stroke();ctx.restore();\n // vector helper\n function arrow(x,y,ex,ey,color,label){\n   const dx=ex-x,dy=ey-y,L=Math.hypot(dx,dy);if(L\u003c3)return;const ux=dx/L,uy=dy/L,head=7;\n   ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=2.7;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(ex,ey);ctx.stroke();\n   ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex-ux*head-uy*head*.55,ey-uy*head+ux*head*.55);ctx.lineTo(ex-ux*head+uy*head*.55,ey-uy*head-ux*head*.55);ctx.closePath();ctx.fill();\n   ctx.font='bold 11px system-ui';ctx.fillText(label,ex+4,ey-4);\n }\n const mag=Math.min(70,Math.max(24,data.m*1.1));arrow(bx,by-14,bx+Math.cos(angle)*mag,by-14+Math.sin(angle)*mag,'#3156d9','F');\n arrow(bx,by-4,bx,by+Math.min(64,Math.max(25,data.m*.9)),'#d94c63','mg');\n arrow(bx,by-12,bx+Math.sin(angle)*40,by-12-Math.cos(angle)*40,'#159b72','N');\n if(friction&&data.mu>0)arrow(bx,by+1,bx-Math.cos(angle)*Math.min(58,22+data.mu*55),by+1-Math.sin(angle)*Math.min(58,22+data.mu*55),'#ed9a32','Fᵢ');\n ctx.fillStyle='#596784';ctx.font='11px system-ui';ctx.fillText('Qiya tekislik',left+4,Math.max(15,y1-12));\n}\nfunction update1(){\n let m=num('m1'),s=num('s1'),h=num('h1'),mu=num('mu1');if(h>=s){h=s*.98;$('h1').value=h;$('geomWarning').hidden=false}else $('geomWarning').hidden=true;\n $('m1o').textContent=m+' kg';$('s1o').textContent=fmt(s,1)+' m';$('h1o').textContent=fmt(h,1)+' m';$('mu1o').textContent=mu.toFixed(2);\n const q=geometry(s,h),N=m*g*q.co,fr=mu*N,F=m*g*q.si+fr;\n $('ang1').textContent=fmt(q.ang,1)+'°';$('force1').textContent=fmt(F,1)+' N';\n $('height1').textContent=fmt(animT*h,2)+' m';\n drawRamp('canvas1',{m,s,h,mu,t:animT},true,true);\n}\nlet animT=0,animTimer=null;\nfunction stopAnim(){if(animTimer){clearInterval(animTimer);animTimer=null}}\n$('start1').onclick=()=>{stopAnim();animTimer=setInterval(()=>{animT+=.018;if(animT>1)animT=0;update1()},40)};\n$('pause1').onclick=stopAnim;\n$('reset1').onclick=()=>{stopAnim();animT=0;update1()};\n['m1','s1','h1','mu1'].forEach(id=>$(id).addEventListener('input',update1));\nfunction update2(){\n let m=num('m2'),s=num('s2'),h=num('h2'),F=num('f2');if(h>=s){h=s*.98;$('h2').value=h}\n ['m2','s2','h2','f2'].forEach((id,i)=>$(id+'o').textContent=[m+' kg',fmt(s,1)+' m',fmt(h,1)+' m',F+' N'][i]);\n const af=m*g*h,at=F*s,eta=at>0?af/at*100:0;\n $('af2').textContent=fmt(af)+' J';$('at2').textContent=fmt(at)+' J';$('eta2').textContent=fmt(eta,1)+'%';\n const invalid=af>at+1e-8;$('warn2').hidden=!invalid;\n $('conclusion2').textContent=invalid?'Ogohlantirish: bu qiymatlarda foydali ish to‘liq ishdan katta chiqmoqda. Kuch yoki parametrlarni tekshiring.':eta>=99.95?'Ideal holatga yaqin: FIK ≈ 100%.':'FIK = '+fmt(eta,1)+'%. Yo‘qotishlar ulushi taxminan '+fmt(Math.max(0,100-eta),1)+'%.';\n const max=Math.max(af,at,1);\n $('bars2').innerHTML=`\u003cdiv class=\"barrow\">\u003cspan>Foydali ish\u003c/span>\u003cdiv class=\"bar\">\u003ci style=\"width:${Math.min(100,af/max*100)}%;background:#3156d9\">\u003c/i>\u003c/div>\u003cb>${fmt(af)} J\u003c/b>\u003c/div>\u003cdiv class=\"barrow\">\u003cspan>To‘liq ish\u003c/span>\u003cdiv class=\"bar\">\u003ci style=\"width:${Math.min(100,at/max*100)}%;background:#7656e8\">\u003c/i>\u003c/div>\u003cb>${fmt(at)} J\u003c/b>\u003c/div>`;\n return {m,s,h,F,af,at,eta};\n}\n['m2','s2','h2','f2'].forEach(id=>$(id).addEventListener('input',update2));\nlet trials=[];\n$('addTrial').onclick=()=>{const d=update2();trials.push(d);renderTrials()};\n$('clearTrials').onclick=()=>{trials=[];renderTrials()};\nfunction renderTrials(){\n $('trialRows').innerHTML=trials.length?trials.map((d,i)=>`\u003ctr>\u003ctd>${i+1}\u003c/td>\u003ctd>${d.m}\u003c/td>\u003ctd>${fmt(d.s,1)}\u003c/td>\u003ctd>${fmt(d.h,1)}\u003c/td>\u003ctd>${d.F}\u003c/td>\u003ctd>${fmt(d.af)}\u003c/td>\u003ctd>${fmt(d.at)}\u003c/td>\u003ctd>${fmt(d.eta,1)}%\u003c/td>\u003c/tr>`).join(''):'\u003ctr>\u003ctd colspan=\"8\" class=\"muted\">Hozircha natija yo‘q. “Natijani jadvalga qo‘shish” tugmasini bosing.\u003c/td>\u003c/tr>';\n}\nfunction update3(){\n let m=num('m3'),s=num('s3'),h=num('h3'),mu=num('mu3');if(h>=s){h=s*.98;$('h3').value=h}\n $('m3o').textContent=m+' kg';$('s3o').textContent=fmt(s,1)+' m';$('h3o').textContent=fmt(h,1)+' m';$('mu3o').textContent=mu.toFixed(2);\n const q=geometry(s,h),N=m*g*q.co,fr=mu*N,F=m*g*q.si+fr,af=m*g*h,at=F*s,eta=at?af/at*100:0,fw=fr*s;\n $('normal3').textContent=fmt(N,1)+' N';$('fric3').textContent=fmt(fr,1)+' N';$('pull3').textContent=fmt(F,1)+' N';$('useful3').textContent=fmt(af)+' J';$('total3').textContent=fmt(at,1)+' J';$('eff3').textContent=fmt(eta,1)+'%';\n drawRamp('canvas3',{m,s,h,mu,t:.62},false,true);\n const max=Math.max(af,fw,1);\n $('energyBars').innerHTML=`\u003cdiv class=\"barrow\">\u003cspan>Foydali ish\u003c/span>\u003cdiv class=\"bar\">\u003ci style=\"width:${af/max*100}%;background:#3156d9\">\u003c/i>\u003c/div>\u003cb>${fmt(af)} J\u003c/b>\u003c/div>\u003cdiv class=\"barrow\">\u003cspan>Ishqalanish\u003c/span>\u003cdiv class=\"bar\">\u003ci style=\"width:${fw/max*100}%;background:#ed9a32\">\u003c/i>\u003c/div>\u003cb>${fmt(fw)} J\u003c/b>\u003c/div>`;\n}\n['m3','s3','h3','mu3'].forEach(id=>$(id).addEventListener('input',update3));\nconst quizForm=$('quizForm');\nquizForm.addEventListener('submit',e=>{e.preventDefault();let score=0;document.querySelectorAll('.quiz-q').forEach((q,i)=>{const chosen=q.querySelector('input:checked'),fb=q.querySelector('.feedback'),correct=Number(q.dataset.answer);if(chosen&&Number(chosen.value)===correct){score++;fb.className='feedback correct';fb.textContent='To‘g‘ri! '+q.dataset.explain}else{fb.className='feedback incorrect';fb.textContent=(chosen?'Noto‘g‘ri. ':'Javob tanlanmadi. ')+q.dataset.explain}});const pct=score/8*100;$('quizResult').hidden=false;$('quizResult').innerHTML=`Natija: \u003cb>${score}/8\u003c/b> ta to‘g‘ri javob (${pct}%). ${score>=7?'A’lo! Mavzuni juda yaxshi o‘zlashtirgansiz.':score>=5?'Yaxshi! Xatolar izohini ko‘rib chiqing.':'Nazariy formulalarni takrorlab, yana urinib ko‘ring.'}`;$('quizResult').scrollIntoView({behavior:'smooth',block:'nearest'})});\n$('resetQuiz').onclick=()=>{quizForm.reset();document.querySelectorAll('.feedback').forEach(x=>{x.textContent='';x.className='feedback'});$('quizResult').hidden=true};\ndocument.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>{document.getElementById(b.dataset.jump).scrollIntoView({behavior:'smooth'});document.querySelectorAll('[data-jump]').forEach(x=>x.classList.toggle('active',x===b))}));\nwindow.addEventListener('scroll',()=>{let max=document.documentElement.scrollHeight-innerHeight;$('scrollProgress').style.width=(max>0?scrollY/max*100:0)+'%'});\nwindow.addEventListener('resize',()=>{update1();update3()});\nupdate1();update2();update3();\n\u003c/script>\n\u003c/body>\n\u003c/html>", "11-mavzu": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Laboratoriya №11 — Qiya tekislikning FIKini aniqlash\u003c/title>\n\u003cstyle>\n:root{--navy:#102044;--blue:#2563eb;--cyan:#38bdf8;--violet:#7c3aed;--ink:#18233b;--muted:#64748b;--paper:#f4f7fc;--line:#dbe4f0;--white:#fff;--green:#059669;--amber:#d97706}\n*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,\"Segoe UI\",sans-serif}\nheader{background:linear-gradient(120deg,#101b3b,#1d4ed8 68%,#7c3aed);color:#fff;padding:18px clamp(16px,4vw,48px);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}\n.brand{font-weight:800;letter-spacing:.08em;font-size:.82rem;text-transform:uppercase;opacity:.9}.header-title{font-size:clamp(1.1rem,2.4vw,1.8rem);font-weight:800;margin-top:4px}.pill{border:1px solid #ffffff65;background:#ffffff18;padding:8px 12px;border-radius:999px;font-size:.85rem}\nmain{max-width:1200px;margin:auto;padding:24px clamp(12px,3vw,32px) 42px}\n.progress{height:6px;background:#dbe5f5;border-radius:9px;overflow:hidden;margin-bottom:20px}.progress>div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));width:7.69%;transition:width .3s}\n.nav{display:flex;gap:8px;overflow:auto;padding:2px 0 16px;margin-bottom:8px}.nav button{white-space:nowrap;border:1px solid var(--line);background:#fff;color:#334155;border-radius:999px;padding:9px 14px;cursor:pointer;font-weight:650}.nav button.active{background:var(--navy);color:white;border-color:var(--navy)}\n.panel{display:none;animation:fade .25s ease}.panel.active{display:block}@keyframes fade{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:none}}\nh1,h2,h3{line-height:1.2;color:var(--navy)}h1{font-size:clamp(1.8rem,4vw,3.4rem);margin:10px 0}h2{font-size:clamp(1.35rem,2.7vw,2rem);margin:0 0 14px}h3{font-size:1.05rem;margin:0 0 10px}\np{line-height:1.65}.muted{color:var(--muted)}.eyebrow{color:var(--blue);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:.75rem}\n.hero{border-radius:24px;background:linear-gradient(135deg,#e4f4ff,#eee8ff);padding:clamp(20px,4vw,44px);display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:center;overflow:hidden}\n.hero-art{min-height:245px;display:flex;align-items:center;justify-content:center}.hero-art svg{width:100%;max-width:470px;filter:drop-shadow(0 12px 18px #10204418)}\n.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}.card,.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 5px 20px #18345c08}.card{cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#93c5fd}.card .num{display:grid;place-items:center;width:38px;height:38px;background:#e8efff;color:var(--blue);border-radius:12px;font-weight:850;margin-bottom:12px}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.stack{display:grid;gap:14px}.formula{background:#eef5ff;border:1px solid #d7e6ff;border-radius:14px;padding:15px;margin:10px 0;font-size:1.13rem;font-weight:700;color:#12336a;overflow-wrap:anywhere}.formula small{display:block;color:var(--muted);font-size:.8rem;font-weight:500;margin-top:6px}\n.equipment{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.equip{padding:14px;text-align:center;background:white;border:1px solid var(--line);border-radius:16px;cursor:pointer}.equip .emoji{font-size:2rem;display:block;margin-bottom:6px}.equip small{display:block;color:var(--muted);margin-top:5px}\nbutton{font:inherit}.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--blue);color:white;font-weight:750;cursor:pointer;box-shadow:0 4px 10px #2563eb22}.btn:hover{filter:brightness(1.06)}.btn.secondary{background:#e8efff;color:#1d4ed8;box-shadow:none}.btn.dark{background:var(--navy)}.btn.green{background:var(--green)}.btn:disabled{opacity:.45;cursor:not-allowed}\n.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}.control{background:#fff;border:1px solid var(--line);padding:14px;border-radius:14px}.control label{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:.92rem}.control output{color:var(--blue)}input[type=range]{width:100%;accent-color:var(--blue);margin-top:13px}input[type=number],textarea,select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font:inherit;background:white;color:var(--ink)}.labscene{background:linear-gradient(#eaf5ff,#fff 80%);border:1px solid var(--line);border-radius:20px;padding:10px;min-height:320px}.labscene svg{width:100%;height:auto;display:block;max-height:420px}.meter{font-size:1.45rem;font-weight:850;color:var(--blue)}.readings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.reading{background:#f7faff;border-radius:12px;padding:12px}.reading span{display:block;color:var(--muted);font-size:.8rem}.reading strong{font-size:1.15rem}\ntable{border-collapse:collapse;width:100%;font-size:.9rem;min-width:740px}th,td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:center}th{background:#edf3ff;color:#1e3a8a}tr:last-child td{border-bottom:0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:white}\n.question{padding:16px;background:white;border:1px solid var(--line);border-radius:15px;margin-bottom:12px}.question label{display:block;padding:8px;border-radius:8px;cursor:pointer}.question label:hover{background:#f1f5ff}.feedback{margin-top:8px;font-weight:700}.step{display:flex;gap:12px;padding:12px
