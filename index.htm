=\"display:none\">\u003c/div>\u003c/div>\n\u003c/section>\n\u003csection id=\"xulosa\">\u003cdiv class=\"card\">\u003ch2>Xulosa va eslatmalar\u003c/h2>\u003cul>\u003cli>Markazga intilma kuch tezlikning kvadratiga to‘g‘ri, radiusga teskari proporsional.\u003c/li>\u003cli>Gravitatsion kuch jismlarni o‘zaro tortadi va masofa kvadratiga teskari proporsional.\u003c/li>\u003cli>Erkin tushish formulalarida h = v₀t + gt²/2 va v = v₀ + gt ishlatiladi (pastga yo‘nalish musbat).\u003c/li>\u003cli>Orbital harakatda gravitatsion kuch markazga intilma kuchni ta’minlaydi.\u003c/li>\u003cli>Har bir natijani SI birligi bilan yozing va mantiqiyligini tekshiring.\u003c/li>\u003c/ul>\u003cbutton onclick=\"window.print()\" class=\"secondary\">Darsni chop etish\u003c/button>\u003c/div>\u003c/section>\n\u003c/main>\n\u003cfooter>4-mavzu · Fizika · Interaktiv HTML5 dars materiali\u003c/footer>\n\u003cscript>\nfunction toggleSolution(id){document.getElementById(id).classList.toggle('show')}\nconst G=6.67e-11, Mearth=5.97e24, Rearth=6.37e6, g0=9.8;\nfunction num(id, fallback){const x=parseFloat(document.getElementById(id).value);return Number.isFinite(x)?x:fallback}\nfunction fmt(x,d=2){return Number(x).toLocaleString('uz-UZ',{maximumFractionDigits:d})}\nfunction setupCanvas(c){const dpr=window.devicePixelRatio||1,rect=c.getBoundingClientRect();c.width=Math.max(1,Math.floor(rect.width*dpr));c.height=Math.max(1,Math.floor(rect.height*dpr));const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return {ctx,w:rect.width,h:rect.height}}\nlet circleAngle=0,circleRunning=true,circleLast=0;\nconst cc=document.getElementById('circleCanvas');\nfunction drawArrow(ctx,x1,y1,x2,y2,color,label){ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();let a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-9*Math.cos(a-.45),y2-9*Math.sin(a-.45));ctx.lineTo(x2-9*Math.cos(a+.45),y2-9*Math.sin(a+.45));ctx.closePath();ctx.fill();ctx.font='12px system-ui';ctx.fillText(label,x2+5,y2-5)}\nfunction drawCircle(ts=0){const {ctx,w,h}=setupCanvas(cc);ctx.clearRect(0,0,w,h);const cx=w*.5,cy=h*.52,r=Math.min(w*.29,h*.34);ctx.strokeStyle='#91a7c5';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#225bd6';ctx.beginPath();ctx.arc(cx,cy,5,0,7);ctx.fill();ctx.fillStyle='#60708a';ctx.font='12px system-ui';ctx.fillText('Markaz',cx+8,cy+16);\nconst x=cx+r*Math.cos(circleAngle),y=cy+r*Math.sin(circleAngle);ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.fill();drawArrow(ctx,x,y,x-35*Math.sin(circleAngle),y+35*Math.cos(circleAngle),'#138a58','v');drawArrow(ctx,x,y,x+(cx-x)*.42,y+(cy-y)*.42,'#c24141','F');\nconst m=num('mass',2),v=num('speed',6),rad=num('radius',4);document.getElementById('circleResult').innerHTML=`\u003cb>Markazga intilma kuch:\u003c/b> F = mv²/r = ${fmt(m)} × ${fmt(v)}² / ${fmt(rad)} = \u003cb>${fmt(m*v*v/r)} N\u003c/b>\u003cbr>\u003cb>Tezlanish:\u003c/b> a = v²/r = ${fmt(v*v/r)} m/s²`;\nif(circleRunning){if(circleLast)circleAngle+=(ts-circleLast)/1000*Math.min(2,v/Math.max(rad,.5));circleLast=ts}else circleLast=0;requestAnimationFrame(drawCircle)}\ndocument.getElementById('circleStart').onclick=()=>{circleRunning=true};document.getElementById('circlePause').onclick=()=>{circleRunning=false};document.getElementById('circleReset').onclick=()=>{circleAngle=0;circleRunning=false};['mass','speed','radius'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{}));\nlet fallProgress=0,fallRunning=false,fallLast=0;const fc=document.getElementById('fallCanvas');\nfunction fallValues(){let H=Math.max(1,num('height',100)),v0=Math.max(0,num('v0',0)),t=Math.max(.1,num('fallTime',3));return {H,v0,t,dist:v0*t+.5*g0*t*t,vel:v0+g0*t}}\nfunction drawFall(ts=0){const {ctx,w,h}=setupCanvas(fc);ctx.clearRect(0,0,w,h);let {H,v0,t,dist,vel}=fallValues();let total=Math.min(H,dist),progress=fallProgress;let ground=h-32,top=28,available=ground-top,yy=top+available*progress;\nctx.strokeStyle='#7b8ca6';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(22,ground);ctx.lineTo(w-22,ground);ctx.stroke();ctx.fillStyle='#225bd6';ctx.fillRect(w*.5-2,top,4,available);ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.arc(w*.5,yy,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#263b5b';ctx.font='13px system-ui';ctx.fillText('Boshlang‘ich balandlik: '+fmt(H)+' m',12,18);\nlet actualT=t*progress,actualDist=v0*actualT+.5*g0*actualT*actualT,actualVel=v0+g0*actualT;\ndocument.getElementById('fallResult').innerHTML=`\u003cb>Berilgan vaqt oxiridagi hisob:\u003c/b> h = ${fmt(dist)} m; v = ${fmt(vel)} m/s pastga.${dist>H?'\u003cbr>\u003cspan style=\"color:#a33\">Jism berilgan balandlikdan oldin yerga yetadi; tushish balandligiga mos vaqtni hisobga oling.\u003c/span>':''}\u003cbr>\u003cb>Animatsiya holati:\u003c/b> t ≈ ${fmt(actualT)} s; bosib o‘tilgan yo‘l ≈ ${fmt(actualDist)} m; tezlik ≈ ${fmt(actualVel)} m/s`;\nif(fallRunning){fallProgress+=((ts-fallLast)||0)/1000/Math.max(.1,t);fallLast=ts;if(fallProgress>=1){fallProgress=1;fallRunning=false}}else fallLast=0;\nrequestAnimationFrame(drawFall)}\ndocument.getElementById('fallRun').onclick=()=>{fallProgress=0;fallRunning=true};document.getElementById('fallStop').onclick=()=>fallRunning=false;document.getElementById('fallReset').onclick=()=>{fallProgress=0;fallRunning=false};\n['height','v0','fallTime'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{fallProgress=0}));\nlet orbitAngle=0,orbitRunning=true,orbitLast=0;const oc=document.getElementById('orbitCanvas');\nfunction drawOrbit(ts=0){const {ctx,w,h}=setupCanvas(oc);ctx.clearRect(0,0,w,h);let alt=Math.max(0,num('orbitAlt',400))*1000,ms=Math.max(1,num('satMass',1000)),speedAnim=Math.max(.2,num('orbitSpeed',1));let r=Rearth+alt,v=Math.sqrt(G*Mearth/r),period=2*Math.PI*r/v,grav=G*Mearth/r**2,F=ms*grav;\nlet cx=w*.5,cy=h*.52,orb=Math.min(w*.39,h*.39),earthR=Math.min(orb*.36,Math.min(w,h)*.18),scale=orb/(r/ Rearth);let drawR=Math.min(orb,earthR*(r/Rearth));drawR=Math.max(earthR,Math.min(orb,drawR));\nctx.strokeStyle='#91a7c5';ctx.setLineDash([5,5]);ctx.beginPath();ctx.arc(cx,cy,orb,0,2*Math.PI);ctx.stroke();ctx.setLineDash([]);\nconst grad=ctx.createRadialGradient(cx-earthR*.3,cy-earthR*.3,2,cx,cy,earthR);grad.addColorStop(0,'#69d6ee');grad.addColorStop(1,'#1760b5');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(cx,cy,earthR,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText('YER',cx,cy+4);ctx.textAlign='left';\nconst x=cx+orb*Math.cos(orbitAngle),y=cy+orb*Math.sin(orbitAngle);ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();drawArrow(ctx,x,y,x-30*Math.sin(orbitAngle),y+30*Math.cos(orbitAngle),'#138a58','v');drawArrow(ctx,x,y,x+(cx-x)*.25,y+(cy-y)*.25,'#c24141','F');\ndocument.getElementById('orbitResult').innerHTML=`\u003cb>Orbita radiusi:\u003c/b> ${fmt(r/1000,0)} km\u003cbr>\u003cb>Orbital tezlik:\u003c/b> ${fmt(v/1000,3)} km/s\u003cbr>\u003cb>Aylanish davri:\u003c/b> ${(period/60).toLocaleString('uz-UZ',{maximumFractionDigits:1})} min\u003cbr>\u003cb>Gravitatsion tezlanish:\u003c/b> ${fmt(grav,3)} m/s²\u003cbr>\u003cb>Yo‘ldoshga ta’sir kuchi:\u003c/b> ${fmt(F,2)} N`;\nif(orbitRunning){if(orbitLast)orbitAngle+=(ts-orbitLast)/1000*.7*speedAnim;orbitLast=ts}else orbitLast=0;requestAnimationFrame(drawOrbit)}\ndocument.getElementById('orbitStart').onclick=()=>orbitRunning=true;document.getElementById('orbitPause').onclick=()=>orbitRunning=false;document.getElementById('orbitReset').onclick=()=>{orbitAngle=0;orbitRunning=false};['orbitAlt','satMass','orbitSpeed'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{}));\nconst answers={q1:'b',q2:'b',q3:'c',q4:'c',q5:'b',q6:'b',q7:'b',q8:'a',q9:'a',q10:'c'};\ndocument.getElementById('checkQuiz').onclick=()=>{let score=0,unanswered=0;for(const [q,a] of Object.entries(answers)){let sel=document.querySelector(`input[name=\"${q}\"]:checked`);if(!sel)unanswered++;else if(sel.value===a)score++}let box=document.getElementById('quizResult');box.style.display='block';box.innerHTML=`\u003cb>Natija: ${score}/10 (${score*10}%)\u003c/b>\u003cbr>Javobsiz savollar: ${unanswered}.\u003cbr>${score>=9?'A’lo! Mavzularni juda yaxshi o‘zlashtirgansiz.':score>=7?'Yaxshi natija. Xato qilingan savollarni qayta ko‘rib chiqing.':score>=5?'Qoniqarli. Formulalarni takrorlab, masalalarni yana ishlang.':'Formulalar va yechish algoritmini qayta o‘rganib, testni takrorlang.'}`};\ndocument.getElementById('resetQuiz').onclick=()=>{const b=document.getElementById('quizResult');b.style.display='none';b.innerHTML=''};\nwindow.addEventListener('resize',()=>{});\nrequestAnimationFrame(drawCircle);requestAnimationFrame(drawFall);requestAnimationFrame(drawOrbit);\n\u003c/script>\n\u003c/body>\n\u003c/html>", "5-mavzu": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Jism og‘irligining harakat turiga bog‘liqligi\u003c/title>\n\u003cstyle>\n:root{--bg:#eef4fb;--card:#fff;--ink:#14233b;--blue:#2463eb;--cyan:#06b6d4;--orange:#f59e0b;--green:#15966b;--muted:#5c6b82}\n*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#e9f2ff,#f6f9ff);color:var(--ink);line-height:1.55}\nheader{padding:30px 18px 26px;background:linear-gradient(120deg,#123b82,#2563eb 60%,#06b6d4);color:#fff;text-align:center}\nheader h1{max-width:900px;margin:0 auto 8px;font-size:clamp(1.55rem,4vw,2.5rem)}header p{margin:0 auto;max-width:760px;color:#eaf5ff}\nmain{max-width:1050px;margin:22px auto;padding:0 14px 35px}.plan{background:var(--card);border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 8px 25px #1e3a5f12;border:1px solid #dce7f5}\nh2{font-size:1.35rem;margin:0 0 10px;color:#1749a5}h3{font-size:1.05rem;margin:12px 0 6px}p{margin:8px 0}.muted{color:var(--muted)}.formula{background:#edf5ff;border-left:4px solid var(--blue);padding:12px 15px;border-radius:8px;font-size:1.06rem;font-weight:bold;margin:12px 0}\n.sim{background:#f7faff;border:1px solid #d8e5f7;border-radius:14px;padding:16px;margin-top:15px}\n.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:12px 0}.controls label{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.controls input[type=range]{width:150px;accent-color:var(--blue)}select,button{font:inherit;border:1px solid #c8d6ea;border-radius:9px;padding:9px 12px;background:#fff;color:var(--ink)}button{background:var(--blue);color:white;border:0;cursor:pointer;font-weight:bold}button.secondary{background:#e3edff;color:#1647a0}button:hover{filter:brightness(.96)}\n.scene{height:230px;position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(#dff4ff,#f7fbff 75%);border:1px solid #d4e5f5}\n.floor{position:absolute;bottom:0;left:0;right:0;height:17px;background:repeating-linear-gradient(135deg,#9bb4d0 0 8px,#c5d5e7 8px 16px);border-top:3px solid #6884a6}\n.lift{position:absolute;bottom:17px;left:50%;transform:translateX(-50%);width:150px;height:190px;border:5px solid #59718e;border-bottom:0;border-radius:9px 9px 0 0;background:#ffffff8c}\n.lift:before{content:\"\";position:absolute;left:50%;top:0;bottom:0;border-left:3px solid #9aacc1}\n.person{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:34px;height:70px;transition:bottom .5s}\n.head{width:22px;height:22px;border-radius:50%;background:#f2bf91;margin:auto;border:2px solid #925b35}.bodyshape{width:28px;height:32px;background:#2563eb;border-radius:7px 7px 3px 3px;margin:1px auto}.legs{display:flex;justify-content:center;gap:5px}.legs span{height:16px;width:8px;background:#334155;border-radius:0 0 3px 3px}\n.gauge{position:absolute;bottom:30px;left:calc(50% + 95px);width:75px;text-align:center;font-size:12px;color:#334155}.gauge .dial{height:65px;border:4px solid #7b8fa8;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:16px}\n.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}.stat{padding:12px;background:#fff;border:1px solid #dce7f5;border-radius:10px}.stat small{display:block;color:var(--muted)}.stat strong{font-size:1.2rem}\ncanvas{width:100%;max-width:100%;height:220px;display:block;background:#fff;border-radius:10px;border:1px solid #dce7f5}\n.quiz{background:#f2fbf7;border:1px solid #bde8d4;border-radius:12px;padding:15px;margin-top:14px}.quiz label{display:block;margin:7px 0}.feedback{font-weight:bold;margin-top:8px}\nfooter{text-align:center;color:var(--muted);padding:10px 15px 28px;font-size:.9rem}\n@media(max-width:560px){.plan{padding:16px}.scene{height:210px}.lift{width:130px}.gauge{left:calc(50% + 78px);width:67px}.controls{align-items:flex-start;flex-direction:column}.controls input[type=range]{width:180px}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\n\u003ch1>Jism og‘irligining harakat turiga bog‘liqligi\u003c/h1>\n\u003cp>Fizika darsi uchun interaktiv HTML5 material • tushuntirish, simulyatsiya, animatsiya va masalalar\u003c/p>\n\u003c/header>\n\u003cmain>\n\u003csection class=\"plan\">\n\u003ch2>1-reja. Jism og‘irligi va unga ta’sir etuvchi omillar\u003c/h2>\n\u003cp>\u003cb>Jism og‘irligi\u003c/b> — jismning tayanchga yoki osmaga ta’sir etadigan kuchi. Tinch holatda yoki vertikal tezlanishsiz harakatda, havo qarshiligi hisobga olinmasa, jism og‘irligi odatda og‘irlik kuchiga teng bo‘ladi.\u003c/p>\n\u003cdiv class=\"formula\">Og‘irlik kuchi: F\u003csub>g\u003c/sub> = mg\u003c/div>\n\u003cp>Bu yerda \u003cb>m\u003c/b> — massa (kg), \u003cb>g\u003c/b> — erkin tushish tezlanishi (Yer yuzida taxminan 9,8 m/s²). Massa kilogrammda, kuch esa nyutonda (N) o‘lchanadi.\u003c/p>\n\u003cp class=\"muted\">Farq: og‘irlik kuchi Yerning jismga ta’siri; jism og‘irligi esa jismning tayanch yoki osmaga ta’sir kuchidir.\u003c/p>\n\u003cdiv class=\"sim\">\n\u003ch3>Simulyatsiya 1: massani o‘zgartiring\u003c/h3>\n\u003cdiv class=\"controls\">\u003clabel>Massa: \u003cb id=\"massVal\">5 kg\u003c/b>\u003cinput id=\"mass\" type=\"range\" min=\"1\" max=\"20\" value=\"5\">\u003c/label>\u003clabel>Erkin tushish tezlanishi: \u003cselect id=\"gravity\">\u003coption value=\"9.8\">Yer — 9,8 m/s²\u003c/option>\u003coption value=\"1.62\">Oy — 1,62 m/s²\u003c/option>\u003coption value=\"3.71\">Mars — 3,71 m/s²\u003c/option>\u003c/select>\u003c/label>\u003c/div>\n\u003cdiv class=\"statrow\">\u003cdiv class=\"stat\">\u003csmall>Massa\u003c/small>\u003cstrong id=\"massStat\">5 kg\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Og‘irlik kuchi mg\u003c/small>\u003cstrong id=\"forceStat\">49 N\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Og‘irlik (tinch holat)\u003c/small>\u003cstrong id=\"weightStat\">49 N\u003c/strong>\u003c/div>\u003c/div>\n\u003cp id=\"gravityExplain\" class=\"muted\">Yerda 5 kg massali jismning og‘irlik kuchi taxminan 49 N.\u003c/p>\n\u003c/div>\n\u003c/section>\n\n\u003csection class=\"plan\">\n\u003ch2>2-reja. Turli harakatlarda jism og‘irligining o‘zgarishi\u003c/h2>\n\u003cp>Vertikal yo‘nalishda tezlanish bo‘lsa, tayanchning jismga ta’sir kuchi o‘zgaradi. Lift misolida bu kuch tarozi ko‘rsatishiga mos keladi.\u003c/p>\n\u003cdiv class=\"formula\">Yuqoriga tezlanishda: P = m(g + a) &nbsp; | &nbsp; Pastga tezlanishda: P = m(g − a)\u003c/div>\n\u003cp>Bu formulalarda \u003cb>P\u003c/b> — tarozi ko‘rsatadigan ko‘rinma og‘irlik, \u003cb>a\u003c/b> — lift tezlanishining moduli. Erkin tushishda a = g bo‘lib, P = 0: jism tayanchga bosim bermaydi va vaznsizlik kuzatiladi.\u003c/p>\n\u003cdiv class=\"sim\">\n\u003ch3>Simulyatsiya 2: lift harakati\u003c/h3>\n\u003cdiv class=\"controls\">\n\u003clabel>Harakat turi: \u003cselect id=\"motion\">\u003coption value=\"rest\">Tinch yoki tekis harakat\u003c/option>\u003coption value=\"up\">Yuqoriga tezlanish\u003c/option>\u003coption value=\"down\">Pastga tezlanish\u003c/option>\u003coption value=\"free\">Erkin tushish (vaznsizlik)\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>Massa: \u003cb id=\"liftMassVal\">60 kg\u003c/b>\u003cinput id=\"liftMass\" type=\"range\" min=\"20\" max=\"120\" value=\"60\" step=\"5\">\u003c/label>\n\u003clabel>Tezlanish: \u003cb id=\"accVal\">2 m/s²\u003c/b>\u003cinput id=\"acc\" type=\"range\" min=\"0\" max=\"9.8\" value=\"2\" step=\"0.2\">\u003c/label>\n\u003c/div>\n\u003cdiv class=\"scene\" id=\"scene\">\u003cdiv class=\"lift\">\u003cdiv class=\"person\" id=\"person\">\u003cdiv class=\"head\">\u003c/div>\u003cdiv class=\"bodyshape\">\u003c/div>\u003cdiv class=\"legs\">\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"gauge\">\u003cdiv class=\"dial\" id=\"dial\">588 N\u003c/div>\u003cdiv>Tarozi\u003c/div>\u003c/div>\u003cdiv class=\"floor\">\u003c/div>\u003c/div>\n\u003cdiv class=\"statrow\">\u003cdiv class=\"stat\">\u003csmall>Haqiqiy og‘irlik kuchi mg\u003c/small>\u003cstrong id=\"trueForce\">588 N\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Tarozi ko‘rsatishi P\u003c/small>\u003cstrong id=\"apparent\">588 N\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Holat\u003c/small>\u003cstrong id=\"stateText\">Oddiy og‘irlik\u003c/strong>\u003c/div>\u003c/div>\n\u003cp class=\"muted\" id=\"motionExplain\">Tinch yoki tekis harakatda tarozi ko‘rsatishi mg ga teng.\u003c/p>\n\u003c/div>\n\u003c/section>\n\n\u003csection class=\"plan\">\n\u003ch2>3-reja. Tajriba, grafik va masalalar orqali o‘rganish\u003c/h2>\n\u003cp>Lift yoki dinamometr yordamida tarozi ko‘rsatishidagi o‘zgarishni kuzatish mumkin. Tezlanish yuqoriga yo‘nalganida ko‘rinma og‘irlik ortadi; pastga yo‘nalganida kamayadi.\u003c/p>\n\u003cdiv class=\"sim\">\n\u003ch3>Grafik: tezlanish va ko‘rinma og‘irlik\u003c/h3>\n\u003cp class=\"muted\">Massa 60 kg deb olingan. Harakat turini tanlab, tarozi ko‘rsatishining qanday o‘zgarishini ko‘ring.\u003c/p>\n\u003cdiv class=\"controls\">\u003clabel>Grafik holati: \u003cselect id=\"graphMotion\">\u003coption value=\"up\">Yuqoriga tezlanish\u003c/option>\u003coption value=\"down\">Pastga tezlanish\u003c/option>\u003c/select>\u003c/label>\u003c/div>\n\u003ccanvas id=\"graph\" width=\"850\" height=\"250\" aria-label=\"Tezlanish va ko‘rinma og‘irlik grafigi\">\u003c/canvas>\n\u003c/div>\n\u003cdiv class=\"sim\">\n\u003ch3>Masala namunasi\u003c/h3>\n\u003cp>\u003cb>Masala:\u003c/b> massasi 50 kg bo‘lgan yo‘lovchi liftda yuqoriga 1,5 m/s² tezlanish bilan harakatlanmoqda. Tarozi ko‘rsatishini toping. g = 9,8 m/s².\u003c/p>\n\u003cdiv class=\"formula\">P = m(g + a) = 50 × (9,8 + 1,5) = 565 N\u003c/div>\n\u003cp>\u003cb>Javob:\u003c/b> 565 N. Tinch holatdagi 490 N bilan solishtirganda ko‘rinma og‘irlik ortgan.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"quiz\">\n\u003ch3>O‘zingizni sinab ko‘ring\u003c/h3>\n\u003cp>Massasi 40 kg bo‘lgan bola liftda pastga 2 m/s² tezlanish bilan harakatlanmoqda. g = 9,8 m/s². Tarozi ko‘rsatishi qancha?\u003c/p>\n{@body const [answer,setAnswer] = DIL.useState(\"\")}\n{@body const [checked,setChecked] = DIL.useState(false)}\n\u003clabel>\u003cinput type=\"radio\" name=\"quiz\" value=\"392\" /> 392 N\u003c/label>\n\u003clabel>\u003cinput type=\"radio\" name=\"quiz\" value=\"312\" /> 312 N\u003c/label>\n\u003clabel>\u003cinput type=\"radio\" name=\"quiz\" value=\"472\" /> 472 N\u003c/label>\n\u003cbutton type=\"button\" id=\"checkAnswer\">Javobni tekshirish\u003c/button>\n\u003cdiv class=\"feedback\" id=\"feedback\" aria-live=\"polite\">\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"plan\">\n\u003ch2>Xulosa\u003c/h2>\n\u003cul>\n\u003cli>Tinch holatda yoki tekis vertikal harakatda: P = mg.\u003c/li>\n\u003cli>Yuqoriga tezlanishda ko‘rinma og‘irlik ortadi: P = m(g + a).\u003c/li>\n\u003cli>Pastga tezlanishda ko‘rinma og‘irlik kamayadi: P = m(g − a).\u003c/li>\n\u003cli>Erkin tushishda ko‘rinma og‘irlik nolga teng bo‘ladi — vaznsizlik.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003c/main>\n\u003cfooter>Interaktiv dars materiali • HTML5, CSS va JavaScript asosida tayyorlandi\u003c/footer>\n\u003cscript>\nconst $=id=>document.getElementById(id);\nfunction updateMass(){\n const m=+$('mass').value,g=+$('gravity').value,w=m*g;\n $('massVal').textContent=m+' kg';$('massStat').textContent=m+' kg';$('forceStat').textContent=w.toFixed(1)+' N';$('weightStat').textContent=w.toFixed(1)+' N';\n const planet=$('gravity').selectedOptions[0].text.split(' — ')[0];\n $('gravityExplain').textContent=planet+'da '+m+' kg massali jism uchun mg = '+w.toFixed(1)+' N. Massa o‘zgarmaydi, lekin g o‘zgarsa og‘irlik kuchi o‘zgaradi.';\n}\n$('mass').addEventListener('input',updateMass);$('gravity').addEventListener('change',updateMass);\nfunction updateLift(){\n const m=+$('liftMass').value,a=+$('acc').value,g=9.8,mode=$('motion').value;\n let p=m*g,state='Oddiy og‘irlik',desc='Tinch yoki tekis harakatda tarozi ko‘rsatishi mg ga teng.',offset=0;\n if(mode==='up'){p=m*(g+a);state='Og‘irlik ortadi';desc='Lift yuqoriga tezlanmoqda: P = m(g + a). Tarozi ko‘rsatishi odatdagidan katta.';offset=10;}\n if(mode==='down'){p=m*Math.max(0,g-a);state='Og‘irlik kamayadi';desc='Lift pastga tezlanmoqda: P = m(g − a). Tezlanish ortgan sari tarozi ko‘rsatishi kamayadi.';offset=-8;}\n if(mode==='free'){p=0;state='Vaznsizlik';desc='Erkin tushishda a = g, shuning uchun tayanch kuchi P = 0. Bu vaznsizlik holati.';offset=-20;}\n $('liftMassVal').textContent=m+' kg';$('accVal').textContent=a.toFixed(1)+' m/s²';$('trueForce').textContent=(m*g).toFixed(1)+' N';$('apparent').textContent=p.toFixed(1)+' N';$('dial').textContent=p.toFixed(0)+' N';$('stateText').textContent=state;$('motionExplain').textContent=desc;\n $('person').style.bottom=(Math.max(0,Math.min(32,offset+18)))+'px';\n $('person').style.transform='translateX(-50%) '+(mode==='free'?'rotate(7deg)':'rotate(0deg)');\n drawGraph();\n}\n['motion','liftMass','acc'].forEach(id=>$(id).addEventListener('input',updateLift));\n$('graphMotion').addEventListener('change',drawGraph);\nfunction drawGraph(){\n const c=$('graph'),ctx=c.getContext('2d'),w=c.width,h=c.height,m=60,g=9.8,mode=$('graphMotion').value;\n ctx.clearRect(0,0,w,h);ctx.font='14px Arial';ctx.fillStyle='#14233b';ctx.strokeStyle='#cbd8e8';ctx.lineWidth=1;\n const L=65,R=20,T=18,B=42,gw=w-L-R,gh=h-T-B,max=1200;\n for(let i=0;i\u003c=5;i++){let y=T+gh*i/5;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(w-R,y);ctx.stroke();ctx.fillStyle='#52647c';ctx.fillText(Math.round(max*(1-i/5))+' N',8,y+4);}\n for(let i=0;i\u003c=5;i++){let x=L+gw*i/5;ctx.beginPath();ctx.moveTo(x,T);ctx.lineTo(x,T+gh);ctx.stroke();ctx.fillStyle='#52647c';ctx.fillText((9.8*i/5).toFixed(1),x-10,h-18);}\n ctx.fillStyle='#14233b';ctx.fillText('Tezlanish a (m/s²)',w/2-65,h-2);\n ctx.strokeStyle='#2563eb';ctx.lineWidth=3;ctx.beginPath();\n for(let i=0;i\u003c=100;i++){let a=9.8*i/100,p=mode==='up'?m*(g+a):m*(g-a),x=L+gw*a/9.8,y=T+gh*(1-p/max);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();\n ctx.fillStyle='#2563eb';ctx.fillText(mode==='up'?'P = m(g + a)':'P = m(g − a)',L+12,T+18);\n}\n$('checkAnswer').addEventListener('click',()=>{\n const chosen=document.querySelector('input[name=\"quiz\"]:checked');\n $('feedback').textContent=!chosen?'Iltimos, javob variantini tanlang.':chosen.value==='312'?'To‘g‘ri! P = m(g − a) = 40 × (9,8 − 2) = 312 N.':'Qayta urinib ko‘ring. Pastga tezlanishda P = m(g − a) formulasidan foydalaning.';\n $('feedback').style.color=chosen&&chosen.value==='312'?'#087443':'#b45309';\n});\nupdateMass();updateLift();\n\u003c/script>\n\u003c/body>\n\u003c/html>", "6-mavzu": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>6-mavzu: Jismning bir nechta kuch ta’siridagi harakati\u003c/title>\n\u003cstyle>\n:root{--bg:#f3f7fc;--card:#fff;--ink:#17243a;--muted:#5d6b82;--blue:#2463eb;--teal:#0d9488;--orange:#ea580c;--line:#dbe4f0}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.55}\nheader{background:linear-gradient(125deg,#123b82,#2876e8);color:white;padding:30px 18px 34px;text-align:center}\nheader .tag{display:inline-block;background:#ffffff24;border:1px solid #ffffff55;border-radius:30px;padding:5px 12px;font-size:13px}\nh1{font-size:clamp(25px,4vw,38px);line-height:1.2;margin:15px auto 10px;max-width:950px}\nheader p{margin:0 auto;max-width:800px;color:#e8f0ff}\nmain{max-width:1100px;margin:22px auto;padding:0 15px 40px}\nnav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}\nnav a{background:white;border:1px solid var(--line);padding:9px 13px;border-radius:10px;text-decoration:none;color:#1747a3;font-weight:bold;font-size:14px}\nsection,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:0 0 18px;box-shadow:0 5px 18px #17345b0a}\nh2{font-size:23px;margin:0 0 8px;color:#1747a3}h3{font-size:18px;margin:18px 0 8px}\n.lead{color:var(--muted);margin-top:0}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}\n.formula{background:#eef5ff;border-left:4px solid var(--blue);padding:12px 14px;border-radius:8px;font-size:18px;font-weight:bold}\n.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px;margin:12px 0}\nlabel{display:block;font-weight:bold;font-size:14px;margin-bottom:5px}\ninput[type=range]{width:100%;accent-color:var(--blue)}\noutput,.value{font-weight:bold;color:var(--blue)}\ncanvas{width:100%;height:280px;display:block;background:linear-gradient(#fbfdff,#f1f6ff);border:1px solid var(--line);border-radius:12px}\n.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}\n.stat{background:#f6f9ff;border:1px solid var(--line);border-radius:10px;padding:11px}\n.stat small{display:block;color:var(--muted)}.stat strong{font-size:20px}\nbutton{background:var(--blue);color:white;border:0;border-radius:9px;padding:10px 15px;font-weight:bold;cursor:pointer;margin:4px 4px 4px 0}\nbutton.secondary{background:#e8efff;color:#1747a3}button:hover{filter:brightness(.96)}\n.note{background:#fff7ed;border-left:4px solid var(--orange);padding:11px 13px;border-radius:8px}\n.good{background:#ecfdf5;border-left:4px solid var(--teal);padding:11px 13px;border-radius:8px}\ntable{width:100%;border-collapse:collapse;margin:10px 0}th,td{padding:10px;border:1px solid var(--line);text-align:left}th{background:#eef5ff}\n.quiz-q{padding:12px 0;border-bottom:1px solid var(--line)}.quiz-q label{font-weight:normal;margin:7px 0}\nfooter{text-align:center;color:var(--muted);font-size:13px;padding:8px}\n@media(max-width:600px){section,.panel{padding:15px}canvas{height:240px}nav a{font-size:12px}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\n  \u003cspan class=\"tag\">FIZIKA • INTERAKTIV DARS\u003c/span>\n  \u003ch1>6-mavzu: Jismning bir nechta kuch ta’siridagi harakati\u003c/h1>\n  \u003cp>Uchta reja asosida nazariya, formulalar, jonli simulyatsiyalar, animatsiyalar va bilimni tekshirish.\u003c/p>\n\u003c/header>\n\u003cmain>\n\u003cnav>\n  \u003ca href=\"#reja1\">1. Kuchlar va teng ta’sir etuvchi\u003c/a>\n  \u003ca href=\"#reja2\">2. Harakat qonunlari\u003c/a>\n  \u003ca href=\"#reja3\">3. Masalalar va amaliyot\u003c/a>\n  \u003ca href=\"#test\">Bilimni tekshirish\u003c/a>\n\u003c/nav>\n\n\u003csection id=\"reja1\">\n\u003ch2>1-reja. Jismga ta’sir etuvchi kuchlar va ularning teng ta’sir etuvchisi\u003c/h2>\n\u003cp class=\"lead\">Jismga bir vaqtning o‘zida bir nechta kuch ta’sir qilishi mumkin. Ularning umumiy ta’siri vektor yig‘indi — \u003cb>teng ta’sir etuvchi kuch\u003c/b> bilan aniqlanadi.\u003c/p>\n\u003cdiv class=\"grid\">\n \u003cdiv>\u003cdiv class=\"formula\">F⃗\u003csub>teng\u003c/sub> = F⃗\u003csub>1\u003c/sub> + F⃗\u003csub>2\u003c/sub> + ...\u003c/div>\n \u003cp>Kuchlar bir yo‘nalishda bo‘lsa, modullari qo‘shiladi. Qarama-qarshi yo‘nalishda bo‘lsa, kattasidan kichigi ayriladi. Natijaviy kuch nol bo‘lsa, kuchlar muvozanatlashgan bo‘ladi.\u003c/p>\n \u003cdiv class=\"note\">\u003cb>Eslab qoling:\u003c/b> kuch — vektor kattalik; uning moduli ham, yo‘nalishi ham muhim.\u003c/div>\u003c/div>\n \u003cdiv>\u003ch3>Misol\u003c/h3>\u003cp>Jismni o‘ngga 12 N, chapga 5 N kuch tortmoqda. Natijaviy kuch:\u003c/p>\u003cdiv class=\"formula\">F\u003csub>teng\u003c/sub> = 12 − 5 = 7 N →\u003c/div>\u003cp>Demak, jism tezlanishi o‘ng tomonga yo‘naladi.\u003c/p>\u003c/div>\n\u003c/div>\n\u003ch3>Simulyatsiya 1 — kuchlar vektorini o‘zgartiring\u003c/h3>\n\u003cp>Slayderlarni suring. O‘ngga va chapga yo‘nalgan kuchlar hamda natijaviy kuch strelkalari o‘zgarishini kuzating.\u003c/p>\n\u003cdiv class=\"controls\">\n \u003cdiv>\u003clabel for=\"rightF\">O‘ngga kuch: \u003coutput id=\"rightVal\">12 N\u003c/output>\u003c/label>\u003cinput id=\"rightF\" type=\"range\" min=\"0\" max=\"20\" value=\"12\">\u003c/div>\n \u003cdiv>\u003clabel for=\"leftF\">Chapga kuch: \u003coutput id=\"leftVal\">5 N\u003c/output>\u003c/label>\u003cinput id=\"leftF\" type=\"range\" min=\"0\" max=\"20\" value=\"5\">\u003c/div>\n\u003c/div>\n\u003ccanvas id=\"forceCanvas\" aria-label=\"Kuchlar vektori simulyatsiyasi\">\u003c/canvas>\n\u003cdiv class=\"stats\">\n \u003cdiv class=\"stat\">\u003csmall>Teng ta’sir etuvchi\u003c/small>\u003cstrong id=\"netF\">7 N →\u003c/strong>\u003c/div>\n \u003cdiv class=\"stat\">\u003csmall>Kuchlar holati\u003c/small>\u003cstrong id=\"balance\">Muvozanatlashmagan\u003c/strong>\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"reja2\">\n\u003ch2>2-reja. Bir nechta kuch ta’sirida jismning harakat qonunlari va Nyuton qonunlari\u003c/h2>\n\u003cp class=\"lead\">Nyutonning ikkinchi qonuniga ko‘ra, jismning tezlanishi natijaviy kuchga to‘g‘ri, massa­ga teskari proporsional.\u003c/p>\n\u003cdiv class=\"grid\">\n \u003cdiv class=\"formula\">F\u003csub>teng\u003c/sub> = ma &nbsp; → &nbsp; a = F\u003csub>teng\u003c/sub>/m\u003c/div>\n \u003cdiv>\u003cb>Birliklar:\u003c/b> kuch — nyuton (N), massa — kilogramm (kg), tezlanish — m/s².\u003c/div>\n\u003c/div>\n\u003cul>\n\u003cli>\u003cb>Nyutonning I qonuni:\u003c/b> natijaviy kuch nol bo‘lsa, jism tinch turadi yoki tekis to‘g‘ri chiziqli harakatini davom ettiradi.\u003c/li>\n\u003cli>\u003cb>Nyutonning II qonuni:\u003c/b> natijaviy kuch jismga tezlanish beradi.\u003c/li>\n\u003cli>\u003cb>Nyutonning III qonuni:\u003c/b> jismlar o‘zaro teng modulli, qarama-qarshi yo‘nalgan kuchlar bilan ta’sirlashadi. Bu kuchlar turli jismlarga ta’sir qiladi.\u003c/li>\n\u003c/ul>\n\u003ch3>Simulyatsiya 2 — aravachaning tezlanishi\u003c/h3>\n\u003cp>Kuch va massani o‘zgartiring, so‘ng “Harakatni boshlash” tugmasini bosing. Aravachaning tezligi natijaviy kuchga qarab o‘zgaradi.\u003c/p>\n\u003cdiv class=\"controls\">\n \u003cdiv>\u003clabel for=\"pushF\">Oldinga kuch: \u003coutput id=\"pushVal\">15 N\u003c/output>\u003c/label>\u003cinput id=\"pushF\" type=\"range\" min=\"0\" max=\"30\" value=\"15\">\u003c/div>\n \u003cdiv>\u003clabel for=\"frictionF\">Ishqalanish kuchi: \u003coutput id=\"frictionVal\">5 N\u003c/output>\u003c/label>\u003cinput id=\"frictionF\" type=\"range\" min=\"0\" max=\"20\" value=\"5\">\u003c/div>\n \u003cdiv>\u003clabel for=\"mass\">Jism massasi: \u003coutput id=\"massVal\">2 kg\u003c/output>\u003c/label>\u003cinput id=\"mass\" type=\"range\" min=\"1\" max=\"10\" value=\"2\">\u003c/div>\n\u003c/div>\n\u003ccanvas id=\"motionCanvas\" aria-label=\"Aravacha harakati animatsiyasi\">\u003c/canvas>\n\u003cdiv class=\"stats\">\n \u003cdiv class=\"stat\">\u003csmall>Natijaviy kuch\u003c/small>\u003cstrong id=\"netMotion\">10 N\u003c/strong>\u003c/div>\n \u003cdiv class=\"stat\">\u003csmall>Tezlanish\u003c/small>\u003cstrong id=\"accel\">5 m/s²\u003c/strong>\u003c/div>\n \u003cdiv class=\"stat\">\u003csmall>Tezlik\u003c/small>\u003cstrong id=\"speed\">0 m/s\u003c/strong>\u003c/div>\n \u003cdiv class=\"stat\">\u003csmall>Vaqt\u003c/small>\u003cstrong id=\"elapsed\">0.0 s\u003c/strong>\u003c/div>\n\u003c/div>\n\u003cbutton id=\"startMotion\">▶ Harakatni boshlash\u003c/button>\u003cbutton class=\"secondary\" id=\"pauseMotion\">Ⅱ Pauza\u003c/button>\u003cbutton class=\"secondary\" id=\"resetMotion\">↺ Qayta boshlash\u003c/button>\n\u003cdiv class=\"note\">Model soddalashtirilgan: natijaviy kuch musbat bo‘lsa, aravacha o‘ngga tezlanadi. Real vaziyatlarda ishqalanish tezlikka va sirtga ham bog‘liq bo‘lishi mumkin.\u003c/div>\n\u003c/section>\n\n\u003csection id=\"reja3\">\n\u003ch2>3-reja. Bir nechta kuch ta’siridagi harakatga doir masalalar va amaliy misollar\u003c/h2>\n\u003cp class=\"lead\">Masala yechish algoritmi: 1) jismga ta’sir etuvchi kuchlarni aniqlash; 2) yo‘nalishlarni belgilash; 3) natijaviy kuchni topish; 4) Nyutonning II qonunini qo‘llash; 5) birlik va javobni tekshirish.\u003c/p>\n\u003ch3>Animatsiyali masala\u003c/h3>\n\u003cp>3 kg massali aravachaga o‘ngga 18 N, chapga 6 N kuch ta’sir qilmoqda. Ishqalanish hisobga olinmasa, tezlanishni toping.\u003c/p>\n\u003cbutton id=\"solveBtn\">Yechim bosqichlarini ko‘rsatish\u003c/button>\n\u003cdiv id=\"solution\" hidden>\n \u003cp>\u003cb>1-bosqich.\u003c/b> Natijaviy kuchni topamiz: F = 18 − 6 = 12 N.\u003c/p>\n \u003cp>\u003cb>2-bosqich.\u003c/b> Nyutonning II qonuni: a = F/m.\u003c/p>\n \u003cp>\u003cb>3-bosqich.\u003c/b> a = 12/3 = \u003cb>4 m/s²\u003c/b>. Tezlanish o‘ngga yo‘nalgan.\u003c/p>\n \u003ccanvas id=\"problemCanvas\" aria-label=\"Masala yechimi kuchlar animatsiyasi\">\u003c/canvas>\n\u003c/div>\n\u003ch3>Mustaqil ishlash uchun\u003c/h3>\n\u003ctable>\n\u003cthead>\u003ctr>\u003cth>№\u003c/th>\u003cth>Shart\u003c/th>\u003cth>Toping\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Jismga o‘ngga 20 N, chapga 8 N kuch ta’sir qiladi. Massa 4 kg.\u003c/td>\u003ctd>Natijaviy kuch va tezlanish\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>10 kg massali jismga 30 N tortish kuchi va 10 N ishqalanish kuchi ta’sir qiladi.\u003c/td>\u003ctd>Tezlanish\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Natijaviy kuch 0 N bo‘lgan jism 3 m/s tezlik bilan harakatlanmoqda.\u003c/td>\u003ctd>Jism harakati qanday davom etadi?\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cdetails>\u003csummary>\u003cb>Mustaqil masalalar javoblari\u003c/b>\u003c/summary>\n\u003cp>1) F = 20 − 8 = 12 N; a = 12/4 = 3 m/s², o‘ngga.\u003c/p>\n\u003cp>2) F = 30 − 10 = 20 N; a = 20/10 = 2 m/s².\u003c/p>\n\u003cp>3) Jismga boshqa kuchlar ta’sir qilmasa va natijaviy kuch nol bo‘lib qolsa, u 3 m/s tezlik bilan tekis to‘g‘ri chiziqli harakatini davom ettiradi.\u003c/p>\n\u003c/details>\n\u003c/section>\n\n\u003csection id=\"test\">\n\u003ch2>Bilimni tekshirish\u003c/h2>\n\u003cp>Har bir savolda bitta javobni tanlang va “Natijani tekshirish” tugmasini bosing.\u003c/p>\n\u003cform id=\"quiz\">\n \u003cdiv class=\"quiz-q\">\u003cb>1. Jismga 10 N o‘ngga va 10 N chapga kuch ta’sir qilsa, natijaviy kuch qancha?\u003c/b>\n \u003clabel>\u003cinput type=\"radio\" name=\"q1\" value=\"a\"> 20 N\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q1\" value=\"b\"> 0 N\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q1\" value=\"c\"> 10 N\u003c/label>\u003c/div>\n \u003cdiv class=\"quiz-q\">\u003cb>2. Natijaviy kuch 12 N, massa 3 kg. Tezlanish qancha?\u003c/b>\n \u003clabel>\u003cinput type=\"radio\" name=\"q2\" value=\"a\"> 4 m/s²\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q2\" value=\"b\"> 36 m/s²\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q2\" value=\"c\"> 9 m/s²\u003c/label>\u003c/div>\n \u003cdiv class=\"quiz-q\">\u003cb>3. Natijaviy kuch nol bo‘lsa, jism qanday harakat qilishi mumkin?\u003c/b>\n \u003clabel>\u003cinput type=\"radio\" name=\"q3\" value=\"a\"> Faqat tezlanadi\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q3\" value=\"b\"> Faqat to‘xtaydi\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q3\" value=\"c\"> Tinch turadi yoki tekis to‘g‘ri chiziqli harakat qiladi\u003c/label>\u003c/div>\n \u003cbutton type=\"button\" id=\"checkQuiz\">Natijani tekshirish\u003c/button>\u003cbutton type=\"reset\" class=\"secondary\" id=\"clearQuiz\">Qayta ishlash\u003c/button>\n\u003c/form>\n\u003cdiv id=\"quizResult\" class=\"good\" hidden aria-live=\"polite\">\u003c/div>\n\u003c/section>\n\u003cfooter>6-mavzu • Interaktiv HTML5 o‘quv materiali • Telefon va kompyuterda ishlaydi\u003c/footer>\n\u003c/main>\n\u003cscript>\nconst $=id=>document.getElementById(id);\nfunction arrow(ctx,x1,y1,x2,y2,color,width=4){\n ctx.save();ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=width;ctx.lineCap='round';\n ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();\n const a=Math.atan2(y2-y1,x2-x1),h=11;\n ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-h*Math.cos(a-Math.PI/6),y2-h*Math.sin(a-Math.PI/6));ctx.lineTo(x2-h*Math.cos(a+Math.PI/6),y2-h*Math.sin(a+Math.PI/6));ctx.closePath();ctx.fill();ctx.restore();\n}\nfunction setupCanvas(c){const dpr=window.devicePixelRatio||1, r=c.getBoundingClientRect();c.width=Math.max(300,r.width*dpr);c.height=Math.max(200,r.height*dpr);const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return {ctx,w:r.width,h:r.height};}\nfunction drawForces(){\n const {ctx,w,h}=setupCanvas($('forceCanvas')),r=+$('rightF').value,l=+$('leftF').value,net=r-l,y=h*.56,cx=w*.5;\n ctx.clearRect(0,0,w,h);ctx.fillStyle='#52647d';ctx.font='13px Arial';ctx.fillText('Kuchlar masshtabi: uzunlik kuch moduliga mutanosib',14,22);\n ctx.fillStyle='#a8b8cc';ctx.fillRect(25,y-2,w-50,4);\n ctx.fillStyle='#dce8f8';ctx.fillRect(cx-25,y-18,50,36);ctx.strokeStyle='#7794bd';ctx.strokeRect(cx-25,y-18,50,36);\n ctx.fillStyle='#18365f';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText('JISM',cx,y+5);ctx.textAlign='left';\n const scale=Math.min((w*.36)/20,9);\n if(r) {arrow(ctx,cx+26,y-7,cx+26+r*scale,y-7,'#16835e',4);ctx.fillStyle='#16835e';ctx.fillText(r+' N →',cx+30,y-19);}\n if(l) {arrow(ctx,cx-26,y+8,cx-26-l*scale,y+8,'#db5b22',4);ctx.fillStyle='#db5b22';ctx.fillText('← '+l+' N',Math.max(8,cx-30-l*scale),y+29);}\n const start=net>=0?cx+26:cx-26, end=cx+26+net*scale;\n if(Math.abs(net)>.01)arrow(ctx,start,y+65,end,y+65,'#245fe5',5);\n else {ctx.fillStyle='#245fe5';ctx.fillText('F teng = 0 N',cx-40,y+72);}\n ctx.fillStyle='#245fe5';ctx.font='bold 14px Arial';ctx.fillText('Natijaviy kuch: '+net+' N',14,h-18);\n $('rightVal').textContent=r+' N';$('leftVal').textContent=l+' N';$('netF').textContent=Math.abs(net)+' N '+(net>0?'→':net\u003c0?'←':'');\n $('balance').textContent=net===0?'Muvozanatlashgan':'Muvozanatlashmagan';\n}\n['rightF','leftF'].forEach(id=>$(id).addEventListener('input',drawForces));\nlet running=false,vel=0,pos=.16,t=0,last=0,raf=0;\nfunction params(){return {f:+$('pushF').value,fr:+$('frictionF').value,m:+$('mass').value};}\nfunction drawMotion(){\n const {ctx,w,h}=setupCanvas($('motionCanvas')),p=params(),net=p.f-p.fr,a=net/p.m;\n ctx.clearRect(0,0,w,h);ctx.fillStyle='#d4e2f4';ctx.fillRect(0,h*.72,w,5);\n ctx.fillStyle='#6f829d';ctx.font='13px Arial';ctx.fillText('Harakat yo‘nalishi →',12,22);\n const x=40+pos*Math.max(1,w-115),y=h*.72-35;\n ctx.fillStyle='#e3a33c';ctx.fillRect(x,y,65,30);ctx.fillStyle='#724916';ctx.fillRect(x+8,y+7,49,10);\n ctx.fillStyle='#2d405a';ctx.beginPath();ctx.arc(x+14,y+32,7,0,Math.PI*2);ctx.arc(x+51,y+32,7,0,Math.PI*2);ctx.fill();\n if(p.f>0)arrow(ctx,x+30,y-10,x+30+Math.min(80,p.f*2.5),y-10,'#16835e',4);\n if(p.fr>0)arrow(ctx,x+30,y+10,x+30-Math.min(70,p.fr*2.5),y+10,'#db5b22',4);\n ctx.fillStyle='#16835e';ctx.fillText('F = '+p.f+' N',12,48);ctx.fillStyle='#db5b22';ctx.fillText('Ishqalanish = '+p.fr+' N',12,68);\n $('pushVal').textContent=p.f+' N';$('frictionVal').textContent=p.fr+' N';$('massVal').textContent=p.m+' kg';\n $('netMotion').textContent=net+' N';$('accel').textContent=a.toFixed(2)+' m/s²';$('speed').textContent=vel.toFixed(2)+' m/s';$('elapsed').textContent=t.toFixed(1)+' s';\n}\nfunction tick(now){if(!running)return;if(!last)last=now;let dt=Math.min((now-last)/1000,.04);last=now;const p=params();vel=Math.max(0,vel+(p.f-p.fr)/p.m*dt);t+=dt;pos+=vel*dt/90;if(pos>.88)pos=.02;drawMotion();raf=requestAnimationFrame(tick);}\n$('startMotion').onclick=()=>{if(!running){running=true;last=0;raf=requestAnimationFrame(tick);}};\n$('pauseMotion').onclick=()=>{running=false;cancelAnimationFrame(raf);last=0;};\n$('resetMotion').onclick=()=>{running=false;cancelAnimationFrame(raf);vel=0;pos=.16;t=0;last=0;drawMotion();};\n['pushF','frictionF','mass'].forEach(id=>$(id).addEventListener('input',drawMotion));\n$('solveBtn').onclick=()=>{const s=$('solution');s.hidden=!s.hidden;$('solveBtn').textContent=s.hidden?'Yechim bosqichlarini ko‘rsatish':'Yechimni yashirish';if(!s.hidden)drawProblem();};\nfunction drawProblem(){const {ctx,w,h}=setupCanvas($('problemCanvas'));ctx.clearRect(0,0,w,h);const x=w*.5,y=h*.5;ctx.fillStyle='#dce8f8';ctx.fillRect(x-25,y-17,50,34);ctx.strokeStyle='#7794bd';ctx.strokeRect(x-25,y-17,50,34);ctx.fillStyle='#18365f';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText('3 kg',x,y+4);arrow(ctx,x+28,y-6,x+28+Math.min(100,w*.28),y-6,'#16835e',4);arrow(ctx,x-28,y+7,x-28-Math.min(45,w*.14),y+7,'#db5b22',4);ctx.textAlign='left';ctx.fillStyle='#16835e';ctx.fillText('18 N',x+35,y-18);ctx.fillStyle='#db5b22';ctx.fillText('6 N',Math.max(8,x-80),y+30);ctx.fillStyle='#245fe5';ctx.font='bold 15px Arial';ctx.fillText('F teng = 12 N →     a = 4 m/s²',12,h-20);}\n$('checkQuiz').onclick=()=>{const answers={q1:'b',q2:'a',q3:'c'};let score=0;for(const [q,a] of Object.entries(answers)){const chosen=document.querySelector('input[name=\"'+q+'\"]:checked');if(chosen&&chosen.value===a)score++;}const r=$('quizResult');r.hidden=false;r.textContent='Natija: '+score+'/3 ta to‘g‘ri. '+(score===3?'A’lo! Mavzuni yaxshi tushunibsiz.':score===2?'Yaxshi! Xatolarni ko‘rib, formulalarni takrorlang.':'Formulalarni qayta ko‘rib chiqing va yana urinib ko‘ring.');};\n$('clearQuiz').onclick=()=>{$('quizResult').hidden=true;};\nwindow.addEventListener('resize',()=>{drawForces();drawMotion();if(!$('solution').hidden)drawProblem();});\ndrawForces();drawMotion();\n\u003c/script>\n\u003c/body>\n\u003c/html>", "7-mavzu": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Yuqoridagi mavzular bo‘yicha masalalar yechish\u003c/title>\n\u003cstyle>\n:root{--blue:#245fe5;--navy:#173b7a;--bg:#f3f7fc;--ink:#17243a;--muted:#5b6b82;--line:#dce5f1;--green:#0d8b68;--orange:#d96a22}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Arial,Helvetica,sans-serif}\nheader{background:linear-gradient(130deg,#153776,#2879ed);color:#fff;text-align:center;padding:32px 18px}\nheader .tag{border:1px solid #ffffff66;background:#ffffff20;padding:5px 12px;border-radius:30px;font-size:13px}\nh1{font-size:clamp(25px,4vw,39px);line-height:1.2;max-width:950px;margin:16px auto 10px}header p{max-width:850px;margin:auto;color:#eaf1ff}\nmain{max-width:1100px;margin:22px auto;padding:0 15px 40px}\nnav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}nav a{background:white;color:#1747a3;border:1px solid var(--line);border-radius:9px;padding:8px 12px;text-decoration:none;font-weight:bold;font-size:14px}\nsection,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 5px 18px #18355d09}\nh2{margin:0 0 8px;color:#1747a3;font-size:23px}h3{margin:18px 0 8px;font-size:18px}.muted{color:var(--muted);margin-top:0}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:13px}.formula{background:#eef5ff;border-left:4px solid var(--blue);padding:12px 14px;border-radius:8px;font-size:18px;font-weight:bold}\nlabel{font-weight:bold;display:block;font-size:14px;margin:8px 0 4px}input,select,textarea{font:inherit}input[type=range]{width:100%;accent-color:var(--blue)}input[type=number]{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px}\nbutton{border:0;background:var(--blue);color:white;padding:10px 15px;border-radius:9px;font-weight:bold;cursor:pointer;margin:5px 4px 4px 0}button.secondary{background:#e8efff;color:#1747a3}button:hover{filter:brightness(.96)}\ncanvas{width:100%;height:245px;display:block;background:linear-gradient(#fcfdff,#f0f6ff);border:1px solid var(--line);border-radius:12px}\n.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:9px;margin:12px 0}.stat{background:#f5f8ff;border:1px solid var(--line);border-radius:10px;padding:10px}.stat small{display:block;color:var(--muted)}.stat strong{font-size:19px}\n.step{padding:10px 12px;border-bottom:1px solid var(--line)}.step:last-child{border-bottom:0}.callout{background:#fff7ed;border-left:4px solid var(--orange);padding:11px 13px;border-radius:8px}.success{background:#ecfdf5;border-left:4px solid var(--green);padding:11px 13px;border-radius:8px}\n.problem{border:1px solid var(--line);padding:14px;border-radius:12px;margin:12px 0}.problem h3{margin-top:0}.answer{display:none;background:#effcf5;border-radius:8px;padding:12px;margin-top:10px}.answer.show{display:block}\n.quiz label{font-weight:normal}.quiz-q{padding:12px 0;border-bottom:1px solid var(--line)}.prompt{white-space:pre-wrap;background:#f7f9fd;border:1px solid var(--line);border-radius:10px;padding:14px;font-size:14px}\nfooter{text-align:center;color:var(--muted);font-size:13px;padding:10px}\n@media(max-width:600px){section,.card{padding:15px}canvas{height:220px}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\n\u003cspan class=\"tag\">10-SINF FIZIKA • INTERAKTIV MASHG‘ULOT\u003c/span>\n\u003ch1>Yuqoridagi mavzular bo‘yicha masalalar yechish\u003c/h1>\n\u003cp>Markazga intilma kuch, gravitatsiya maydonidagi harakat, jism og‘irligining harakat turiga bog‘liqligi va bir nechta kuch ta’siridagi harakat bo‘yicha formulalar, simulyatsiyalar va mashqlar.\u003c/p>\n\u003c/header>\n\u003cmain>\n\u003cnav>\n\u003ca href=\"#formulalar\">Formulalar\u003c/a>\u003ca href=\"#centripetal\">1. Markazga intilma kuch\u003c/a>\u003ca href=\"#gravity\">2. Gravitatsiya\u003c/a>\u003ca href=\"#weight\">3. Jism og‘irligi\u003c/a>\u003ca href=\"#forces\">4. Bir nechta kuch\u003c/a>\u003ca href=\"#practice\">Mustaqil masalalar\u003c/a>\u003ca href=\"#quiz\">Test\u003c/a>\u003ca href=\"#prompt\">Mukammal prompt\u003c/a>\n\u003c/nav>\n\n\u003csection id=\"formulalar\">\n\u003ch2>Asosiy formulalar eslatmasi\u003c/h2>\n\u003cdiv class=\"grid\">\n\u003cdiv class=\"formula\">Markazga intilma kuch: F = mv²/r\u003c/div>\n\u003cdiv class=\"formula\">Gravitatsion kuch: F = GmM/r²\u003c/div>\n\u003cdiv class=\"formula\">Erkin tushish: g = GM/R²\u003c/div>\n\u003cdiv class=\"formula\">Jism og‘irligi: P = m(g ± a)\u003c/div>\n\u003cdiv class=\"formula\">Nyutonning II qonuni: F\u003csub>teng\u003c/sub> = ma\u003c/div>\n\u003cdiv class=\"formula\">Tezlik: v = v₀ + at\u003c/div>\n\u003c/div>\n\u003cp class=\"muted\">Belgilar: m — jism massasi, v — tezlik, r — aylana radiusi, G — gravitatsion doimiy, M — markaziy jism massasi, g — erkin tushish tezlanishi, a — tezlanish. Yer yaqinida hisoblashda g ≈ 9,8 m/s² (maktab masalalarida 10 m/s² deb olinishi mumkin).\u003c/p>\n\u003c/section>\n\n\u003csection id=\"centripetal\">\n\u003ch2>1. Markazga intilma kuch\u003c/h2>\n\u003cp class=\"muted\">Aylana bo‘ylab harakatda tezlik yo‘nalishi uzluksiz o‘zgaradi. Markazga yo‘nalgan natijaviy kuch jismni egri chiziqli trayektoriyada ushlab turadi.\u003c/p>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003cp>\u003cb>Namuna:\u003c/b> massasi 2 kg bo‘lgan jism radiusi 4 m aylana bo‘ylab 6 m/s tezlik bilan harakatlanadi.\u003c/p>\n\u003cdiv class=\"formula\">F = mv²/r = 2 × 6² / 4 = 18 N\u003c/div>\n\u003cp>Javob: markazga intilma kuch 18 N.\u003c/p>\u003c/div>\n\u003cdiv>\u003ccanvas id=\"orbitCanvas\" aria-label=\"Aylana bo‘ylab harakat animatsiyasi\">\u003c/canvas>\u003cbutton id=\"orbitToggle\">Ⅱ Animatsiyani pauza qilish\u003c/button>\u003c/div>\n\u003c/div>\n\u003ch3>Interaktiv hisoblagich\u003c/h3>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003clabel for=\"cmass\">Massa: \u003cspan id=\"cmassV\">2\u003c/span> kg\u003c/label>\u003cinput id=\"cmass\" type=\"range\" min=\"1\" max=\"10\" value=\"2\">\u003c/div>\n\u003cdiv>\u003clabel for=\"cvel\">Tezlik: \u003cspan id=\"cvelV\">6\u003c/span> m/s\u003c/label>\u003cinput id=\"cvel\" type=\"range\" min=\"1\" max=\"15\" value=\"6\">\u003c/div>\n\u003cdiv>\u003clabel for=\"crad\">Radius: \u003cspan id=\"cradV\">4\u003c/span> m\u003c/label>\u003cinput id=\"crad\" type=\"range\" min=\"1\" max=\"12\" value=\"4\">\u003c/div>\n\u003c/div>\n\u003cdiv class=\"stats\">\u003cdiv class=\"stat\">\u003csmall>Markazga intilma kuch\u003c/small>\u003cstrong id=\"cforce\">18 N\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Tezlanish\u003c/small>\u003cstrong id=\"cacc\">9 m/s²\u003c/strong>\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection id=\"gravity\">\n\u003ch2>2. Gravitatsiya maydonidagi harakat\u003c/h2>\n\u003cp class=\"muted\">Gravitatsion kuch jismlarni o‘zaro tortadi. Yer yaqinida, havo qarshiligi e’tiborga olinmasa, jismlar bir xil g tezlanish bilan erkin tushadi.\u003c/p>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003cb>Namuna:\u003c/b> 2 kg jism Yer sirtiga yaqin joyda erkin tushmoqda. g = 9,8 m/s².\u003c/div>\n\u003cdiv class=\"formula\">F = mg = 2 × 9,8 = 19,6 N\u003c/div>\n\u003c/div>\n\u003ch3>Simulyatsiya — tushish vaqti va masofa\u003c/h3>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003clabel for=\"height\">Boshlang‘ich balandlik: \u003cspan id=\"heightV\">20\u003c/span> m\u003c/label>\u003cinput id=\"height\" type=\"range\" min=\"5\" max=\"100\" value=\"20\">\u003c/div>\n\u003cdiv>\u003clabel for=\"gravG\">Erkin tushish tezlanishi: \u003cspan id=\"gravGV\">9,8\u003c/span> m/s²\u003c/label>\u003cinput id=\"gravG\" type=\"range\" min=\"1\" max=\"20\" step=\".1\" value=\"9.8\">\u003c/div>\n\u003c/div>\n\u003ccanvas id=\"fallCanvas\" aria-label=\"Erkin tushish simulyatsiyasi\">\u003c/canvas>\n\u003cdiv class=\"stats\">\u003cdiv class=\"stat\">\u003csmall>Tushish vaqti (taxminiy)\u003c/small>\u003cstrong id=\"fallTime\">2,02 s\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Yerga urilish tezligi\u003c/small>\u003cstrong id=\"fallSpeed\">19,80 m/s\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Joriy tushish masofasi\u003c/small>\u003cstrong id=\"fallDistance\">0,0 m\u003c/strong>\u003c/div>\u003c/div>\n\u003cbutton id=\"fallStart\">▶ Tushirish\u003c/button>\u003cbutton class=\"secondary\" id=\"fallReset\">↺ Qayta boshlash\u003c/button>\n\u003cp class=\"callout\">Model havo qarshiligini hisobga olmaydi. Formulalar: h = gt²/2 va v = gt (boshlang‘ich tezlik nol bo‘lganda).\u003c/p>\n\u003c/section>\n\n\u003csection id=\"weight\">\n\u003ch2>3. Jism og‘irligining harakat turiga bog‘liqligi\u003c/h2>\n\u003cp class=\"muted\">Jismning tayanchga yoki osmaga ta’sir kuchi og‘irlik deyiladi. Lift yuqoriga tezlanganda ko‘rinma og‘irlik ortadi; pastga tezlanganda kamayadi. Erkin tushishda tayanchga bosim nolga teng bo‘ladi.\u003c/p>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003clabel for=\"wmass\">Jism massasi: \u003cspan id=\"wmassV\">60\u003c/span> kg\u003c/label>\u003cinput id=\"wmass\" type=\"range\" min=\"10\" max=\"120\" value=\"60\">\u003c/div>\n\u003cdiv>\u003clabel for=\"wacc\">Lift tezlanishi: \u003cspan id=\"waccV\">0\u003c/span> m/s²\u003c/label>\u003cinput id=\"wacc\" type=\"range\" min=\"-9.8\" max=\"9.8\" step=\".2\" value=\"0\">\u003c/div>\n\u003c/div>\n\u003ccanvas id=\"liftCanvas\" aria-label=\"Lift harakati va og‘irlik animatsiyasi\">\u003c/canvas>\n\u003cdiv class=\"stats\">\u003cdiv class=\"stat\">\u003csmall>Tinch holatdagi og‘irlik mg\u003c/small>\u003cstrong id=\"normalP\">588 N\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Ko‘rinma og‘irlik P\u003c/small>\u003cstrong id=\"apparentP\">588 N\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Holat\u003c/small>\u003cstrong id=\"weightState\">Tinch yoki tekis harakat\u003c/strong>\u003c/div>\u003c/div>\n\u003cdiv class=\"callout\">Musbat tezlanish — yuqoriga; manfiy tezlanish — pastga deb qabul qilingan. P = m(g + a) formulasi shu belgilash uchun amal qiladi. Erkin tushishda a = −g, demak P = 0.\u003c/div>\n\u003c/section>\n\n\u003csection id=\"forces\">\n\u003ch2>4. Jismning bir nechta kuch ta’siridagi harakati\u003c/h2>\n\u003cp class=\"muted\">Bir nechta kuchning umumiy ta’siri ularning vektor yig‘indisi bilan topiladi. So‘ng F\u003csub>teng\u003c/sub> = ma formulasi ishlatiladi.\u003c/p>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003clabel for=\"fRight\">O‘ngga kuch: \u003cspan id=\"fRightV\">18\u003c/span> N\u003c/label>\u003cinput id=\"fRight\" type=\"range\" min=\"0\" max=\"40\" value=\"18\">\u003c/div>\n\u003cdiv>\u003clabel for=\"fLeft\">Chapga kuch: \u003cspan id=\"fLeftV\">6\u003c/span> N\u003c/label>\u003cinput id=\"fLeft\" type=\"range\" min=\"0\" max=\"40\" value=\"6\">\u003c/div>\n\u003cdiv>\u003clabel for=\"fMass\">Massa: \u003cspan id=\"fMassV\">3\u003c/span> kg\u003c/label>\u003cinput id=\"fMass\" type=\"range\" min=\"1\" max=\"15\" value=\"3\">\u003c/div>\n\u003c/div>\n\u003ccanvas id=\"netCanvas\" aria-label=\"Teng ta’sir etuvchi kuchlar animatsiyasi\">\u003c/canvas>\n\u003cdiv class=\"stats\">\u003cdiv class=\"stat\">\u003csmall>Teng ta’sir etuvchi kuch\u003c/small>\u003cstrong id=\"netResult\">12 N →\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Tezlanish\u003c/small>\u003cstrong id=\"netAccel\">4 m/s²\u003c/strong>\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection id=\"practice\">\n\u003ch2>Mustaqil masalalar\u003c/h2>\n\u003cp class=\"muted\">Avval o‘zingiz yechib ko‘ring, keyin javobni oching.\u003c/p>\n\u003cdiv class=\"problem\">\u003ch3>1-masala. Markazga intilma kuch\u003c/h3>\u003cp>Massasi 3 kg jism radiusi 6 m aylana bo‘ylab 4 m/s tezlik bilan harakatlanmoqda. Markazga intilma kuchni toping.\u003c/p>\u003cbutton class=\"secondary\" onclick=\"toggleAnswer('a1')\">Yechimni ko‘rish\u003c/button>\u003cdiv class=\"answer\" id=\"a1\">F = mv²/r = 3 × 16 / 6 = \u003cb>8 N\u003c/b>.\u003c/div>\u003c/div>\n\u003cdiv class=\"problem\">\u003ch3>2-masala. Gravitatsiya\u003c/h3>\u003cp>Massasi 5 kg jism Yer sirtiga yaqin turibdi. g = 10 m/s² deb oling. Jismga ta’sir etuvchi og‘irlik kuchini toping.\u003c/p>\u003cbutton class=\"secondary\" onclick=\"toggleAnswer('a2')\">Yechimni ko‘rish\u003c/button>\u003cdiv class=\"answer\" id=\"a2\">F = mg = 5 × 10 = \u003cb>50 N\u003c/b>.\u003c/div>\u003c/div>\n\u003cdiv class=\"problem\">\u003ch3>3-masala. Erkin tushish\u003c/h3>\u003cp>Jism tinch holatdan 3 s davomida erkin tushdi. g = 10 m/s². Tushgan masofasi va oxirgi tezligini toping.\u003c/p>\u003cbutton class=\"secondary\" onclick=\"toggleAnswer('a3')\">Yechimni ko‘rish\u003c/button>\u003cdiv class=\"answer\" id=\"a3\">h = gt²/2 = 10 × 9 / 2 = \u003cb>45 m\u003c/b>. v = gt = 10 × 3 = \u003cb>30 m/s\u003c/b>.\u003c/div>\u003c/div>\n\u003cdiv class=\"problem\">\u003ch3>4-masala. Jism og‘irligi\u003c/h3>\u003cp>Massasi 50 kg bo‘lgan yo‘lovchi lift bilan yuqoriga 2 m/s² tezlanishda harakatlanmoqda. g = 10 m/s². Ko‘rinma og‘irlikni toping.\u003c/p>\u003cbutton class=\"secondary\" onclick=\"toggleAnswer('a4')\">Yechimni ko‘rish\u003c/button>\u003cdiv class=\"answer\" id=\"a4\">P = m(g + a) = 50 × (10 + 2) = \u003cb>600 N\u003c/b>.\u003c/div>\u003c/div>\n\u003cdiv class=\"problem\">\u003ch3>5-masala. Bir nechta kuch\u003c/h3>\u003cp>Massasi 4 kg jismga o‘ngga 28 N va chapga 12 N kuch ta’sir qiladi. Natijaviy kuch va tezlanishni toping.\u003c/p>\u003cbutton class=\"secondary\" onclick=\"toggleAnswer('a5')\">Yechimni ko‘rish\u003c/button>\u003cdiv class=\"answer\" id=\"a5\">F = 28 − 12 = 16 N. a = F/m = 16/4 = \u003cb>4 m/s² o‘ngga\u003c/b>.\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection id=\"quiz\" class=\"quiz\">\n\u003ch2>Bilimni tekshirish testi\u003c/h2>\n\u003cdiv class=\"quiz-q\">\u003cb>1. m = 2 kg, v = 5 m/s, r = 10 m. Markazga intilma kuch qancha?\u003c/b>\u003clabel>\u003cinput type=\"radio\" name=\"q1\" value=\"a\"> 5 N\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q1\" value=\"b\"> 10 N\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q1\" value=\"c\"> 25 N\u003c/label>\u003c/div>\n\u003cdiv class=\"quiz-q\">\u003cb>2. Jism 2 s erkin tushdi, g = 10 m/s². Tushish masofasi qancha?\u003c/b>\u003clabel>\u003cinput type=\"radio\" name=\"q2\" value=\"a\"> 10 m\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q2\" value=\"b\"> 20 m\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q2\" value=\"c\"> 40 m\u003c/label>\u003c/div>\n\u003cdiv class=\"quiz-q\">\u003cb>3. Lift pastga tezlanganda yo‘lovchining ko‘rinma og‘irligi odatda qanday o‘zgaradi?\u003c/b>\u003clabel>\u003cinput type=\"radio\" name=\"q3\" value=\"a\"> Ortadi\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q3\" value=\"b\"> Kamayadi\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q3\" value=\"c\"> Har doim nol bo‘ladi\u003c/label>\u003c/div>\n\u003cdiv class=\"quiz-q\">\u003cb>4. 20 N o‘ngga va 8 N chapga kuchlar ta’sir qilsa, natijaviy kuch?\u003c/b>\u003clabel>\u003cinput type=\"radio\" name=\"q4\" value=\"a\"> 12 N o‘ngga\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q4\" value=\"b\"> 28 N chapga\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q4\" value=\"c\"> 0 N\u003c/label>\u003c/div>\n\u003cbutton type=\"button\" id=\"checkQuiz\">Natijani tekshirish\u003c/button>\u003cbutton type=\"button\" class=\"secondary\" id=\"resetQuiz\">Qayta ishlash\u003c/button>\u003cdiv id=\"quizResult\" class=\"success\" hidden>\u003c/div>\n\u003c/section>\n\n\u003csection id=\"prompt\">\n\u003ch2>ChatGPT uchun mukammal prompt\u003c/h2>\n\u003cp class=\"muted\">Quyidagi matnni nusxalab, ChatGPT’ga berib, shu darsning boshqa variantini ham tayyorlatishingiz mumkin.\u003c/p>\n\u003cdiv class=\"prompt\" id=\"promptText\">Sen 10-sinf fizika o‘qituvchisi, metodist va HTML5 dasturchisisan. “Yuqoridagi mavzular bo‘yicha masalalar yechish” nomli interaktiv o‘quv darsini o‘zbek tilida yarat.\n\nQuyidagi mavzularni qamrab ol:\n1. Markazga intilma kuch: F = mv²/r.\n2. Gravitatsiya maydonidagi harakat: F = GmM/r², Yer yaqinida F = mg, erkin tushish h = gt²/2 va v = gt.\n3. Jism og‘irligining harakat turiga bog‘liqligi: P = m(g + a) belgilangan yo‘nalish konvensiyasi bilan tushuntirilsin; yuqoriga tezlanish, pastga tezlanish va erkin tushish holatlari taqqoslansin.\n4. Jismning bir nechta kuch ta’siridagi harakati: kuchlarning vektor yig‘indisi va Nyutonning II qonuni F_teng = ma.\n\nHar bir bo‘limda nazariya, formulalar, o‘lchov birliklari, kamida bitta bosqichma-bosqich yechilgan masala, kundalik hayotdan misol va interaktiv simulyatsiya bo‘lsin. Simulyatsiyalarda slayderlar qiymatlarni o‘zgartirsin, natijalar avtomatik qayta hisoblansin, strelkalar va jism animatsiyasi ko‘rsatilsin. Alohida mustaqil masalalar, javoblarni ochish tugmalari va avtomatik baholanadigan test qo‘sh.\n\nDizayn zamonaviy, tushunarli, mobil telefon va kompyuterga mos bo‘lsin. HTML, CSS va JavaScript bitta HTML5 fayl ichida bo‘lsin; tashqi kutubxona va internetga bog‘liqlik bo‘lmasin. Barcha tugmalar ishlasin. Formulalar, hisob-kitoblar va birliklarni tekshir; noto‘g‘ri yoki bir-biriga zid natija chiqmasin. Fayl nomi “Yuqoridagi mavzular bo‘yicha masalalar yechish.html” bo‘lsin.\u003c/div>\n\u003cbutton id=\"copyPrompt\">Promptni nusxalash\u003c/button>\u003cspan id=\"copyStatus\" aria-live=\"polite\">\u003c/span>\n\u003c/section>\n\u003cfooter>Interaktiv fizika mashg‘uloti • HTML5, CSS va JavaScript • Offline foydalanish mumkin\u003c/footer>\n\u003c/main>\n\u003cscript>\nconst $=id=>document.getElementById(id);\nfunction num(n,d=2){return Number(n).toLocaleString('uz-UZ',{maximumFractionDigits:d,minimumFractionDigits:0});}\nfunction setup(id){const c=$(id),r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.max(300,r.width*d);c.height=Math.max(200,r.height*d);let x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return {x,w:r.width,h:r.height};}\nfunction arrow(c,x1,y1,x2,y2,color,width=4){c.strokeStyle=color;c.fillStyle=color;c.lineWidth=width;c.lineCap='round';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();let a=Math.atan2(y2-y1,x2-x1),s=10;c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-s*Math.cos(a-.5),y2-s*Math.sin(a-.5));c.lineTo(x2-s*Math.cos(a+.5),y2-s*Math.sin(a+.5));c.closePath();c.fill();}\nfunction calcC(){let m=+$('cmass').value,v=+$('cvel').value,r=+$('crad').value; $('cmassV').textContent=m;$('cvelV').textContent=v;$('cradV').textContent=r;$('cforce').textContent=num(m*v*v/r)+' N';$('cacc').textContent=num(v*v/r)+' m/s²';}\n['cmass','cvel','crad'].forEach(id=>$(id).addEventListener('input',calcC));\nlet orbitAngle=0,orbitOn=true,fallRunning=false,fallT=0,fallRAF=0,lastTime=0;\nfunction drawOrbit(){let {x:c,w,h}=setup('orbitCanvas');c.clearRect(0,0,w,h);let cx=w/2,cy=h/2,r=Math.min(w,h)*.29;c.strokeStyle='#9db6d8';c.lineWidth=2;c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.stroke();c.fillStyle='#e7a83b';c.beginPath();c.arc(cx,cy,15,0,Math.PI*2);c.fill();let px=cx+r*Math.cos(orbitAngle),py=cy+r*Math.sin(orbitAngle);c.fillStyle='#2563eb';c.beginPath();c.arc(px,py,9,0,Math.PI*2);c.fill();arrow(c,px,py,px+(cx-px)*.25,py+(cy-py)*.25,'#db5b22',3);c.fillStyle='#4a5e7a';c.font='12px Arial';c.fillText('Markazga yo‘nalgan kuch',10,18);}\nfunction orbitLoop(){if(orbitOn){orbitAngle+=.018;drawOrbit();}requestAnimationFrame(orbitLoop);}\n$('orbitToggle').onclick=()=>{orbitOn=!orbitOn;$('orbitToggle').textContent=orbitOn?'Ⅱ Animatsiyani pauza qilish':'▶ Animatsiyani davom ettirish';};\nfunction drawFall(){let {x:c,w,h}=setup('fallCanvas');c.clearRect(0,0,w,h);let H=+$('height').value,g=+$('gravG').value,ground=h-25,top=25,range=ground-top,elapsed=Math.min(fallT,Math.sqrt(2*H/g)),d=Math.min(H,g*elapsed*elapsed/2),y=top+range*d/H;c.strokeStyle='#a9bad0';c.lineWidth=3;c.beginPath();c.moveTo(w*.65,top);c.lineTo(w*.65,ground);c.stroke();c.fillStyle='#a7b8ce';c.fillRect(10,ground,w-20,5);c.fillStyle='#e6a33c';c.beginPath();c.arc(w*.65,y,10,0,Math.PI*2);c.fill();arrow(c,w*.65+25,y,w*.65+25,Math.min(ground-12,y+35),'#db5b22',3);c.fillStyle='#415570';c.font='13px Arial';c.fillText('h = '+num(H)+' m',12,24);c.fillText('g = '+num(g)+' m/s²',12,44);$('heightV').textContent=H;$('gravGV').textContent=num(g,1);$('fallTime').textContent=num(Math.sqrt(2*H/g))+' s';$('fallSpeed').textContent=num(Math.sqrt(2*g*H))+' m/s';$('fallDistance').textContent=num(d)+' m';}\nfunction fallTick(now){if(!fallRunning)return;if(!lastTime)lastTime=now;fallT+=Math.min((now-lastTime)/1000,.04);lastTime=now;let H=+$('height').value,g=+$('gravG').value;if(fallT>=Math.sqrt(2*H/g)){fallT=Math.sqrt(2*H/g);fallRunning=false;}drawFall();if(fallRunning)fallRAF=requestAnimationFrame(fallTick);}\n$('fallStart').onclick=()=>{if(!fallRunning){if(fallT>=Math.sqrt(2*(+$('height').value)/(+$('gravG').value)))fallT=0;fallRunning=true;lastTime=0;fallRAF=requestAnimationFrame(fallTick);}};\n$('fallReset').onclick=()=>{fallRunning=false;cancelAnimationFrame(fallRAF);fallT=0;lastTime=0;drawFall();};\n['height','gravG'].forEach(id=>$(id).addEventListener('input',()=>{fallRunning=false;fallT=0;drawFall();}));\nfunction drawLift(){let {x:c,w,h}=setup('liftCanvas'),m=+$('wmass').value,a=+$('wacc').value,g=9.8,P=Math.max(0,m*(g+a));c.clearRect(0,0,w,h);let liftX=w*.34,liftY=28,liftW=w*.32,liftH=h-58;c.strokeStyle='#9aadc6';c.lineWidth=3;c.strokeRect(liftX,liftY,liftW,liftH);c.fillStyle='#dce8f8';c.fillRect(liftX+8,liftY+8,liftW-16,liftH-16);let bx=w*.5,by=h*.55;c.fillStyle='#e7a83b';c.fillRect(bx-20,by-20,40,40);c.fillStyle='#684919';c.font='bold 12px Arial';c.textAlign='center';c.fillText(m+' kg',bx,by+5);if(a>0.01)arrow(c,bx+40,by+5,bx+40,by-35,'#16835e',4);else if(a\u003c-.01)arrow(c,bx+40,by-30,bx+40,by+10,'#db5b22',4);c.textAlign='left';c.fillStyle='#4b5d77';c.fillText('Lift',12,20);$('wmassV').textContent=m;$('waccV').textContent=num(a,1);$('normalP').textContent=num(m*g)+' N';$('apparentP').textContent=num(P)+' N';$('weightState').textContent=Math.abs(a)\u003c.11?'Tinch yoki tekis harakat':a\u003c-.11&&a\u003c=-9.7?'Erkin tushishga yaqin':a>0?'Yuqoriga tezlanmoqda':'Pastga tezlanmoqda';}\n['wmass','wacc'].forEach(id=>$(id).addEventListener('input',drawLift));\nfunction drawNet(){let {x:c,w,h}=setup('netCanvas'),r=+$('fRight').value,l=+$('fLeft').value,m=+$('fMass').value,n=r-l,y=h*.5,cx=w*.5;c.clearRect(0,0,w,h);c.fillStyle='#cbd9eb';c.fillRect(20,y-2,w-40,4);c.fillStyle='#dce8f8';c.fillRect(cx-24,y-17,48,34);c.strokeStyle='#7895bb';c.strokeRect(cx-24,y-17,48,34);c.fillStyle='#1c3d69';c.font='bold 12px Arial';c.textAlign='center';c.fillText(m+' kg',cx,y+4);let s=Math.min((w*.32)/40,5);if(r)arrow(c,cx+27,y-6,cx+27+r*s,y-6,'#16835e',4);if(l)arrow(c,cx-27,y+7,cx-27-l*s,y+7,'#db5b22',4);if(Math.abs(n)>.01)arrow(c,cx,y+62,cx+n*s,y+62,'#245fe5',5);c.textAlign='left';c.fillStyle='#16835e';c.fillText('O‘ngga: '+r+' N',10,20);c.fillStyle='#db5b22';c.fillText('Chapga: '+l+' N',10,40);$('fRightV').textContent=r;$('fLeftV').textContent=l;$('fMassV').textContent=m;$('netResult').textContent=num(Math.abs(n))+' N '+(n>0?'→':n\u003c0?'←':'');$('netAccel').textContent=num(n/m)+' m/s²';}\n['fRight','fLeft','fMass'].forEach(id=>$(id).addEventListener('input',drawNet));\nfunction toggleAnswer(id){$(id).classList.toggle('show');}\n$('checkQuiz').onclick=()=>{let ans={q1:'a',q2:'b',q3:'b',q4:'a'},score=0;for(let q in ans){let e=document.querySelector('input[name=\"'+q+'\"]:checked');if(e&&e.value===ans[q])score++;}let r=$('quizResult');r.hidden=false;r.textContent='Natija: '+score+'/4. '+(score===4?'A’lo! Barcha savollarga to‘g‘ri javob berdingiz.':score>=2?'Yaxshi urinish. Formulalarni qayta ko‘rib, yana urinib ko‘ring.':'Formulalar bo‘limini takrorlab, testni qayta ishlang.');};\n$('resetQuiz').onclick=()=>{document.querySelectorAll('#quiz input[type=radio]').forEach(e=>e.checked=false);$('quizResult').hidden=true;};\n$('copyPrompt').onclick=async()=>{let t=$('promptText').innerText;try{await navigator.clipboard.writeText(t);$('copyStatus').textContent=' Nusxalandi!';}catch(e){let range=document.createRange();range.selectNodeContents($('promptText'));let sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);$('copyStatus').textContent=' Matn belgilanadi — nusxalash uchun Copy buyrug‘idan foydalaning.';}};\nfunction resizeAll(){drawOrbit();drawFall();drawLift();drawNet();calcC();}\nwindow.addEventListener('resize',resizeAll);calcC();drawOrbit();orbitLoop();drawFall();drawLift();drawNet();\n\u003c/script>\n\u003c/body>\n\u003c/html>", "8-mavzu": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Jismning qiya tekislikdagi harakati\u003c/title>\n\u003cstyle>\n:root{--bg:#eef3f7;--card:#fff;--ink:#16232e;--mute:#556472;--line:#c7d3dd;--slope:#c9d8e6;--acc:#1f5f8b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#10181f;--card:#17232d;--ink:#e6edf3;--mute:#93a4b3;--line:#2b3b48;--slope:#26394a;--acc:#6db3e3}}\n:root[data-theme=\"dark\"]{--bg:#10181f;--card:#17232d;--ink:#e6edf3;--mute:#93a4b3;--line:#2b3b48;--slope:#26394a;--acc:#6db3e3}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nmain{max-width:760px;margin:0 auto;padding:16px}\nh1{font-size:1.5rem;line-height:1.2;margin:8px 0 4px}\nh2{font-size:1.2rem;margin:0 0 8px}\np{margin:6px 0}.sub{color:var(--mute);margin:0 0 12px}\nnav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}\nnav button{flex:1 0 auto;padding:10px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;font-size:.9rem;cursor:pointer}\nnav button[aria-selected=\"true\"]{background:var(--acc);color:#fff;border-color:var(--acc)}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}\nsection{display:none}section.on{display:block}\n.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}\n.f{font-family:Georgia,serif;font-size:1.05rem;background:var(--bg);padding:6px 10px;border-radius:6px;margin:6px 0;overflow-x:auto;white-space:nowrap}\ncanvas{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line);border-radius:8px}\n.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:10px 0}\n.ctl label{display:block;font-size:.9rem}\n.ctl input[type=range]{width:100%}\n.ctl select{width:100%;padding:6px;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px}\n.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}\n.row button{padding:10px 16px;border-radius:8px;border:0;font:inherit;font-weight:600;color:#fff;cursor:pointer}\n.go{background:#2f8f4e}.stop{background:#c77b12}.rs{background:#7a5cc4}\n.vals{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;font-size:.92rem}\n.vals span{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px}\n.k1{color:#d33}.k2{color:#2a9d4a}.k3{color:#2b6fd6}.k4{color:#d9821a}.k5{color:#8a4bd0}\n.graphs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}\ntable{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid var(--line);padding:6px 8px;text-align:left}\n.msg{font-weight:600;color:#c77b12;min-height:1.5em}\n@media(max-width:520px){.ctl,.graphs{grid-template-columns:1fr}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003ch1>Jismning qiya tekislikdagi harakati\u003c/h1>\n\u003cp class=\"sub\">10-sinf fizika · g = 9,8 m/s²\u003c/p>\n\u003cnav role=\"tablist\">\n\u003cbutton role=\"tab\" aria-selected=\"true\" data-t=\"s1\">1. Og'irlik kuchi tashkil etuvchilari\u003c/button>\n\u003cbutton role=\"tab\" aria-selected=\"false\" data-t=\"s2\">2. Ishqalanish kuchi\u003c/button>\n\u003cbutton role=\"tab\" aria-selected=\"false\" data-t=\"s3\">3. Pastga harakat\u003c/button>\n\u003c/nav>\n\n\u003csection id=\"s1\" class=\"on\">\n\u003cdiv class=\"box\">\n\u003ch2>Og'irlik kuchini ikkiga ajratamiz\u003c/h2>\n\u003cp>Qiya tekislikda mg kuchi vertikal pastga yo'nalgan. Uni tekislikka parallel va perpendikulyar ikki tashkil etuvchiga ajratamiz. Mg va tekislikka perpendikulyar orasidagi burchak tekislik burchagi α ga teng (tomonlari o'zaro perpendikulyar burchaklar).\u003c/p>\n\u003cdiv class=\"f\">F∥ = mg·sinα &nbsp; (jismni pastga tortadi)\u003c/div>\n\u003cdiv class=\"f\">F⊥ = mg·cosα &nbsp; (tekislikka bosadi), N = mg·cosα\u003c/div>\n\u003cp>\u003cb>Misol.\u003c/b> m = 5 kg, α = 30°. mg = 49 N, F∥ = 49·0,5 = 24,5 N, F⊥ = 49·0,866 ≈ 42,4 N.\u003c/p>\n\u003c/div>\n\u003ccanvas id=\"c1\" width=\"640\" height=\"340\">\u003c/canvas>\n\u003cdiv class=\"ctl\">\n\u003clabel>Burchak α: \u003cb id=\"o1a\">30\u003c/b>°\u003cinput type=\"range\" id=\"a1\" min=\"0\" max=\"90\" value=\"30\">\u003c/label>\n\u003clabel>Massa m: \u003cb id=\"o1m\">5\u003c/b> kg\u003cinput type=\"range\" id=\"m1\" min=\"1\" max=\"20\" value=\"5\">\u003c/label>\n\u003c/div>\n\u003cdiv class=\"vals\" id=\"v1\">\u003c/div>\n\u003c/section>\n\n\u003csection id=\"s2\">\n\u003cdiv class=\"box\">\n\u003ch2>Qiya tekislikda ishqalanish kuchi\u003c/h2>\n\u003cp>Ishqalanish kuchi jism harakatiga (yoki harakat tomon intilishiga) qarama-qarshi, tekislik bo'ylab yuqoriga yo'naladi. U bosim kuchi N ga bog'liq.\u003c/p>\n\u003cdiv class=\"f\">N = mg·cosα\u003c/div>\n\u003cdiv class=\"f\">F_ish = μ·N = μ·mg·cosα\u003c/div>\n\u003cp>α oshsa, cosα kamayadi, demak ishqalanish kuchi ham kamayadi. Jism qachon tinch turadi?\u003c/p>\n\u003cdiv class=\"f\">mg·sinα ≤ μ·mg·cosα &nbsp;⇒&nbsp; tgα ≤ μ\u003c/div>\n\u003cp>Bu holda ishqalanish kuchi mg·sinα ga teng bo'lib, jism sirpanmaydi. tgα &gt; μ bo'lsa jism pastga sirpanadi va F_ish = μ·mg·cosα.\u003c/p>\n\u003cp>\u003cb>Misol.\u003c/b> m = 2 kg, α = 30°, μ = 0,3. N = 2·9,8·0,866 ≈ 17 N; F_ish = 0,3·17 ≈ 5,1 N. mg·sinα = 9,8 N &gt; 5,1 N, demak jism sirpanadi. (tg30° ≈ 0,58 &gt; 0,3 — mos.)\u003c/p>\n\u003cp>\u003cb>Mustaqil masala.\u003c/b> μ = 0,5 bo'lsa, qanday α da jism sirpana boshlaydi? (Javob: α ≈ 26,6°)\u003c/p>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"s3\">\n\u003cdiv class=\"box\">\n\u003ch2>Jismning tekislik bo'ylab pastga harakati\u003c/h2>\n\u003cp>Harakat yo'nalishidagi teng ta'sir etuvchi kuch: F = mg·sinα − μ·mg·cosα. Nyutonning II qonuniga ko'ra:\u003c/p>\n\u003cdiv class=\"f\">a = g(sinα − μ·cosα)\u003c/div>\n\u003cdiv class=\"f\">v = a·t &nbsp;&nbsp; s = a·t²/2\u003c/div>\n\u003cp>\u003cb>Misol.\u003c/b> α = 30°, μ = 0,2, L = 4 m. a = 9,8(0,5 − 0,2·0,866) ≈ 3,2 m/s²; t = √(2L/a) ≈ 1,58 s; v = a·t ≈ 5,06 m/s.\u003c/p>\n\u003c/div>\n\u003ccanvas id=\"c2\" width=\"640\" height=\"340\">\u003c/canvas>\n\u003cdiv class=\"ctl\">\n\u003clabel>Burchak α: \u003cb id=\"o2a\">30\u003c/b>°\u003cinput type=\"range\" id=\"a2\" min=\"1\" max=\"90\" value=\"30\">\u003c/label>\n\u003clabel>Massa m: \u003cb id=\"o2m\">5\u003c/b> kg\u003cinput type=\"range\" id=\"m2\" min=\"1\" max=\"20\" value=\"5\">\u003c/label>\n\u003clabel>Ishqalanish μ: \u003cb id=\"o2u\">0.20\u003c/b>\u003cinput type=\"range\" id=\"u2\" min=\"0\" max=\"1\" step=\"0.01\" value=\"0.2\">\u003c/label>\n\u003clabel>Uzunlik L: \u003cb id=\"o2l\">4\u003c/b> m\u003cinput type=\"range\" id=\"l2\" min=\"1\" max=\"10\" step=\"0.5\" value=\"4\">\u003c/label>\n\u003clabel>Tezlik ko'rsatish\u003cselect id=\"sp\">\u003coption value=\"0.25\">×0,25 (sekin)\u003c/option>\u003coption value=\"0.5\" selected>×0,5\u003c/option>\u003coption value=\"1\">×1 (real)\u003c/option>\u003c/select>\u003c/label>\n\u003c/div>\n\u003cdiv class=\"row\">\u003cbutton class=\"go\" id=\"go\">Start\u003c/button>\u003cbutton class=\"stop\" id=\"st\">To'xtat\u003c/button>\u003cbutton class=\"rs\" id=\"rs\">Qayta boshlash\u003c/button>\u003c/div>\n\u003cdiv class=\"msg\" id=\"msg\">\u003c/div>\n\u003cdiv class=\"vals\" id=\"v2\">\u003c/div>\n\u003cdiv class=\"graphs\">\u003ccanvas id=\"gv\" width=\"320\" height=\"220\">\u003c/canvas>\u003ccanvas id=\"gs\" width=\"320\" height=\"220\">\u003c/canvas>\u003c/div>\n\u003cdiv id=\"res\">\u003c/div>\n\u003c/section>\n\u003c/main>\n\n\u003cscript>\nconst g=9.8,$=id=>document.getElementById(id);\nconst css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nconst D=Math.PI/180;\n\n// Tablar\ndocument.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{\n  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));\n  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t));\n});\n\n// Strelka (vektor) chizish\nfunction arrow(c,x,y,dx,dy,col,txt,ox,oy){\n  const l=Math.hypot(dx,dy); if(l\u003c3)return;\n  c.strokeStyle=c.fillStyle=col;c.lineWidth=3;\n  c.beginPath();c.moveTo(x,y);c.lineTo(x+dx,y+dy);c.stroke();\n  const a=Math.atan2(dy,dx),X=x+dx,Y=y+dy;\n  c.beginPath();c.moveTo(X,Y);c.lineTo(X-11*Math.cos(a-.4),Y-11*Math.sin(a-.4));c.lineTo(X-11*Math.cos(a+.4),Y-11*Math.sin(a+.4));c.closePath();c.fill();\n  c.font='600 14px system-ui';c.fillText(txt,X+(ox||0),Y+(oy||0));\n}\n// Tekislik va blok: dist = blokning pastki chekkadan masofasi (px)\nfunction scene(c,W,H,al,dist,Lpx){\n  const bx=W-40,by=H-30,tx=bx-Lpx*Math.cos(al),ty=by-Lpx*Math.sin(al);\n  c.clearRect(0,0,W,H);\n  c.fillStyle=css('--slope');c.beginPath();c.moveTo(bx,by);c.lineTo(tx,ty);c.lineTo(tx,by);c.closePath();c.fill();\n  c.strokeStyle=css('--ink');c.lineWidth=2;c.beginPath();c.moveTo(10,by);c.lineTo(W-10,by);c.moveTo(tx,ty);c.lineTo(bx,by);c.stroke();\n  const px=bx-dist*Math.cos(al),py=by-dist*Math.sin(al);\n  c.save();c.translate(px,py);c.rotate(al);\n  c.fillStyle='#e0a030';c.strokeStyle=css('--ink');c.fillRect(-25,-50,50,50);c.strokeRect(-25,-50,50,50);c.restore();\n  return {cx:px+25*Math.sin(al),cy:py-25*Math.cos(al),bx,by};\n}\nfunction arc(c,x,y,r,a0,a1,txt,tx,ty){\n  c.strokeStyle=css('--ink');c.lineWidth=1.5;c.beginPath();c.arc(x,y,r,a0,a1);c.stroke();\n  c.fillStyle=css('--ink');c.font='italic 15px Georgia,serif';c.fillText(txt,tx,ty);\n}\n\n// ---------- 1-simulyatsiya ----------\nfunction draw1(){\n  const al=$('a1').value*D,m=+$('m1').value,W=640,H=340,c=$('c1').getContext('2d');\n  $('o1a').textContent=$('a1').value;$('o1m').textContent=m;\n  const s=Math.sin(al),co=Math.cos(al),mg=m*g,k=110/mg;\n  const S=scene(c,W,H,al,230,380),x=S.cx,y=S.cy;\n  arrow(c,x,y,0,110,'#d33','mg',6,14);\n  arrow(c,x,y,co*110*s,s*110*s,'#2a9d4a','F∥',6,14);\n  arrow(c,x,y,-s*110*co,co*110*co,'#2b6fd6','F⊥',-30,14);\n  arrow(c,x,y,s*110*co,-co*110*co,'#d9821a','N',6,-6);\n  // burchak tengligi\n  arc(c,S.bx,S.by,45,Math.PI,Math.PI+al,'α',S.bx-70,S.by-10);\n  arc(c,x,y,32,Math.PI/2,Math.PI/2+al,'α',x-30,y+55);\n  c.setLineDash([4,4]);c.strokeStyle='#888';c.lineWidth=1;\n  c.beginPath();c.moveTo(x+co*110*s,y+s*110*s);c.lineTo(x,y+110);c.lineTo(x-s*110*co,y+co*110*co);c.stroke();c.setLineDash([]);\n  $('v1').innerHTML=`\u003cspan class=\"k1\">mg = ${mg.toFixed(1)} N\u003c/span>\u003cspan class=\"k2\">F∥ = mg·sinα = ${(mg*s).toFixed(1)} N\u003c/span>\u003cspan class=\"k3\">F⊥ = mg·cosα = ${(mg*co).toFixed(1)} N\u003c/span>\u003cspan class=\"k4\">N = ${(mg*co).toFixed(1)} N\u003c/span>`;\n}\n['a1','m1'].forEach(i=>$(i).oninput=draw1);\n\n// ---------- 2-simulyatsiya ----------\nlet st={t:0,s:0,run:false,pts:[],last:0,done:false},raf=0;\nfunction par(){\n  const al=$('a2').value*D,m=+$('m2').value,u=+$('u2').value,L=+$('l2').value;\n  const moves=Math.tan(al)>u+1e-9||$('a2').value==90;\n  const a=moves?g*(Math.sin(al)-u*Math.cos(al)):0;\n  return {al,m,u,L,a,moves};\n}\nfunction draw2(){\n  const p=par(),c=$('c2').getContext('2d'),W=640,H=340;\n  $('o2a').textContent=$('a2').value;$('o2m').textContent=p.m;$('o2u').textContent=p.u.toFixed(2);$('o2l').textContent=p.L;\n  const s=Math.sin(p.al),co=Math.cos(p.al),Lpx=Math.min(420,250/Math.max(s,.01));\n  const dist=Math.max(0,Lpx*(1-st.s/p.L)),S=scene(c,W,H,p.al,dist,Lpx),x=S.cx,y=S.cy;\n  const mg=p.m*g,k=85/mg,N=mg*co;\n  const fr=p.moves?p.u*N:Math.min(p.u*N,mg*s),net=p.m*p.a;\n  arrow(c,x,y,0,mg*k,'#d33','mg',6,14);\n  arrow(c,x,y,s*N*k,-co*N*k,'#d9821a','N',6,-6);\n  arrow(c,x,y,-co*fr*k,-s*fr*k,'#2b6fd6','F_ish',-52,-6);\n  arrow(c,x,y,co*net*k,s*net*k,'#8a4bd0','F',8,14);\n  const v=p.a*st.t;\n  $('v2').innerHTML=`\u003cspan>t = ${st.t.toFixed(2)} s\u003c/span>\u003cspan>a = ${p.a.toFixed(2)} m/s²\u003c/span>\u003cspan>v = ${v.toFixed(2)} m/s\u003c/span>\u003cspan>s = ${st.s.toFixed(2)} m\u003c/span>\u003cspan class=\"k3\">F_ish = ${fr.toFixed(1)} N\u003c/span>\u003cspan class=\"k5\">F (teng ta'sir) = ${net.toFixed(1)} N\u003c/span>`;\n  $('msg').textContent=p.moves?'':`Jism tinch holatda: tgα = ${Math.tan(p.al).toFixed(2)} ≤ μ = ${p.u.toFixed(2)}`;\n  graphs(p);\n}\nfunction graphs(p){\n  const T=p.moves?Math.sqrt(2*p.L/p.a):1,Vm=p.moves?p.a*T:1;\n  gr($('gv'),'v–t grafik (v, m/s)',T,Vm,st.pts.map(q=>[q[0],q[1]]),'#2b6fd6');\n  gr($('gs'),'s–t grafik (s, m)',T,p.L,st.pts.map(q=>[q[0],q[2]]),'#2a9d4a');\n}\nfunction gr(cv,title,T,Y,pts,col){\n  const c=cv.getContext('2d'),W=cv.width,H=cv.height,l=38,b=28;\n  c.clearRect(0,0,W,H);c.fillStyle=css('--ink');c.font='13px system-ui';c.fillText(title,l,14);\n  c.strokeStyle=css('--mute');c.lineWidth=1;c.beginPath();c.mov
