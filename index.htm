- Simulation Canvas & Live Gauge Grid -->\n            \u003cdiv class=\"grid grid-cols-1 lg:grid-cols-3 gap-6\">\n                \n                \u003c!-- Main Canvas Viewport -->\n                \u003cdiv class=\"lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden flex flex-col\">\n                    \u003cdiv class=\"p-3 bg-slate-950/80 border-b border-slate-800 flex items-center justify-between text-xs text-slate-400\">\n                        \u003cspan class=\"flex items-center space-x-2\">\n                            \u003ci class=\"fa-solid fa-display text-sky-400\">\u003c/i>\n                            \u003cspan class=\"font-semibold text-slate-200\">Interaktiv Fizika Simulyatsiyasi Canvas\u003c/span>\n                        \u003c/span>\n                        \u003cspan class=\"font-mono text-[10px] bg-slate-900 px-2 py-0.5 rounded border border-slate-800 text-slate-400\">Vektorlar: F (Kuch), P (Og'irlik), N (Reaksiya)\u003c/span>\n                    \u003c/div>\n\n                    \u003cdiv class=\"canvas-container flex-1\">\n                        \u003ccanvas id=\"simCanvas\" class=\"w-full h-full block cursor-crosshair\">\u003c/canvas>\n                    \u003c/div>\n\n                    \u003cdiv class=\"p-3 bg-slate-950/90 border-t border-slate-800 grid grid-cols-2 sm:grid-cols-4 gap-3 text-center text-xs\">\n                        \u003cdiv>\n                            \u003cp class=\"text-slate-500 text-[10px]\">Ta'sir Etayotgan Kuch (F):\u003c/p>\n                            \u003cp id=\"live-force\" class=\"font-mono font-bold text-sky-400 text-sm\">0.0 N\u003c/p>\n                        \u003c/div>\n                        \u003cdiv>\n                            \u003cp class=\"text-slate-500 text-[10px]\">Yuk Ko'tarilish Masofasi (h):\u003c/p>\n                            \u003cp id=\"live-h\" class=\"font-mono font-bold text-amber-400 text-sm\">0.00 m\u003c/p>\n                        \u003c/div>\n                        \u003cdiv>\n                            \u003cp class=\"text-slate-500 text-[10px]\">Ip/Kuch Bosgan Yo'li (s):\u003c/p>\n                            \u003cp id=\"live-s\" class=\"font-mono font-bold text-purple-400 text-sm\">0.00 m\u003c/p>\n                        \u003c/div>\n                        \u003cdiv>\n                            \u003cp class=\"text-slate-500 text-[10px]\">Joriy FIK (η):\u003c/p>\n                            \u003cp id=\"live-fik\" class=\"font-mono font-bold text-emerald-400 text-sm\">0.0 %\u003c/p>\n                        \u003c/div>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Real-time Metrics & Live Chart -->\n                \u003cdiv class=\"space-y-6 flex flex-col justify-between\">\n                    \n                    \u003c!-- Real-time Physics Metrics Cards -->\n                    \u003cdiv class=\"bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4\">\n                        \u003ch3 class=\"text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center space-x-2 border-b border-slate-800 pb-2\">\n                            \u003ci class=\"fa-solid fa-chart-simple text-amber-400\">\u003c/i>\n                            \u003cspan>Tajriba O'lchov Natijalari\u003c/span>\n                        \u003c/h3>\n\n                        \u003cdiv class=\"space-y-3 font-mono text-xs\">\n                            \u003cdiv class=\"flex justify-between items-center p-2.5 bg-slate-950 rounded-lg border border-slate-800\">\n                                \u003cspan class=\"text-slate-400 font-sans\">Foydali Ish ($A_f = P \\cdot h$):\u003c/span>\n                                \u003cspan id=\"metric-af\" class=\"font-bold text-amber-400 text-sm\">0.0 J\u003c/span>\n                            \u003c/div>\n\n                            \u003cdiv class=\"flex justify-between items-center p-2.5 bg-slate-950 rounded-lg border border-slate-800\">\n                                \u003cspan class=\"text-slate-400 font-sans\">To'liq Sarflangan Ish ($A_t$):\u003c/span>\n                                \u003cspan id=\"metric-at\" class=\"font-bold text-sky-400 text-sm\">0.0 J\u003c/span>\n                            \u003c/div>\n\n                            \u003cdiv class=\"flex justify-between items-center p-2.5 bg-slate-950 rounded-lg border border-slate-800\">\n                                \u003cspan class=\"text-slate-400 font-sans\">Yo'qotilgan Ish (Ishqalanish):\u003c/span>\n                                \u003cspan id=\"metric-loss\" class=\"font-bold text-rose-400 text-sm\">0.0 J\u003c/span>\n                            \u003c/div>\n\n                            \u003cdiv class=\"p-3 bg-gradient-to-r from-emerald-950/40 to-slate-950 border border-emerald-500/30 rounded-lg flex justify-between items-center\">\n                                \u003cdiv>\n                                    \u003cp class=\"text-[10px] text-slate-400 font-sans uppercase\">Xisoblangan Hisobiy FIK:\u003c/p>\n                                    \u003cp id=\"metric-fik\" class=\"text-xl font-extrabold text-emerald-400\">0.0%\u003c/p>\n                                \u003c/div>\n                                \u003cdiv class=\"text-2xl text-emerald-400\">\u003ci class=\"fa-solid fa-award\">\u003c/i>\u003c/div>\n                            \u003c/div>\n                        \u003c/div>\n                    \u003c/div>\n\n                    \u003c!-- Dynamic Live Chart -->\n                    \u003cdiv class=\"bg-slate-900 border border-slate-800 rounded-2xl p-4 flex-1 flex flex-col justify-between\">\n                        \u003ch4 class=\"text-xs font-bold text-slate-300 mb-2 flex items-center justify-between\">\n                            \u003cspan>FIK vs Yo'qotishlar Grafigi\u003c/span>\n                            \u003cspan class=\"text-[10px] text-slate-500 font-normal\">Dinamik tahlil\u003c/span>\n                        \u003c/h4>\n                        \u003cdiv class=\"relative w-full h-44\">\n                            \u003ccanvas id=\"analyticsChart\">\u003c/canvas>\n                        \u003c/div>\n                    \u003c/div>\n\n                \u003c/div>\n            \u003c/div>\n\n        \u003c/section>\n\n    \u003c/main>\n\n    \u003c!-- Footer -->\n    \u003cfooter class=\"border-t border-slate-800 bg-slate-900 py-4 mt-8\">\n        \u003cdiv class=\"max-w-7xl mx-auto px-4 text-center text-xs text-slate-500\">\n            Fizika va Muhandislik bo'yicha Interaktiv STEM Loyihasi &copy; 2026. Barcha huquqlar himoyalangan.\n        \u003c/div>\n    \u003c/footer>\n\n    \u003c!-- ================= PROJECT REPORT / PRESENTATION MODAL ================= -->\n    \u003cdiv id=\"report-modal\" class=\"fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto\">\n        \u003cdiv class=\"bg-slate-900 border border-slate-800 rounded-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto shadow-2xl relative\">\n            \n            \u003c!-- Close Modal Button -->\n            \u003cbutton onclick=\"closeReportModal()\" class=\"absolute top-4 right-4 text-slate-400 hover:text-white w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center no-print\">\n                \u003ci class=\"fa-solid fa-xmark\">\u003c/i>\n            \u003c/button>\n\n            \u003c!-- Printable Certificate / Report Area -->\n            \u003cdiv id=\"printable-report\" class=\"p-6 sm:p-8 space-y-6 text-slate-200\">\n                \n                \u003c!-- Report Header -->\n                \u003cdiv class=\"border-b border-slate-800 pb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4\">\n                    \u003cdiv>\n                        \u003cdiv class=\"flex items-center space-x-2 text-amber-400 font-bold text-xs uppercase tracking-widest mb-1\">\n                            \u003ci class=\"fa-solid fa-certificate\">\u003c/i>\n                            \u003cspan>STEM Loyiha Taqdimot Sertifikati\u003c/span>\n                        \u003c/div>\n                        \u003ch2 class=\"text-2xl font-black text-white\">Oddiy Mexanizmni Sinash Hisoboti\u003c/h2>\n                        \u003cp class=\"text-xs text-slate-400\">Tadqiqotchi O'quvchi / Talaba Hujjati\u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"text-right font-mono text-xs text-slate-400 bg-slate-950 p-3 rounded-xl border border-slate-800\">\n                        \u003cp>Sana: \u003cspan id=\"report-date\" class=\"text-white\">2026-10-20\u003c/span>\u003c/p>\n                        \u003cp>ID: \u003cspan class=\"text-amber-400\">STEM-MECH-2026\u003c/span>\u003c/p>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Student & Project Info Inputs -->\n                \u003cdiv class=\"grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-950 p-4 rounded-xl border border-slate-800 no-print\">\n                    \u003cdiv>\n                        \u003clabel class=\"block text-xs text-slate-400 mb-1\">O'quvchi / Talaba Ismi Familiyasi:\u003c/label>\n                        \u003cinput type=\"text\" id=\"student-name\" value=\"Aliyev Vali\" oninput=\"updateReportFields()\" class=\"w-full bg-slate-900 border border-slate-700 text-white text-xs rounded-lg p-2 focus:ring-1 focus:ring-amber-500 outline-none\">\n                    \u003c/div>\n                    \u003cdiv>\n                        \u003clabel class=\"block text-xs text-slate-400 mb-1\">Sinf / Guruh:\u003c/label>\n                        \u003cinput type=\"text\" id=\"student-class\" value=\"9-A sinf\" oninput=\"updateReportFields()\" class=\"w-full bg-slate-900 border border-slate-700 text-white text-xs rounded-lg p-2 focus:ring-1 focus:ring-amber-500 outline-none\">\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Print Display Names (visible during print) -->\n                \u003cdiv class=\"hidden print:block text-xs space-y-1\">\n                    \u003cp>\u003cstrong>Bajaruvchi:\u003c/strong> \u003cspan id=\"print-student-name\">Aliyev Vali\u003c/span>\u003c/p>\n                    \u003cp>\u003cstrong>Sinf/Guruh:\u003c/strong> \u003cspan id=\"print-student-class\">9-A sinf\u003c/span>\u003c/p>\n                \u003c/div>\n\n                \u003c!-- Assembly Summary -->\n                \u003cdiv class=\"space-y-3\">\n                    \u003ch3 class=\"text-sm font-bold text-amber-400 uppercase tracking-wider\">1. Yasalgan Mexanizm Specifikatsiyasi\u003c/h3>\n                    \u003cdiv class=\"grid grid-cols-2 sm:grid-cols-4 gap-3 font-mono text-xs\">\n                        \u003cdiv class=\"bg-slate-950 p-3 rounded-xl border border-slate-800\">\n                            \u003cspan class=\"text-[10px] text-slate-500 block\">Mexanizm Turi:\u003c/span>\n                            \u003cspan id=\"rep-type\" class=\"font-bold text-white\">Richag Krani\u003c/span>\n                        \u003c/div>\n                        \u003cdiv class=\"bg-slate-950 p-3 rounded-xl border border-slate-800\">\n                            \u003cspan class=\"text-[10px] text-slate-500 block\">Yuk Og'irligi (P):\u003c/span>\n                            \u003cspan id=\"rep-p\" class=\"font-bold text-amber-400\">100 N\u003c/span>\n                        \u003c/div>\n                        \u003cdiv class=\"bg-slate-950 p-3 rounded-xl border border-slate-800\">\n                            \u003cspan class=\"text-[10px] text-slate-500 block\">Konstruksiya Nisbati:\u003c/span>\n                            \u003cspan id=\"rep-ratio\" class=\"font-bold text-sky-400\">2.0\u003c/span>\n                        \u003c/div>\n                        \u003cdiv class=\"bg-slate-950 p-3 rounded-xl border border-slate-800\">\n                            \u003cspan class=\"text-[10px] text-slate-500 block\">Ishqalanish μ:\u003c/span>\n                            \u003cspan id=\"rep-mu\" class=\"font-bold text-emerald-400\">0.10\u003c/span>\n                        \u003c/div>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Test Measurements Table -->\n                \u003cdiv class=\"space-y-3\">\n                    \u003ch3 class=\"text-sm font-bold text-amber-400 uppercase tracking-wider\">2. Sinov va O'lchov Natijalari\u003c/h3>\n                    \u003cdiv class=\"overflow-x-auto\">\n                        \u003ctable class=\"w-full text-left text-xs font-mono border-collapse\">\n                            \u003cthead>\n                                \u003ctr class=\"bg-slate-950 text-slate-400 border-b border-slate-800\">\n                                    \u003cth class=\"p-2\">Parametr\u003c/th>\n                                    \u003cth class=\"p-2\">Nazariy Ko'rsatkich\u003c/th>\n                                    \u003cth class=\"p-2\">Amaliy O'lchangan\u003c/th>\n                                    \u003cth class=\"p-2\">Farq / Yo'qotish\u003c/th>\n                                \u003c/tr>\n                            \u003c/thead>\n                            \u003ctbody class=\"divide-y divide-slate-800/60\">\n                                \u003ctr>\n                                    \u003ctd class=\"p-2 text-slate-300 font-sans\">Kiritilgan Kuch (F)\u003c/td>\n                                    \u003ctd id=\"rep-f-ideal\" class=\"p-2 text-slate-400\">50.0 N\u003c/td>\n                                    \u003ctd id=\"rep-f-real\" class=\"p-2 text-sky-400 font-bold\">55.0 N\u003c/td>\n                                    \u003ctd id=\"rep-f-diff\" class=\"p-2 text-rose-400\">+5.0 N\u003c/td>\n                                \u003c/tr>\n                                \u003ctr>\n                                    \u003ctd class=\"p-2 text-slate-300 font-sans\">Bajarilgan Ish (Joul)\u003c/td>\n                                    \u003ctd id=\"rep-af\" class=\"p-2 text-slate-400\">50.0 J (Foydali)\u003c/td>\n                                    \u003ctd id=\"rep-at\" class=\"p-2 text-amber-400 font-bold\">55.0 J (To'liq)\u003c/td>\n                                    \u003ctd id=\"rep-loss-work\" class=\"p-2 text-rose-400\">5.0 J yo'qotish\u003c/td>\n                                \u003c/tr>\n                                \u003ctr>\n                                    \u003ctd class=\"p-2 text-slate-300 font-sans\">Samaradorlik (FIK)\u003c/td>\n                                    \u003ctd class=\"p-2 text-slate-400\">100% (Ideal)\u003c/td>\n                                    \u003ctd id=\"rep-fik\" class=\"p-2 text-emerald-400 font-bold text-sm\">90.9 %\u003c/td>\n                                    \u003ctd class=\"p-2 text-slate-400\">-9.1% (Ishqalanish)\u003c/td>\n                                \u003c/tr>\n                            \u003c/tbody>\n                        \u003c/table>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Conclusions -->\n                \u003cdiv class=\"space-y-2 bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs\">\n                    \u003ch3 class=\"font-bold text-white flex items-center space-x-2\">\n                        \u003ci class=\"fa-solid fa-lightbulb text-amber-400\">\u003c/i>\n                        \u003cspan>Ilmiy Xulosa va Tahlil:\u003c/span>\n                    \u003c/h3>\n                    \u003cp id=\"rep-conclusion\" class=\"text-slate-300 leading-relaxed\">\n                        Ushbu oddiy mexanizm modelini yasash va sinash natijasida ko'rindiki, mexanizm kuchdan yutish bergani bilan, ishqalanish kuchlari tufayli to'liq ish foydali ishdan ortiq bo'ladi. FIK koeffitsiyenti o'rtacha 90.9% ni tashkil etdi.\n                    \u003c/p>\n                \u003c/div>\n\n                \u003c!-- Footer Signatures -->\n                \u003cdiv class=\"pt-6 border-t border-slate-800 flex justify-between items-end text-xs text-slate-500\">\n                    \u003cdiv>\n                        \u003cp>O'qituvchi Imzosi: ____________________\u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"text-right\">\n                        \u003cp class=\"font-semibold text-slate-400\">STEM Fizika Laboratoriyasi\u003c/p>\n                    \u003c/div>\n                \u003c/div>\n\n            \u003c/div>\n\n            \u003c!-- Modal Action Buttons -->\n            \u003cdiv class=\"p-4 bg-slate-950 border-t border-slate-800 rounded-b-2xl flex justify-end space-x-3 no-print\">\n                \u003cbutton onclick=\"closeReportModal()\" class=\"px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold\">Yopish\u003c/button>\n                \u003cbutton onclick=\"window.print()\" class=\"px-5 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs flex items-center space-x-2 shadow-lg shadow-amber-500/20\">\n                    \u003ci class=\"fa-solid fa-print\">\u003c/i>\n                    \u003cspan>Chop Etish / PDF Saqlash\u003c/span>\n                \u003c/button>\n            \u003c/div>\n\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- ================= JAVASCRIPT LOGIC ================= -->\n    \u003cscript>\n        // --- State Management ---\n        const state = {\n            mechanism: 'lever', // lever, pulley, winch, inclined\n            weight: 100,        // N\n            param1: 2.0,        // lever ratio, pulley count, winch radius ratio, or angle\n            friction: 0.10,     // friction coeff\n            \n            // Simulation physics variables\n            isSimulating: false,\n            progress: 0,        // 0 to 1\n            animFrame: null,\n            \n            // Calculated dynamic metrics\n            appliedForce: 0,\n            displacementH: 0,\n            displacementS: 0,\n            usefulWork: 0,\n            totalWork: 0,\n            fik: 0\n        };\n\n        // Presets Configuration\n        const presets = {\n            lever: {\n                title: \"1. Richag Yordamidagi Kran Model\",\n                blueprintTitle: \"Richag Krani Modellari\",\n                blueprintDesc: \"Tayanch nuqtasini surish orqali yuk yelkasi hamda kuch yelkasini o'zgartirish mumkin bo'lgan kran loyihasi.\",\n                p1Label: \"Yelkalar Nisbati (L1 / L2):\",\n                p1Min: 1, p1Max: 5, p1Step: 0.5, p1Val: 2.0,\n                p1Ticks: [\"1:1\", \"3:1\", \"5:1\"]\n            },\n            pulley: {\n                title: \"2. Ko'p Blokli Polispast Tizimi\",\n                blueprintTitle: \"Polispast Bloklar Tizimi\",\n                blueprintDesc: \"Qo'zg'aluvchan va qo'zg'almas g'altaklar birikmasidan iborat ko'tarish mexanizmi.\",\n                p1Label: \"Harakatli Bloklar Soni (n):\",\n                p1Min: 1, p1Max: 4, p1Step: 1, p1Val: 2,\n                p1Ticks: [\"1 blok\", \"2 blok\", \"4 blok\"]\n            },\n            winch: {\n                title: \"3. Konchilik Chig'iriq Mexanizmi\",\n                blueprintTitle: \"Val va Dastali Chig'iriq\",\n                blueprintDesc: \"Katta dastali baraban valiga o'ralgan ip orqali chuqurlikdan og'ir yuklarni tortib chiqarish vositasi.\",\n                p1Label: \"Radiuslar Nisbati (R_dasta / r_val):\",\n                p1Min: 1.5, p1Max: 6, p1Step: 0.5, p1Val: 3.0,\n                p1Ticks: [\"1.5x\", \"3.5x\", \"6.0x\"]\n            },\n            inclined: {\n                title: \"4. Qiya Tekislik Elevatori\",\n                blueprintTitle: \"Qiya Tekislik Rampsi\",\n                blueprintDesc: \"Burchak ostida joylashgan sirpanish va g'ildirakli yuklarni balandlikka oson olib chiqish moslamasi.\",\n                p1Label: \"Qiyalik Burchagi (α gradus):\",\n                p1Min: 15, p1Max: 60, p1Step: 5, p1Val: 30,\n                p1Ticks: [\"15°\", \"35°\", \"60°\"]\n            }\n        };\n\n        // --- DOM Elements ---\n        const canvas = document.getElementById('simCanvas');\n        const ctx = canvas.getContext('2d');\n        let analyticsChart = null;\n\n        // Init on load\n        window.addEventListener('load', () => {\n            resizeCanvas();\n            window.addEventListener('resize', resizeCanvas);\n            initChart();\n            loadPreset('lever');\n            \n            // Set today's date in report\n            document.getElementById('report-date').innerText = new Date().toISOString().split('T')[0];\n        });\n\n        function resizeCanvas() {\n            const rect = canvas.parentElement.getBoundingClientRect();\n            canvas.width = rect.width;\n            canvas.height = rect.height;\n            drawSimulation();\n        }\n\n        // Tab Switching\n        function switchTab(tabId) {\n            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));\n            document.querySelectorAll('.tab-btn').forEach(btn => {\n                btn.classList.remove('bg-sky-600', 'text-white', 'shadow');\n                btn.classList.add('text-slate-400');\n            });\n\n            document.getElementById(`tab-${tabId}`).classList.remove('hidden');\n            const activeBtn = document.getElementById(`tab-btn-${tabId}`);\n            activeBtn.classList.add('bg-sky-600', 'text-white', 'shadow');\n            activeBtn.classList.remove('text-slate-400');\n\n            if (tabId === 'lab') {\n                setTimeout(resizeCanvas, 50);\n            }\n        }\n\n        // Load Preset Mechanism\n        function loadPreset(key) {\n            state.mechanism = key;\n            const p = presets[key];\n\n            document.getElementById('blueprint-title').innerText = p.blueprintTitle;\n            document.getElementById('blueprint-desc').innerText = p.blueprintDesc;\n            document.getElementById('active-model-name').innerText = p.title;\n\n            // Update Label & Slider 1\n            const lbl = document.getElementById('label-param1');\n            lbl.querySelector('span').innerText = p.p1Label;\n\n            const slider1 = document.getElementById('slider-param1');\n            slider1.min = p.p1Min;\n            slider1.max = p.p1Max;\n            slider1.step = p.p1Step;\n            slider1.value = p.p1Val;\n\n            const ticks = document.getElementById('ticks-param1');\n            ticks.innerHTML = p.p1Ticks.map(t => `\u003cspan>${t}\u003c/span>`).join('');\n\n            updateControls();\n            resetSimulation();\n        }\n\n        // Update Controls & Physics Math\n        function updateControls() {\n            state.weight = parseFloat(document.getElementById('slider-weight').value);\n            state.param1 = parseFloat(document.getElementById('slider-param1').value);\n            state.friction = parseFloat(document.getElementById('slider-friction').value);\n\n            // Display Values\n            document.getElementById('val-weight').innerText = `${state.weight} N`;\n            document.getElementById('val-param1').innerText = state.param1;\n            document.getElementById('val-friction').innerText = `${state.friction.toFixed(2)} (${state.friction \u003c 0.1 ? 'Past' : state.friction \u003c 0.25 ? 'O\\'rtacha' : 'Yuqori'})`;\n\n            // Compute theoretical physics\n            calculatePhysics();\n\n            // Canvas Redraw\n            drawSimulation();\n        }\n\n        function calculatePhysics() {\n            let idealForce = 0;\n            let realForce = 0;\n\n            const P = state.weight;\n            const mu = state.friction;\n\n            if (state.mechanism === 'lever') {\n                // F * L1 = P * L2 => F_ideal = P / ratio\n                const ratio = state.param1;\n                idealForce = P / ratio;\n                realForce = idealForce * (1 + mu);\n            } else if (state.mechanism === 'pulley') {\n                // Pulley system with n moving pulleys => Advantage = 2*n\n                const n = state.param1;\n                idealForce = P / (2 * n);\n                realForce = idealForce * (1 + mu * 1.2);\n            } else if (state.mechanism === 'winch') {\n                // R / r ratio\n                const ratio = state.param1;\n                idealForce = P / ratio;\n                realForce = idealForce * (1 + mu * 0.8);\n            } else if (state.mechanism === 'inclined') {\n                // Angle in degrees\n                const rad = (state.param1 * Math.PI) / 180;\n                // F = P * sin(a) + mu * P * cos(a)\n                idealForce = P * Math.sin(rad);\n                realForce = P * Math.sin(rad) + mu * P * Math.cos(rad);\n            }\n\n            state.appliedForce = realForce;\n            \n            // Work & FIK (eta = A_useful / A_total)\n            // Displacement scale\n            const targetH = 1.0; // 1 meter lift\n            let targetS = 1.0;\n\n            if (state.mechanism === 'lever') targetS = targetH * state.param1;\n            else if (state.mechanism === 'pulley') targetS = targetH * (2 * state.param1);\n            else if (state.mechanism === 'winch') targetS = targetH * state.param1;\n            else if (state.mechanism === 'inclined') targetS = targetH / Math.sin((state.param1 * Math.PI) / 180);\n\n            const UsefulW = P * targetH;\n            const TotalW = realForce * targetS;\n            const fik = (UsefulW / TotalW) * 100;\n\n            state.usefulWork = UsefulW;\n            state.totalWork = TotalW;\n            state.fik = Math.min(fik, 99.9);\n\n            // Update UI Previews\n            document.getElementById('preview-force').innerText = `${realForce.toFixed(1)} N`;\n            document.getElementById('preview-fik').innerText = `${state.fik.toFixed(1)} %`;\n        }\n\n        // --- SIMULATION ANIMATION ENGINE ---\n        function startSimulation() {\n            if (state.isSimulating) return;\n            state.isSimulating = true;\n            state.progress = 0;\n            animate();\n        }\n\n        function resetSimulation() {\n            state.isSimulating = false;\n            if (state.animFrame) cancelAnimationFrame(state.animFrame);\n            state.progress = 0;\n            \n            // Clear Live metrics\n            document.getElementById('live-force').innerText = '0.0 N';\n            document.getElementById('live-h').innerText = '0.00 m';\n            document.getElementById('live-s').innerText = '0.00 m';\n            document.getElementById('live-fik').innerText = '0.0 %';\n\n            document.getElementById('metric-af').innerText = '0.0 J';\n            document.getElementById('metric-at').innerText = '0.0 J';\n            document.getElementById('metric-loss').innerText = '0.0 J';\n            document.getElementById('metric-fik').innerText = '0.0%';\n\n            drawSimulation();\n        }\n\n        function animate() {\n            if (!state.isSimulating) return;\n\n            state.progress += 0.008; // speed\n            if (state.progress > 1) {\n                state.progress = 1;\n                state.isSimulating = false;\n            }\n\n            // Calculate live values during animation\n            const P = state.weight;\n            const currentH = 1.0 * state.progress; // meters\n            let currentS = 0;\n\n            if (state.mechanism === 'lever') currentS = currentH * state.param1;\n            else if (state.mechanism === 'pulley') currentS = currentH * (2 * state.param1);\n            else if (state.mechanism === 'winch') currentS = currentH * state.param1;\n            else if (state.mechanism === 'inclined') currentS = currentH / Math.sin((state.param1 * Math.PI) / 180);\n\n            const liveUseful = P * currentH;\n            const liveTotal = state.appliedForce * currentS;\n            const liveFIK = liveTotal > 0 ? (liveUseful / liveTotal) * 100 : 0;\n\n            // Update Live UI\n            document.getElementById('live-force').innerText = `${state.appliedForce.toFixed(1)} N`;\n            document.getElementById('live-h').innerText = `${currentH.toFixed(2)} m`;\n            document.getElementById('live-s').innerText = `${currentS.toFixed(2)} m`;\n            document.getElementById('live-fik').innerText = `${liveFIK.toFixed(1)} %`;\n\n            document.getElementById('metric-af').innerText = `${liveUseful.toFixed(1)} J`;\n            document.getElementById('metric-at').innerText = `${liveTotal.toFixed(1)} J`;\n            document.getElementById('metric-loss').innerText = `${(liveTotal - liveUseful).toFixed(1)} J`;\n            document.getElementById('metric-fik').innerText = `${state.fik.toFixed(1)}%`;\n\n            drawSimulation();\n            updateChartData(liveFIK);\n\n            if (state.isSimulating) {\n                state.animFrame = requestAnimationFrame(animate);\n            }\n        }\n\n        // --- CANVAS RENDERING CODE ---\n        function drawSimulation() {\n            const w = canvas.width;\n            const h = canvas.height;\n            ctx.clearRect(0, 0, w, h);\n\n            // Draw Background Grid\n            ctx.strokeStyle = '#1e293b';\n            ctx.lineWidth = 1;\n            const gridSize = 30;\n            for (let x = 0; x \u003c w; x += gridSize) {\n                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();\n            }\n            for (let y = 0; y \u003c h; y += gridSize) {\n                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();\n            }\n\n            // Draw Base Ground\n            ctx.fillStyle = '#0f172a';\n            ctx.fillRect(0, h - 30, w, 30);\n            ctx.strokeStyle = '#334155';\n            ctx.lineWidth = 2;\n            ctx.beginPath(); ctx.moveTo(0, h - 30); ctx.lineTo(w, h - 30); ctx.stroke();\n\n            // Render Mechanism specific visuals\n            if (state.mechanism === 'lever') drawLeverCanvas(w, h);\n            else if (state.mechanism === 'pulley') drawPulleyCanvas(w, h);\n            else if (state.mechanism === 'winch') drawWinchCanvas(w, h);\n            else if (state.mechanism === 'inclined') drawInclinedCanvas(w, h);\n        }\n\n        // 1. LEVER CANVAS\n        function drawLeverCanvas(w, h) {\n            const fulcrumX = w * 0.45;\n            const fulcrumY = h - 100;\n            const ratio = state.param1;\n\n            const leverLength = Math.min(w * 0.6, 400);\n            const armLoad = leverLength / (1 + ratio);\n            const armForce = armLoad * ratio;\n\n            const angle = (state.progress - 0.5) * 0.35; // rotation angle\n\n            ctx.save();\n            ctx.translate(fulcrumX, fulcrumY);\n\n            // Fulcrum triangle\n            ctx.fillStyle = '#f59e0b';\n            ctx.beginPath();\n            ctx.moveTo(0, 0);\n            ctx.lineTo(-20, 40);\n            ctx.lineTo(20, 40);\n            ctx.closePath();\n            ctx.fill();\n\n            // Rotating Beam\n            ctx.rotate(angle);\n\n            // Beam bar\n            ctx.fillStyle = '#38bdf8';\n            ctx.fillRect(-armLoad, -10, armLoad + armForce, 20);\n            ctx.strokeStyle = '#0284c7';\n            ctx.strokeRect(-armLoad, -10, armLoad + armForce, 20);\n\n            // Left side: Load Box (P)\n            ctx.fillStyle = '#ef4444';\n            ctx.fillRect(-armLoad - 25, -50, 50, 40);\n            ctx.fillStyle = '#ffffff';\n            ctx.font = 'bold 12px Inter';\n            ctx.textAlign = 'center';\n            ctx.fillText(`Yuk: ${state.weight}N`, -armLoad, -26);\n\n            // Load vector arrow (P - down)\n            drawArrow(-armLoad, -10, -armLoad, 40, '#ef4444', 'P');\n\n            // Right side: Applied Force Arrow (F - down)\n            drawArrow(armForce, -10, armForce, 50, '#10b981', `F = ${state.appliedForce.toFixed(0)}N`);\n\n            ctx.restore();\n        }\n\n        // 2. PULLEY CANVAS\n        function drawPulleyCanvas(w, h) {\n            const centerX = w * 0.5;\n            const topY = 60;\n            const n = state.param1; // moving pulleys\n            const liftOffset = state.progress * 80;\n\n            // Ceiling support\n            ctx.fillStyle = '#334155';\n            ctx.fillRect(centerX - 100, topY - 20, 200, 15);\n\n            // Fixed top pulley\n            ctx.beginPath();\n            ctx.arc(centerX, topY + 20, 25, 0, Math.PI * 2);\n            ctx.fillStyle = '#38bdf8';\n            ctx.fill();\n            ctx.lineWidth = 3;\n            ctx.strokeStyle = '#0284c7';\n            ctx.stroke();\n\n            // Moving bottom pulley\n            const movingY = (h - 140) - liftOffset;\n            ctx.beginPath();\n            ctx.arc(centerX, movingY, 25, 0, Math.PI * 2);\n            ctx.fillStyle = '#f59e0b';\n            ctx.fill();\n            ctx.stroke();\n\n            // Ropes\n            ctx.strokeStyle = '#f8fafc';\n            ctx.lineWidth = 2;\n            ctx.beginPath();\n            ctx.moveTo(centerX - 25, topY + 20);\n            ctx.lineTo(centerX - 25, movingY);\n            ctx.moveTo(centerX + 25, topY + 20);\n            ctx.lineTo(centerX + 25, movingY);\n            ctx.stroke();\n\n            // Pulling Rope end\n            ctx.strokeStyle = '#10b981';\n            ctx.beginPath();\n            ctx.moveTo(centerX + 25, topY + 20);\n            ctx.lineTo(centerX + 80, topY + 120 + liftOffset * 1.5);\n            ctx.stroke();\n\n            // Load hanging from moving pulley\n            ctx.fillStyle = '#ef4444';\n            ctx.fillRect(centerX - 30, movingY + 25, 60, 45);\n            ctx.fillStyle = '#ffffff';\n            ctx.font = 'bold 11px Inter';\n            ctx.textAlign = 'center';\n            ctx.fillText(`${state.weight} N`, centerX, movingY + 52);\n\n            // Force vector\n            drawArrow(centerX + 80, topY + 120 + liftOffset * 1.5, centerX + 80, topY + 160 + liftOffset * 1.5, '#10b981', `F = ${state.appliedForce.toFixed(0)}N`);\n        }\n\n        // 3. WINCH CANVAS\n        function drawWinchCanvas(w, h) {\n            const cx = w * 0.45;\n            const cy = h * 0.45;\n            const ratio = state.param1;\n\n            const rVal = 30;\n            const RDasta = rVal * Math.min(ratio, 4);\n            const liftOffset = state.progress * 100;\n\n            // Winch Shaft / Big Wheel\n            ctx.beginPath();\n            ctx.arc(cx, cy, RDasta, 0, Math.PI * 2);\n            ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';\n            ctx.fill();\n            ctx.strokeStyle = '#38bdf8';\n            ctx.lineWidth = 3;\n            ctx.stroke();\n\n            // Small Drum Val\n            ctx.beginPath();\n            ctx.arc(cx, cy, rVal, 0, Math.PI * 2);\n            ctx.fillStyle = '#f59e0b';\n            ctx.fill();\n            ctx.stroke();\n\n            // Handle Arm\n            const handleAngle = state.progress * Math.PI * 4;\n            const hx = cx + Math.cos(handleAngle) * RDasta;\n            const hy = cy + Math.sin(handleAngle) * RDasta;\n\n            ctx.strokeStyle = '#38bdf8';\n            ctx.lineWidth = 6;\n            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(hx, hy); ctx.stroke();\n\n            // Rope hanging down from small drum\n            ctx.strokeStyle = '#f8fafc';\n            ctx.lineWidth = 3;\n            ctx.beginPath();\n            ctx.moveTo(cx - rVal, cy);\n            ctx.lineTo(cx - rVal, cy + 120 - liftOffset);\n            ctx.stroke();\n\n            // Load\n            ctx.fillStyle = '#ef4444';\n            ctx.fillRect(cx - rVal - 25, cy + 120 - liftOffset, 50, 40);\n            ctx.fillStyle = '#ffffff';\n            ctx.font = 'bold 11px Inter';\n            ctx.textAlign = 'center';\n            ctx.fillText(`${state.weight} N`, cx - rVal, cy + 144 - liftOffset);\n\n            // Force vector on handle\n            drawArrow(hx, hy, hx + 30, hy + 30, '#10b981', `F = ${state.appliedForce.toFixed(0)}N`);\n        }\n\n        // 4. INCLINED PLANE CANVAS\n        function drawInclinedCanvas(w, h) {\n            const startX = 80;\n            const startY = h - 50;\n            const angleDeg = state.param1;\n            const rad = (angleDeg * Math.PI) / 180;\n\n            const rampLen = Math.min(w * 0.65, 450);\n            const endX = startX + rampLen * Math.cos(rad);\n            const endY = startY - rampLen * Math.sin(rad);\n\n            // Wedge Triangle\n            ctx.beginPath();\n            ctx.moveTo(startX, startY);\n            ctx.lineTo(endX, startY);\n            ctx.lineTo(endX, endY);\n            ctx.closePath();\n            ctx.fillStyle = 'rgba(51, 65, 85, 0.6)';\n            ctx.fill();\n            ctx.strokeStyle = '#64748b';\n            ctx.lineWidth = 3;\n            ctx.stroke();\n\n            // Angle arc\n            ctx.beginPath();\n            ctx.arc(startX, startY, 40, 0, -rad, true);\n            ctx.strokeStyle = '#f59e0b';\n            ctx.stroke();\n            ctx.fillStyle = '#f59e0b';\n            ctx.font = 'bold 12px Inter';\n            ctx.fillText(`${angleDeg}°`, startX + 50, startY - 10);\n\n            // Sliding Block on Ramp\n            const blockDist = state.progress * (rampLen - 60) + 30;\n            const bx = startX + blockDist * Math.cos(rad);\n            const by = startY - blockDist * Math.sin(rad);\n\n            ctx.save();\n            ctx.translate(bx, by);\n            ctx.rotate(-rad);\n\n            ctx.fillStyle = '#ef4444';\n            ctx.fillRect(-25, -30, 50, 30);\n            ctx.fillStyle = '#ffffff';\n            ctx.font = 'bold 10px Inter';\n            ctx.textAlign = 'center';\n            ctx.fillText(`${state.weight} N`, 0, -12);\n\n            // Pull Force vector along ramp\n            drawArrow(25, -15, 70, -15, '#10b981', `F=${state.appliedForce.toFixed(0)}N`);\n\n            ctx.restore();\n        }\n\n        // Helper: Draw Vector Arrow\n        function drawArrow(fromx, fromy, tox, toy, color, label) {\n            const headlen = 10;\n            const dx = tox - fromx;\n            const dy = toy - fromy;\n            const angle = Math.atan2(dy, dx);\n\n            ctx.strokeStyle = color;\n            ctx.fillStyle = color;\n            ctx.lineWidth = 3;\n\n            ctx.beginPath();\n            ctx.moveTo(fromx, fromy);\n            ctx.lineTo(tox, toy);\n            ctx.stroke();\n\n            ctx.beginPath();\n            ctx.moveTo(tox, toy);\n            ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));\n            ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));\n            ctx.closePath();\n            ctx.fill();\n\n            if (label) {\n                ctx.font = 'bold 11px Inter';\n                ctx.fillText(label, tox + 12, toy + 4);\n            }\n        }\n\n        // --- CHART ENGINE ---\n        function initChart() {\n            const chartCtx = document.getElementById('analyticsChart').getContext('2d');\n            analyticsChart = new Chart(chartCtx, {\n                type: 'line',\n                data: {\n                    labels: ['0%', '20%', '40%', '60%', '80%', '100%'],\n                    datasets: [{\n                        label: 'Sinov FIK Koeffitsiyenti (%)',\n                        data: [0, 0, 0, 0, 0, 0],\n                        borderColor: '#10b981',\n                        backgroundColor: 'rgba(16, 185, 129, 0.1)',\n                        borderWidth: 2,\n                        fill: true,\n                        tension: 0.3\n                    }]\n                },\n                options: {\n                    responsive: true,\n                    maintainAspectRatio: false,\n                    scales: {\n                        y: {\n                            min: 0,\n                            max: 100,\n                            grid: { color: '#334155' },\n                            ticks: { color: '#94a3b8', font: { size: 10 } }\n                        },\n                        x: {\n                            grid: { color: '#334155' },\n                            ticks: { color: '#94a3b8', font: { size: 10 } }\n                        }\n                    },\n                    plugins: {\n                        legend: { display: false }\n                    }\n                }\n            });\n        }\n\n        function updateChartData(currentFik) {\n            if (!analyticsChart) return;\n            const idx = Math.floor(state.progress * 5);\n            analyticsChart.data.datasets[0].data[idx] = currentFik.toFixed(1);\n            analyticsChart.update('none');\n        }\n\n        // --- REPORT MODAL GENERATOR ---\n        function openReportModal() {\n            calculatePhysics();\n\n            document.getElementById('rep-type').innerText = presets[state.mechanism].blueprintTitle;\n            document.getElementById('rep-p').innerText = `${state.weight} N`;\n            document.getElementById('rep-ratio').innerText = state.param1;\n            document.getElementById('rep-mu').innerText = state.friction.toFixed(2);\n\n            const idealF = state.weight / (state.mechanism === 'lever' || state.mechanism === 'winch' ? state.param1 : state.mechanism === 'pulley' ? state.param1 * 2 : Math.sin((state.param1 * Math.PI) / 180));\n\n            document.getElementById('rep-f-ideal').innerText = `${idealF.toFixed(1)} N`;\n            document.getElementById('rep-f-real').innerText = `${state.appliedForce.toFixed(1)} N`;\n            document.getElementById('rep-f-diff').innerText = `+${(state.appliedForce - idealF).toFixed(1)} N`;\n\n            document.getElementById('rep-af').innerText = `${state.usefulWork.toFixed(1)} J`;\n            document.getElementById('rep-at').innerText = `${state.totalWork.toFixed(1)} J`;\n            document.getElementById('rep-loss-work').innerText = `${(state.totalWork - state.usefulWork).toFixed(1)} J`;\n\n            document.getElementById('rep-fik').innerText = `${state.fik.toFixed(1)} %`;\n\n            document.getElementById('rep-conclusion').innerText = \n                `Tadqiqot natijalariga ko'ra, tanlangan ${presets[state.mechanism].blueprintTitle} mexanizmi ` +\n                `kuchdan taxminan ${state.param1} marta yutish berdi. Ishqalanish koeffitsiyenti (μ = ${state.friction}) ` +\n                `tufayli foydali ish koeffitsiyenti (FIK) ${state.fik.toFixed(1)}% ni tashkil qildi. `;\n\n            document.getElementById('report-modal').classList.remove('hidden');\n        }\n\n        function closeReportModal() {\n            document.getElementById('report-modal').classList.add('hidden');\n        }\n\n        function updateReportFields() {\n            const name = document.getElementById('student-name').value;\n            const cls = document.getElementById('student-class').value;\n\n            document.getElementById('print-student-name').innerText = name;\n            document.getElementById('print-student-class').innerText = cls;\n        }\n    \u003c/script>\n\u003c/body>\n\u003c/html>"}</script>
<script>
(function(){
  var TOPICS = [
    {id:"1-mavzu", n:"1", t:"Kuchlarni qo‘shish", s:"Simulyatsiya"},
    {id:"2-mavzu", n:"2", t:"Markazga intilma kuch", s:"Simulyatsiya"},
    {id:"3-mavzu", n:"3", t:"Gravitatsiya maydonidagi harakat", s:"Simulyatsiya"},
    {id:"4-mavzu", n:"4", t:"Masalalar yechish", s:"Masalalar"},
    {id:"5-mavzu", n:"5", t:"Jism og‘irligining harakat turiga bog‘liqligi", s:"Simulyatsiya"},
    {id:"6-mavzu", n:"6", t:"Bir nechta kuch ta’siridagi harakat", s:"Simulyatsiya"},
    {id:"7-mavzu", n:"7", t:"Masalalar yechish (1–6 mavzular)", s:"Masalalar"},
    {id:"8-mavzu", n:"8", t:"Jismning qiya tekislikdagi harakati", s:"Simulyatsiya"},
    {id:"9-mavzu", n:"9", t:"Qiya tekislik va FIK", s:"Taqdimot"},
    {id:"10-mavzu", n:"10", t:"Masalalar: qiya tekislik, ish va FIK", s:"Masalalar"},
    {id:"11-mavzu", n:"11", t:"Laboratoriya: qiya tekislikning FIKini aniqlash", s:"Laboratoriya"},
    {id:"12-mavzu", n:"12", t:"Massa markazi, muvozanat va kuch momenti", s:"Simulyatsiya"},
    {id:"13-mavzu", n:"13", t:"Oddiy mexanizmlar va momentlar qoidasi", s:"Simulyatsiya"},
    {id:"14-mavzu", n:"14", t:"Masalalar: kuch momenti va oddiy mexanizmlar", s:"Masalalar"},
    {id:"loyiha", n:"★", t:"Loyiha ishi: oddiy mexanizmlarni yasash va tadqiq etish", s:"Loyiha", project:true}
  ];
  var PAGES = JSON.parse(document.getElementById("pages").textContent);
  var $ = function(id){return document.getElementById(id)};
  var list=$("list"), view=$("view"), welcome=$("welcome"), loading=$("loading");
  var cur=-1, blobUrl=null, buttons=[];

  $("count").textContent = TOPICS.length + " ta bo‘lim";

  TOPICS.forEach(function(tp,i){
    var b=document.createElement("button");
    b.type="button";
    b.className="topic"+(tp.project?" project":"");
    b.innerHTML='<span class="n"></span><span class="t"><b></b><span></span></span>';
    b.querySelector(".n").textContent=tp.n;
    b.querySelector("b").textContent=tp.t;
    b.querySelector(".t > span").textContent=tp.s;
    b.addEventListener("click",function(){open(i);closeMenu();});
    list.appendChild(b); buttons.push(b);
  });

  function open(i,skipHash){
    if(i<0||i>=TOPICS.length) return;
    var tp=TOPICS[i];
    cur=i;
    buttons.forEach(function(b,k){
      var on=k===i; b.classList.toggle("active",on);
      if(on){b.setAttribute("aria-current","page");b.scrollIntoView({block:"nearest"});}
      else b.removeAttribute("aria-current");
    });
    $("nowNum").textContent = tp.project ? "Loyiha ishi" : (tp.n+"-mavzu");
    $("nowTitle").textContent = tp.t;
    $("prev").disabled = i===0;
    $("next").disabled = i===TOPICS.length-1;
    welcome.style.display="none";
    loading.style.display="flex";
    var html = PAGES[tp.id];
    var old=blobUrl;
    blobUrl = URL.createObjectURL(new Blob([html],{type:"text/html;charset=utf-8"}));
    view.onload=function(){loading.style.display="none"; if(old){URL.revokeObjectURL(old);}};
    view.src=blobUrl;
    document.title=tp.t+" — Fizika";
    if(!skipHash){ try{ history.replaceState(null,"","#"+tp.id); }catch(e){ location.hash=tp.id; } }
    try{ localStorage.setItem("fizika:last",tp.id); }catch(e){}
  }

  function idxFromHash(){
    var h=(location.hash||"").slice(1);
    for(var i=0;i<TOPICS.length;i++){ if(TOPICS[i].id===h) return i; }
    return -1;
  }
  function openMenu(){document.body.classList.add("open");}
  function closeMenu(){document.body.classList.remove("open");}

  $("prev").onclick=function(){open(cur-1);};
  $("next").onclick=function(){open(cur+1);};
  $("menu").onclick=openMenu;
  $("scrim").onclick=closeMenu;
  $("start").onclick=function(){open(0);};
  window.addEventListener("hashchange",function(){var i=idxFromHash(); if(i>=0&&i!==cur) open(i,true);});
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape") closeMenu();
    if(e.altKey||e.ctrlKey||e.metaKey) return;
    var tag=(e.target.tagName||"").toLowerCase();
    if(tag==="input"||tag==="textarea"||tag==="select") return;
    if(e.key==="ArrowRight"&&cur<TOPICS.length-1) open(cur+1);
    if(e.key==="ArrowLeft"&&cur>0) open(cur-1);
  });

  var start=idxFromHash();
  if(start<0){ try{ var last=localStorage.getItem("fizika:last"); for(var k=0;k<TOPICS.length;k++){ if(TOPICS[k].id===last) start=k; } }catch(e){} }
  if(start>=0) open(start,true);
})();
</script>
</body>
</html>
